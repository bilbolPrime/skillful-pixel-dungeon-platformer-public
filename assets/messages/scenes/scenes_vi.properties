scenes.heroselectscene.challenges_nowin=Thử thách là những yếu tố tùy chọn giúp trò chơi trở nên khó khăn hơn. Một số thử thách làm cho hầm ngục nguy hiểm hơn, số khác làm giảm sức mạnh của các kỹ năng hoặc vật phẩm của bạn. Bạn phải thắng ít nhất một ván trước khi có thể kích hoạt thử thách.
scenes.heroselectscene.custom_seed=Hạt giống tùy chỉnh
scenes.heroselectscene.custom_seed_clear=Thông thoáng
scenes.heroselectscene.custom_seed_desc=Trò chơi sử dụng mã hạt giống để tạo hầm ngục, cùng một mã hạt giống và phiên bản trò chơi sẽ luôn tạo ra cùng một hầm ngục! _Các trò chơi sử dụng mã hạt giống tùy chỉnh không thể nhận huy hiệu hoặc đóng góp vào số trận đấu đã chơi, và sẽ xuất hiện ở cuối trang xếp hạng._
scenes.heroselectscene.custom_seed_duplicate=Bạn hiện đang có một ván chơi thông thường đang diễn ra với mã hạt giống đó. Bạn phải kết thúc ván chơi đó trước khi sử dụng mã hạt giống tùy chỉnh này.
scenes.heroselectscene.custom_seed_nowin=Trò chơi sử dụng mã hạt giống để tạo hầm ngục, cùng một mã hạt giống và phiên bản trò chơi sẽ luôn tạo ra cùng một hầm ngục! \n\n_Bạn phải thắng ít nhất một ván trước khi có thể nhập mã hạt giống tùy chỉnh._
scenes.heroselectscene.custom_seed_set=BỘ
scenes.heroselectscene.custom_seed_title=Nhập mã hạt giống tùy chỉnh
scenes.heroselectscene.daily=Chạy bộ hàng ngày
scenes.heroselectscene.daily_desc=Mỗi ngày đều có một trò chơi mới giống nhau cho tất cả mọi người! "Lượt chơi hàng ngày" này sẽ tạo ra cùng một hầm ngục cho tất cả những người chơi (miễn là họ cũng đang chơi cùng một phiên bản trò chơi). Bạn có thể dành bao nhiêu thời gian tùy thích để hoàn thành lượt chơi hàng ngày, nhưng chỉ có thể có một lượt chơi đang hoạt động cùng một lúc. Lượt chơi hàng ngày không được tính huy hiệu và có trang xếp hạng riêng. Bạn có muốn bắt đầu lượt chơi hàng ngày hôm nay với anh hùng và thử thách hiện tại của mình không?
scenes.heroselectscene.daily_existing=Bạn đang thực hiện một chu trình chạy hàng ngày. Bạn phải kết thúc chu trình đó trước khi bắt đầu một chu trình hàng ngày khác.
scenes.heroselectscene.daily_no=KHÔNG
scenes.heroselectscene.daily_nowin=Mỗi ngày đều có một trò chơi mới giống nhau cho tất cả mọi người! Chế độ "chơi hàng ngày" này tạo ra cùng một hầm ngục cho tất cả người chơi (miễn là họ cũng đang chơi cùng một phiên bản game). Bạn phải thắng ít nhất một ván trước khi có thể chơi chế độ "chơi hàng ngày".
scenes.heroselectscene.daily_repeat=Bạn đã hoàn thành nhiệm vụ hàng ngày hôm nay rồi. Bạn có thể chơi lại nếu muốn, nhưng chỉ là chơi thử không xếp hạng. Sau khi hoàn thành chơi lại, bạn có thể xem lại trong cửa sổ xếp hạng hàng ngày trong một thời gian ngắn trước khi bản ghi bị xóa. Bạn có muốn chơi lại nhiệm vụ hàng ngày hôm nay với tướng và thử thách hiện tại của mình không?
scenes.heroselectscene.daily_unavailable_long=Có vẻ như bạn đã bắt đầu một nhiệm vụ hàng ngày ở tương lai! Điều này có thể xảy ra nếu bạn vừa thay đổi múi giờ hoặc thay đổi đồng hồ hệ thống. _Nhiệm vụ hàng ngày tiếp theo của bạn sẽ có sẵn sau %d ngày._
