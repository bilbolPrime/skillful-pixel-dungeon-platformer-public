custom.generated.warriors_are_physically_tough_and_02774ddc7a=Prajurit memiliki fisik yang tangguh dan mampu menahan banyak kerusakan. Namun, mereka lemah dalam hal senjata jarak jauh dan sihir. Mempelajari keterampilan tersebut masih mungkin dilakukan, tetapi membutuhkan lebih banyak usaha.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Para penjahat mengandalkan kelincahan, kemampuan menyelinap, dan ketepatan. Mereka unggul dalam mobilitas, penyergapan, racun, dan pertempuran menghindar, tetapi mengorbankan sebagian ketangguhan seorang prajurit garis depan.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Penyihir menguasai seni sihir. Mereka lemah dalam hal kekuatan fisik dan kelincahan. Mempelajari keterampilan tersebut masih mungkin dilakukan, tetapi membutuhkan lebih banyak usaha.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Pemburu wanita unggul dalam pertempuran jarak jauh dan mobilitas. Mereka mengendalikan pertarungan dengan busur, tembakan pendukung, dan peralatan bertahan hidup yang andal, tetapi kurang nyaman dalam perkelahian jarak dekat yang berkepanjangan.
