custom.generated.warriors_are_physically_tough_and_02774ddc7a=Chiến binh có thể lực dẻo dai và có khả năng chịu đựng nhiều sát thương. Tuy nhiên, họ lại yếu thế khi sử dụng vũ khí tầm xa và phép thuật. Việc học những kỹ năng này vẫn có thể thực hiện được nhưng đòi hỏi nhiều nỗ lực hơn.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Những kẻ lừa đảo dựa vào sự nhanh nhẹn, lén lút và chính xác. Chúng giỏi về khả năng di chuyển, phục kích, sử dụng chất độc và chiến đấu né tránh, nhưng lại đánh đổi bằng sức chịu đựng thô bạo của một chiến binh tiền tuyến.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Các pháp sư nắm vững nghệ thuật ma thuật. Tuy nhiên, họ lại yếu về sức mạnh thể chất và sự nhanh nhẹn. Việc học hỏi những kỹ năng này vẫn có thể thực hiện được nhưng đòi hỏi nhiều nỗ lực hơn.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Các nữ thợ săn giỏi chiến đấu tầm xa và có tính cơ động cao. Họ kiểm soát trận chiến bằng cung tên, các phát bắn hỗ trợ và các công cụ sinh tồn ổn định, nhưng lại kém thoải mái hơn trong các cuộc ẩu đả cận chiến kéo dài.
