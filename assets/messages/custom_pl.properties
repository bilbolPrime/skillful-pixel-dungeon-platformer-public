custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=Och, jaka miła niespodzianka spotkać porządną osobę w takim miejscu! Przyszedłem tu po rzadki składnik: rybę widmo. Można ją złapać gołymi rękami, ale w wodzie bardzo trudno ją zauważyć. Jako magik całkiem dobrze radzę sobie z obroną przed tutejszymi potworami, ale szybko się gubię, to bardzo krępujące. Może mógłbyś mi pomóc? Z chęcią zapłacę za twoją usługę jedną z moich najlepszych różdżek.
