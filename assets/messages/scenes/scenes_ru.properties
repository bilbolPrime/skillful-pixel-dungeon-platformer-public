scenes.heroselectscene.challenges_nowin=Испытания — это необязательные модификаторы, которые усложняют игру. Некоторые испытания делают подземелье более опасным, другие снижают эффективность ваших способностей или предметов. _Для включения испытаний необходимо выиграть хотя бы одну игру._
scenes.heroselectscene.custom_seed=Семена на заказ
scenes.heroselectscene.custom_seed_clear=Прозрачный
scenes.heroselectscene.custom_seed_desc=В игре используется сид-код для генерации подземелий; один и тот же сид и версия игры всегда генерируют одно и то же подземелье! _Игры с пользовательскими сид-кодами не могут зарабатывать значки или влиять на результаты игр, и отображаются внизу страницы рейтинга._
scenes.heroselectscene.custom_seed_duplicate=У вас уже идёт обычная игра с этим начальным значением. Вам необходимо завершить эту игру, прежде чем использовать это пользовательское начальное значение.
scenes.heroselectscene.custom_seed_nowin=В игре используется сид-код для генерации подземелий; один и тот же сид и версия игры всегда генерируют одно и то же подземелье! \n\n_Вы должны выиграть хотя бы одну игру, прежде чем сможете использовать пользовательские сиды._
scenes.heroselectscene.custom_seed_set=НАБОР
scenes.heroselectscene.custom_seed_title=Введите пользовательское начальное значение
scenes.heroselectscene.daily=Ежедневная пробежка
scenes.heroselectscene.daily_desc=Каждый день становится доступна новая игра, одинаковая для всех! Этот «ежедневный забег» генерирует одно и то же подземелье для каждого игрока (при условии, что он играет в ту же версию игры). Вы можете потратить на выполнение ежедневного забега столько времени, сколько захотите, но одновременно может быть активен только один забег. Ежедневные забеги не дают права на получение значков и имеют отдельную страницу рейтинга. Хотите начать сегодняшний ежедневный забег с выбранным вами героем и испытаниями?
scenes.heroselectscene.daily_existing=У вас уже запущен ежедневный запуск. Необходимо завершить этот запуск, прежде чем начинать следующий.
scenes.heroselectscene.daily_no=нет
scenes.heroselectscene.daily_nowin=Каждый день становится доступна новая игра, одинаковая для всех! Этот «ежедневный забег» генерирует одно и то же подземелье для каждого игрока (при условии, что он играет в ту же версию игры). \n\n_Вы должны выиграть хотя бы одну игру, прежде чем сможете участвовать в ежедневных забегах._
scenes.heroselectscene.daily_repeat=Вы уже играли в сегодняшнее ежедневное задание. Вы можете переиграть его, если хотите, но только в качестве тренировочного запуска без рейтинга. После завершения переигровки вы сможете просмотреть её в окне ежедневного рейтинга в течение короткого времени, после чего запись будет удалена. Хотите переиграть сегодняшнее ежедневное задание с выбранным вами героем и испытаниями?
scenes.heroselectscene.daily_unavailable_long=Похоже, вы начали ежедневное задание, которое будет доступно в будущем! Это может произойти, если вы недавно сменили часовой пояс или изменили системное время. _Ваше следующее ежедневное задание будет доступно через %d дней._
