custom.generated.warriors_are_physically_tough_and_02774ddc7a=전사들은 육체적으로 강인하고 많은 피해를 견딜 수 있습니다. 하지만 원거리 무기와 마법에는 취약합니다. 이러한 기술을 배우는 것은 여전히 가능하지만 더 많은 노력이 필요합니다.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=도적은 민첩성, 은밀성, 그리고 정확성에 의존합니다. 기동성, 매복, 독, 그리고 회피 전투에 탁월하지만, 최전선 전사로서의 강인함은 다소 떨어집니다.
custom.generated.wizards_master_the_arts_of_3efc4cde47=마법사들은 마법의 기술에 통달했지만, 신체적인 힘과 민첩성 면에서는 부족합니다. 이러한 능력을 배우는 것 자체는 불가능하지 않지만, 훨씬 더 많은 노력이 필요합니다.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=헌트리스는 원거리 전투와 기동성에 탁월합니다. 활, 특수 공격, 안정적인 생존 도구를 활용하여 전투를 주도하지만, 장시간의 근접전에는 다소 약합니다.
