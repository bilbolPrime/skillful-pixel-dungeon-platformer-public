custom.theme.sewers.intro=Il Dungeon si trova proprio sotto la Città, e i suoi livelli superiori costituiscono di fatto il sistema fognario cittadino. Essendo nominalmente parte della Città, questi livelli non sono poi così pericolosi. Nessuno lo definirebbe un luogo sicuro, ma almeno qui non dovrete avere a che fare con la magia nera.
custom.theme.prison.intro=Molti anni fa, qui fu costruita una prigione sotterranea per i criminali più pericolosi. All'epoca sembrò un'idea geniale, perché da quel luogo era davvero difficile fuggire. Ma ben presto una nefasta nebbia iniziò a permeare il sottosuolo, facendo impazzire prigionieri e guardie. Alla fine la prigione fu abbandonata, anche se alcuni detenuti rimasero rinchiusi al suo interno.
custom.theme.caves.intro=Le caverne, che si estendono sotto la prigione abbandonata, sono scarsamente popolate. Si trovano troppo in profondità per essere sfruttate dalla Città e sono troppo povere di minerali per interessare i nani. In passato, da qualche parte qui sorgeva un avamposto commerciale sulla rotta tra questi due stati, ma è scomparso dopo il declino della Metropoli Nanica. Ora vi abitano solo gli onnipresenti gnoll e le creature sotterranee.
custom.theme.city.intro=Un tempo, Metropoli Nanica era la più grande delle città-stato naniche. Nel suo periodo di massimo splendore, l'esercito meccanizzato dei nani respinse con successo l'invasione dell'antico dio e del suo esercito demoniaco. Ma si dice che i guerrieri di ritorno abbiano portato con sé i semi della corruzione, e che quella vittoria abbia segnato l'inizio della fine per il regno sotterraneo.
custom.theme.halls.intro=In passato questi livelli costituivano la periferia di Metropolis. Dopo la costosa vittoria nella guerra contro l'antico dio, i nani erano troppo indeboliti per liberarli dai demoni rimasti. Gradualmente i demoni hanno stretto la loro presa su questo luogo, che ora è chiamato Sale dei Demoni. \n\n Pochissimi avventurieri sono mai scesi così in basso...
custom.theme.sewers.sign.1=Non sopravvalutare la tua forza, usa armi e armature che sei in grado di maneggiare.
custom.theme.sewers.sign.2=Alcuni pericoli nelle fogne sono facili da non notare a prima vista. Se una stanza vi sembra sospetta, rallentate e guardate attentamente.
custom.theme.sewers.sign.3=Ricorda che aumentare la tua forza non è l'unico modo per accedere a equipaggiamento migliore. Puoi anche ridurne il requisito di forza utilizzando le Pergamene di Potenziamento.
custom.theme.sewers.sign.4=Puoi spendere il tuo oro nei negozi sparsi per il dungeon. Ora c'è persino un mercante al primo piano.
custom.theme.sewers.sign.5=Attenzione alla melma!
custom.theme.prison.sign.1=Pixel-Mart: tutto ciò che ti serve per un'avventura di successo!
custom.theme.prison.sign.2=Identifica le tue pozioni e pergamene il prima possibile. Non rimandare fino al momento in cui ne avrai effettivamente bisogno.
custom.theme.prison.sign.3=Avere fame non fa male, ma morire di fame sì.
custom.theme.prison.sign.4=Un attacco a sorpresa ha maggiori probabilità di andare a segno. Puoi ancora cogliere i nemici di sorpresa controllando lo spazio intorno a una porta.
custom.theme.prison.sign.5=Non lasciate uscire il Tengu!
custom.theme.caves.sign.1=Pixel-Mart. Spendi soldi. Vivi più a lungo.
custom.theme.caves.sign.2=Quando vieni attaccato da più mostri contemporaneamente, cerca di ripararti dietro una porta.
custom.theme.caves.sign.3=Se stai bruciando, non lasciarti intrappolare. Nelle grotte, il movimento verticale è fondamentale.
custom.theme.caves.sign.4=Non ha senso possedere più di un Ankh contemporaneamente, perché li perderete al momento della resurrezione.
custom.theme.caves.sign.5=PERICOLO! I macchinari pesanti possono causare lesioni, perdita di arti o morte!
custom.theme.city.sign.1=Pixel-Mart. Una vita più sicura nel dungeon.
custom.theme.city.sign.2=Quando si potenzia un'arma incantata, esiste una possibilità di distruggere l'incantesimo.
custom.theme.city.sign.3=Armi e armature si deteriorano più rapidamente di bacchette e anelli, ma esistono più modi per ripararle.
custom.theme.city.sign.4=L'unico modo per ottenere una Pergamena di Annientamento è riceverla in dono dagli spiriti del dungeon.
custom.theme.city.sign.5=Vietato portare armi in presenza di Sua Maestà!
custom.theme.halls.sign.1=Nel momento in cui provi a leggere il cartello, questo si incendia di fiamme verdastre.
