levels.cavesbosslevel.energy_desc=O chão aqui está faiscando com eletricidade e é perigoso pisar nele. _As faíscas parecem estar gravitando em uma certa direção..._ talvez levem à fonte de energia?
levels.cavesbosslevel.gate_desc=Um grande portão de metal bloqueia a entrada para a metrópole anã. A caixa de metal no centro emite um zumbido alto; deve estar conectada aos circuitos e máquinas próximos. Talvez destruir o DM-300 abra o portão?
levels.cavesbosslevel.gate_desc_broken=O portal devia estar conectado ao DM-300 de alguma forma, pois explodiu quando o DM-300 foi derrotado. Agora só restam fragmentos.
levels.cavesbosslevel.gate_name=Portão de metal
levels.cavesbosslevel.water_desc=Com toda a eletricidade por aqui, a água pode nem sempre ser segura...
levels.cavesbosslevel.wires_desc=O solo está parcialmente escavado aqui, mostrando alguns fios grossos expostos. Eles devem estar conectando as diversas máquinas elétricas. Os fios devem estar conduzindo corrente elétrica. Se o DM-300 pisar aqui, poderá obter energia deles.
levels.cavesbosslevel.wires_name=Fiação exposta
levels.caveslevel.bookshelf_desc=Quem precisaria de uma estante de livros em uma caverna?
levels.caveslevel.entrance_desc=A escada leva à parte superior da estrutura.
levels.caveslevel.exit_desc=A escada leva à parte mais profunda.
levels.caveslevel.grass_name=Musgo fluorescente
levels.caveslevel.high_grass_desc=Cogumelos enormes bloqueiam a vista.
levels.caveslevel.high_grass_name=Cogumelos fluorescentes
levels.caveslevel.region_deco_desc=Uma grande estrutura totalmente metálica, provavelmente construída pelos anões quando exploravam este local. Você acha que consegue ver trilhos de vagonetes de mina, há muito tempo abandonados, percorrendo o topo.
levels.caveslevel.region_deco_name=Estrutura metálica
levels.caveslevel.wall_deco_desc=É possível ver uma veia de minério na parede. Ouro?
levels.caveslevel.water_name=Água gelada
levels.citybosslevel.summoning_desc=Este pedestal possui uma grande abertura no centro, que praticamente irradia energia sombria. O Rei Anão usa esses pedestais como pontos focais para sua magia necromântica e pode invocar lacaios para eles. O pedestal precisa carregar por alguns turnos antes que o lacaio apareça, e o tipo de lacaio invocado é indicado pelo poder mágico acumulado.
levels.citybosslevel.summoning_name=pedestal de invocação
levels.citybosslevel.throne_desc=Este trono impressionantemente grande é a sede do império anão, agora dominado por um necromante sedento de poder. Parece haver algumas partes mágicas ou mecânicas no trono; o Rei Anão pode ter poder adicional ao sentar-se nele.
levels.citybosslevel.throne_name=Trono
levels.citylevel.bookshelf_desc=Fileiras de livros sobre diferentes disciplinas preenchem a estante.
levels.citylevel.deco_desc=Faltam várias peças aqui.
levels.citylevel.entrance_desc=Uma rampa conduz à parte superior do terreno.
levels.citylevel.exit_desc=Uma rampa leva à parte mais profunda.
levels.citylevel.high_grass_name=Flores de floração alta
levels.citylevel.region_deco_desc=Um pedestal elevado com uma chama mágica verde brilhante no topo. A chama é tão densa que poderia muito bem ser sólida.
levels.citylevel.region_deco_name=pedestal em chamas
levels.citylevel.sp_desc=Um tapete grosso cobre o chão.
levels.citylevel.statue_desc=A estátua retrata um anão em uma postura heroica.
levels.citylevel.upcoming_quest_intro_no=Fique aqui
levels.citylevel.upcoming_quest_intro_title=Mensagem do desenvolvedor
levels.citylevel.upcoming_quest_intro_yes=Desça até o cofre.
levels.citylevel.water_name=Água com coloração suspeita
levels.features.chasm.chasm=Abismo
levels.features.chasm.jump=Você realmente quer pular no abismo? Uma queda tão grande será dolorosa.
levels.features.chasm.no=Não, mudei de ideia.
levels.features.chasm.ondeath=Você caiu e morreu...
levels.features.chasm.rankings_desc=Morreu no impacto.
levels.features.chasm.yes=Sim, eu sei o que estou fazendo.
levels.hallslevel.bookshelf_desc=Livros em línguas antigas queimam lentamente na estante.
levels.hallslevel.grass_name=Musgo de brasa
levels.hallslevel.high_grass_name=Fungos de brasa
levels.hallslevel.region_deco_desc=Um enorme pedaço de pedra que parece ter se desprendido do teto ou de uma parede próxima.
levels.hallslevel.region_deco_name=Pedaço de entulho
levels.hallslevel.statue_desc=A coluna é feita de crânios humanoides reais. Incrível.
levels.hallslevel.statue_name=Pilar
levels.hallslevel.water_desc=Parece lava, mas está fria e provavelmente é seguro tocar.
levels.hallslevel.water_name=Lava fria
levels.level$feeling.chasm_desc=Seus passos ecoam pela masmorra.
levels.level$feeling.chasm_title=chão do abismo
levels.level$feeling.dark_desc=É possível ouvir inimigos se movendo na escuridão.
levels.level$feeling.dark_title=chão escuro
levels.level$feeling.grass_desc=O ar está impregnado com o cheiro da vegetação.
levels.level$feeling.grass_title=chão de grama
levels.level$feeling.large_desc=Este andar da masmorra parece excepcionalmente grande.
levels.level$feeling.large_title=piso amplo
levels.level$feeling.secrets_desc=A atmosfera sugere que este andar esconde muitos segredos.
levels.level$feeling.secrets_title=andar dos segredos
levels.level$feeling.traps_desc=O terreno parece especialmente traiçoeiro aqui.
levels.level$feeling.traps_title=armadilhas no chão
levels.level$feeling.water_desc=Você ouve água espirrando ao seu redor.
levels.level$feeling.water_title=piso de água
levels.level.alchemy_desc=Este pote está cheio de água mágica. Itens podem ser misturados no pote para criar algo novo!
levels.level.alchemy_name=caldeirão de alquimia
levels.level.barricade_desc=A barricada de madeira está bem fixada, mas ressecou com o passar dos anos. Será que pode pegar fogo?
levels.level.barricade_name=Barricada
levels.level.bookshelf_name=Estante de livros
levels.level.chasm_desc=Você não consegue ver o fundo.
levels.level.chasm_name=Abismo
levels.level.closed_door_name=Porta fechada
levels.level.crystal_door_desc=Esta porta trancada é feita de cristal mágico. Você consegue ver através dela, mas precisará de uma chave de cristal para abri-la.
levels.level.crystal_door_name=Porta de cristal
levels.level.default_name=???
levels.level.embers_desc=Brasas cobrem o chão.
levels.level.embers_name=Brasas
levels.level.empty_well_desc=A fonte secou.
levels.level.empty_well_name=Poço vazio
levels.level.entrace_name=Entrada em profundidade
levels.level.entrance_desc=Uma escada leva à parte superior.
levels.level.exit_desc=Uma escadaria leva à parte inferior.
levels.level.exit_name=Saída de profundidade
levels.level.floor_name=Chão
levels.level.furrowed_grass_name=Vegetação sulcada
levels.level.grass_name=Grama
levels.level.hidden_trap=Um %s oculto é ativado!
levels.level.high_grass_desc=A vegetação densa bloqueia a vista.
levels.level.high_grass_name=Grama alta
levels.level.inactive_trap_desc=A armadilha já foi acionada antes e não representa mais perigo.
levels.level.inactive_trap_name=Armadilha acionada
levels.level.locked_door_desc=Esta porta está trancada; você precisa da chave correspondente para destrancá-la.
levels.level.locked_door_name=Porta trancada
levels.level.locked_exit_desc=Barras pesadas bloqueiam a escada que leva ao andar de baixo.
levels.level.locked_exit_name=Saída de profundidade bloqueada
levels.level.open_door_name=Abra a porta
levels.level.pedestal_name=Pedestal
levels.level.statue_desc=Alguém quis enfeitar este lugar, mas obviamente falhou.
levels.level.statue_name=Estátua
levels.level.unlocked_exit_name=Saída de profundidade desbloqueada
levels.level.wall_name=Parede
levels.level.water_desc=Em caso de incêndio, entre na água para extinguir o fogo.
levels.level.water_name=Água
levels.level.well_name=Bem
levels.mininglevel.barricade_desc=A barricada de madeira está firmemente fixada e serve de suporte para o teto. Provavelmente foi construída pelos gnolls para oferecer alguma proteção contra a queda de rochas. Quaisquer celas adjacentes estarão protegidas contra armadilhas e ataques de queda de rochas. Parece que ela queimaria tão bem quanto qualquer outra barricada.
levels.mininglevel.boulder_desc=Há uma grande pedra bloqueando o caminho. Deve ser relativamente fácil quebrá-la com uma picareta.
levels.mininglevel.boulder_name=Pedregulho
levels.mininglevel.crystal_desc=Aqui existe um grande afloramento de cristal colorido. Esses cristais são frágeis e podem ser facilmente quebrados com uma picareta, ou se quebrarão se algo for minerado próximo a eles.
levels.mininglevel.crystal_name=Espinho de cristal
levels.mininglevel.gold_extra_desc=Você provavelmente consegue extrair isso com sua picareta.
levels.mininglevel.wall_desc=Uma parede de rocha lisa, um pouco mais macia que o normal. Você pode minerá-la com sua picareta, mas isso exigirá algum esforço e aumentará um pouco sua fome.
levels.prisonlevel.bookshelf_desc=Provavelmente é um vestígio de uma biblioteca de prisão. Será que pode ser destruída pelo fogo?
levels.prisonlevel.empty_deco_desc=Há manchas antigas de sangue no chão.
levels.prisonlevel.region_deco_alt_desc=Uma gaiola de metal com tamanho suficiente apenas para conter uma pessoa. Ela está suspensa sobre um abismo profundo, presa por uma corrente.
levels.prisonlevel.region_deco_alt_name=gaiola suspensa
levels.prisonlevel.region_deco_desc=Uma gaiola de metal com tamanho suficiente apenas para conter uma pessoa. Parece estar presa ao chão de alguma forma, não é possível movê-la.
levels.prisonlevel.region_deco_name=Jaula de prisão
levels.prisonlevel.water_name=Água escura e fria
levels.rooms.quest.ambitiousimproom$questentrance.desc=Este poço sinistro parece ser a entrada para algum antigo cofre anão. Uma barreira mágica impede a entrada; você pode andar sobre ela como se houvesse chão.
levels.rooms.quest.ambitiousimproom$questentrance.name=Entrada do cofre
levels.rooms.quest.blacksmithroom$questentrance.desc=Esta escada leva a uma antiga mina logo abaixo da oficina do ferreiro.
levels.rooms.quest.blacksmithroom$questentrance.name=Entrada da mina
levels.rooms.quest.massgraveroom$bones.desc=Ossos espalhados pelo chão, o que aconteceu aqui?
levels.rooms.quest.massgraveroom$bones.name=vala comum
levels.rooms.quest.mineentrance$questexit.desc=Esta escada leva para fora da mina, de volta à oficina do ferreiro.
levels.rooms.quest.mineentrance$questexit.name=Saída da mina
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Um marcador pintado para algum ritual sombrio. Velas são geralmente colocadas nos quatro cantos.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Marcador ritual
levels.rooms.special.magicalfireroom$eternalfire.desc=Uma parede de fogo verde brilhante e denso se ergue aqui, aparentemente causada por magia. É tão densa que você não consegue atravessá-la e incendeia tudo que se aproxima demais. Não dá sinais de que vai se extinguir naturalmente; você precisará usar algo para apagá-la.
levels.rooms.special.sentryroom$sentry.desc=Esta sentinela vermelho-sangue parece estar posicionada aqui para guardar o tesouro no outro extremo desta sala. Ela disparará raios de magia de desintegração em você se você entrar na área que ela defende. Ela é imune a todos os efeitos nocivos e pode ver através da invisibilidade, mas parece levar um tempo para carregar antes de começar a atirar. De alguma forma, a sentinela só quer atirar em você, como se soubesse que os habitantes da masmorra não representam uma ameaça ao tesouro.
levels.rooms.special.sentryroom$sentry.discover_hint=Você pode encontrar esse inimigo em qualquer lugar da masmorra.
levels.rooms.special.sentryroom$sentry.name=sentinela vermelha
levels.rooms.special.toxicgasroom$toxicvent.desc=Algum aventureiro descuidado deve ter acionado essa armadilha há muito tempo. Apesar de estar inativa, ela continua expelindo gás tóxico pela sala e não dá sinais de que vai parar. Você precisará de alguma forma de evitar danos causados pelo gás se quiser explorar esta sala.
levels.rooms.special.toxicgasroom$toxicvent.name=ventilação tóxica
levels.rooms.special.weakfloorroom$hiddenwell.desc=É possível distinguir um poço nas profundezas, talvez haja algo lá embaixo?
levels.rooms.special.weakfloorroom$hiddenwell.name=poço distante
levels.sewerlevel.bookshelf_desc=A estante está cheia de livros baratos e inúteis. Será que ela pode pegar fogo?
levels.sewerlevel.empty_deco_desc=Musgo úmido e amarelado cobre o chão.
levels.sewerlevel.region_deco_desc=Um barril robusto, quase do seu tamanho. Deve estar cheio de alguma coisa, pois é pesado demais para mover.
levels.sewerlevel.region_deco_name=Barril de armazenamento
levels.sewerlevel.water_name=Água turva
levels.traps.alarmtrap.alarm=A armadilha emite um som estridente que ecoa por toda a masmorra!
levels.traps.alarmtrap.desc=Essa armadilha parece estar ligada a um mecanismo de alarme muito alto. Acioná-lo provavelmente alertará todos no andar.
levels.traps.alarmtrap.name=armadilha de alarme
levels.traps.blazingtrap.desc=Ao pisar nessa armadilha, uma poderosa mistura química será acionada, incendiando uma vasta área.
levels.traps.blazingtrap.name=armadilha flamejante
levels.traps.burningtrap.desc=Ao pisar nessa armadilha, uma mistura química será acionada, incendiando a área ao redor.
levels.traps.burningtrap.name=armadilha de fogo
levels.traps.chillingtrap.desc=Quando ativada, as substâncias químicas presentes nessa armadilha congelarão rapidamente o ar ao seu redor.
levels.traps.chillingtrap.name=armadilha arrepiante
levels.traps.confusiontrap.desc=Acionar essa armadilha liberará uma nuvem de gás causador de confusão na área imediata.
levels.traps.confusiontrap.name=armadilha de gás de confusão
levels.traps.corrosiontrap.desc=Acionar essa armadilha liberará uma nuvem de gás ácido mortal na área imediata.
levels.traps.corrosiontrap.name=armadilha de gás corrosivo
levels.traps.cursingtrap.curse=Seu equipamento desgastado fica amaldiçoado!
levels.traps.cursingtrap.desc=Esta armadilha contém a mesma magia maligna encontrada em equipamentos amaldiçoados. Ao ativá-la, alguns itens na área imediata serão amaldiçoados.
levels.traps.cursingtrap.name=armadilha de maldição
levels.traps.disarmingtrap.desc=Essa armadilha contém uma magia de teletransporte muito específica, que transportará a arma da vítima para outro local.
levels.traps.disarmingtrap.disarm=Sua arma foi teletransportada para longe!
levels.traps.disarmingtrap.name=armadilha de desarmamento
levels.traps.disintegrationtrap.desc=Quando acionada, esta armadilha lançará raios de desintegração no alvo mais próximo, causando dano significativo e destruindo itens. Felizmente, o mecanismo de acionamento não está escondido.
levels.traps.disintegrationtrap.name=armadilha de desintegração
levels.traps.disintegrationtrap.ondeath=Você foi morto pela armadilha de desintegração...
levels.traps.disintegrationtrap.one=A armadilha desintegra seu %s!
levels.traps.disintegrationtrap.some=A armadilha desintegra parte do seu %s!
levels.traps.distortiontrap.desc=Construída com uma estranha magia de origem desconhecida, esta armadilha invocará todo tipo de criatura para este local.
levels.traps.distortiontrap.name=armadilha de distorção
levels.traps.explosivetrap.desc=Esta armadilha contém explosivo em pó e um mecanismo de acionamento. Ao ativá-la, ocorrerá uma explosão na área imediata.
levels.traps.explosivetrap.name=armadilha explosiva
levels.traps.flashingtrap.desc=Ao ser ativada, esta armadilha inflamará um potente pó inflamável armazenado em seu interior, cegando, incapacitando e ferindo temporariamente a vítima. A armadilha deve ter uma grande quantidade de pó, pois pode ser ativada várias vezes sem quebrar.
levels.traps.flashingtrap.name=armadilha intermitente
levels.traps.flocktrap.desc=Talvez seja uma brincadeira de algum mago amador; acionar essa armadilha criará um rebanho de ovelhas mágicas.
levels.traps.flocktrap.name=armadilha para rebanho
levels.traps.frosttrap.desc=Quando ativada, as substâncias químicas presentes nessa armadilha congelarão rapidamente o ar em uma ampla área ao redor de sua localização.
levels.traps.frosttrap.name=armadilha de gelo
levels.traps.gatewaytrap.desc=Essa armadilha de teletransporte especial pode ser ativada um número infinito de vezes e sempre teletransporta para o mesmo local.
levels.traps.gatewaytrap.name=armadilha de entrada
levels.traps.geysertrap.desc=Quando acionada, essa armadilha fará com que um gêiser de água jorre, causando dano aos inimigos em chamas, arremessando todos os personagens próximos, apagando incêndios e transformando o terreno ao redor em água.
levels.traps.geysertrap.name=armadilha de gêiser
levels.traps.gnollrockfalltrap.desc=Esta armadilha de queda de rochas é feita com algum tipo de auxílio mágico. Quando acionada, ela fará com que rochas se soltem e caiam imediatamente de cima em uma área de 5x5 ao redor dela. Devido às rochas mais macias na área, ela não causará tanto dano quanto uma armadilha de queda de rochas comum, mas sua armadura também não será eficaz contra ela. Rochas também não cairão em locais com uma barricada adjacente, pois elas ajudam a sustentar o teto._Esta armadilha não distingue amigo de inimigo e, portanto, é tão prejudicial aos gnolls quanto a você._
levels.traps.gnollrockfalltrap.name=armadilha de queda de rochas gnoll
levels.traps.grimtrap.desc=Uma magia destrutiva extremamente poderosa está armazenada dentro desta armadilha, suficiente para matar instantaneamente qualquer um, exceto os heróis mais saudáveis. Ao ativá-la, uma rajada de magia letal será lançada em direção ao personagem mais próximo. Felizmente, o mecanismo de ativação não está escondido.
levels.traps.grimtrap.name=armadilha sinistra
levels.traps.grimtrap.ondeath=Você foi morto pela explosão de uma armadilha sinistra...
levels.traps.grippingtrap.desc=Esta armadilha prende-se aos pés de quem a aciona, causando dano e reduzindo a velocidade de movimento. Devido à sua simplicidade, esta armadilha pode ser ativada várias vezes sem quebrar.
levels.traps.grippingtrap.name=armadilha de agarrar
levels.traps.guardiantrap$guardian.desc=Essa aparição azul parece ser um eco invocado de um dos guardiões de pedra da masmorra.
levels.traps.guardiantrap$guardian.desc_weapon=Embora a estátua em si seja quase incorpórea, o _%s_ que ela empunha parece real.
levels.traps.guardiantrap$guardian.discover_hint=Você pode encontrar esse inimigo com uma armadilha específica.
levels.traps.guardiantrap$guardian.name=guardião convocado
levels.traps.guardiantrap.alarm=A armadilha emite um som estridente que ecoa por toda a masmorra!
levels.traps.guardiantrap.desc=Essa armadilha está ligada a um estranho mecanismo mágico, que invocará guardiões e alertará todos os inimigos no andar.
levels.traps.guardiantrap.name=armadilha guardiã
levels.traps.oozetrap.desc=Ao ser ativada, essa armadilha lançará um líquido cáustico que causará queimaduras até ser removido pela água.
levels.traps.oozetrap.name=armadilha de lodo
levels.traps.pitfalltrap.desc=Essa armadilha está conectada a um grande mecanismo de alçapão, e logo após ser acionado, qualquer coisa próxima a ele deslizará pelo chão e cairá! No entanto, não funcionará em áreas com pisos muito sólidos.
levels.traps.pitfalltrap.name=armadilha de armadilha
levels.traps.pitfalltrap.no_pit=O solo é muito firme para que uma armadilha de queda funcione aqui.
levels.traps.pitfalltrap.triggered=O chão começa a ceder ao redor da armadilha acionada!
levels.traps.pitfalltrap.triggered_hero=O chão começa a ceder ao seu redor!
levels.traps.poisondarttrap.desc=Um pequeno lançador de dardos deve estar escondido por perto; ativar essa armadilha fará com que ela dispare um dardo envenenado no alvo mais próximo. Felizmente, o mecanismo de disparo não está escondido.
levels.traps.poisondarttrap.name=armadilha de dardo envenenado
levels.traps.poisondarttrap.ondeath=Você foi morto pela armadilha de dardos envenenados...
levels.traps.rockfalltrap.desc=Esta armadilha está conectada a uma série de pedras soltas acima; ao acioná-la, elas cairão sobre toda a sala! Se a armadilha não estiver em uma sala específica, as pedras cairão em uma área ao redor dela. Felizmente, o mecanismo de acionamento não está escondido.
levels.traps.rockfalltrap.name=armadilha de queda de rochas
levels.traps.rockfalltrap.ondeath=Você foi esmagado pela armadilha de queda de rochas...
levels.traps.shockingtrap.desc=Um mecanismo com uma grande quantidade de energia armazenada. Acionar essa armadilha liberará essa energia em um campo ao seu redor.
levels.traps.shockingtrap.name=armadilha chocante
levels.traps.stormtrap.desc=Um mecanismo com uma enorme quantidade de energia armazenada. Acionar essa armadilha liberará essa energia em uma grande tempestade elétrica.
levels.traps.stormtrap.name=armadilha de tempestade
levels.traps.summoningtrap.desc=Acionar essa armadilha fará com que vários monstros desta área apareçam neste local.
levels.traps.summoningtrap.name=armadilha de invocação
levels.traps.teleportationtrap.desc=Sempre que essa armadilha for acionada, tudo ao redor será teleportado para locais aleatórios neste andar.
levels.traps.teleportationtrap.name=armadilha de teletransporte
levels.traps.tengudarttrap.desc=Tengu claramente se preparou para uma luta. Esta armadilha ativará um lançador de dardos oculto que disparará um dardo envenenado contra o objeto mais próximo que não seja Tengu. A armadilha é tão bem feita que o mecanismo de ativação é impossível de detectar sem auxílio mágico. No entanto, a armadilha fica visível por um instante enquanto está sendo armada.
levels.traps.toxictrap.desc=Acionar essa armadilha liberará uma nuvem de gás tóxico na área circundante.
levels.traps.toxictrap.name=armadilha de gás tóxico
levels.traps.trap.discover_hint=Você pode encontrar essa armadilha aleatoriamente na masmorra. Cada região possui armadilhas diferentes que podem aparecer.
levels.traps.trap.rankings_desc=Morto por: %s
levels.traps.warpingtrap.desc=Essa armadilha é semelhante a uma armadilha de teletransporte, mas também fará com que o herói perca seu conhecimento do layout do andar!
levels.traps.warpingtrap.name=armadilha de distorção
levels.traps.weakeningtrap.desc=A magia negra desta armadilha suga a energia de tudo que entra em contato com ela. Inimigos poderosos podem resistir ao efeito, no entanto.
levels.traps.weakeningtrap.name=armadilha de enfraquecimento
levels.traps.worndarttrap.desc=Um pequeno lançador de dardos deve estar escondido por perto; ativar essa armadilha fará com que ele dispare no alvo mais próximo. Devido à sua idade, não é muito perigoso, e nem está escondido...
levels.traps.worndarttrap.name=armadilha de dardos desgastada
