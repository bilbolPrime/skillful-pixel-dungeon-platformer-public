custom.theme.sewers.intro=地牢位于城市正下方，其上层实际上构成了城市的下水道系统。由于名义上是城市的一部分，这些楼层并不算危险。虽然没人会称其为安全之地，但至少你在这里不必面对邪恶魔法。
custom.theme.prison.intro=多年前，这里曾建有一座地下监狱，用来关押最危险的罪犯。当时这似乎是个绝妙的主意，因为这里的确很难逃脱。但不久之后，一股阴森恐怖的气息开始从地下弥漫开来，令囚犯和狱卒都几近疯狂。最终，这座监狱被废弃，但仍有一些罪犯被囚禁于此。
custom.theme.caves.intro=这些洞穴绵延至废弃监狱下方，人烟稀少。它们埋藏太深，城市无法开采，矿产资源又匮乏，矮人也提不起兴趣。过去，在这两个州之间的某处曾有一个贸易站，但随着矮人都城的衰落，它也随之消失了。如今，这里只剩下无处不在的豺狼人和地下生物。
custom.theme.city.intro=矮人大都会曾是矮人城邦中最伟大的城市。在其鼎盛时期，矮人的机械化军队曾成功击退了古神及其恶魔大军的入侵。但据说，凯旋的战士们也带来了腐败的种子，而那场胜利也正是这座地下王国走向衰落的开端。
custom.theme.halls.intro=过去，这片区域是都市的边缘地带。在与古神的战争中，矮人们付出了惨重的代价才取得胜利，但他们自身实力也因此削弱，无力清除残余的恶魔。恶魔逐渐控制了这片区域，如今这里被称为恶魔大厅。极少有冒险者曾深入到此……
custom.theme.sewers.sign.1=不要高估自己的力量，使用你能驾驭的武器和盔甲。
custom.theme.sewers.sign.2=下水道里有些危险乍一看很容易被忽略。如果感觉某个房间不对劲，就放慢脚步，仔细观察。
custom.theme.sewers.sign.3=记住，提升力量并不是获得更好装备的唯一途径。你还可以使用升级卷轴来降低装备的力量需求。
custom.theme.sewers.sign.4=你可以用金币在地牢各处的商店里购物。现在一楼甚至还有商人。
custom.theme.sewers.sign.5=小心粘液！
custom.theme.prison.sign.1=Pixel-Mart——助您成功冒险所需的一切！
custom.theme.prison.sign.2=尽快清点你的药剂和卷轴。不要等到真正需要它们的时候才去做。
custom.theme.prison.sign.3=饥饿本身并不痛苦，但挨饿却很痛苦。
custom.theme.prison.sign.4=突袭命中率更高。控制住门口周围的空间，你仍然可以出其不意地攻击敌人。
custom.theme.prison.sign.5=别放天狗出来！
custom.theme.caves.sign.1=像素超市。花钱，活得更久。
custom.theme.caves.sign.2=当同时受到多个怪物攻击时，试着躲到门后。
custom.theme.caves.sign.3=如果你着火了，别让自己被困住。在洞穴里，垂直移动更为重要。
custom.theme.caves.sign.4=同时拥有多个安卡是没有意义的，因为复活后你会失去它们。
custom.theme.caves.sign.5=危险！重型机械可能造成人身伤害、肢体残缺甚至死亡！
custom.theme.city.sign.1=像素超市。地牢里更安全的生活。
custom.theme.city.sign.2=升级附魔武器时，有一定几率会破坏附魔效果。
custom.theme.city.sign.3=武器和盔甲比魔杖和戒指损耗得更快，但修复它们的方法也更多。
custom.theme.city.sign.4=获得“歼灭卷轴”的唯一方法是从地牢精灵那里获得礼物。
custom.theme.city.sign.5=在陛下面前，禁止携带任何武器！
custom.theme.halls.sign.1=当你试图看清标志上的字时，它突然燃起绿色的火焰。
