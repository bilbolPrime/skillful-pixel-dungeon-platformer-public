items.weapon.curses.dazzling.desc=Armas deslumbrantes às vezes emitem uma luz ofuscante, cegando tudo o que consegue vê-las.
items.weapon.curses.dazzling.elestrike_desc=Um ataque elemental com uma maldição deslumbrante tem 50% de chance de cegar todos os inimigos ao alcance por 6 turnos.
items.weapon.curses.dazzling.name=deslumbrante %s
items.weapon.curses.displacing.desc=As armas de deslocamento são imbuídas com magia de teletransporte caótica, possuindo a capacidade de teletransportar inimigos pelo chão aleatoriamente.
items.weapon.curses.displacing.elestrike_desc=Um ataque elemental com uma maldição de deslocamento tem 50% de chance de teletransportar cada inimigo dentro do alcance.
items.weapon.curses.displacing.name=deslocando %s
items.weapon.curses.explosive.desc=Armas explosivas acumulam energia gradualmente e explodem, danificando tudo o que estiver por perto.
items.weapon.curses.explosive.desc_cool=Sua arma está fria ao toque neste momento.
items.weapon.curses.explosive.desc_hot=Sua arma está quente! Ela está prestes a explodir!
items.weapon.curses.explosive.desc_warm=Sua arma está acumulando energia e aquecendo...
items.weapon.curses.explosive.elestrike_desc=Um ataque elemental com maldição explosiva tem 50% de chance de causar uma explosão em um inimigo aleatório dentro do alcance.
items.weapon.curses.explosive.hot=Quente!
items.weapon.curses.explosive.name=explosivo %s
items.weapon.curses.explosive.warm=Esquentar...
items.weapon.curses.friendly.desc=Armas amigáveis são mais adequadas para pacifistas, ocasionalmente desencadeando magia que torna o combate impossível.
items.weapon.curses.friendly.elestrike_desc=Um ataque elemental com uma maldição aliada tem 50% de chance de enfeitiçar cada inimigo no alcance por 6 turnos.
items.weapon.curses.friendly.name=amigável %s
items.weapon.curses.polarized.desc=Uma arma polarizada é afetada por magia, fazendo com que seu ataque cause 50% mais dano ou nenhum dano.
items.weapon.curses.polarized.elestrike_desc=Um ataque elemental com uma maldição polarizada tem 50% de chance de causar de 24 a 36 de dano a cada inimigo dentro do alcance.
items.weapon.curses.polarized.name=polarizado %s
items.weapon.curses.sacrificial.desc=As armas sacrificiais exigirão sangue do portador em troca de ataques contra inimigos. Quanto mais saudável o portador estiver, mais sangue a maldição consumirá.
items.weapon.curses.sacrificial.elestrike_desc=Um ataque elemental com uma maldição sacrificial faz com que o herói e cada inimigo ao alcance sangrem, perdendo 12 pontos de vida.
items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.wayward$waywardbuff.desc=A magia da sua arma descontrolada foi ativada, tornando-a extremamente imprecisa por um curto período. Observe que isso não afeta ataques com acerto garantido, como ataques surpresa. Atacar com sucesso usando a arma descontrolada removerá esse efeito imediatamente.
items.weapon.curses.wayward$waywardbuff.name=rebelde
items.weapon.curses.wayward.desc=Armas descontroladas podem se tornar extremamente imprecisas. Essa magia dura pouco tempo após ser ativada, mas pode ser dissipada ao acertar um golpe com a arma descontrolada.
items.weapon.curses.wayward.elestrike_desc=Um ataque elemental com uma maldição descontrolada tem 50% de chance de amaldiçoar cada inimigo no alcance por 6 turnos.
items.weapon.curses.wayward.name=%s desgarrado
items.weapon.enchantments.blazing.desc=Este encantamento faz com que chamas jorrem de uma arma, incendiando os inimigos e causando dano bônus àqueles que já estão em chamas.
items.weapon.enchantments.blazing.elestrike_desc=Um ataque elemental com um encantamento flamejante espalha fogo por todos os quadrados ao alcance, com duração de 8 turnos.
items.weapon.enchantments.blazing.name=flamejante %s
items.weapon.enchantments.blocking$blockbuff.desc=O encantamento de bloqueio da sua arma concedeu um breve aumento ao seu poder defensivo!\n\nEscudo restante: %d\n\nTurnos restantes: %s.
items.weapon.enchantments.blocking$blockbuff.name=bloqueio
items.weapon.enchantments.blocking.desc=Armas de bloqueio têm uma chance de te proteger brevemente após um ataque.
items.weapon.enchantments.blocking.elestrike_desc=Um ataque elemental com um encantamento de bloqueio concede ao Duelista 6 de escudo adicional para cada inimigo ao alcance.
items.weapon.enchantments.blocking.name=bloqueando %s
items.weapon.enchantments.blooming.desc=Armas florescentes contêm magia que fará com que vegetação brote sobre ou ao redor daqueles atingidos por elas.
items.weapon.enchantments.blooming.elestrike_desc=Um ataque elemental com um encantamento de florescimento espalha grama em um raio de até 8 quadrados e imobiliza todos os inimigos dentro do alcance por 6 turnos.
items.weapon.enchantments.blooming.name=florescendo %s
items.weapon.enchantments.chilling.desc=Os inimigos atingidos por esse encantamento ficam congelados, tendo seus movimentos e ataques reduzidos.
items.weapon.enchantments.chilling.elestrike_desc=Um ataque elemental com um encantamento gélido espalha ar gélido por todos os quadrados dentro do alcance, com duração de 8 turnos.
items.weapon.enchantments.chilling.name=arrepiante %s
items.weapon.enchantments.corrupting.desc=Este poderoso encantamento possui a capacidade de fazer com que os inimigos se submetam à sua vontade. Quando um inimigo é morto com esta arma, existe a possibilidade de que ele seja corrompido em vez de morrer.
items.weapon.enchantments.corrupting.elestrike_desc=Um ataque elemental com um encantamento corruptor tem de 5 a 25% de chance (com base nos pontos de vida perdidos) de corromper todos os inimigos dentro do alcance, exceto o alvo principal.
items.weapon.enchantments.corrupting.name=corrompendo %s
items.weapon.enchantments.elastic.desc=Armas elásticas têm uma chance de arremessar inimigos para trás a curtas distâncias.
items.weapon.enchantments.elastic.elestrike_desc=Um ataque elemental com encantamento elástico empurra todos os inimigos dentro do alcance 5 quadrados para trás.
items.weapon.enchantments.elastic.name=elástico %s
items.weapon.enchantments.grim.desc=Este poderoso encantamento possui o poder de executar um inimigo instantaneamente. O efeito é mais provável de ocorrer quanto mais fraco for o inimigo.
items.weapon.enchantments.grim.elestrike_desc=Um ataque elemental com um encantamento sombrio tem de 6 a 30% de chance (com base nos pontos de vida perdidos) de matar todos os inimigos dentro do alcance, exceto o alvo principal.
items.weapon.enchantments.grim.name=sombrio %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Sua arma armazenou o excesso de força de um golpe fatal anterior e a aplicará como dano bônus ao seu próximo ataque. No entanto, a energia se dissipará lentamente com o tempo. \n\nDano Conservado: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=danos conservados
items.weapon.enchantments.kinetic.desc=Quando um inimigo é morto com uma arma cinética, qualquer excesso de força é armazenado na arma e será aplicado no próximo ataque bem-sucedido.
items.weapon.enchantments.kinetic.elestrike_desc=Um ataque elemental com encantamento cinético aplica 40% do dano armazenado a cada inimigo dentro do alcance, exceto o alvo principal.
items.weapon.enchantments.kinetic.name=cinética %s
items.weapon.enchantments.lucky.desc=Inimigos mortos por uma arma da sorte têm uma chance de deixar cair itens extras.
items.weapon.enchantments.lucky.elestrike_desc=Um ataque elemental com um encantamento de sorte tem 12,5% de chance de gerar itens sob cada inimigo no alcance. Este efeito só pode ser ativado uma vez por inimigo.
items.weapon.enchantments.lucky.name=sortudo %s
items.weapon.enchantments.projecting.desc=Com esse encantamento, armas de combate corpo a corpo terão alcance maior. Armas de longo alcance atravessarão paredes ao serem apontadas para alvos próximos.
items.weapon.enchantments.projecting.elestrike_desc=Um ataque elemental com um encantamento de projeção causa 30% de dano a cada inimigo no alcance, exceto o alvo principal.
items.weapon.enchantments.projecting.name=projetando %s
items.weapon.enchantments.shocking.desc=Arcos elétricos emanam de uma arma de choque, causando dano extra a todos os inimigos próximos.
items.weapon.enchantments.shocking.elestrike_desc=Um ataque elemental com um encantamento chocante espalha eletricidade por todos os quadrados ao alcance, com duração de 8 turnos.
items.weapon.enchantments.shocking.name=chocante %s
items.weapon.enchantments.unstable.desc=Este encantamento irradia energia caótica, agindo como um encantamento diferente a cada golpe.
items.weapon.enchantments.unstable.elestrike_desc=Um ataque elemental com um encantamento instável aplica um efeito de encantamento aleatório a cada inimigo dentro do alcance, exceto o alvo principal.
items.weapon.enchantments.unstable.name=instável %s
items.weapon.enchantments.vampiric.desc=Este poderoso encantamento drena a força vital dos inimigos a cada golpe, canalizando-a de volta para o usuário. O efeito é mais forte quanto menor for a saúde do usuário.
items.weapon.enchantments.vampiric.elestrike_desc=Um ataque elemental com encantamento vampírico cura o Duelista em 2,5 PV para cada inimigo ao alcance.
items.weapon.enchantments.vampiric.name=vampírico %s
items.weapon.melee.assassinsblade.ability_desc=A Duelista pode se esgueirar enquanto empunha uma lâmina de assassina. Essa habilidade permite que a Duelista se teletransporte instantaneamente até 3 quadrados de distância e lhe concede _%d turnos de invisibilidade._
items.weapon.melee.assassinsblade.ability_name=esgueirar-se
items.weapon.melee.assassinsblade.desc=Uma pequena lâmina ondulada feita de obsidiana, difícil de usar apesar de ser leve, mas mortal se atingir o alvo certo.
items.weapon.melee.assassinsblade.name=lâmina de assassino
items.weapon.melee.assassinsblade.stats_desc=Esta arma é mais eficaz contra inimigos desavisados.
items.weapon.melee.assassinsblade.typical_ability_desc=A Duelista pode se esgueirar enquanto empunha uma lâmina de assassina. Essa habilidade permite que a Duelista se teletransporte instantaneamente até 3 quadrados de distância e geralmente lhe concede _%d turnos de invisibilidade._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Duração da habilidade
items.weapon.melee.battleaxe.ability_desc=O Duelista pode desferir um _golpe pesado_ com um machado de batalha. Este ataque concentrado causa _%1$d-%2$d de dano_ se surpreender o inimigo e o atordoa por 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado sempre acerta, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.battleaxe.ability_name=golpe forte
items.weapon.melee.battleaxe.desc=A enorme cabeça de aço deste machado de batalha confere um peso considerável a cada golpe amplo.
items.weapon.melee.battleaxe.name=machado de batalha
items.weapon.melee.battleaxe.stats_desc=Esta é uma arma bastante precisa.
items.weapon.melee.battleaxe.typical_ability_desc=O Duelista pode desferir um _golpe pesado_ com um machado de batalha. Este ataque concentrado normalmente causa _%1$d-%2$d de dano_ se surpreender o inimigo, e o atordoa por 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado sempre acerta, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.crossbow$chargedshot.desc=A Duelista está concentrando poder em sua besta. O próximo ataque que ela fizer com ela sempre acertará e aplicará um dos três efeitos: \n - Ataques corpo a corpo arremessarão os inimigos a alguns quadrados de distância. \n - Dardos sem ponta causarão dano bônus. \n - Dardos com ponta ganharão usos extras e aplicarão seu efeito em uma área de 7x7. Os efeitos positivos dos dardos afetarão apenas aliados, e os efeitos negativos se aplicarão apenas a inimigos. A Duelista não pode usar esta habilidade para aplicar efeitos positivos de dardos a si mesma.
items.weapon.melee.crossbow$chargedshot.name=cobrado
items.weapon.melee.crossbow.ability_desc=A Duelista pode _carregar_ sua besta, fazendo com que seu próximo ataque normal com ela sempre acerte e aplique um dos três efeitos: ataques corpo a corpo empurrarão os inimigos para longe, dardos sem ponta causarão _+%1$d de dano_, e dardos com ponta aplicarão seu efeito em uma área de 7x7 e durarão _%2$d usos adicionais_.
items.weapon.melee.crossbow.ability_name=tiro carregado
items.weapon.melee.crossbow.desc=Uma arma bastante complexa que dispara virotes a velocidades excepcionais. Embora não tenha sido projetada para isso, o peso e a construção robusta desta besta também a tornam uma arma de combate corpo a corpo decente.
items.weapon.melee.crossbow.name=besta
items.weapon.melee.crossbow.stats_desc=Esta arma aprimora os dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e ainda concede seu encantamento a eles.
items.weapon.melee.crossbow.typical_ability_desc=A Duelista pode _carregar_ sua besta, fazendo com que seu próximo ataque normal com ela sempre acerte e aplique um dos três efeitos: ataques corpo a corpo empurrarão os inimigos para longe, dardos sem ponta normalmente causarão _+%1$d de dano_, e dardos com ponta aplicarão seu efeito em uma área de 7x7 e normalmente durarão _%2$d usos adicionais_.
items.weapon.melee.crossbow.typical_stats_desc=Normalmente, esta arma aprimora os dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e até mesmo concede seu encantamento a eles.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Aumento de Habilidade
items.weapon.melee.cudgel.ability_desc=O Duelista pode desferir um _golpe pesado_ com um porrete. Este ataque concentrado causa _%1$d-%2$d de dano_ se surpreender o inimigo e o atordoa por 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado sempre acerta, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.cudgel.ability_name=golpe forte
items.weapon.melee.cudgel.desc=Uma pequena maça de latão, feita mais como uma ferramenta de autodefesa para nobres do que como uma arma para aventureiros.
