custom.theme.sewers.intro=Ruang Bawah Tanah terletak tepat di bawah Kota, tingkat atasnya sebenarnya merupakan sistem saluran pembuangan Kota. Karena secara nominal merupakan bagian dari Kota, tingkat-tingkat ini tidak terlalu berbahaya. Tidak ada yang akan menyebutnya tempat yang aman, tetapi setidaknya Anda tidak perlu berurusan dengan sihir jahat di sini.
custom.theme.prison.intro=Bertahun-tahun yang lalu, sebuah penjara bawah tanah dibangun di sini untuk para penjahat paling berbahaya. Pada saat itu, tampaknya itu adalah ide yang sangat cerdas, karena tempat ini memang sangat sulit untuk diloloskan. Tetapi segera kabut gelap mulai merembes dari bawah, membuat para tahanan dan penjaga menjadi gila. Pada akhirnya penjara itu ditinggalkan, meskipun beberapa narapidana dibiarkan terkunci di sini.
custom.theme.caves.intro=Gua-gua yang membentang di bawah penjara yang terbengkalai itu jarang dihuni. Gua-gua tersebut terlalu dalam untuk dieksploitasi oleh Kota dan terlalu miskin mineral untuk menarik minat para kurcaci. Di masa lalu, ada pos perdagangan di suatu tempat di sini, di jalur antara kedua negara bagian ini, tetapi pos tersebut telah lenyap sejak kemunduran Metropolis Kurcaci. Hanya gnoll dan hewan bawah tanah yang ada di mana-mana yang tinggal di sini sekarang.
custom.theme.city.intro=Metropolis Kurcaci dulunya adalah negara-kota kurcaci terbesar. Pada masa kejayaannya, pasukan kurcaci yang dilengkapi mesin berhasil memukul mundur invasi dewa kuno dan pasukan iblisnya. Namun, konon para prajurit yang kembali membawa benih-benih korupsi, dan kemenangan itu adalah awal dari akhir bagi kerajaan bawah tanah tersebut.
custom.theme.halls.intro=Dahulu, wilayah ini merupakan pinggiran Metropolis. Setelah kemenangan yang mahal dalam perang melawan dewa kuno, para kurcaci terlalu lemah untuk membersihkan wilayah ini dari iblis yang tersisa. Secara bertahap, iblis semakin memperketat cengkeramannya di tempat ini dan sekarang disebut Aula Iblis. Sangat sedikit petualang yang pernah turun sejauh ini...
custom.theme.sewers.sign.1=Jangan terlalu percaya diri dengan kekuatanmu, gunakan senjata dan baju zirah yang mampu kamu tangani.
custom.theme.sewers.sign.2=Beberapa bahaya di saluran pembuangan mudah terlewatkan pada pandangan pertama. Jika suatu ruangan terasa mencurigakan, perlambat langkah dan perhatikan dengan saksama.
custom.theme.sewers.sign.3=Ingatlah bahwa meningkatkan kekuatan bukanlah satu-satunya cara untuk mendapatkan peralatan yang lebih baik. Anda juga dapat menurunkan persyaratan kekuatannya dengan Gulungan Peningkatan.
custom.theme.sewers.sign.4=Anda bisa membelanjakan emas Anda di toko-toko yang tersebar di seluruh ruang bawah tanah. Bahkan sekarang ada pedagang di lantai pertama.
custom.theme.sewers.sign.5=Waspadalah terhadap Goo!
custom.theme.prison.sign.1=Pixel-Mart - semua yang Anda butuhkan untuk petualangan yang sukses!
custom.theme.prison.sign.2=Identifikasi ramuan dan gulungan Anda sesegera mungkin. Jangan menundanya hingga saat Anda benar-benar membutuhkannya.
custom.theme.prison.sign.3=Rasa lapar tidak sakit, tetapi kelaparan itu sakit.
custom.theme.prison.sign.4=Serangan mendadak memiliki peluang lebih besar untuk mengenai sasaran. Anda masih bisa mengejutkan musuh ketika Anda mengendalikan ruang di sekitar pintu.
custom.theme.prison.sign.5=Jangan biarkan Tengu keluar!
custom.theme.caves.sign.1=Pixel-Mart. Belanjakan uang. Hidup lebih lama.
custom.theme.caves.sign.2=Saat diserang oleh beberapa monster sekaligus, cobalah untuk berlindung di balik pintu.
