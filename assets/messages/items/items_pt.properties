items.potions.potion.charcoal=poção de carvão
items.potions.potion.crimson=poção carmesim
items.potions.potion.discover_hint=Você pode encontrar este item aleatoriamente na masmorra ou criá-lo através da alquimia.
items.potions.potion.golden=poção dourada
items.potions.potion.harmful=Poção nociva!
items.potions.potion.indigo=poção índigo
items.potions.potion.ivory=poção de marfim
items.potions.potion.jade=poção de jade
items.potions.potion.magenta=poção magenta
items.potions.potion.no=Não, mudei de ideia.
items.potions.potion.shatter=O frasco se estilhaça e o líquido espirra sem causar danos.
items.potions.potion.silver=poção de prata
items.potions.potion.sure_drink=Tem certeza de que quer beber isso? Na maioria dos casos, você deveria jogar essas poções nos seus inimigos.
items.potions.potion.sure_throw=Tem certeza de que quer jogar fora? Na maioria dos casos, faz sentido beber.
items.potions.potion.turquoise=poção turquesa
items.potions.potion.unknown_desc=Este frasco contém um líquido colorido em movimento. Quem sabe o que acontecerá quando for bebido ou atirado?
items.potions.potion.yes=Sim, eu sei o que estou fazendo.
items.potions.potionofexperience.desc=As experiências lendárias de inúmeras batalhas reduzidas à forma líquida, esta poção aumentará instantaneamente seu nível de experiência.
items.potions.potionofexperience.name=poção de experiência
items.potions.potionoffrost.desc=A substância química contida nesta poção evaporará, transformando-se em uma nuvem congelante ao entrar em contato com o ar.
items.potions.potionoffrost.name=poção de gelo
items.potions.potionofhaste.desc=Ingerir esse líquido estranhamente doce lhe dará uma energia tremenda por um curto período de tempo, permitindo que você corra em alta velocidade.
items.potions.potionofhaste.energetic=Você se sente cheio de energia!
items.potions.potionofhaste.name=poção da pressa
items.potions.potionofhealing.desc=Este elixir restaurará rapidamente sua saúde e curará instantaneamente muitas doenças.
items.potions.potionofhealing.heal=Suas feridas começam a cicatrizar.
items.potions.potionofhealing.name=poção de cura
items.potions.potionofinvisibility.desc=Ao beber esta poção, você ficará temporariamente invisível. Enquanto estiver invisível, os inimigos não poderão vê-lo. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelarão imediatamente a invisibilidade.
items.potions.potionofinvisibility.invisible=Você vê suas mãos ficarem invisíveis!
items.potions.potionofinvisibility.name=poção da invisibilidade
items.potions.potionoflevitation.desc=Ao beber este curioso líquido, você poderá flutuar no ar, deslizando sem esforço sobre armadilhas e fossos. Arremessar esta poção criará uma nuvem de gás bruto, desorientando tudo o que for atingido por ela.
items.potions.potionoflevitation.float=Você flutua no ar!
items.potions.potionoflevitation.name=poção de levitação
items.potions.potionofliquidflame.desc=Este frasco contém um composto instável que entrará em combustão espontânea violenta ao entrar em contato com o ar.
items.potions.potionofliquidflame.name=poção de chama líquida
items.potions.potionofmindvision.desc=Após beber esta poção, sua mente se sintonizará com a assinatura psíquica de criaturas distantes, permitindo que você sinta presenças biológicas através das paredes. Além disso, esta poção lhe permitirá ver através de paredes e portas próximas.
items.potions.potionofmindvision.name=poção da visão mental
items.potions.potionofmindvision.see_mobs=De alguma forma, você consegue sentir a presença da mente de outras criaturas!
items.potions.potionofmindvision.see_none=De alguma forma, você consegue perceber que está sozinho nesse nível neste momento.
items.potions.potionofparalyticgas.desc=Ao entrar em contato com o ar, o líquido neste frasco vaporizará, formando uma névoa amarela e entorpecente. Qualquer um que inalar a nuvem ficará instantaneamente paralisado, incapaz de se mover por algum tempo após a dissipação da nuvem. Este item pode ser arremessado contra inimigos distantes para atingi-los dentro do efeito do gás.
items.potions.potionofparalyticgas.name=poção de gás paralisante
items.potions.potionofpurity.desc=Este reagente mágico neutralizará rapidamente todos os efeitos nocivos localizados em uma grande área. Ingeri-lo lhe dará imunidade temporária a tais efeitos.
items.potions.potionofpurity.freshness=Sente-se uma frescura incomum no ar.
items.potions.potionofpurity.name=poção da pureza
items.potions.potionofpurity.protected=Uma película protetora te envolve!
items.potions.potionofstrength.desc=Este poderoso líquido percorrerá seus músculos, aumentando permanentemente sua força em um ponto.
items.potions.potionofstrength.msg=Uma força inédita percorre seu corpo, agora você possui a força %d!
items.potions.potionofstrength.name=poção da força
items.potions.potionoftoxicgas.desc=Ao abrir ou quebrar este frasco de vidro pressurizado, seu conteúdo explodirá em uma nuvem mortal de gás verde tóxico. Você pode optar por arremessar esta poção contra inimigos distantes em vez de abri-la manualmente.
items.potions.potionoftoxicgas.name=poção de gás tóxico
items.quest.ceremonialcandle.desc=Um conjunto de velas, derretidas e fundidas pelo uso. Sozinhas, elas não têm valor, mas usadas com outras velas em um padrão, podem concentrar a energia para um ritual de invocação.
items.quest.ceremonialcandle.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.ceremonialcandle.name=vela cerimonial
items.quest.corpsedust.chill=Um arrepio percorre sua espinha.
items.quest.corpsedust.desc=A bola de pó de cadáver não difere externamente de uma bola de poeira comum. Mas você pode sentir uma energia malévola à espreita dentro dela. Livrar-se dela o mais rápido possível seria uma boa ideia.
items.quest.corpsedust.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.corpsedust.name=pó de cadáver
items.quest.darkgold.desc=Esse metal é chamado de escuro não por causa de sua cor (que não difere da cor do ouro normal), mas porque derrete sob a luz do dia, tornando-se inútil na superfície.
items.quest.darkgold.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.darkgold.name=minério de ouro escuro
items.quest.darkgold.you_now_have=Você agora possui minério de ouro escuro %d.
items.quest.dwarftoken.desc=Muitos anões e algumas de suas criações maiores carregam esses pequenos pedaços de metal de propósito desconhecido. Talvez sejam joias ou algum tipo de identificação. Os anões são um povo estranho.
items.quest.dwarftoken.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.dwarftoken.name=ficha de anão
items.quest.embers.desc=Brasas especiais que só podem ser coletadas de elementais de fogo jovens. Elas irradiam energia térmica.
items.quest.embers.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.embers.name=brasas elementais
items.quest.escapecrystal.ac_use=USAR
items.quest.escapecrystal.desc=Um fino cristal mágico que parece conter magia de teletransporte. Você pode usar o cristal a qualquer momento para sair do cofre anão, mas não poderá levar nada consigo!
items.quest.escapecrystal.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.escapecrystal.name=cristal de escape
items.quest.gooblob.desc=Uma gosma gelatinosa, desprendida de Goo quando este morreu. É quase como uma grande bola de gelatina, embora você não ousaria comê-la. Ela não faz nada sozinha, mas pode ser útil quando combinada com certas poções ou uma bomba. No mínimo, deve se converter em uma quantidade razoável de energia.
items.quest.gooblob.discover_hint=Você pode obter este item como recompensa ao derrotar certos inimigos.
items.quest.gooblob.name=bolha de gosma
items.quest.metalshard.desc=Um fragmento de metal amaldiçoado e enferrujado, que se desprendeu do DM-300 quando este foi destruído. É possível sentir uma magia maligna inativa dentro dele. Ele não faz nada por si só, mas pode ser útil quando combinado com certos pergaminhos ou uma bomba. No mínimo, deve se converter em uma quantidade razoável de energia.
items.quest.metalshard.discover_hint=Você pode obter este item como recompensa ao derrotar certos inimigos.
items.quest.metalshard.name=fragmento de metal amaldiçoado
items.quest.pickaxe.ability_desc=O Duelista pode perfurar um inimigo com uma picareta. O ataque acerta com certeza, aplica vulnerabilidade por 3 turnos e causa dano de %1$d a %2$d a inimigos com pele rígida.
items.quest.pickaxe.ability_name=perfurar
items.quest.pickaxe.desc=Esta é uma ferramenta robusta e pesada para quebrar rochas. Você não precisa equipar a picareta para minerar com ela, mas provavelmente pode equipá-la como arma em caso de necessidade.
items.quest.pickaxe.discover_hint=Você pode encontrar este item durante uma missão específica.
items.quest.pickaxe.name=picareta
items.quest.pickaxe.upgrade_ability_stat_name=Dano de Habilidade
items.quest.ratskull.desc=Um crânio de rato surpreendentemente grande. Seria um ótimo troféu de caça, se você tivesse uma parede para pendurá-lo.
items.quest.ratskull.name=crânio de rato gigante
items.remains.bowfragment.desc=Este fragmento de madeira quebrado fazia parte de um arco espiritual perdido de uma Caçadora. Você ainda pode sentir um pouco de energia natural residual no fragmento; você pode usá-lo para fazer crescer grama alta ao seu redor. No entanto, fazer isso destruirá o fragmento.
items.remains.bowfragment.name=fragmento de arco
items.remains.brokenhilt.desc=Este cabo quebrado parece ter vindo da arma de um duelista derrotado. Você ainda sente um pouco de poder marcial residual no cabo, que pode ser usado para causar um pequeno bônus de dano nos seus próximos dois golpes corpo a corpo. No entanto, fazer isso destruirá o cabo.
items.remains.brokenhilt.name=cabo quebrado
items.remains.brokenstaff.desc=Este cajado de mago foi partido ao meio após a morte de seu dono. Você ainda pode sentir alguma energia mágica residual no cajado, que pode ser usada para dar um pequeno impulso de carga às suas varinhas. No entanto, fazer isso destruirá o cajado.
items.remains.brokenstaff.name=equipe quebrada
items.remains.cloakscrap.desc=Este pedaço de tecido translúcido parece ter vindo do manto das sombras de um Ladino falecido. Você ainda pode sentir um pouco de energia mística nele; pode usá-la para dar um pequeno impulso de carga aos seus artefatos. No entanto, fazer isso destruirá o tecido.
items.remains.cloakscrap.name=retalho de tecido
items.remains.remainsitem.ac_use=USAR
items.remains.remainsitem.discover_hint=Você pode encontrar este item nos restos mortais de um herói específico de uma missão anterior perdida.
items.remains.sealshard.desc=Esses minúsculos fragmentos de cera vermelha parecem ter vindo do selo de um guerreiro caído. Você ainda sente um resquício de força de vontade ligado ao selo; pode usá-lo para se proteger um pouco. No entanto, fazer isso destruirá os fragmentos do selo.
items.remains.sealshard.name=fragmentos de selo
items.remains.tornpage.desc=Esta página parece ter sido arrancada de um tomo sagrado de um clérigo antigo. Ainda há um pouco de energia divina nela, que você pode usar para recuperar um pouco de saúde. No entanto, fazer isso destruirá a página rasgada.
items.remains.tornpage.name=página rasgada
items.rings.ring.agate=anel de ágata
items.rings.ring.amethyst=anel de ametista
items.rings.ring.curse_known=É possível sentir uma magia maligna à espreita dentro deste anel.
items.rings.ring.cursed_worn=Como este anel é amaldiçoado, você não tem poder para removê-lo.
items.rings.ring.diamond=anel de diamante
items.rings.ring.emerald=anel de esmeralda
items.rings.ring.equip_cursed=O anel aperta seu dedo de forma dolorosa!
items.rings.ring.garnet=anel de granada
items.rings.ring.identify=Agora você já conhece seu anel o suficiente para identificá-lo.
items.rings.ring.known=Este é um %s
items.rings.ring.not_cursed=Este anel está livre de magia malévola.
items.rings.ring.onyx=anel de ônix
items.rings.ring.opal=anel de opala
