items.armor.curses.antientropy.desc=A maldição Anti-entropia age contra as forças do universo, atraindo energia para dentro do usuário e afastando-a do ambiente ao seu redor. Isso faz com que o usuário pegue fogo brevemente, mas congela tudo ao seu redor!
items.armor.curses.antientropy.name=%s de anti-entropia
items.armor.curses.bulk.desc=Armaduras volumosas parecem maiores e mais imponentes, mas na verdade não oferecem defesa aprimorada. Pior ainda, o tamanho adicional dificulta bastante a passagem por portas.
items.armor.curses.bulk.name=%s a granel
items.armor.curses.corrosion.desc=A armadura de corrosão é capaz de romper-se com um fluido corrosivo, revestindo tudo na área com uma gosma ácida e pegajosa.
items.armor.curses.corrosion.name=%s de corrosão
items.armor.curses.displacement.desc=A maldição do deslocamento tenta mover o usuário para um local seguro quando ele é atacado. No entanto, ela é um pouco eficaz demais, teleportando o usuário aleatoriamente pelo cenário.
items.armor.curses.displacement.name=%s de deslocamento
items.armor.curses.metabolism.desc=A maldição do metabolismo converte diretamente a saciedade em saúde quando o usuário está ferido, proporcionando um aumento na cura, mas causando rapidamente inanição.
items.armor.curses.metabolism.name=%s do metabolismo
items.armor.curses.multiplicity.desc=Armaduras amaldiçoadas com multiplicidade contêm magia de duplicação perigosa. Elas podem, por vezes, criar uma imagem espelhada do usuário, mas também podem duplicar o atacante!
items.armor.curses.multiplicity.name=%s de multiplicidade
items.armor.curses.overgrowth.desc=A armadura de crescimento excessivo é coberta por diversas plantas floridas. Embora esse efeito seja certamente interessante, não oferece nenhuma defesa, e essas plantas se ativarão aleatoriamente em combate!
items.armor.curses.overgrowth.name=%s de crescimento excessivo
items.armor.curses.stench.desc=Armaduras amaldiçoadas com mau cheiro liberam nuvens de gás tóxico, que são perigosas para tudo o que for atingido por elas.
items.armor.curses.stench.name=%s de fedor
items.armor.duelistarmor.desc=Ao usar esta armadura de placas e capa, o Duelista pode executar uma habilidade especial.
items.armor.duelistarmor.name=couraça do herói
items.armor.glyphs.affection.desc=Este poderoso glifo manipula a mente dos atacantes, enfeitiçando-os temporariamente.
items.armor.glyphs.affection.name=%s de afeição
items.armor.glyphs.antimagic.desc=Este poderoso glifo permite que a armadura defenda seu usuário contra ataques mágicos, bem como físicos. Essa defesa mágica não é afetada pelo nível da armadura.
items.armor.glyphs.antimagic.name=%s de anti-magia
items.armor.glyphs.brimstone.desc=Este glifo protege o usuário e seus pertences do fogo, anulando completamente seus danos e efeitos negativos.
items.armor.glyphs.brimstone.name=%s de enxofre
items.armor.glyphs.camouflage.desc=Este glifo permite que o usuário se camufle na grama alta, concedendo-lhe invisibilidade temporária.
items.armor.glyphs.camouflage.name=%s de camuflagem
items.armor.glyphs.entanglement.desc=Este glifo cria uma armadura de terra ao redor do usuário para absorver dano, mas essa armadura se quebrará se o usuário se mover.
items.armor.glyphs.entanglement.name=%s de emaranhamento
items.armor.glyphs.flow.desc=Este glifo manipula o fluxo de água ao redor de quem o usa, tornando-o muito mais rápido ao se mover através dela.
items.armor.glyphs.flow.name=%s de fluxo
items.armor.glyphs.obfuscation.desc=Este glifo oculta o usuário, tornando-o mais difícil de detectar.
items.armor.glyphs.obfuscation.name=%s de ofuscação
items.armor.glyphs.potential.desc=Este glifo acumula energia ao ser atingido, concedendo carga à varinha do usuário quando ativada.
items.armor.glyphs.potential.name=%s de potencial
items.armor.glyphs.repulsion.desc=Este glifo reflete a força contra os atacantes, lançando-os para trás.
items.armor.glyphs.repulsion.name=%s de repulsão
items.armor.glyphs.stone.desc=Este glifo envolve a armadura com uma pesada pedra mágica que torna a esquiva impossível, mas bloqueia o dano proporcionalmente à evasão.
items.armor.glyphs.stone.name=%s de pedra
items.armor.glyphs.swiftness.desc=Este glifo aumenta a velocidade do usuário sempre que ele não estiver perto de um inimigo.
items.armor.glyphs.swiftness.name=%s de rapidez
items.armor.glyphs.thorns.desc=Este poderoso glifo fere os atacantes, fazendo com que sangrem lentamente ao atacarem o portador.
items.armor.glyphs.thorns.name=%s de espinhos
items.armor.glyphs.viscosity$defereddamage.desc=O dano está sendo causado lentamente ao longo do tempo, em vez de imediatamente.\n\nDano diferido restante: %d.
items.armor.glyphs.viscosity$defereddamage.name=dano diferido
items.armor.glyphs.viscosity$defereddamage.ondeath=O dano adiado te matou...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Morto por dano retardado
items.armor.glyphs.viscosity.deferred=%d adiado
items.armor.glyphs.viscosity.desc=Este glifo é capaz de armazenar o dano causado ao usuário, liberando-o gradualmente em vez de todo de uma vez.
items.armor.glyphs.viscosity.name=%s de viscosidade
items.armor.huntressarmor.desc=Ao usar essa capa, a Caçadora pode executar uma habilidade especial.
items.armor.huntressarmor.name=capa de herói
items.armor.huntressarmor.no_enemies=Nenhum inimigo à vista.
items.armor.leatherarmor.desc=Armadura feita de pele curtida de monstro. Não tão leve quanto uma armadura de tecido, mas oferece melhor proteção.
items.armor.leatherarmor.name=armadura de couro
items.armor.magearmor.desc=Ao usar este magnífico manto, o Mago pode executar uma habilidade especial.
items.armor.magearmor.name=manto de herói
items.armor.mailarmor.desc=Elos metálicos interligados criam uma armadura resistente, porém flexível.
items.armor.mailarmor.name=armadura de malha
items.armor.platearmor.desc=Enormes placas de metal são unidas para formar uma armadura que oferece proteção incomparável a qualquer aventureiro forte o suficiente para suportar seu peso impressionante.
items.armor.platearmor.name=armadura de placas
items.armor.roguearmor.desc=Ao usar essa vestimenta escura, o Ladino pode executar uma habilidade especial.
items.armor.roguearmor.name=traje de herói
items.armor.scalearmor.desc=As escamas de metal costuradas em um colete de couro criam uma armadura flexível, porém protetora.
items.armor.scalearmor.name=armadura de escamas
items.armor.warriorarmor.desc=Ao usar essa armadura pesada, o Guerreiro pode executar uma habilidade especial.
items.armor.warriorarmor.name=armadura de placas do herói
items.artifacts.alchemiststoolkit.ac_brew=CERVEJA
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.artifacts.alchemiststoolkit.cursed=Seu kit de ferramentas amaldiçoado impede você de usar alquimia!
items.artifacts.alchemiststoolkit.desc=Este kit contém diversos reagentes e ervas, além de um pequeno frasco para mistura, permitindo a prática de alquimia em qualquer lugar. O frasco contém o que parecem ser cristais de energia alquímica em forma líquida.
items.artifacts.alchemiststoolkit.desc_cursed=O kit de ferramentas amaldiçoado se ligou a você e se recusa a deixá-lo usar alquimia.
items.artifacts.alchemiststoolkit.desc_hint=O kit de ferramentas equipado está gerando energia alquímica lentamente à medida que você ganha experiência. Parece que a mistura no frasco poderia ser aprimorada com a adição de cristais de energia.
items.artifacts.alchemiststoolkit.desc_warming=O kit de ferramentas está em fase de inicialização e estará pronto para uso em breve.
items.artifacts.alchemiststoolkit.energize_1=6 de energia: +1 nível
items.artifacts.alchemiststoolkit.energize_all=Energia %1$d: +Níveis %2$d
items.artifacts.alchemiststoolkit.energize_desc=A cada 6 cristais de energia, o kit de ferramentas receberá energia suficiente para subir de nível, o que aumenta a taxa de geração de energia ao longo do tempo e a rapidez com que aquece. Quanta energia você gostaria de usar?
items.artifacts.alchemiststoolkit.name=kit de ferramentas do alquimista
items.artifacts.alchemiststoolkit.need_energy=Você precisa de pelo menos 6 pontos de energia para isso.
items.artifacts.alchemiststoolkit.not_ready=Seu conjunto de ferramentas ainda não terminou de aquecer.
