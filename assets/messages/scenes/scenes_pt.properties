scenes.heroselectscene.challenges_nowin=Os desafios são modificadores opcionais que tornam o jogo mais difícil. Alguns desafios tornam a masmorra mais perigosa, outros reduzem o poder de suas habilidades ou itens. Você precisa vencer pelo menos uma partida antes de poder ativar os desafios.
scenes.heroselectscene.custom_seed=Sementes personalizadas
scenes.heroselectscene.custom_seed_clear=Claro
scenes.heroselectscene.custom_seed_desc=O jogo usa um código de semente para a geração de masmorras; a mesma semente e versão do jogo sempre geram a mesma masmorra! _Jogos com sementes personalizadas não podem ganhar emblemas nem contribuir para o número de jogos jogados e aparecem na parte inferior da página de classificação._
scenes.heroselectscene.custom_seed_duplicate=Você já tem um jogo normal em andamento com essa seed. Você precisa encerrar esse jogo antes de usar a seed personalizada.
scenes.heroselectscene.custom_seed_nowin=O jogo usa um código de semente para geração de masmorras; a mesma semente e versão do jogo sempre geram a mesma masmorra! \n\n_Você precisa vencer pelo menos uma partida antes de poder inserir sementes personalizadas._
