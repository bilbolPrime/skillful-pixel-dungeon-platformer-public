challenges.champion_enemies=Campeões hostis
challenges.champion_enemies_desc=Você não é o único que pode subir de nível! ZXQPH0 ZXQ ZXQPH1 ZXQ Inimigos comuns têm 1/8 de chance de surgir com um bônus especial de campeão no andar 1, aumentando para 1/6 no andar 21. ZXQPH2 ZXQ ZXQPH3 ZXQ - Campeões acordam se surgirem dormindo ZXQPH4 ZXQ - O herói sabe quando um campeão surge ZXQPH5 ZXQ - Campeões não podem ser transformados em aliados ZXQPH6 ZXQ ZXQPH7 ZXQ Existem seis tipos de inimigos campeões: ZXQPH8 ZXQ - Flamejante (laranja): +25% de dano corpo a corpo, pega fogo ao atingir, espalha chamas ao morrer, não pode incendiar blocos de água ZXQPH9 ZXQ - Projetando (roxo): +25% de dano corpo a corpo, +3 de alcance corpo a corpo ZXQPH10 ZXQ - Antimágico (verde): -50% Dano recebido, imune a efeitos mágicos\n_Gigante (azul):_ -80% de dano recebido, +1 de alcance corpo a corpo, não pode se mover para túneis\n_Abençoado (amarelo):_ 4x precisão e evasão\n_Crescente (vermelho):_ +20% de precisão, evasão, dano e HP efetivo. Aumenta em 1% a cada 4 turnos.
challenges.darkness=Na escuridão
challenges.darkness_desc=Afinal, é uma masmorra! ZXQPH0 ZXQ ZXQPH1 ZXQ - A distância de visibilidade normal é drasticamente reduzida ZXQPH2 ZXQ - Uma tocha aparece em cada andar ZXQPH3 ZXQ - Outras fontes de luz são 1/5 tão eficazes
challenges.no_armor=A fé é a minha armadura.
challenges.no_armor_desc=Você precisará ter fé em si mesmo, pois sua armadura não será muito útil! \n\n - O poder de bloqueio base foi reduzido para todas as armaduras, exceto as de tecido. \n - Todas as armaduras agora ganham muito pouco bloqueio ao serem aprimoradas. \n - O poder defensivo do guardião da terra também foi significativamente reduzido.
challenges.no_food=Em dieta
challenges.no_food_desc=A comida já é escassa, mas você também precisa controlar as porções! A comida e a cornucópia são um terço tão eficazes para saciar a fome. Outras fontes de saciedade não são afetadas.
challenges.no_healing=Farmacofobia
challenges.no_healing_desc=Poções de cura são muito úteis, mas infelizmente você é alérgico! Poções de cura, itens que usam poções de cura em sua receita e frutas solares envenenarão o herói em vez de curá-lo. Poções instáveis não podem envenenar ou curar o herói aleatoriamente. Esses itens ainda funcionam normalmente para outros personagens.
challenges.no_herbalism=Terra árida
challenges.no_herbalism_desc=Parece não haver mais água limpa nesta masmorra amaldiçoada... \n\n - Gotas de orvalho foram removidas \n - Plantas foram removidas \n - Sementes ainda aparecem, mas não criam raízes
challenges.no_scrolls=Runas proibidas
challenges.no_scrolls_desc=Certa runa é mais difícil de encontrar. Infelizmente, é sempre a mais útil. Metade dos pergaminhos de aprimoramento da masmorra foram removidos.
challenges.stronger_bosses=Chefes piores
