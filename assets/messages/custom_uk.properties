custom.generated.hello_adventurer_once_i_was_31d46ea80e=Привіт, шукачу пригод... Колись я був таким, як ти — сильним і впевненим... А тепер я мертвий... Але я не можу покинути це місце, бо я скутий жахливим прокляттям... Будь ласка... Допоможи мені... Зніми прокляття...
