items.rings.ring.topaz=anel de topázio
items.rings.ring.tourmaline=anel de turmalina
items.rings.ring.unknown_desc=Esta aliança de metal é adornada com uma grande gema que brilha na escuridão. Quem sabe que efeito ela terá quando usada?
items.rings.ringofaccuracy.combined_stats=Os anéis que você equipou estão combinando seus poderes, aumentando sua precisão em um total de _%s%%_.
items.rings.ringofaccuracy.desc=Este anel aumenta sua concentração, facilitando que seus ataques acertem o alvo. Um anel amaldiçoado, por outro lado, dificultará que seus ataques acertem o alvo.
items.rings.ringofaccuracy.name=anel de precisão
items.rings.ringofaccuracy.stats=Ao ser usado, este anel aumentará sua precisão em _%s%%._
items.rings.ringofaccuracy.typical_stats=Quando usado, este anel normalmente aumentará sua precisão em _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento de Precisão
items.rings.ringofarcana.combined_stats=Os anéis equipados por você estão combinando seus poderes, aumentando o poder dos encantamentos e glifos em _%s%%_ no total.
items.rings.ringofarcana.desc=Este anel aprimora encantamentos mágicos em armas e glifos em armaduras, incluindo maldições! Primeiro, ele aumenta a chance de ativação e, em seguida, aumenta a força do efeito quando a chance de ativação atinge 100%. Um anel amaldiçoado, por outro lado, enfraquecerá encantamentos, glifos e maldições.
items.rings.ringofarcana.name=anel arcano
items.rings.ringofarcana.stats=Ao ser usado, este anel aumentará o poder de encantamentos e glifos em _%s%%._
items.rings.ringofarcana.typical_stats=Quando usado, este anel normalmente aumentará o poder de encantamentos e glifos em _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Aumento de Arcana
items.rings.ringofelements.combined_stats=Seus anéis equipados estão combinando seus poderes, fornecendo uma resistência elemental total de _%s%%_.
items.rings.ringofelements.desc=Este anel oferece resistência à maioria dos efeitos elementais e mágicos, diminuindo o dano e a duração de debuffs. Naturalmente, um anel amaldiçoado irá piorar esses efeitos.
items.rings.ringofelements.name=anel de elementos
items.rings.ringofelements.stats=Quando usado, este anel proporcionará resistência elementar de _%s%%_.
items.rings.ringofelements.typical_stats=Quando usado, este anel normalmente fornecerá resistência elementar de _%s%%_.
items.rings.ringofelements.upgrade_stat_name_1=Resistência
items.rings.ringofenergy.combined_stats=Seus anéis equipados estão combinando seus poderes, aumentando a velocidade de carregamento em _%s%%_ no total.
items.rings.ringofenergy.desc=Seu equipamento mágico recarregará mais rapidamente no campo arcano que emana deste anel. Um anel amaldiçoado, por outro lado, terá uma recarga mais lenta.
items.rings.ringofenergy.name=anel de energia
items.rings.ringofenergy.stats=Ao ser equipado, este anel aumentará a velocidade de carregamento de varinhas, artefatos e armaduras heroicas em _%s%%._
items.rings.ringofenergy.typical_stats=Quando equipado, este anel normalmente aumentará a velocidade de carregamento de varinhas, artefatos e armaduras heroicas em _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Reforço de carga
items.rings.ringofevasion.combined_stats=Os anéis que você equipou estão combinando seus poderes, aumentando sua evasão em _%s%%_ no total.
items.rings.ringofevasion.desc=Este anel acelera os reflexos de quem o usa, tornando mais difícil acertá-lo com golpes. Um anel amaldiçoado, por outro lado, tornará o usuário mais fácil de ser atingido.
items.rings.ringofevasion.name=anel de evasão
items.rings.ringofevasion.stats=Ao ser usado, este anel aumentará sua evasão em _%s%%._
items.rings.ringofevasion.typical_stats=Quando usado, este anel normalmente aumentará sua evasão em _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Aumento de evasão
items.rings.ringofforce$brawlersstance.desc=Nessa postura, os ataques normais da Duelista usarão o anel de força equipado, mesmo quando ela estiver com uma arma em mãos. Esses ataques recebem dano bônus e ainda usarão o aprimoramento e o encantamento da arma. Manter essa postura exige concentração, reduzindo a velocidade de recarga das habilidades da arma em 50%. Essa postura pode ser ativada ou desativada usando um anel de força, mas a redução na velocidade de recarga persistirá por um curto período se a postura for ativada e desativada rapidamente.
items.rings.ringofforce$brawlersstance.name=postura do brigão
items.rings.ringofforce.ability_desc=A Duelista pode adotar uma postura de brigão com este anel, fazendo com que seus ataques normais sempre usem este anel, mesmo com uma arma equipada. Esses ataques causarão dano de %1$d a %2$d e também herdarão o encantamento e aprimoramento da arma. Esta postura reduz a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.ability_name=postura do brigão
items.rings.ringofforce.combined_stats=Os anéis equipados estão combinando seus poderes, causando um total de _%1$d-%2$d de dano_ sem uma arma, ou aumentando o dano em _%3$d_ com uma.
items.rings.ringofforce.desc=Este anel aumenta a força dos golpes corpo a corpo do usuário. Esse poder extra é relativamente fraco ao empunhar armas, mas um ataque desarmado se tornará muito mais forte. Um anel amaldiçoado, por outro lado, enfraquecerá os golpes do usuário.
items.rings.ringofforce.name=anel de força
items.rings.ringofforce.stats=Quando desarmado, com sua força atual, este anel causará _%1$d-%2$d de dano._ Com uma arma equipada, este anel aumentará o dano em _%3$d._
items.rings.ringofforce.typical_ability_desc=A Duelista pode adotar uma postura de brigão com este anel, fazendo com que seus ataques normais sempre usem este anel, mesmo com uma arma equipada. Esses ataques normalmente causarão dano de %1$d a %2$d e também herdarão o encantamento e aprimoramento da arma. Esta postura reduz a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.typical_stats=Quando desarmado, com sua força atual, este anel normalmente causará de _%1$d a _%2$d de dano._ Com uma arma equipada, este anel normalmente aumentará o dano em _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Dano Desarmado
items.rings.ringofforce.upgrade_stat_name_2=Aumento de dano armado
items.rings.ringofforce.upgrade_stat_name_3=Dano de Habilidade
items.rings.ringoffuror.combined_stats=Os anéis equipados por você estão combinando seus poderes, aumentando a velocidade de seus ataques em um total de _%s%%_.
items.rings.ringoffuror.desc=Este anel concede ao usuário uma fúria interior, permitindo-lhe atacar mais rapidamente. Um anel amaldiçoado, por outro lado, diminuirá a velocidade de ataque do usuário.
items.rings.ringoffuror.name=anel de furor
items.rings.ringoffuror.stats=Ao ser usado, este anel aumentará a velocidade de seus ataques em _%s%%._
items.rings.ringoffuror.typical_stats=Quando usado, este anel normalmente aumentará a velocidade de seus ataques em _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Aumento da velocidade de ataque
items.rings.ringofhaste.combined_stats=Os anéis que você equipou estão combinando seus poderes, aumentando sua velocidade de movimento em _%s%%_ no total.
items.rings.ringofhaste.desc=Este anel reduz o estresse do movimento para quem o usa, permitindo que corra a velocidades sobre-humanas. Um anel amaldiçoado, por outro lado, fará com que o usuário se sinta sobrecarregado.
items.rings.ringofhaste.name=anel da pressa
items.rings.ringofhaste.stats=Ao ser usado, este anel aumentará sua velocidade de movimento em _%s%%._
items.rings.ringofhaste.typical_stats=Quando usado, este anel normalmente aumentará sua velocidade de movimento em _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Aumento de velocidade de movimento
items.rings.ringofmight.combined_stats=Os anéis equipados por você estão combinando seus poderes, aumentando sua força em _%1$d_ e seu HP máximo em _%2$s%%_ no total.
items.rings.ringofmight.desc=Este anel aprimora os atributos físicos de quem o usa, concedendo-lhe maior força física e constituição. Um anel amaldiçoado enfraquecerá quem o usar.
items.rings.ringofmight.name=anel do poder
items.rings.ringofmight.stats=Ao ser usado, este anel aumentará sua força em _%1$d_ e seu HP máximo em _%2$s%%_.
items.rings.ringofmight.typical_stats=Ao ser usado, este anel normalmente aumentará sua força em _%1$d_ e seu HP máximo em _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=aumento de força
items.rings.ringofmight.upgrade_stat_name_2=Aumento máximo de HP
items.rings.ringofsharpshooting.combined_stats=Os anéis equipados por você estão combinando seus poderes, aumentando o nível efetivo de arremesso de armas em _%1$d_ e aumentando sua durabilidade em _%2$s%%_ no total.
items.rings.ringofsharpshooting.desc=Este anel aprimora a precisão e a mira do usuário, tornando todas as armas de projétil mais poderosas e duráveis. Um anel amaldiçoado terá o efeito oposto.
items.rings.ringofsharpshooting.name=anel de atiradores de elite
items.rings.ringofsharpshooting.stats=Ao ser usado, este anel aumentará o dano de suas armas de arremesso como se o nível delas tivesse sido aumentado em _%1$d_, e aumentará sua durabilidade em _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Quando usado, este anel normalmente aumentará o dano de suas armas de arremesso como se o nível delas tivesse sido aumentado em _%1$d_ e aumentará sua durabilidade em _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento de dano de nível
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento da durabilidade
items.rings.ringoftenacity.combined_stats=Os anéis equipados por você estão combinando seus poderes, reduzindo o dano recebido em até _%s%%_ no total.
items.rings.ringoftenacity.desc=Quando usado, este anel permitirá ao portador resistir a golpes normalmente mortais. Quanto mais ferido o usuário estiver, mais resistente ele será a danos. Um anel amaldiçoado, por outro lado, facilitará a execução do portador pelos inimigos.
items.rings.ringoftenacity.name=anel de tenacidade
items.rings.ringoftenacity.stats=Quando usado, este anel reduzirá os danos que você sofre em até _%s%%._
items.rings.ringoftenacity.typical_stats=Quando usado, este anel normalmente reduz o dano sofrido em até _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Resistência máxima a danos
items.rings.ringofwealth.combined_stats=Os anéis que você equipou estão combinando seus poderes, aumentando sua sorte em um total de _%s%%_.
items.rings.ringofwealth.desc=Este anel age como um ímã para tesouros, aumentando a probabilidade de inimigos e contêineres conterem itens valiosos. Um anel amaldiçoado, por outro lado, reduzirá suas chances de obter itens.
items.rings.ringofwealth.name=anel da riqueza
items.rings.ringofwealth.stats=Ao ser usado, este anel aumentará sua sorte em _%s%%._
items.rings.ringofwealth.typical_stats=Quando usado, este anel normalmente aumentará sua sorte em _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Aumento de sorte
