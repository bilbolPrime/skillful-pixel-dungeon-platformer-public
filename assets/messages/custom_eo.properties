custom.theme.sewers.intro=La Kelkarcero situas rekte sub la Urbo, ĝiaj supraj niveloj fakte konsistigas la kloakaron de la Urbo. Estante nominale parto de la Urbo, ĉi tiuj niveloj ne estas tiel danĝeraj. Neniu nomos ĝin sekura loko, sed almenaŭ vi ne bezonos trakti malbonan magion ĉi tie.
custom.theme.prison.intro=Antaŭ multaj jaroj oni konstruis ĉi tie subteran malliberejon por la plej danĝeraj krimuloj. Tiutempe ĝi ŝajnis tre lerta ideo, ĉar efektive estis tre malfacile eskapi el ĉi tiu loko. Sed baldaŭ malhela miasmo komencis trapenetri de sube, frenezigante malliberulojn kaj gardistojn. Fine la malliberejo estis forlasita, kvankam kelkaj kondamnitoj estis lasitaj enŝlositaj ĉi tie.
custom.theme.caves.intro=La kavernoj, kiuj etendiĝas sub la forlasita malliberejo, estas maldense loĝataj. Ili kuŝas tro profundaj por esti ekspluatataj de la Urbo kaj ili estas tro malriĉaj je mineraloj por interesi la gnomojn. En la pasinteco estis komerca antaŭposteno ie ĉi tie sur la vojo inter ĉi tiuj du ŝtatoj, sed ĝi malaperis ekde la malkresko de la Nana Metropolo. Nur ĉieestaj gnoloj kaj subteraj bestoj loĝas ĉi tie nun.
custom.theme.city.intro=La Nana Metropolo iam estis la plej granda el la nanaj urboŝtatoj. En sia glortempo, la mekanizita armeo de nanoj sukcese forpuŝis la invadon de la maljuna dio kaj lia demona armeo. Sed oni diras, ke la revenantaj militistoj kunportis semojn de korupto, kaj ke venko estis la komenco de la fino por la subtera regno.
custom.theme.halls.intro=En la pasinteco, ĉi tiuj niveloj estis la periferio de Metropolo. Post la multekosta venko en la milito kontraŭ la malnovaj dioj, la gnomoj estis tro malfortigitaj por forigi la restantajn demonojn. Iom post iom demonoj plifortigis sian tenon sur ĉi tiu loko kaj nun ĝi nomiĝas Demonaj Haloj. \n\nTre malmultaj aventuristoj iam ajn malsupreniris tiel malproksimen...
custom.theme.sewers.sign.1=Ne supertaksu vian forton, uzu armilojn kaj kirasojn, kiujn vi povas uzi.
custom.theme.sewers.sign.2=Kelkajn danĝerojn en la kloakoj facile oni pretervidas unuarigarde. Se ĉambro ŝajnas malĝusta, malrapidiĝu kaj rigardu atente.
custom.theme.sewers.sign.3=Memoru, ke pliigi vian forton ne estas la sola maniero atingi pli bonan ekipaĵon. Vi ankaŭ povas malaltigi ĝian fortpostulon per Volvlibroj de Plibonigo.
custom.theme.sewers.sign.4=Vi povas elspezi vian oron en butikoj tra la kelkarcero. Nun estas eĉ komercisto sur la unua etaĝo.
custom.theme.sewers.sign.5=Gardu vin de Goo!
custom.theme.prison.sign.1=Pixel-Mart - ĉio, kion vi bezonas por sukcesa aventuro!
custom.theme.prison.sign.2=Identigu viajn pociojn kaj volvlibrojn kiel eble plej baldaŭ. Ne prokrastu ĝin ĝis la momento kiam vi efektive bezonas ilin.
custom.theme.prison.sign.3=Malsati ne doloras, sed malsati ja doloras.
custom.theme.prison.sign.4=Surprizatako havas pli bonan ŝancon trafi. Vi ankoraŭ povas surprizi malamikojn kiam vi kontrolas la spacon ĉirkaŭ pordo.
custom.theme.prison.sign.5=Ne ellasu la Tenguojn!
custom.theme.caves.sign.1=Pixel-Mart. Elspezu monon. Vivu pli longe.
custom.theme.caves.sign.2=Kiam vin atakas pluraj monstroj samtempe, provu retiriĝi malantaŭ pordon.
custom.theme.caves.sign.3=Se vi brulas, ne lasu vin enŝlosiĝi. Vertikala movado gravas pli en la kavernoj.
custom.theme.caves.sign.4=Ne havas sencon posedi pli ol unu Ankh-on samtempe, ĉar vi perdos ilin reviviĝinte.
custom.theme.caves.sign.5=DANĜERO! Pezaj maŝinoj povas kaŭzi vundojn, perdon de membroj aŭ morton!
