custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Łowczynie celują w walce dystansowej i mobilności. Kontrolują walkę za pomocą łuków, broni użytkowej i solidnych narzędzi przetrwania, ale nie czują się komfortowo w przedłużających się bójkach w zwarciu.
