items.artifacts.skeletonkey$keywall.desc=Uma parede mágica temporária foi colocada aqui pela chave mestra.
items.artifacts.skeletonkey.ac_insert=INSERIR
items.artifacts.skeletonkey.crystal_charges=Para abrir uma fechadura de cristal são necessárias 5 cargas.
items.artifacts.skeletonkey.cursed=Você não pode usar uma chave mestra amaldiçoada.
items.artifacts.skeletonkey.desc=Uma chave de aparência imponente, com a cabeça em formato de caveira. Seus dentes parecem diferentes a cada olhar.
items.artifacts.skeletonkey.desc_cursed=A chave amaldiçoada parece estar ativamente evitando encaixar em qualquer fechadura, e está até mesmo dificultando (mas não impossibilitando) o uso de suas outras chaves.
items.artifacts.skeletonkey.desc_worn=Essa chave mágica parece ganhar poder conforme você a usa em vez das chaves comuns da masmorra. Ela pode ser inserida em quase todas as fechaduras da masmorra para abri-las ou fechá-las, incluindo portas que nunca foram trancadas antes. A chave pode até ser usada em um espaço vazio em uma direção cardeal ou diagonal para "travar" o ar à sua frente, criando uma parede sólida de 3 quadrados de largura que dura 10 turnos. Travar o ar repelirá os inimigos se houver espaço para isso.
items.artifacts.skeletonkey.discard=Descarte as chaves que não estiverem em uso.
items.artifacts.skeletonkey.force_lock=A fechadura ficou mais frágil sem a sua chave mestra. Você consegue forçá-la e abri-la.
items.artifacts.skeletonkey.gold_charges=Abrir um cadeado de ouro requer 2 cargas.
items.artifacts.skeletonkey.invalid_target=Não há nada para trancar ou destrancar ali.
items.artifacts.skeletonkey.iron_charges=Abrir uma fechadura comum requer 1 carga.
items.artifacts.skeletonkey.levelup=Sua chave mestra está ficando mais forte!
