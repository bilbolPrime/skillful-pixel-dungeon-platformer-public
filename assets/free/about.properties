en.title=A real-time platformer based on Skillful Pixel Dungeon, by BilbolDev
en.body=Thanks for playing the free version of Pixel Dungeon Platformer! You can play the full adventure for free. Buying on Steam supports the developer and includes online co-op, Remote Play Together, Steam achievements, Steam Cloud saves and a supporter badge. The Rat King can also tag along. He won't help in combat, but he makes good company.
be.title=Платформер у рэальным часе паводле Skillful Pixel Dungeon, ад BilbolDev
be.body=Дзякуй, што гуляеце ў бясплатную версію Pixel Dungeon Platformer! Уся прыгода даступная бясплатна. Купля ў Steam падтрымлівае распрацоўшчыка і дае магчымасць гуляць разам праз інтэрнэт, карыстацца Remote Play Together, дасягненнямі Steam і захаваннямі ў Steam Cloud. Вы таксама атрымаеце значок прыхільніка. Пацучы кароль можа стаць вашым спадарожнікам. У баі ён не дапаможа, затое з ім весялей.
cs.title=Plošinovka v reálném čase podle Skillful Pixel Dungeon od BilbolDev
cs.body=Díky, že hrajete bezplatnou verzi Pixel Dungeon Platformer! Celé dobrodružství si můžete zahrát zdarma. Koupí na Steamu podpoříte vývojáře a získáte online kooperaci, Remote Play Together, achievementy, ukládání do Steam Cloudu a odznak podporovatele. Na cestu se s vámi může vydat i král krys. V boji vám nepomůže, ale společnost vám dělat bude.
de.title=Ein Echtzeit-Jump-and-Run von BilbolDev, basierend auf Skillful Pixel Dungeon
de.body=Danke, dass du die kostenlose Version von Pixel Dungeon Platformer spielst! Das gesamte Abenteuer ist kostenlos spielbar. Mit einem Kauf auf Steam unterstützt du den Entwickler und erhältst Online-Koop, Remote Play Together, Steam-Erfolge, Steam-Cloud-Spielstände und ein Unterstützerabzeichen. Auch der Rattenkönig kann dich begleiten. Im Kampf hilft er dir nicht, aber er leistet dir Gesellschaft.
el.title=Ένα παιχνίδι πλατφόρμας σε πραγματικό χρόνο, βασισμένο στο Skillful Pixel Dungeon, από τον BilbolDev
el.body=Ευχαριστούμε που παίζετε τη δωρεάν έκδοση του Pixel Dungeon Platformer! Μπορείτε να παίξετε ολόκληρη την περιπέτεια δωρεάν. Με την αγορά στο Steam στηρίζετε τον δημιουργό και αποκτάτε συνεργατικό παιχνίδι μέσω διαδικτύου, Remote Play Together, επιτεύγματα Steam, αποθήκευση στο Steam Cloud και σήμα υποστηρικτή. Μπορεί να σας ακολουθήσει και ο βασιλιάς των αρουραίων. Δεν βοηθά στη μάχη, αλλά κάνει καλή παρέα.
eo.title=Realtempa platformludo bazita sur Skillful Pixel Dungeon, de BilbolDev
eo.body=Dankon, ke vi ludas la senpagan version de Pixel Dungeon Platformer! Vi povas ludi la tutan aventuron senpage. Aĉetante ĉe Steam, vi subtenas la programiston kaj ricevas interretan kunludadon, Remote Play Together, Steam-atingojn, konservadon en Steam Cloud kaj subtenantan insignon. La rata reĝo ankaŭ povas akompani vin. Li ne helpos en batalo, sed li estas bona kunulo.
es.title=Un juego de plataformas en tiempo real basado en Skillful Pixel Dungeon, de BilbolDev
es.body=¡Gracias por jugar a la versión gratuita de Pixel Dungeon Platformer! Puedes disfrutar de toda la aventura gratis. Al comprarlo en Steam apoyas al desarrollador y obtienes juego cooperativo en línea, Remote Play Together, logros de Steam, guardado en Steam Cloud y una insignia de apoyo. El rey rata también puede acompañarte. No te ayudará en combate, pero te hará compañía.
fr.title=Un jeu de plateforme en temps réel inspiré de Skillful Pixel Dungeon, par BilbolDev
fr.body=Merci de jouer à la version gratuite de Pixel Dungeon Platformer ! Toute l'aventure est accessible gratuitement. En achetant le jeu sur Steam, vous soutenez le développeur et profitez du jeu en coopération en ligne, de Remote Play Together, des succès Steam, des sauvegardes Steam Cloud et d'un badge de soutien. Le roi des rats peut aussi vous accompagner. Il ne vous aidera pas au combat, mais vous tiendra compagnie.
hu.title=Valós idejű platformjáték a Skillful Pixel Dungeon alapján, BilbolDev alkotása
hu.body=Köszönjük, hogy a Pixel Dungeon Platformer ingyenes változatával játszol! A teljes kaland ingyen végigjátszható. A steames vásárlással támogatod a fejlesztőt, és online közös játékot, Remote Play Togethert, Steam-teljesítményeket, Steam Cloud-mentéseket és támogatói jelvényt kapsz. A patkánykirály is elkísérhet. A harcban nem segít, de legalább lesz társaságod.
in.title=Game platformer waktu nyata dari BilbolDev, berdasarkan Skillful Pixel Dungeon
in.body=Terima kasih sudah memainkan versi gratis Pixel Dungeon Platformer! Seluruh petualangan bisa dimainkan gratis. Membeli di Steam mendukung pengembang dan memberimu fitur bermain bersama secara online, Remote Play Together, pencapaian Steam, penyimpanan Steam Cloud, serta lencana pendukung. Raja tikus juga bisa ikut menemanimu. Dia tidak membantu saat bertarung, tapi bisa membuat perjalananmu lebih seru.
it.title=Un platform in tempo reale basato su Skillful Pixel Dungeon, di BilbolDev
it.body=Grazie per aver scelto la versione gratuita di Pixel Dungeon Platformer! Puoi giocare l'intera avventura gratis. Acquistando il gioco su Steam sostieni lo sviluppatore e ottieni la modalità cooperativa online, Remote Play Together, obiettivi Steam, salvataggi su Steam Cloud e un distintivo di sostenitore. Anche il re dei topi può accompagnarti. Non ti aiuterà in combattimento, ma ti farà compagnia.
ja.title=BilbolDev制作、Skillful Pixel Dungeonをもとにしたリアルタイムアクションゲーム
ja.body=Pixel Dungeon Platformerの無料版を遊んでいただき、ありがとうございます！冒険は最後まで無料で楽しめます。Steam版を購入すると開発者を支援でき、オンライン協力プレイ、Remote Play Together、Steam実績、Steamクラウドセーブ、サポーターバッジも利用できます。ネズミの王様を旅のお供にすることもできます。戦いでは役に立ちませんが、楽しい道連れになってくれるでしょう。
ko.title=BilbolDev가 Skillful Pixel Dungeon을 바탕으로 만든 실시간 플랫폼 게임
ko.body=Pixel Dungeon Platformer 무료 버전을 플레이해 주셔서 감사합니다! 모험은 끝까지 무료로 즐길 수 있습니다. Steam에서 구매하면 개발자를 후원하고 온라인 협동 플레이, Remote Play Together, Steam 도전 과제, Steam 클라우드 저장, 후원자 배지를 이용할 수 있습니다. 쥐왕과 함께 모험을 떠날 수도 있습니다. 전투를 돕지는 않지만 심심하지 않게 해 줄 거예요.
nl.title=Een realtime platformspel van BilbolDev, gebaseerd op Skillful Pixel Dungeon
nl.body=Bedankt dat je de gratis versie van Pixel Dungeon Platformer speelt! Je kunt het hele avontuur gratis spelen. Met een aankoop op Steam steun je de ontwikkelaar en krijg je online coöp, Remote Play Together, Steam-prestaties, opslag in Steam Cloud en een supportersbadge. De rattenkoning kan ook met je mee. Hij helpt niet in gevechten, maar houdt je wel gezelschap.
pl.title=Platformówka w czasie rzeczywistym oparta na Skillful Pixel Dungeon, autorstwa BilbolDev
pl.body=Dzięki, że grasz w darmową wersję Pixel Dungeon Platformer! Całą przygodę możesz przejść za darmo. Kupując grę na Steam, wspierasz twórcę i zyskujesz tryb współpracy online, Remote Play Together, osiągnięcia Steam, zapisy w Steam Cloud oraz odznakę wsparcia. Może ci też towarzyszyć król szczurów. Nie pomoże w walce, ale dotrzyma ci towarzystwa.
pt.title=Um jogo de plataforma em tempo real baseado em Skillful Pixel Dungeon, por BilbolDev
pt.body=Obrigado por jogar a versão gratuita de Pixel Dungeon Platformer! Você pode jogar a aventura inteira de graça. Ao comprar no Steam, você apoia o desenvolvedor e ganha acesso ao modo cooperativo online, Remote Play Together, conquistas Steam, salvamentos no Steam Cloud e um distintivo de apoiador. O rei dos ratos também pode acompanhar você. Ele não ajuda no combate, mas faz boa companhia.
pt-pt.title=Um jogo de plataformas em tempo real baseado em Skillful Pixel Dungeon, por BilbolDev
pt-pt.body=Obrigado por jogares a versão gratuita de Pixel Dungeon Platformer! Podes jogar a aventura inteira de graça. Ao comprares no Steam, apoias o programador e tens acesso ao modo cooperativo online, Remote Play Together, conquistas Steam, gravações na Steam Cloud e um distintivo de apoiante. O rei dos ratos também te pode acompanhar. Não ajuda no combate, mas faz boa companhia.
ru.title=Платформер в реальном времени по мотивам Skillful Pixel Dungeon, от BilbolDev
ru.body=Спасибо, что играете в бесплатную версию Pixel Dungeon Platformer! Всё приключение можно пройти бесплатно. Покупка в Steam поддержит разработчика и даст доступ к совместной игре через интернет, Remote Play Together, достижениям Steam, сохранениям в Steam Cloud и значку сторонника. Крысиный король тоже может составить вам компанию. В бою он не поможет, зато с ним веселее.
sv.title=Ett plattformsspel i realtid baserat på Skillful Pixel Dungeon, av BilbolDev
sv.body=Tack för att du spelar gratisversionen av Pixel Dungeon Platformer! Du kan spela hela äventyret gratis. Ett köp på Steam stöder utvecklaren och ger dig samarbetsläge online, Remote Play Together, Steam-prestationer, sparfiler i Steam Cloud och ett supportermärke. Råttkungen kan också följa med. Han hjälper inte till i strid, men håller dig sällskap.
tr.title=BilbolDev'den, Skillful Pixel Dungeon'ı temel alan gerçek zamanlı bir platform oyunu
tr.body=Pixel Dungeon Platformer'ın ücretsiz sürümünü oynadığınız için teşekkürler! Maceranın tamamını ücretsiz oynayabilirsiniz. Steam'den satın alarak geliştiriciyi destekleyebilir; çevrimiçi birlikte oynama, Remote Play Together, Steam başarımları, Steam Cloud kayıtları ve destekçi rozeti gibi özelliklere erişebilirsiniz. Fare kralı da yolculuğunuza katılabilir. Savaşta yardım etmez ama size arkadaşlık eder.
uk.title=Платформер у реальному часі за мотивами Skillful Pixel Dungeon, від BilbolDev
uk.body=Дякуємо, що граєте в безкоштовну версію Pixel Dungeon Platformer! Усю пригоду можна пройти безкоштовно. Купівля у Steam підтримає розробника й відкриє спільну гру через інтернет, Remote Play Together, досягнення Steam, збереження у Steam Cloud та значок прихильника. Король щурів теж може скласти вам компанію. У бою він не допоможе, зате з ним веселіше.
vi.title=Game đi cảnh thời gian thực của BilbolDev, dựa trên Skillful Pixel Dungeon
vi.body=Cảm ơn bạn đã chơi bản miễn phí của Pixel Dungeon Platformer! Bạn có thể chơi miễn phí toàn bộ cuộc phiêu lưu. Mua game trên Steam giúp ủng hộ nhà phát triển và cho phép bạn chơi phối hợp trực tuyến, dùng Remote Play Together, mở thành tích Steam, lưu game trên Steam Cloud và nhận huy hiệu ủng hộ. Vua chuột cũng có thể đồng hành cùng bạn. Ông ấy không giúp chiến đấu, nhưng sẽ khiến chuyến đi vui hơn.
zh.title=BilbolDev 根据 Skillful Pixel Dungeon 改编的即时横版平台游戏
zh.body=感谢你游玩 Pixel Dungeon Platformer 免费版！整个冒险都可以免费体验。在 Steam 购买游戏可以支持开发者，还能享受在线合作、Remote Play Together、Steam 成就、Steam 云存档和支持者徽章。你也可以带鼠王一起冒险。他不会帮你战斗，但能给旅途添些乐趣。
zh-hant.title=BilbolDev 根據 Skillful Pixel Dungeon 改編的即時橫向平台遊戲
zh-hant.body=感謝你遊玩 Pixel Dungeon Platformer 免費版！整段冒險都能免費體驗。在 Steam 購買遊戲可以支持開發者，還能享受線上合作、Remote Play Together、Steam 成就、Steam 雲端存檔和支持者徽章。你也可以帶鼠王一起冒險。他不會幫你戰鬥，但能為旅途增添樂趣。
