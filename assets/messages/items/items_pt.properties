items.artifacts.artifact.need_to_equip=Você precisa equipar seu artefato para fazer isso.
items.artifacts.artifact.not_cursed=Este artefato está livre de magia malévola.
items.artifacts.capeofthorns$thorns.desc=Sua capa está irradiando energia, envolvendo você em um campo de força defletora!\n\nTodo o dano recebido é reduzido enquanto o efeito de espinhos estiver ativo. Além disso, se o atacante estiver próximo a você, a quantidade reduzida é refletida de volta para o atacante.\n\nTurnos restantes de espinhos: %s.
items.artifacts.capeofthorns$thorns.inert=Sua capa volta a ficar inerte.
items.artifacts.capeofthorns$thorns.levelup=Sua capa está ficando mais forte!
items.artifacts.capeofthorns$thorns.name=espinhos
items.artifacts.capeofthorns$thorns.radiating=Sua capa começa a irradiar energia, você se sente protegido!
items.artifacts.capeofthorns.desc=Essas chapas de metal colapsadas do DM-300 se uniram formando uma capa rígida. Ela parece armazenar uma energia profunda; talvez contenha parte do poder do DM-300?
items.artifacts.capeofthorns.desc_active=A capa parece estar liberando energia armazenada, irradiando uma energia protetora.
items.artifacts.capeofthorns.desc_inactive=A capa parece ter um peso reconfortante sobre seus ombros, como se estivesse ganhando energia com os danos que você sofre.
items.artifacts.capeofthorns.name=cabo de espinhos
items.artifacts.chaliceofblood.ac_prick=ESPINHO
items.artifacts.chaliceofblood.desc=Este cálice de prata brilhante é curiosamente adornado com gemas afiadas na borda.
items.artifacts.chaliceofblood.desc_1=Ao segurar o cálice, você sente uma estranha compulsão de se picar nas pedras afiadas.
items.artifacts.chaliceofblood.desc_2=Parte do seu sangue se acumula no cálice, e você sente sutilmente o cálice lhe fornecendo energia vital, aumentando sua regeneração natural da saúde. Mesmo sabendo que vai doer, você ainda sente vontade de se cortar no cálice.
items.artifacts.chaliceofblood.desc_3=O cálice está repleto da sua essência vital. Você pode sentir o cálice derramando energia vital de volta para você.
items.artifacts.chaliceofblood.desc_cursed=O cálice amaldiçoado se prendeu à sua mão e está impedindo sua capacidade de regenerar a saúde.
items.artifacts.chaliceofblood.name=cálice de sangue
items.artifacts.chaliceofblood.no=Não, mudei de ideia.
items.artifacts.chaliceofblood.ondeath=O Cálice suga toda a sua essência vital...
items.artifacts.chaliceofblood.onprick=Você se espeta e sua essência vital escorre para o cálice.
items.artifacts.chaliceofblood.prick_warn=Cada vez que você usa o cálice, ele drena mais da sua energia vital, mas em troca, aumenta ainda mais sua regeneração natural de saúde. Atualmente, espetar-se causa dano de _%1$d a %2$d_, embora esse dano possa ser reduzido por _bloqueio físico e mágico ou redução de dano_. Sem considerar os efeitos de redução de dano, espetar-se tem atualmente uma chance de _%3$s%%_ de drenar completamente sua força vital. Tem certeza de que deseja oferecer mais energia vital ao cálice?
items.artifacts.chaliceofblood.yes=Sim, eu sei o que estou fazendo.
items.artifacts.cloakofshadows$cloakstealth.desc=Seu manto das sombras lhe concede invisibilidade enquanto estiver envolto por ele. Você permanecerá invisível até que o efeito seja cancelado ou que a carga do manto se esgote. Enquanto estiver invisível, os inimigos não poderão atacá-lo ou segui-lo. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelarão imediatamente a invisibilidade. Turnos até o uso da carga: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Sua capa está ficando mais forte!
items.artifacts.cloakofshadows$cloakstealth.name=camuflado
items.artifacts.cloakofshadows$cloakstealth.no_charge=Sua capa ficou sem energia.
items.artifacts.cloakofshadows.ac_stealth=FURTIVIDADE
items.artifacts.cloakofshadows.cooldown=Sua capa precisa de mais rodadas (%d) para recarregar.
items.artifacts.cloakofshadows.cursed=Você não pode usar uma capa amaldiçoada.
items.artifacts.cloakofshadows.desc=Uma capa mágica de valor inestimável, roubada do arsenal real há muitos anos pelo Ladino. Quando usada, ela permite que o ladino fique completamente invisível por um curto período. Quanto mais a capa for usada, mais forte ela se tornará, permitindo que o Ladino fique invisível com mais frequência e por períodos mais longos.
items.artifacts.cloakofshadows.discover_hint=Um dos heróis começa com este item.
items.artifacts.cloakofshadows.name=manto das sombras
items.artifacts.cloakofshadows.no_charge=Sua capa ainda não recarregou o suficiente para ser utilizável.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Como você sobreviveu a isso?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Quem me dera ter um desses...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Nossa! Você ainda está vivo!
items.artifacts.driedrose$ghosthero.def_verb=esquivou-se
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Sinto muito... boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finalize isso... sem mim...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Não... eu não posso...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Cansado... por enquanto...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Eu voltarei...
items.artifacts.driedrose$ghosthero.desc=Uma figura etérea de aparência frágil com forma humanoide. Seu poder parece estar ligado à rosa que você possui. \n\nEste fantasma pode não ser grande coisa, ele parece ser seu único amigo verdadeiro aqui embaixo.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Por que isso está acontecendo? Eu pensei que tínhamos conseguido!
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Como é que essa coisa ainda consegue influenciar este mundo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que você saiba o que está fazendo com esse amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Imagino que ainda não terminamos.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Já chegamos tão longe, podemos terminar isso!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Só mais um pouquinho e conseguiremos sair daqui!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Não há humanos ou anões aqui há muito tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=O que levaria os anões a abandonar uma mina de ouro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=É uma pena que todo o ouro aqui seja inútil à primeira vista.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=As criaturas daqui são deformadas, assim como as dos esgotos.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Até os morcegos são sedentos de sangue por aqui.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Não há sinal de nenhum equipamento de mineração; será que os anões recuperaram tudo?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Os anões eram trabalhadores, mas gananciosos.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Então a metrópole dos anões realmente caiu.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que a superfície nunca acabe como este lugar.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Os anões não deveriam ter uma aparência tão pálida.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Não sei o que é pior, os anões ou suas criações.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Parece que agora os anões também são monstros sem cérebro.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Que lugar é este?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar é aterrorizante...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=O que os anões estavam pensando, brincando com o poder dessa maneira?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Os monstros daqui são de outro mundo, de onde vieram?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Você consegue sentir? É como se algo estivesse nos observando.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Ainda bem que há tochas, está tão escuro aqui!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Já ouvi histórias sobre esse lugar, nada de bom.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Este lugar sempre foi mais uma masmorra do que uma prisão.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Não consigo imaginar o que aconteceu quando este lugar foi abandonado.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Parece que tanto os prisioneiros quanto os guardas se transformaram em monstros.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=O que poderia ser responsável por todos esses esqueletos?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Essas pessoas não precisavam ter terminado assim...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Esses esgotos costumavam ser seguros, as pessoas até moravam aqui no inverno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Gostaria de saber o que aconteceu com as patrulhas da guarda, será que desistiram?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Eu tinha família na superfície, espero que estejam seguros.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Os guardas não conseguiram derrotar esses monstros, mas talvez nós consigamos.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se até os esgotos são tão perigosos, fico imaginando o que será que há lá embaixo...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=O que poderia ter feito com que esses ratos e caranguejos crescessem tanto?
items.artifacts.driedrose$ghosthero.direct_prompt=O que devo fazer?
items.artifacts.driedrose$ghosthero.directed_attack_1=Certo, vou abordar essa questão.
items.artifacts.driedrose$ghosthero.directed_attack_2=Eu vou atender esse.
items.artifacts.driedrose$ghosthero.directed_attack_3=Envolvente...
items.artifacts.driedrose$ghosthero.directed_attack_4=Vamos pegá-los!
items.artifacts.driedrose$ghosthero.directed_attack_5=Essa eu já tenho.
items.artifacts.driedrose$ghosthero.directed_follow_1=Certo, eu te sigo.
items.artifacts.driedrose$ghosthero.directed_follow_2=Vou atrás de você.
items.artifacts.driedrose$ghosthero.directed_follow_3=Seguindo você...
items.artifacts.driedrose$ghosthero.directed_follow_4=Ok, vamos lá!
items.artifacts.driedrose$ghosthero.directed_follow_5=Pode contar comigo.
items.artifacts.driedrose$ghosthero.directed_position_1=Certo, vou manter essa posição.
items.artifacts.driedrose$ghosthero.directed_position_2=Eu irei lá e defenderei.
items.artifacts.driedrose$ghosthero.directed_position_3=Reposicionamento...
items.artifacts.driedrose$ghosthero.directed_position_4=Estou a caminho!
items.artifacts.driedrose$ghosthero.directed_position_5=Vou até lá.
items.artifacts.driedrose$ghosthero.discover_hint=Você pode encontrar esse personagem com um artefato específico.
items.artifacts.driedrose$ghosthero.hello=Olá novamente %s.
items.artifacts.driedrose$ghosthero.introduce=Meu espírito está ligado a esta rosa, ela era muito preciosa para mim, um presente do meu amor que deixei na superfície. Não posso retornar a ele, mas graças a você tenho uma segunda chance de completar minha jornada. Quando eu puder, responderei ao seu chamado e lutarei ao seu lado. Enquanto você tiver a rosa, poderei ouvir sua voz, então você poderá usá-la para me guiar de longe. Espero que você consiga onde eu falhei...
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.player_killed_1=Não!...
items.artifacts.driedrose$ghosthero.player_killed_2=Eu não pude ajudá-los...
items.artifacts.driedrose$ghosthero.player_killed_3=Não assim...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Só anões construiriam uma máquina de mineração que mata intrusos.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Aquilo é enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Como é que essa coisa se manteve ativa por tanto tempo?
items.artifacts.driedrose$ghosthero.seen_goo_1=Cuidado com a gosma!
items.artifacts.driedrose$ghosthero.seen_goo_2=Muitos dos meus amigos morreram por causa disso, chegou a hora da vingança!
items.artifacts.driedrose$ghosthero.seen_goo_3=Tal aberração não pode ter permissão para viver!
items.artifacts.driedrose$ghosthero.seen_king_1=Quando as pessoas dizem que o poder corrompe, é a isso que elas se referem.
items.artifacts.driedrose$ghosthero.seen_king_2=Ele é mais um lich do que um rei agora.
items.artifacts.driedrose$ghosthero.seen_king_3=Até mesmo na morte, os anões obedecem ao seu mestre.
items.artifacts.driedrose$ghosthero.seen_tengu_1=O único prisioneiro que restou é um assassino mortal. Claro...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ele nos prendeu!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Já ouvi histórias terríveis sobre essa máscara...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, isso não parece nada bom.
items.artifacts.driedrose$ghosthero.seen_yog_2=Então é assim que um deus se parece?
items.artifacts.driedrose$ghosthero.seen_yog_3=Isso vai doer...
items.artifacts.driedrose$petal.desc=Uma pétala frágil e ressecada, que de alguma forma sobreviveu até aqui, no interior da masmorra.
items.artifacts.driedrose$petal.levelup=Você adiciona a pétala à rosa.
items.artifacts.driedrose$petal.maxlevel=A rosa está pronta!
items.artifacts.driedrose$petal.name=pétala seca
