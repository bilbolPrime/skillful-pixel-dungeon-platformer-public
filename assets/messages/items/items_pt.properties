items.weapon.missiles.darts.adrenalinedart.desc=Essas flechas são revestidas com um composto à base de cardo-veloz que aumenta a velocidade de movimento e ataque dos aliados, ou reduz brevemente a velocidade de movimento dos inimigos. A flecha em si ainda causa dano aos inimigos, mas não aos aliados.
items.weapon.missiles.darts.adrenalinedart.name=dardo de adrenalina
items.weapon.missiles.darts.blindingdart.desc=Esses dardos são revestidos com um composto à base de erva-cega que cegará o alvo por um curto período. No entanto, eles não desorientam, portanto o inimigo ainda saberá onde o viu pela última vez.
items.weapon.missiles.darts.blindingdart.name=dardo cegante
