actors.blobs.blizzard.desc=Uma nevasca está se formando aqui.
actors.blobs.blizzard.name=nevasca
actors.blobs.confusiongas.desc=Uma nuvem de gás causador de confusão está circulando por aqui.
actors.blobs.confusiongas.name=gás de confusão
actors.blobs.corrosivegas.desc=Uma nuvem de gás cáustico mortal está circulando por aqui.
actors.blobs.corrosivegas.name=gás corrosivo
actors.blobs.electricity.desc=Um campo de eletricidade está faiscando intensamente aqui.
actors.blobs.electricity.name=eletricidade
actors.blobs.electricity.ondeath=Você ficou em choque mortal...
actors.blobs.electricity.rankings_desc=Eletrocutado
actors.blobs.fire.desc=Um incêndio está devastando este local.
actors.blobs.fire.name=fogo
actors.blobs.foliage.desc=Raios de luz atravessam a escuridão do jardim subterrâneo.
actors.blobs.foliage.name=folhagem
actors.blobs.freezing.desc=O ar aqui está anormalmente frio.
actors.blobs.freezing.name=ar congelante
actors.blobs.goowarn.desc=Partículas de energia escura estão se espalhando por aqui!
actors.blobs.goowarn.name=energia escura
actors.blobs.inferno.desc=Um incêndio está devastando este local.
actors.blobs.inferno.name=inferno
actors.blobs.paralyticgas.desc=Uma nuvem de gás paralisante está circulando por aqui.
actors.blobs.paralyticgas.name=gás paralisante
actors.blobs.regrowth.name=regeneração
actors.blobs.sacrificialfire.desc=Aqui existe um altar com uma fogueira sacrificial acesa sobre ele. Qualquer criatura morta aqui será consumida como oferenda aos espíritos da masmorra. Talvez uma recompensa seja dada se forem feitos sacrifícios suficientes?
actors.blobs.sacrificialfire.name=fogo sacrificial
actors.blobs.sacrificialfire.reward=O fogo arde e depois se dissipa, deixando uma recompensa para trás!
actors.blobs.sacrificialfire.unworthy=O fogo consome sua oferenda, mas não a altera.
actors.blobs.sacrificialfire.worthy=O fogo consome sua oferenda e se intensifica.
actors.blobs.smokescreen.desc=Uma densa nuvem de fumaça preta está rodopiando por aqui.
actors.blobs.smokescreen.name=cortina de fumaça
actors.blobs.stenchgas.desc=Uma nuvem de odor fétido paira no ar.
actors.blobs.stenchgas.name=gás fétido
actors.blobs.stormcloud.desc=Uma nuvem de vapor de água ondulante está girando aqui.
actors.blobs.stormcloud.name=nuvens de tempestade
actors.blobs.toxicgas.desc=Uma nuvem esverdeada de gás tóxico está circulando por aqui.
actors.blobs.toxicgas.name=gás tóxico
actors.blobs.toxicgas.ondeath=Você morreu por causa do gás tóxico...
actors.blobs.toxicgas.rankings_desc=Sufocado
actors.blobs.waterofawareness.desc=O poder do conhecimento emana da água deste poço. Beber dessa água revelará todos os itens equipados, identificará as maldições em todos os itens do seu inventário e revelará todos os itens do andar atual.
actors.blobs.waterofawareness.name=água da consciência
actors.blobs.waterofawareness.procced=Ao dar um gole, você sente o conhecimento inundar sua mente.
actors.blobs.waterofhealth.desc=A força da saúde emana da água deste poço. Beber desta água curará suas feridas, saciará sua fome e removerá maldições de quaisquer objetos desgastados.
actors.blobs.waterofhealth.name=água da saúde
actors.blobs.waterofhealth.procced=Ao dar um gole, você sente suas feridas cicatrizarem completamente.
actors.blobs.web.desc=Uma teia densa cobre tudo aqui. Qualquer coisa que toque ou seja atirada através da teia a romperá, mas também ficará presa no lugar.
actors.blobs.web.name=teia de aranha
actors.buffs.adrenaline.desc=Uma onda de poder físico, a adrenalina aumenta a velocidade de ataque e movimento. A adrenalina permite que seu alvo corra com o dobro da velocidade e ataque com 1,5 vezes a velocidade. Turnos restantes:
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenalinesurge.desc=Uma onda de grande poder, mas infelizmente não permanente.\n\nAumento de força: +%d.\nTurnos até o aumento enfraquecer: %s.
actors.buffs.adrenalinesurge.name=aumento de força
actors.buffs.amok.desc=Amok causa um estado de grande fúria e confusão em seu alvo.\n\nQuando uma criatura está em amok, ela atacará tudo o que estiver perto dela, seja amigo ou inimigo.\n\nTurnos de amok restantes: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Um escudo fino está ao seu redor, bloqueando parte do dano de ataques mágicos. Sua armadura mágica está atualmente reforçada em: 0-%d. Turnos até que a armadura arcana enfraqueça: %s.
actors.buffs.arcanearmor.name=armadura arcana
actors.buffs.artifactrecharge.desc=A energia está fluindo através de você, aumentando a taxa de carregamento dos seus artefatos equipados. Cada artefato é afetado de uma maneira um pouco diferente, mas todos eles ganharão carga muito mais rápido do que o normal. Turnos restantes:
actors.buffs.artifactrecharge.name=recarga de artefatos
actors.buffs.ascensionchallenge.almost=Você sente que o aperto de Yog no amuleto começa a enfraquecer, você está quase lá!
actors.buffs.ascensionchallenge.beckon=O amuleto começa a invocar inimigos distantes.
actors.buffs.ascensionchallenge.break=Você respira fundo por um instante e sente suas feridas começarem a cicatrizar!
actors.buffs.ascensionchallenge.damage=O amuleto começa a irradiar energia escura. Ele queima!
actors.buffs.ascensionchallenge.desc=De alguma forma, Yog-Dzewa mantém influência neste mundo através do amuleto e está tentando impedir sua ascensão! O poder de Yog está tornando a masmorra muito mais perigosa, aumentando o número de inimigos e tornando-os mais fortes! Esse poder continuará aumentando se não for controlado e pode ser enfraquecido ao derrotar inimigos que foram fortalecidos pelo poder de Yog.
actors.buffs.ascensionchallenge.desc_beckon=O amuleto está atualmente _chamando inimigos distantes_, alertando-os sobre sua posição.
actors.buffs.ascensionchallenge.desc_clear=A energia escura que emanava do amuleto foi enfraquecida ao máximo possível por enquanto.
actors.buffs.ascensionchallenge.desc_damage=A energia do amuleto ficou tão forte que está te prejudicando diretamente!
actors.buffs.ascensionchallenge.desc_haste=O amuleto está atualmente _acelerando inimigos distantes_, permitindo que eles cheguem até você mais rapidamente!
actors.buffs.ascensionchallenge.desc_slow=O amuleto está atualmente _te deixando mais lento_ e anulando os efeitos de aumento de velocidade!
actors.buffs.ascensionchallenge.haste=O amuleto começa a atrair inimigos distantes!
actors.buffs.ascensionchallenge.name=maldição do amuleto
actors.buffs.ascensionchallenge.on_kill=A energia escura te consome...
actors.buffs.ascensionchallenge.slow=O amuleto começa a parecer um peso morto no seu inventário!
actors.buffs.ascensionchallenge.weaken=É possível sentir a maldição do amuleto enfraquecer ligeiramente.
actors.buffs.ascensionchallenge.weaken_info=A maldição do amuleto pode ser enfraquecida ao derrotar mais inimigos.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Ao derrotar os inimigos, a maldição do amuleto enfraquecerá!
actors.buffs.barkskin.desc=Sua pele está endurecida, áspera e sólida como casca de árvore. A pele endurecida aumenta sua armadura efetiva, permitindo que você se defenda melhor contra ataques físicos. Sua armadura está atualmente aumentada em: 0-ZXQPH0. ZXQPH6. Turnos até que a pele de casca enfraqueça: ZXQPH1. ZXQPH7. ZXQPH8. Se você receber pele de casca de múltiplas fontes, apenas a mais forte será aplicada.
actors.buffs.barkskin.name=casca
actors.buffs.barrier.desc=Uma bolha de força durável que bloqueia todos os danos. A barreira absorverá dano por tudo o que estiver protegendo enquanto houver escudo restante. O escudo também se deteriorará lentamente com o tempo. Escudo restante: %d.
actors.buffs.barrier.name=barreira
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=irritado
actors.buffs.berserk.angered_desc=A gravidade dos ferimentos do Berserker fortalece seus golpes. Conforme o Berserker sofre dano físico, sua fúria aumenta, concedendo-lhe dano bônus. O dano bloqueado pela armadura ainda conta para o acúmulo de fúria. A fúria diminui com o tempo. Quanto menor a saúde do Berserker, mais tempo ela durará. Com 100 de fúria, o Berserker pode entrar em frenesi, recebendo proteção com base no nível de sua armadura e na sua saúde restante. Enquanto estiver em fúria, seu escudo se dissipa com o tempo e, quando acabar, ele precisará descansar antes de acumular fúria novamente. \n\n Fúria atual: _%1$.0f%%_\n_+%2$.0f%%_ dano\n\n Escudo de fúria com armadura e HP atuais: _%3$d_
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.berserk_desc=O medo e a incerteza se dissipam, restando apenas a raiva. Nesse estado, o Berserker é extremamente poderoso, causando +50 de dano e ganhando escudo bônus, mas também perdendo escudo a cada turno. Quando todo o seu escudo for reduzido a 0, o estado de berserk terminará. Após entrar em fúria, o Berserker precisará se recuperar antes de poder acumular fúria novamente. Escudo Restante:
actors.buffs.berserk.exhausted=esgotado
actors.buffs.berserk.no_seal=Você precisa que seu selo rompido entre em fúria!
actors.buffs.berserk.rankings_desc=Enlouquecido até a morte
actors.buffs.berserk.recovering=recuperando
actors.buffs.berserk.recovering_desc=A força interior tem seus limites. O Berserker precisa descansar antes de usar sua fúria novamente. Enquanto se recupera, o Berserker não acumula fúria ao sofrer dano.
actors.buffs.berserk.recovering_desc_levels=Níveis até a recuperação: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Giros até ser recuperado: _%d_
actors.buffs.bleeding.desc=Esse ferimento está sangrando uma quantidade preocupante de sangue. O sangramento causa dano a cada turno. A cada turno, o dano diminui em uma quantidade aleatória, até que o sangramento eventualmente pare. Dano atual do sangramento: %d.
actors.buffs.bleeding.heromsg=Você está sangrando!
actors.buffs.bleeding.name=sangramento
actors.buffs.bleeding.ondeath=Você morreu sangrando...
actors.buffs.bleeding.rankings_desc=Sangrou até a morte
actors.buffs.bless.desc=Uma grande explosão de foco, alguns dizem que é inspirada pelos deuses.\n\nA bênção aumenta a precisão e a evasão em 25%%, tornando o abençoado muito mais eficaz em combate.\n\nTurnos restantes da bênção: %s.
actors.buffs.bless.name=abençoado
actors.buffs.blindness.desc=A cegueira transforma o mundo ao redor em uma névoa escura. Enquanto estiver cego, o alcance de visão de um personagem é reduzido a um quadrado, tornando os ataques à distância inúteis e facilitando muito a perda de vista de inimigos distantes. Além disso, um herói cego é incapaz de ler pergaminhos ou livros. Turnos restantes de cegueira:
actors.buffs.blindness.heromsg=Você está cego!
actors.buffs.blindness.name=cego
actors.buffs.blobimmunity.desc=Alguma força estranha está envolvendo você em uma fina barreira protetora, bloqueando todos os efeitos nocivos transmitidos pelo ar.\n\nVocê está imune a todos os efeitos de área enquanto esta barreira durar.\n\nTurnos de imunidade restantes: %s.
actors.buffs.blobimmunity.name=barreira de purificação
actors.buffs.buff.heromsg=
actors.buffs.burning.burnsup=%s pega fogo!
actors.buffs.burning.desc=Poucas coisas são mais angustiantes do que ser consumido pelas chamas. O fogo causará dano a cada turno até ser apagado pela água ou até se extinguir. O fogo pode ser extinto entrando na água ou com o respingo de uma poção estilhaçante. Além disso, o fogo pode incendiar terrenos ou objetos inflamáveis com os quais entrar em contato. Turnos restantes de queima:
actors.buffs.burning.heromsg=Você pega fogo!
actors.buffs.burning.name=queimando
actors.buffs.burning.ondeath=Você morreu queimado...
actors.buffs.burning.rankings_desc=Reduzido a cinzas
actors.buffs.championenemy$antimagic.desc=Campeões antimágicos recebem 50% menos dano e são completamente imunes a efeitos mágicos.
actors.buffs.championenemy$antimagic.name=campeão antimagia
actors.buffs.championenemy$blazing.desc=Campeões flamejantes causam 25% mais dano corpo a corpo, incendeiam os inimigos que atacam, são imunes ao fogo e espalham chamas ao seu redor ao morrer. No entanto, eles não podem espalhar fogo na água.
actors.buffs.championenemy$blazing.name=campeão flamejante
actors.buffs.championenemy$blessed.desc=Campeões abençoados têm precisão e evasão quadruplicadas.
actors.buffs.championenemy$blessed.name=campeão abençoado
actors.buffs.championenemy$giant.desc=Campeões gigantes recebem 80% menos dano e têm +1 de alcance de ataque, mas não podem se mover por espaços fechados.
actors.buffs.championenemy$giant.name=campeão gigante
actors.buffs.championenemy$growing.desc=Campeões em crescimento recebem um bônus crescente de precisão, evasão, dano físico e redução de dano recebido. Aumento atual de precisão/evasão/dano: %1$d%%\n Redução de dano atual: %2$d%%
actors.buffs.championenemy$growing.name=campeão em crescimento
actors.buffs.championenemy$projecting.desc=Campeões com projeção causam 25% mais dano corpo a corpo e têm +3 de alcance de ataque.
actors.buffs.championenemy$projecting.name=campeão de projeção
actors.buffs.championenemy.warn=Você sente uma presença mortal.
actors.buffs.charm.cant_attack=Você está enfeitiçado por esse inimigo e não consegue atacá-lo.
actors.buffs.charm.desc=Um encanto é uma magia manipulativa que pode fazer com que inimigos se adorem temporariamente. Personagens afetados por encanto não podem atacar diretamente o inimigo que os enfeitiçou. No entanto, ainda é possível atacar outros alvos. O choque da dor diminuirá a duração do encanto. Turnos restantes de encanto:
actors.buffs.charm.heromsg=Você está encantado(a)!
actors.buffs.charm.name=Encantado
actors.buffs.chill.desc=Não está completamente congelado, mas ainda está muito frio. Alvos congelados realizam todas as ações mais lentamente, dependendo de quantas rodadas restam do efeito. No pior cenário, isso equivale a ter a velocidade reduzida. Turnos restantes de congelamento: Velocidade reduzida em:
actors.buffs.chill.freezes=%s congela!
actors.buffs.chill.name=gelado
actors.buffs.combo$combomove.clobber.desc=Empurra um inimigo 2 casas para trás, mas não causa dano e não pode jogá-lo em buracos. Aumenta o combo em 1.
actors.buffs.combo$combomove.clobber.empower_desc=Empurra o inimigo para trás _3 quadrados, causa vertigem e pode jogá-lo em buracos_, mas não causa dano. Aumenta o combo em 1.
actors.buffs.combo$combomove.clobber.name=bater
actors.buffs.combo$combomove.crush.desc=Causa dano de %d%% (combo*25%%) ao alvo principal e metade desse dano a todos os outros inimigos em uma área de efeito de 7x7. Reinicia o combo ao ser usado.
actors.buffs.combo$combomove.crush.empower_desc=Salta para o(s) quadrado(s) %1$d e causa dano de %2$d%% (combo*25%%) ao alvo principal e metade desse dano a todos os outros inimigos em uma área de efeito de 7x7. Reinicia o combo ao ser usado.
actors.buffs.combo$combomove.crush.name=crush
actors.buffs.combo$combomove.fury.desc=Atinge um inimigo uma vez para cada combo que você tiver; cada acerto causa 60% de dano e pode ativar encantamentos. Reinicia o combo ao ser usado.
actors.buffs.combo$combomove.fury.empower_desc=Salta para a(s) casa(s) %d e atinge um inimigo uma vez para cada combo que você tiver. Cada acerto causa 60%% de dano e pode ativar encantamentos. Reinicia o combo ao ser usado.
actors.buffs.combo$combomove.fury.name=fúria
actors.buffs.combo$combomove.parry.desc=Ao ser ativado, bloqueia o próximo ataque em até 1 turno e contra-ataca instantaneamente. Reinicia o combo se nenhum ataque for aparado.
actors.buffs.combo$combomove.parry.empower_desc=Bloqueia _todos os ataques_ em 1 turno ao ser ativado e contra-ataca instantaneamente. Reinicia o combo se nenhum ataque for aparado.
actors.buffs.combo$combomove.parry.name=aparar
actors.buffs.combo$combomove.slam.desc=Causa %d%% (combo*20%%) do seu poder de bloqueio de dano como dano bônus. Reinicia o combo ao ser usado.
actors.buffs.combo$combomove.slam.empower_desc=Salta para a(s) casa(s) %1$d e causa %2$d%% (combo*20%%) do seu poder de bloqueio de dano como dano bônus. Reinicia o combo ao ser usado.
actors.buffs.combo$combomove.slam.name=golpe
actors.buffs.combo.action_name=ataque combinado
actors.buffs.combo.bad_target=Você deve selecionar um inimigo que esteja ao seu alcance de ataque.
actors.buffs.combo.combo=Combo %d!
actors.buffs.combo.desc=O gladiador ganha impulso à medida que acerta golpes. Cada ataque aumenta o contador de combo em um, mas demorar muito entre os golpes zera o contador. Enquanto o gladiador estiver em combo, qualquer proteção que ele possua devido ao selo quebrado não começará a desaparecer. \n\n Acumular combo desbloqueia ataques especiais que não podem errar! Um ataque diferente é desbloqueado com 2, 4, 6, 8 e 10 pontos de combo. Alguns golpes zeram o combo e outros não, mas cada golpe só pode ser usado uma vez por sessão de combo. \n\n Combo atual: %1$d. \n\n Turnos até o combo ser perdido: %2$s.
actors.buffs.combo.name=combo
actors.buffs.combo.prompt=Selecione um alvo para atacar.
actors.buffs.corrosion.desc=Um ácido poderoso derrete carne, metal e osso a uma velocidade alarmante. Os danos por corrosão aumentam com o tempo, à medida que o alvo continua a derreter. Número de voltas de corrosão restantes: %1$s. Danos atuais por corrosão: %2$d.
actors.buffs.corrosion.heromsg=Você está derretendo!
actors.buffs.corrosion.name=corrosão
actors.buffs.corrosion.ondeath=Você se dissolve...
actors.buffs.corrosion.rankings_desc=Dissolvido
actors.buffs.corruption.desc=A corrupção infiltra-se na essência de um ser, distorcendo-o contra sua natureza original. Criaturas corrompidas atacarão seus aliados e ignorarão seus antigos inimigos. A corrupção também causa dano e, lentamente, levará seu alvo à ruína. A corrupção é permanente; seus efeitos só terminam com a morte.
actors.buffs.corruption.name=corrompido
actors.buffs.cripple.desc=Você tem quase certeza de que as pernas não foram feitas para dobrar dessa maneira.\n\nAleijado reduz a velocidade de movimento pela metade, fazendo com que mover uma peça geralmente leve dois turnos em vez de um.\n\nTurnos restantes de aleijado: %s.
actors.buffs.cripple.heromsg=Você está aleijado!
actors.buffs.cripple.name=aleijado
actors.buffs.daze.desc=Zumbido nos ouvidos e visão turva dificultam o combate. Enquanto atordoado, a precisão e a esquiva são reduzidas em 50%, tornando muito mais difícil acertar e esquivar de golpes. Turnos restantes de atordoamento:
actors.buffs.daze.heromsg=Você está atordoado!
actors.buffs.daze.name=atordoado
actors.buffs.degrade.desc=Magia negra poderosa está drenando a força que os pergaminhos de aprimoramento aplicaram ao seu equipamento! Enquanto degradado, o equipamento aprimorado será tratado como se fosse de um nível inferior ao real. _Cada aprimoramento após +3 se torna exponencialmente mais fraco que o anterior._ As descrições dos seus itens mudarão para refletir seu nível de poder reduzido. A degradação não afeta os requisitos de força, cargas de varinha, durabilidade de armas de arremesso ou artefatos. Turnos de degradação restantes: Usar um pergaminho de aprimoramento ou remover maldição encerrará a degradação imediatamente.
actors.buffs.degrade.heromsg=Seu equipamento parece mais fraco!
actors.buffs.degrade.name=degradado
actors.buffs.doom.desc=É difícil continuar quando parece que o universo quer você morto.Personagens condenados receberão +67% de dano de todas as fontes.A condenação é permanente, seus efeitos só terminam com a morte.
actors.buffs.doom.name=condenado
actors.buffs.dread.desc=Um terror tão grande que fará com que seu alvo fuja completamente da masmorra! Criaturas afetadas pelo terror fugirão de seu oponente em alta velocidade e desaparecerão completamente da masmorra assim que estiverem fora de vista. Inimigos derrotados dessa forma concedem metade da experiência e não deixam cair itens. O choque da dor diminuirá a duração do terror. Turnos restantes de terror:
actors.buffs.dread.name=temor
actors.buffs.drowsy.desc=Uma força mágica está dificultando a vigília; após alguns turnos, o alvo cairá em um sono mágico profundo. O herói pode resistir à sonolência sofrendo dano ou estando com a saúde completa. Turnos até dormir:
actors.buffs.drowsy.name=sonolento
actors.buffs.earthimbue.desc=Você está imbuído com o poder da terra!\n\nTodos os ataques físicos deslocarão a terra sob o inimigo, incapacitando-o por um curto período.\n\nTurnos de imbuir terra restantes: %s.
actors.buffs.earthimbue.name=impregnado de terra
actors.buffs.enhancedrings.desc=O artefato usado recentemente pelo Ladino está fortalecendo seus anéis, concedendo-lhes +1 nível.\n\nTurnos restantes: %s.
actors.buffs.enhancedrings.name=anéis aprimorados
actors.buffs.fireimbue.desc=Você está imbuído com o poder do fogo! Todos os ataques físicos terão uma chance de incendiar os inimigos. Além disso, você é completamente imune aos efeitos do fogo. Turnos restantes de imbuimento de fogo:
actors.buffs.fireimbue.name=imbuído de fogo
actors.buffs.foresight.desc=De alguma forma, você consegue ver o layout do terreno ao redor com a sua mente.\n\nEnquanto estiver sob o efeito da premonição, todos os ladrilhos em um amplo raio são revelados a você, incluindo quaisquer armadilhas ou portas secretas.\n\nTurnos de premonição restantes: %s.
actors.buffs.foresight.name=previsão
actors.buffs.frost.desc=Não confundir com congelamento total, este congelamento mais benigno simplesmente envolve o alvo em gelo. O congelamento age de forma semelhante à paralisia, tornando impossível para o alvo agir. Ao contrário da paralisia, o congelamento é imediatamente cancelado se o alvo sofrer dano, pois o gelo se quebrará. Turnos restantes de congelamento:
actors.buffs.frost.freezes=%s congela!
actors.buffs.frost.name=congelado
actors.buffs.frostimbue.desc=Você está imbuído de poder gélido! Todos os ataques físicos acumularão congelamento nos inimigos de forma constante. Além disso, você é completamente imune ao frio. Turnos restantes de imbuimento de gelo:
actors.buffs.frostimbue.name=impregnado de gelo
actors.buffs.fury.desc=Você está com raiva, e seus inimigos não gostarão de você quando estiver com raiva. Uma grande fúria queima dentro de você, aumentando o dano que você causa com ataques físicos em 50. Essa fúria durará enquanto você estiver com menos de 50 de saúde.
actors.buffs.fury.heromsg=Você fica furioso!
actors.buffs.fury.name=furioso
actors.buffs.gravitychaostracker.desc_duration=Não está claro por quanto tempo o efeito irá durar, mas certamente não será para sempre.
actors.buffs.gravitychaostracker.desc_intro=A cada poucos turnos, todos os personagens no andar atual da masmorra serão arremessados em uma direção aleatória.
actors.buffs.gravitychaostracker.desc_positive=Você e seus aliados parecem ser imunes.
actors.buffs.gravitychaostracker.name=caos gravitacional
actors.buffs.greaterhaste.desc=Um aumento incrível de velocidade; por um momento, parece que tudo ao redor está parado. Enquanto estiver sob o efeito de maior aceleração, as ações de movimento não levam tempo algum, mas outras ações ainda são realizadas em velocidade normal. Cada passo de movimento consome um turno de maior aceleração. Turnos de maior aceleração restantes:
actors.buffs.greaterhaste.name=maior pressa
actors.buffs.haste.desc=A energia percorre seus músculos, permitindo que você corra a velocidades incríveis!\n\nEnquanto estiver sob o efeito de aceleração, você correrá com velocidade 3x maior, mas realizará todas as outras ações em velocidade normal.\n\nTurnos de aceleração restantes: %s.
actors.buffs.haste.name=pressa
actors.buffs.healing.desc=Um remédio mágico está fazendo com que as feridas se fechem e a carne se regenere. A cada turno, a saúde se regenerará constantemente até que o efeito de cura expire. A quantidade de cura pode diminuir com o tempo. Próxima cura: ZXQPH0. Cura restante: ZXQPH1.
actors.buffs.healing.name=cura
actors.buffs.herodisguise.desc=Magia ilusória alterou sua aparência física! O efeito é puramente cosmético, mas a sensação é muito estranha mesmo assim.\n\nTurnos de disfarce restantes: %s.
actors.buffs.herodisguise.name=disfarce
actors.buffs.hex.desc=Magia negra que mina a concentração, deixando o alvo ligeiramente desorientado.\n\nO feitiço reduz a precisão e a evasão em 20%%, tornando o alvo menos eficaz em combate.\n\nTurnos de feitiço restantes: %s.
actors.buffs.hex.heromsg=Você foi enfeitiçado(a)!
actors.buffs.hex.name=amaldiçoado
actors.buffs.holdfast.desc=O Guerreiro mantém sua posição, aumentando sua armadura em %1$d-%2$d e reduzindo a taxa de decaimento de alguns buffs em %3$d%%. Isso durará até que ele se mova.
actors.buffs.holdfast.name=agarrar-se
actors.buffs.hunger.cursedhorn=O chifre amaldiçoado rouba parte da energia dos alimentos enquanto você come.
actors.buffs.hunger.desc=A fome aumenta gradualmente conforme você passa tempo na masmorra, até que eventualmente você comece a morrer de fome. Enquanto estiver faminto, você perderá saúde lentamente em vez de regenerá-la. Racionar é importante! Se você tiver saúde de sobra, passar fome não é uma má ideia se isso significar que haverá mais comida mais tarde. Um racionamento eficaz pode fazer com que a comida dure muito mais tempo!
actors.buffs.hunger.desc_intro_hungry=Você consegue sentir seu estômago pedindo comida, mas ainda não é nada urgente.
actors.buffs.hunger.desc_intro_starving=Você está com tanta fome que chega a doer.
actors.buffs.hunger.hungry=com fome
actors.buffs.hunger.ondeath=Você morreu de fome...
actors.buffs.hunger.onhungry=Você está com fome.
actors.buffs.hunger.onstarving=Você está morrendo de fome!
actors.buffs.hunger.rankings_desc=Morreu de fome
actors.buffs.hunger.starving=morrendo de fome
actors.buffs.invisibility.desc=Você se camufla completamente com o terreno ao redor, tornando-se impossível de ser visto. Enquanto estiver invisível, os inimigos não podem atacá-lo ou segui-lo. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelarão imediatamente a invisibilidade. Turnos restantes de invisibilidade:
actors.buffs.invisibility.name=invisível
actors.buffs.invulnerability.desc=Este personagem é imbuído de grande poder protetor, concedendo-lhe um breve período de invulnerabilidade!\n\nTurnos restantes: %s.
actors.buffs.invulnerability.name=invulnerável
actors.buffs.levitation.desc=Uma força mágica está levitando você acima do chão, fazendo você se sentir sem peso. Personagens levitando se movem silenciosamente e ignoram todos os efeitos terrestres. Armadilhas não serão acionadas, água não apagará fogo, plantas não serão pisoteadas, raízes não serão atingidas e buracos serão sobrevoados. Tenha cuidado, pois todas essas coisas podem entrar em vigor no instante em que a levitação terminar! Turnos de levitação restantes: %s.
actors.buffs.levitation.name=levitando
actors.buffs.lifelink.desc=A força vital deste personagem está ligada à de outro personagem próximo. Qualquer dano recebido é compartilhado entre eles.\n\nSempre que este personagem sofrer dano, metade dele será infligida ao alvo do vínculo vital.\n\nTurnos restantes do vínculo vital: %s.
actors.buffs.lifelink.name=ligação vital
actors.buffs.lifelink.ondeath=O dano vital que te matou...
actors.buffs.light.desc=Mesmo na Masmorra Mais Escura, uma luz constante ao seu lado é sempre reconfortante. A luz ajuda a manter a escuridão afastada, permitindo que você veja a uma distância razoável, apesar do ambiente. Número de voltas de iluminação restantes:
actors.buffs.light.name=iluminado
actors.buffs.lockedfloor.desc=O andar atual está bloqueado e você não pode sair! Enquanto um andar estiver bloqueado, você não sentirá fome nem sofrerá dano por inanição. Além disso, se você não se esforçar para derrotar o chefe deste andar, os efeitos de regeneração passiva também serão interrompidos. Se você for revivido por um ankh não abençoado enquanto o andar estiver bloqueado, ele será redefinido. Derrote o chefe deste andar para quebrar o bloqueio.
actors.buffs.lockedfloor.name=O chão está trancado
actors.buffs.lostinventory.desc=Seu inventário foi perdido em algum lugar da masmorra! Você não poderá pegar ou usar a maioria dos itens até recuperá-lo.
actors.buffs.lostinventory.name=inventário perdido
actors.buffs.magicalsight.desc=De alguma forma, você consegue ver com a mente, em vez de com os olhos.\n\nEnquanto a visão mágica estiver ativa, você poderá ver através de todo o terreno em um raio de 12 quadrados.\n\nTurnos restantes de visão mágica: %s.
actors.buffs.magicalsight.name=visão mágica
actors.buffs.magicalsleep.desc=Este personagem caiu em um sono mágico profundo do qual não despertará naturalmente. O sono mágico é semelhante ao sono normal, exceto que apenas dano fará com que o alvo acorde. Para o herói e seus aliados, o sono mágico possui algumas propriedades restauradoras, permitindo que se curem rapidamente enquanto descansam.
actors.buffs.magicalsleep.fallasleep=Você cai num sono profundo e mágico.
actors.buffs.magicalsleep.name=sono mágico
actors.buffs.magicalsleep.toohealthy=Você está muito saudável e resiste à vontade de dormir.
actors.buffs.magicalsleep.wakeup=Você acorda se sentindo revigorado e saudável.
actors.buffs.magicimmune.desc=Todos os efeitos mágicos perderam o efeito sobre você, você está completamente imune a eles. Enquanto imune à magia, todos os efeitos mágicos, sejam eles nocivos ou benéficos, não se aplicarão a você, incluindo maldições, encantamentos, varinhas, pergaminhos, anéis, artefatos, etc. As habilidades da armadura heroica são fortes o suficiente para funcionar independentemente deste efeito. Turnos restantes de imunidade à magia: %s.
actors.buffs.magicimmune.name=imune à magia
actors.buffs.mindvision.desc=De alguma forma, você consegue ver todas as criaturas neste andar através da sua mente. É uma sensação estranha. Todos os personagens neste andar são visíveis para você enquanto você tiver visão mental. Ver uma criatura através da visão mental conta como vê-la ou tê-la por perto para efeitos de muitos efeitos mágicos. Turnos restantes de visão mental:
actors.buffs.mindvision.name=visão mental
actors.buffs.momentum.action_name=corrida livre
actors.buffs.momentum.momentum=ganhando impulso
actors.buffs.momentum.momentum_desc=Ao se mover, o Corredor Livre acumula impulso, que ele pode usar para iniciar o parkour. Cada carga de impulso concede duas rodadas de parkour, e o Corredor Livre pode acumular até 10 cargas. O impulso é perdido rapidamente quando o Corredor Livre para de se mover. Carga de impulso atual:
actors.buffs.momentum.resting=recuperando
actors.buffs.momentum.resting_desc=Ao se mover, o Corredor Livre ganha impulso, que ele pode usar para começar a correr livremente. O Corredor Livre precisa de tempo para recuperar sua resistência antes de ganhar impulso novamente. Turnos restantes:
actors.buffs.momentum.running=parkour
actors.buffs.momentum.running_desc=Ao se mover, o Corredor Livre ganha impulso, que ele pode usar para começar a correr livremente. Enquanto corre livremente, o Corredor Livre se move com o dobro da velocidade e ganha evasão bônus com base em seu nível. Turnos restantes:
actors.buffs.monkenergy$monkability$dash.desc=Um deslocamento instantâneo de até 4 quadrados de distância. Essa habilidade permite atravessar obstáculos, mas não inimigos ou terreno sólido.
actors.buffs.monkenergy$monkability$dash.empower_desc=Um impulso instantâneo de até 8 quadrados de distância. Essa habilidade permite atravessar obstáculos, mas não inimigos ou terreno sólido.
actors.buffs.monkenergy$monkability$dash.name=traço
actors.buffs.monkenergy$monkability$dash.prompt=Escolha um local
actors.buffs.monkenergy$monkability$dragonkick.desc=Um chute devastador que causa dano de %1$d a %2$d e ignora a armadura. O chute arremessa o alvo para longe e o paralisa para cada quadrado percorrido.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Um chute devastador que causa _%1$d-%2$d de dano_ e ignora armadura. O chute arremessa _todos os alvos adjacentes_ para longe e os paralisa para cada quadrado percorrido.
actors.buffs.monkenergy$monkability$dragonkick.name=chute do dragão
actors.buffs.monkenergy$monkability$flurry.desc=Dois golpes instantâneos que causam dano de %1$d a %2$d e ignoram a armadura. Esta habilidade não pode ser usada repetidamente.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dois golpes instantâneos que causam dano de %1$d a %2$d, ignoram a armadura e usam o encantamento da sua arma. Esta habilidade não pode ser usada repetidamente.
actors.buffs.monkenergy$monkability$flurry.name=chuva de golpes
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=A Monja está concentrada em seus arredores, antecipando o próximo ataque. Enquanto estiver concentrada, ela tem a garantia de aparar o próximo ataque recebido.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focado
actors.buffs.monkenergy$monkability$focus.desc=O Monge aproveita a oportunidade para se concentrar, permitindo que ela defenda o próximo ataque direcionado a ela.
actors.buffs.monkenergy$monkability$focus.empower_desc=O Monge _concentra-se instantaneamente_, permitindo que ela apare o próximo ataque direcionado a ela.
actors.buffs.monkenergy$monkability$focus.name=foco
actors.buffs.monkenergy$monkability$meditate.desc=A Monja concentra energia em seu corpo por 5 turnos. Isso elimina a maioria dos efeitos negativos e concede a ela 8 turnos de recarga para sua varinha e artefatos.
actors.buffs.monkenergy$monkability$meditate.empower_desc=A Monja concentra energia em seu corpo por 5 turnos. Isso remove a maioria dos efeitos negativos e concede a ela 8 turnos de recarga para sua varinha e artefatos. Ela também ganha 80% de resistência a dano enquanto medita e se cura lentamente em 20% de seus pontos de vida perdidos.
actors.buffs.monkenergy$monkability$meditate.name=meditar
actors.buffs.monkenergy.action=Habilidades do Monge
actors.buffs.monkenergy.desc=Ao derrotar inimigos, a Monja ganha energia que pode usar em diversas habilidades. A maioria dos inimigos concede 1 ponto de energia ao serem derrotados, e a Monja não perde energia com o tempo. Energia atual: \n\n.
actors.buffs.monkenergy.desc_cooldown=O Monge usou uma habilidade recentemente e deve esperar antes de usar outra.\n\nTempo de recarga atual: %d turnos.
actors.buffs.monkenergy.name=energia
actors.buffs.ooze.desc=Este ácido pegajoso adere à carne, derretendo-a lentamente.\n\nO lodo causará danos consistentes ao longo do tempo, mas pode ser lavado imediatamente com água.\n\nTurnos de lodo restantes: %s.
actors.buffs.ooze.heromsg=Uma substância cáustica corrói sua carne. Lave-a!
actors.buffs.ooze.name=lodo cáustico
actors.buffs.ooze.ondeath=Você se dissolve...
actors.buffs.ooze.rankings_desc=Dissolvido
actors.buffs.paralysis.desc=Muitas vezes, a pior coisa a fazer é não fazer nada. A paralisia interrompe completamente todas as ações, forçando o alvo a esperar até que o efeito passe. A dor de sofrer dano pode fazer com que os personagens resistam à paralisia, libertando-os do efeito. Turnos restantes de paralisia:
actors.buffs.paralysis.heromsg=Você está paralisado!
actors.buffs.paralysis.name=paralisado
actors.buffs.paralysis.out=resistiu à paralisia
actors.buffs.physicalempower.desc=Seus golpes foram potencializados, aumentando a quantidade de dano que você pode causar ao atingir inimigos com ataques físicos.\n\nDano bônus: %1$d.\nAcertos restantes: %2$d.
actors.buffs.physicalempower.name=fisicamente capacitado
actors.buffs.pincushion.desc=As armas arremessadas que você usou contra este personagem estão atualmente presas a ele e cairão no chão após ele ser derrotado. Os seguintes itens estão atualmente anexados:
actors.buffs.pincushion.name=almofada de alfinetes
actors.buffs.poison.desc=O veneno se espalha pelo corpo, prejudicando lentamente seu funcionamento interno. O veneno causa dano a cada turno, proporcional ao tempo restante até que ele expire. Turnos restantes de veneno:
actors.buffs.poison.heromsg=Você está envenenado!
actors.buffs.poison.name=envenenado
actors.buffs.poison.ondeath=Você morreu envenenado...
actors.buffs.poison.rankings_desc=Sucumbiu ao envenenamento
actors.buffs.preparation.action_name=greve preparada
actors.buffs.preparation.assassinated=assassinado
actors.buffs.preparation.desc=O Assassino aguarda pacientemente, preparando-se para atacar das sombras.
actors.buffs.preparation.desc_blink=Ele é capaz de se teletransportar em direção a um inimigo antes de atacá-lo, com uma distância máxima de _%d._
actors.buffs.preparation.desc_dmg=Seu próximo ataque causará _%1$d%% de dano bônus_ e executará inimigos comuns com menos de _%2$d%% de vida_ ou chefes com menos de _%3$d%% de vida_.
actors.buffs.preparation.desc_dmg_likely=O ataque também terá maior probabilidade de causar uma quantidade maior de dano.
actors.buffs.preparation.desc_invis_next=Turnos para ataque mais forte: _%d._
actors.buffs.preparation.desc_invis_time=Turnos passados invisível: _%d._
actors.buffs.preparation.name=preparação
actors.buffs.preparation.no_target=Não há nada para atacar ali.
actors.buffs.preparation.out_of_reach=Essa meta está fora de alcance.
actors.buffs.preparation.prompt=Selecione um alvo para atacar!\nDistância máxima de piscar: %d
actors.buffs.prismaticguard.desc=Você está sendo protegido por uma imagem prismática que está atualmente inativa. Quando inimigos estiverem presentes, a imagem prismática entrará em ação e o protegerá! Enquanto inativa, a imagem prismática se recuperará gradualmente de qualquer dano sofrido. HP atual: %d/%d.
actors.buffs.prismaticguard.desc_many=Esta imagem prismática também se beneficia do Poder de Muitos. Turnos restantes: %d.
actors.buffs.prismaticguard.name=Guarda prismática
actors.buffs.recharging.desc=A energia está fluindo através de você, melhorando a taxa de recarga de suas varinhas e cajados. A cada turno, este bônus aumentará a carga atual em um quarto, além da recarga normal. Turnos de recarga restantes:
actors.buffs.recharging.name=recarregando
actors.buffs.revealedarea.desc=Uma área da masmorra foi temporariamente revelada ao herói. Ele poderá vê-la não importa onde esteja. \n\nTurnos restantes: %s.
actors.buffs.revealedarea.name=área revelada
actors.buffs.revealedchar.desc=Este personagem é revelado ao herói. Ele ficará visível não importa onde esteja. \n\n Turnos restantes: %s.
actors.buffs.revealedchar.name=revelado
actors.buffs.roots.desc=Raízes (mágicas ou naturais) agarram os pés, forçando-os para baixo, em direção ao chão. \n\n As raízes prendem um alvo no lugar, tornando o movimento e a maioria das habilidades de movimento impossíveis. Outras ações não são afetadas, incluindo efeitos de teletransporte. \n\n Turnos restantes da raiz: %s.
actors.buffs.roots.heromsg=Você não pode se mexer!
actors.buffs.roots.name=enraizado
actors.buffs.scrollempower.desc=A energia do pergaminho lido recentemente pelo Mago está fortalecendo suas varinhas! Aumento de nível: +\n\nZaps restantes: %2$d.
actors.buffs.scrollempower.name=rolagem capacitar
actors.buffs.shadows.desc=Você se funde às sombras ao seu redor, o que lhe concede invisibilidade e desacelera seu metabolismo. Enquanto estiver invisível, os inimigos não poderão atacá-lo ou segui-lo. A maioria dos ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelará imediatamente a invisibilidade. Além disso, enquanto estiver fundido às sombras, sua fome será reduzida. Você permanecerá fundido às sombras até sair delas ou um inimigo entrar em contato com você.
actors.buffs.shadows.name=sombra mesclada
actors.buffs.slow.desc=A magia de lentidão afeta a percepção do tempo do alvo, fazendo com que tudo se mova em velocidade supersônica. Um personagem com a magia de lentidão realiza todas as ações no dobro do tempo que normalmente levaria. Turnos restantes de lentidão:
actors.buffs.slow.name=desacelerado
actors.buffs.snipersmark.action_name_snapshot=instantâneo
actors.buffs.snipersmark.action_name_sniper=tiro de atirador
actors.buffs.snipersmark.action_name_volley=voleio
actors.buffs.snipersmark.desc=A Atiradora está focada no alvo que atacou mais recentemente. Ela é capaz de realizar um ataque especial com seu arco, que varia de acordo com o aprimoramento do arco. Um arco sem aprimoramentos dispara um _tiro rápido_, que causa dano reduzido, mas não leva tempo para disparar. Um arco aprimorado para velocidade dispara uma _saraivada_ de três flechas. Cada flecha causa dano reduzido, mas ainda pode ativar um encantamento. Essa saraivada leva 1 turno para ser disparada. Um arco aprimorado para dano dispara um _tiro de precisão_. Este tiro tem acerto garantido, causa dano bônus com base na distância do alvo e leva 2 turnos para ser disparado. Turnos restantes:
actors.buffs.snipersmark.name=marca de atirador
actors.buffs.soulmark.desc=O bruxo acessou a alma desta criatura, permitindo-lhe curar-se enquanto ela sofre dano físico.\n\nTurnos restantes da marca da alma: %s.
actors.buffs.soulmark.name=alma marcada
actors.buffs.stamina.desc=Você tem resistência infinita, permitindo movimentos mais rápidos!\n\nEnquanto estiver sob o efeito da resistência, você correrá com +50%% de velocidade, mas realizará todas as outras ações em velocidade normal.\n\nTurnos de resistência restantes: %s.
actors.buffs.stamina.name=resistência
actors.buffs.terror.desc=Terror é uma magia manipuladora que força seu alvo a um pânico incontrolável. Personagens aterrorizados são forçados a fugir de seu oponente, tentando colocar o máximo de portas e paredes entre eles possível. O choque da dor, no entanto, diminuirá a duração do terror. Turnos de terror restantes:
actors.buffs.terror.name=aterrorizada
actors.buffs.toxicimbue.desc=Você está imbuído de energia venenosa!\n\nAo se mover, um gás tóxico emanará constantemente de você, causando dano aos seus inimigos. Você é imune a gás tóxico e veneno durante a duração do efeito, bem como por alguns turnos depois.\n\nTurnos restantes de imbuimento tóxico: %s.
actors.buffs.toxicimbue.name=impregnado de toxicidade
actors.buffs.vertigo.desc=Andar em linha reta pode ser difícil quando o mundo inteiro está girando.\n\nSob os efeitos da vertigem, os personagens que tentarem se mover irão em uma direção aleatória, em vez daquela que pretendiam seguir.\n\nTurnos de vertigem restantes: %s.
actors.buffs.vertigo.name=vertigem
actors.buffs.vulnerable.desc=A magia Vulnerabilidade aumenta todo o dano físico que um personagem recebe em 33%%, após esse dano ter sido reduzido pela armadura.\n\nTurnos restantes de vulnerabilidade: %s.
actors.buffs.vulnerable.heromsg=Você se sente frágil!
actors.buffs.vulnerable.name=vulnerável
actors.buffs.wandempower.desc=Suas varinhas de dano foram aprimoradas, aumentando a quantidade de dano que causam por alguns golpes.\n\nDano bônus: %1$d.\nGatilhos restantes: %2$d.
actors.buffs.wandempower.name=varinhas energizadas
actors.buffs.weakness.desc=De repente, tudo parece muito mais pesado. ZXQPH2 ZXQ ZXQPH3 ZXQ Magia de enfraquecimento reduz a força física de um personagem, fazendo com que ele cause 33 ZXQPH0 ZXQ de dano reduzido. ZXQPH4 ZXQ ZXQPH5 ZXQ Turnos de fraqueza restantes: ZXQPH1 ZXQ.
actors.buffs.weakness.heromsg=Você se sente fraco!
actors.buffs.weakness.name=enfraquecido
actors.buffs.wellfed.desc=Você se sente bastante satisfeito e saciado.\n\nEnquanto bem alimentado, sua fome não aumentará e você recuperará uma quantidade adicional de saúde ao longo do tempo.\n\nTurnos restantes: %d.
actors.buffs.wellfed.name=bem alimentado
actors.char.def_verb=esquivou-se
actors.char.defeat=Você derrotou %s.
actors.char.immune=imune
actors.char.invulnerable=invulnerável
actors.char.kill=%s te matou...
actors.hero.abilities.armorability.cost=Custo da cobrança: _%d_
actors.hero.abilities.armorability.no_target=Não há nada para mirar ali!
actors.hero.abilities.armorability.prompt=Escolha um local para segmentar
actors.hero.abilities.armorability.self_target=Você não pode se escolher como alvo!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Energia radiante emana do corpo do Clérigo. Enquanto estiver nesta forma, o Clérigo ganha 2 de alcance de ataque (devido à energia sagrada projetada por ele) e 10 de escudo sempre que gasta uma carga de tomo sagrado. Ele também pode conjurar as magias desbloqueadas pelos talentos da forma ascendida. O escudo concedido pela forma ascendida e suas magias não se dissipará normalmente, mas desaparecerá instantaneamente quando a forma ascendida terminar. Escudo atual: 0. Turnos restantes: 1.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=forma ascendida
actors.hero.abilities.cleric.ascendedform.desc=O Clérigo projeta energia sagrada de si mesmo, assumindo uma forma radiante estendida por 10 turnos. Enquanto estiver nessa forma, o Clérigo pode conjurar novas magias, ganha 2 de alcance de ataque, 30 de escudo e quaisquer magias adicionais que conjurar concederão 10 de escudo por carga de tomo sagrado usada. O escudo da forma ascendida e de suas magias não se dissipa normalmente, mas desaparecerá imediatamente assim que a forma ascendida terminar. A habilidade pode ser reutilizada para renovar a duração da forma ascendida.
actors.hero.abilities.cleric.ascendedform.name=forma ascendida
actors.hero.abilities.cleric.ascendedform.short_desc=O Clérigo assume uma _Forma Ascendida_, ganhando novas magias, alcance de ataque e proteção.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Uma cópia de um dos companheiros de aventura do Clérigo, feita de luz sólida. Embora tenha a forma de outro herói, não possui nenhuma de suas habilidades únicas. Este aliado persistirá enquanto o Poder de Muitos estiver aplicado a ele. Este aliado pode ser direcionado sem custo ao reutilizar a habilidade de armadura Poder de Muitos.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Seu aliado se move para atacar!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Seu aliado se move para essa posição.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Seu aliado se move para segui-lo.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Você pode encontrar esse personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.cleric.powerofmany$lightally.name=aliado da luz
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Este aliado foi fortalecido pelo Poder de Muitos, concedendo-lhe +25%% de dano causado e -25%% de dano recebido. Ele também compartilhará seu alcance de visão com o Clérigo e poderá se beneficiar de magias de Poder de Muitos. O Poder de Muitos persistirá mesmo quando aliados como imagens prismáticas se esconderem, mas sua duração continuará a ser contabilizada. Turnos Restantes: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=poder de muitos
actors.hero.abilities.cleric.powerofmany.ally_exists=Você já tem um aliado empoderado.
actors.hero.abilities.cleric.powerofmany.desc=O Clérigo canaliza o _Poder de Muitos_, que fortalece um aliado existente ou cria um novo aliado fortalecido por 100 turnos. Escolher um espaço vazio cria um novo aliado. Enquanto estiver fortalecido pelo Poder de Muitos, qualquer aliado causa +25% de dano, recebe -25% de dano e compartilha sua visão com o Clérigo. Ele também ganha 25 de escudo quando a habilidade é usada. O Clérigo também ganha três novas magias que só podem ser conjuradas com um aliado fortalecido. O Poder de Muitos não termina enquanto uma dessas magias estiver ativa.
actors.hero.abilities.cleric.powerofmany.name=poder de muitos
actors.hero.abilities.cleric.powerofmany.no_vision=Você não pode selecionar um local que não consegue ver.
actors.hero.abilities.cleric.powerofmany.only_allies=Você só pode fortalecer aliados.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direcione seu aliado de luz
actors.hero.abilities.cleric.powerofmany.prompt_default=Escolha um aliado ou local
actors.hero.abilities.cleric.powerofmany.short_desc=O Clérigo canaliza o _Poder de Muitos_, fortalecendo um aliado existente ou criando um novo.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Atribuir à forma do corpo
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Atribua à forma mental
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Atribuir à forma espiritual
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Selecione um efeito para ser imbuído em Trinity. Informações adicionais serão exibidas antes da confirmação.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Forma do corpo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Forma Mental: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Forma Espiritual: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Selecione qual forma da Trindade usar. Os efeitos de diferentes formas podem estar ativos simultaneamente.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity aplicará o efeito de alquimia remota deste artefato, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity aplicará o efeito passivo de regeneração de vida deste artefato em _+%1$d_ por 20 turnos, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.cost=O custo de ativação dessa habilidade varia, mas geralmente é _%d._
actors.hero.abilities.cleric.trinity.desc=O Clérigo adquire uma _Trindade_ de habilidades de armadura, que podem ser atribuídas a vários efeitos de itens usando três novas magias. Cada uma dessas magias se concentra em emular os efeitos de diferentes tipos de equipamentos que o Clérigo identificou durante esta jornada: forma corporal (armas e armaduras), forma mental (varinhas e armas de arremesso) e forma espiritual (anéis e artefatos). Cada forma da Trindade pode ser imbuída com um efeito por vez, e o Clérigo escolhe qual ativar ao usar Trindade. Trindade não duplicará o efeito de algo que você já tenha equipado.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity usará o efeito deste artefato para invocar um espectro aliado corrompido com o HP de um fantasma _+%1$d_, ao custo de _%2$s cargas._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity aplicará esse efeito por _%1$d turnos_ ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity aplicará o efeito de conjuração em cadeia deste artefato com alcance de _+%1$d_, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity aplicará o efeito de consumo deste artefato, ao custo de uma carga de _%2$s_.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity aplicará o efeito de roubo de inimigos deste artefato em _+%1$d_, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.name=trindade
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity não pode duplicar um efeito que você já tenha equipado!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity não possui nenhum efeito definido para nenhuma de suas formas no momento, use uma de suas magias!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity aplicará este efeito _poderoso_ por _%1$d turnos_ ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.ring_use=Trinity aplicará o efeito deste anel em _+%1$d_ por 20 turnos, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity aplicará o efeito raiz deste artefato com uma semente nociva aleatória, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.short_desc=O Clérigo adquire uma _Trindade_ de habilidades, que emulam equipamentos que ele viu e podem ser atribuídas usando novas magias.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity aplicará o efeito de inserção deste artefato, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity aplicará o efeito de vidência deste artefato em _+%1$d_, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity lançará esta arma em _+%1$d_ ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity aplicará o efeito de congelamento temporal deste artefato com uma duração de turno de _%1$d_, ao custo de _%2$s cargas._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity aplicará o efeito de pergaminho aleatório deste artefato com uma chance de _%1$d/10_ de oferecer a versão exótica sem custo adicional, ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity vai disparar este bastão de _multicarga_ em _+%1$d_ ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.wand_use=Trinity lançará esta varinha a _+%1$d_ ao custo de _%2$s de carga._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Este personagem está participando de um duelo. Ele, e quaisquer aliados ou lacaios seus, podem agir normalmente enquanto os outros estão congelados. O duelo durará por um período determinado, até que um participante morra ou até que os participantes se afastem mais de 5 casas um do outro. Turnos restantes:
actors.hero.abilities.duelist.challenge$duelparticipant.name=participante do duelo
actors.hero.abilities.duelist.challenge.ally_target=Você só pode desafiar inimigos.
actors.hero.abilities.duelist.challenge.already_dueling=Você só pode participar de um duelo por vez.
actors.hero.abilities.duelist.challenge.desc=A Duelista desafia um inimigo próximo para um duelo. Esse inimigo é compelido a lutar contra ela enquanto todos os outros inimigos são temporariamente congelados no tempo. O alvo deve estar ao alcance e a até 5 quadrados da Duelista. O duelo dura até que 10 turnos se passem, o inimigo morra ou a Duelista esteja a mais de 5 quadrados de distância do inimigo. Inimigos congelados são invulneráveis. Os aliados da Duelista não são congelados por esta habilidade, mas se um chefe for o alvo, seus lacaios também não serão congelados.
actors.hero.abilities.duelist.challenge.distant_target=Esse inimigo está muito longe para ser enfrentado.
actors.hero.abilities.duelist.challenge.name=desafio
actors.hero.abilities.duelist.challenge.prompt=Escolha um inimigo para desafiar.
actors.hero.abilities.duelist.challenge.short_desc=O Duelista desafia um inimigo próximo para um duelo, congelando temporariamente todos os outros inimigos.
actors.hero.abilities.duelist.challenge.unreachable_target=Você precisa ser capaz de atingir seu objetivo.
actors.hero.abilities.duelist.elementalstrike.desc=O Duelista ataca um inimigo ou local, realizando um ataque normal com acerto garantido e espalhando um efeito mágico que se propaga por até 4 quadrados em um cone de 65 graus. Esse efeito mágico varia de acordo com o encantamento da arma principal do Duelista.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Um ataque elemental sem encantamento liberará uma pequena explosão de magia, causando de 6 a 12 de dano a todos os inimigos dentro do alcance.
actors.hero.abilities.duelist.elementalstrike.name=ataque elemental
actors.hero.abilities.duelist.elementalstrike.short_desc=A Duelista executa um _Golpe Elemental_, espalhando um efeito em uma área cônica com base no encantamento de sua arma.
actors.hero.abilities.duelist.feint.bad_location=Você não pode se mudar para esse local.
actors.hero.abilities.duelist.feint.desc=A Duelista simula um ataque enquanto se desloca rapidamente para uma casa adjacente, deixando para trás uma imagem residual momentânea de si mesma. Inimigos que estavam atacando a Duelista agora atacarão sua imagem residual. Inimigos que atacam a imagem residual ficam confusos, o que cancela sua próxima ação e os deixa vulneráveis a um ataque surpresa.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Escolha um local para onde ir.
actors.hero.abilities.duelist.feint.short_desc=A Duelista realiza uma finta, simulando um ataque enquanto se desloca rapidamente para um quadrado adjacente. Os inimigos atacarão sua imagem residual, ficando vulneráveis a um contra-ataque.
actors.hero.abilities.duelist.feint.too_far=Esse local não fica perto de você.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=A Caçadora é brevemente fortalecida, aumentando sua velocidade de movimento e velocidade de ataque com seu arco.\n\nTurnos restantes: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=o poder da natureza
actors.hero.abilities.huntress.naturespower.desc=A Caçadora se fortalece temporariamente, assim como seu arco, com o poder da natureza! Isso dura 8 turnos. Durante esse tempo, a Caçadora se move com o dobro da velocidade e ataca 33% mais rápido com seu arco. Os efeitos bônus do arco não são ativados se a Atiradora estiver usando seus ataques especiais.
actors.hero.abilities.huntress.naturespower.name=o poder da natureza
actors.hero.abilities.huntress.naturespower.short_desc=A Caçadora invoca o _Poder da Natureza_, aumentando sua velocidade de movimento e a cadência de tiro de seu arco por um curto período de tempo.
actors.hero.abilities.huntress.spectralblades.desc=A Caçadora lança uma lâmina espectral contra um inimigo, que age como um ataque à distância de sua arma corpo a corpo. Todos os efeitos normais de uma arma corpo a corpo serão ativados, incluindo encantamentos.
actors.hero.abilities.huntress.spectralblades.name=lâminas espectrais
actors.hero.abilities.huntress.spectralblades.short_desc=A Caçadora lança _Lâminas Espectrais_ em um alvo, causando dano dependendo da arma corpo a corpo que ela estiver usando.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Um falcão mágico, invocado pela Caçadora. Ele brilha com um azul etéreo intenso, e sua cabeça se move constantemente enquanto observa a área. Embora não seja um grande lutador, sua velocidade e visão o tornam excelente para reconhecimento e para distrair inimigos.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Esquivas garantidas restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turnos restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Seu falcão se prepara para atacar!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Seu falcão se move para essa posição.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Seu falcão se move para segui-lo.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Você pode encontrar esse personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.huntress.spirithawk$hawkally.name=falcão espiritual
actors.hero.abilities.huntress.spirithawk.desc=A Caçadora invoca um falcão espiritual familiar, que pode ser controlado usando a habilidade novamente enquanto estiver invocado. O falcão dura 100 turnos e controlá-lo não consome nenhuma carga. O falcão tem pouca vida e poder de ataque, mas é rápido, evasivo e preciso. Ele compartilha todo o seu campo de visão com a Caçadora o tempo todo. É imune a todos os efeitos de área, como fogo e gás venenoso. Ele não atacará a menos que seja especificamente comandado.
actors.hero.abilities.huntress.spirithawk.name=falcão espiritual
actors.hero.abilities.huntress.spirithawk.no_space=Não há vagas disponíveis perto de você.
actors.hero.abilities.huntress.spirithawk.short_desc=A Caçadora invoca um familiar _Falcão Espiritual_, que pode ajudá-la a explorar locais e distrair inimigos.
actors.hero.abilities.mage.elementalblast.desc=O Mago emite uma explosão mágica que cobre uma região circular de até 4 quadrados de distância e causa de 15 a 25 pontos de dano. O efeito específico da explosão elemental varia de acordo com a varinha imbuída no cajado do Mago.
actors.hero.abilities.mage.elementalblast.generic_desc=O efeito da explosão elemental será semelhante ao efeito da varinha quando lançada contra um inimigo ou aliado.
actors.hero.abilities.mage.elementalblast.name=explosão elemental
actors.hero.abilities.mage.elementalblast.no_staff=Você não pode usar essa habilidade sem a sua equipe.
actors.hero.abilities.mage.elementalblast.short_desc=O mago emite uma _Explosão Elemental_ de seu cajado, cobrindo uma grande área ao seu redor, com um efeito que varia de acordo com a varinha em seu cajado.
actors.hero.abilities.mage.warpbeacon.depths=Você não pode se teletransportar entre profundidades!
actors.hero.abilities.mage.warpbeacon.desc=O Mago coloca um farol, que pode ser usado para teletransportar-se à vontade. Colocar o farol leva 1 turno, mas o teletransporte até ele é instantâneo. O Mago não pode se teletransportar entre andares por padrão, nem usar o farol para alcançar locais inacessíveis, como salas trancadas. O Mago pode se teletransportar para dentro dos inimigos, empurrando-os para o lado.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Você não pode colocar um farol ali!
actors.hero.abilities.mage.warpbeacon.locked_floor=Você não pode sair de um andar trancado!
actors.hero.abilities.mage.warpbeacon.name=farol de dobra
actors.hero.abilities.mage.warpbeacon.short_desc=O Mago coloca um _Farol de Teletransporte_ em sua localização atual, para o qual ele pode se teletransportar instantaneamente de volta.
actors.hero.abilities.mage.warpbeacon.too_far=Esse lugar é muito longe!
actors.hero.abilities.mage.warpbeacon.window_cancel=cancelar
actors.hero.abilities.mage.warpbeacon.window_clear=farol claro
actors.hero.abilities.mage.warpbeacon.window_desc=Seu farol está atualmente localizado no andar %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teletransportar para o farol
actors.hero.abilities.mage.wildmagic.desc=O Mago libera o poder de suas varinhas, disparando-as aleatoriamente até 4 vezes em um único turno. O cajado do Mago não está incluído neste efeito. Cada varinha também tem seu nível aumentado em 2, até um máximo de +3. Esta habilidade usa metade da carga de uma varinha a cada disparo, e nenhuma varinha pode ser disparada mais de 2 vezes.
actors.hero.abilities.mage.wildmagic.name=magia selvagem
actors.hero.abilities.mage.wildmagic.no_wands=Você não tem varinhas para lançar raios!
actors.hero.abilities.mage.wildmagic.short_desc=O Mago libera a _Magia Selvagem_ contida em suas varinhas, disparando-as aleatoriamente várias vezes contra um alvo escolhido durante um único turno.
actors.hero.abilities.ratmogrify$transmograt.desc=Este inimigo foi transformado em um rato. Uma grande melhoria, na minha opinião! - Rei dos Ratos
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrificado %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Morto por: inimigo ratmogrificado
actors.hero.abilities.ratmogrify.cant_transform=Você não pode transformar isso em um rato!
actors.hero.abilities.ratmogrify.desc=O herói transforma um inimigo em um rato por 6 turnos! Chefes, aliados e ratos não podem ser transformados em ratos. Inimigos transformados em ratos mantêm seus atributos originais, mas não possuem habilidades.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=O herói transforma um inimigo em um rato! Isso o transforma temporariamente em um rato sem habilidades.
actors.hero.abilities.ratmogrify.too_strong=Esse inimigo é forte demais para ser transformado em ratmogrificado!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Este inimigo foi marcado, fazendo com que ele receba 25%% de dano bônus, mas também tornando-o incapaz de morrer até que a marca termine.\n\nTurnos restantes: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marcado para morrer
actors.hero.abilities.rogue.deathmark.ally_target=Você só pode marcar inimigos.
actors.hero.abilities.rogue.deathmark.desc=O Ladino marca um inimigo escolhido, fazendo com que ele receba 25% de dano extra. A marca é aplicada instantaneamente e dura 5 turnos. Inimigos marcados recebem dano bônus, mas não podem morrer até que a marca expire. Se um inimigo tiver 0 PV quando a marca terminar, ele morrerá imediatamente.
actors.hero.abilities.rogue.deathmark.name=marca da morte
actors.hero.abilities.rogue.deathmark.short_desc=O Ladino coloca uma _Marca da Morte_ em um inimigo escolhido. Inimigos marcados sofrem dano bônus, mas não podem morrer até que a marca termine.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Uma cópia do Ladino, feita de trevas sombrias. Permanece imóvel, com olhos vazios e minúsculos fios de escuridão emanando dele como vapor. O clone não é uma cópia perfeita do Ladino, mas ainda é um lutador decente e pode se beneficiar do equipamento do Ladino com os talentos certos.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Seu clone se move para atacar!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Seu clone se move para essa posição.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Seu clone se move para te seguir.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Você pode encontrar esse personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ladino das sombras
actors.hero.abilities.rogue.shadowclone.desc=O Ladino invoca um clone sombrio de si mesmo, que pode ser controlado para auxiliá-lo em combate. Controlar o clone sombrio não consome nenhuma carga. O clone possui 80 PV, não usa armadura e causa de 10 a 20 de dano. Todas essas características podem ser aprimoradas com talentos, de forma que o clone se beneficie das armas e armaduras que o herói possui.
actors.hero.abilities.rogue.shadowclone.name=clone das sombras
actors.hero.abilities.rogue.shadowclone.short_desc=O Ladino invoca um _Clone Sombrio_, que pode ser direcionado para auxiliá-lo em combate.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=De alguma forma, os inimigos são facilmente convencidos de que essa isca de madeira é o verdadeiro Rogue!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Você pode encontrar esse personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=isca de madeira
actors.hero.abilities.rogue.smokebomb.desc=O Ladino lança uma bomba de fumaça e se teletransporta até 6 quadrados de distância. Ele pode se teletransportar através de obstáculos e inimigos, mas não através de terreno sólido como paredes. Inimigos adjacentes à posição anterior do Ladino ficarão cegos por 5 turnos.
actors.hero.abilities.rogue.smokebomb.fov=Você só pode saltar para um local vazio em seu campo de visão.
actors.hero.abilities.rogue.smokebomb.name=bomba de fumaça
actors.hero.abilities.rogue.smokebomb.prompt=Escolha um local para onde deseja ir.
actors.hero.abilities.rogue.smokebomb.short_desc=O Ladino lança uma Bomba de Fumaça enquanto desaparece teleportando-se. Ele cega os inimigos próximos à sua posição anterior.
actors.hero.abilities.warrior.endure$enduretracker.desc=O Guerreiro agora causa dano bônus com base no dano que sofreu.\n\nDano Bônus: %1$d\nAcertos Restantes: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=resistência
actors.hero.abilities.warrior.endure.desc=O Guerreiro resiste por 3 turnos, recebendo metade do dano de todas as fontes. Essa redução é aplicada antes de efeitos de resistência a dano, como armadura. Após resistir, o próximo ataque do guerreiro dentro de 10 turnos recebe dano bônus. Esse dano bônus é igual à metade de todo o dano infligido a ele enquanto resistia, antes de quaisquer efeitos de redução de dano! Se o Guerreiro tiver algum combo, usar essa habilidade aumenta o tempo restante em 3 turnos.
actors.hero.abilities.warrior.endure.name=aguentar
actors.hero.abilities.warrior.endure.short_desc=O Guerreiro _Persiste_, pulando vários turnos, mas ganhando alta resistência a dano. Ele então causa dano bônus com base no que perseverou.
actors.hero.abilities.warrior.heroicleap.desc=O Guerreiro salta em direção a um local alvo, passando por cima de quaisquer inimigos ou obstáculos em seu caminho. No entanto, ele não pode saltar sobre muros ou outros terrenos firmes.
actors.hero.abilities.warrior.heroicleap.name=salto heroico
actors.hero.abilities.warrior.heroicleap.prompt=Escolha a direção do salto.
actors.hero.abilities.warrior.heroicleap.short_desc=O Guerreiro executa um Salto Heroico em direção a um local alvo, sobrevoando inimigos e obstáculos.
actors.hero.abilities.warrior.shockwave.desc=O Guerreiro golpeia o chão, produzindo uma onda de choque que se propaga por até 5 quadrados em um cone de 60 graus. Inimigos atingidos por essa onda de choque ficam incapacitados por 5 turnos. Eles também sofrem de 5 a 10 pontos de dano, mais 1 a 2 pontos de dano adicionais para cada ponto de força que o Guerreiro tiver acima de 10.
actors.hero.abilities.warrior.shockwave.name=onda de choque
actors.hero.abilities.warrior.shockwave.short_desc=O Guerreiro libera uma Onda de Choque em uma área de efeito cônica ao golpear o chão. Inimigos atingidos pela onda de choque sofrem dano e ficam incapacitados.
actors.hero.hero.key_distracted=Você não consegue abrir a fechadura, terá que continuar tentando.
actors.hero.hero.leave=Você ainda não pode sair, o resto da masmorra aguarda lá embaixo!
actors.hero.hero.level_cap=Você não pode ficar mais forte, mas suas experiências lhe dão uma onda de energia!
actors.hero.hero.level_up=Suba de nível!
actors.hero.hero.locked_chest=Este baú está trancado e você não tem a chave correspondente.
actors.hero.hero.locked_door=Você não possui uma chave correspondente.
actors.hero.hero.name=você
actors.hero.hero.new_level=Suba de nível! +Precisão, +Evasão, +5 PV!
actors.hero.hero.new_talent=+1 Ponto de Talento!
actors.hero.hero.noticed_smth=Você percebeu algo.
actors.hero.hero.pain_resist=A dor ajuda você a resistir à vontade de dormir.
actors.hero.hero.revive=A cruz ankh explode com energia vital!
actors.hero.hero.search=procurar
actors.hero.hero.search_distracted=É difícil se concentrar, a busca é exaustiva.
actors.hero.hero.unspent=Você tem pontos de talento não utilizados!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Você não pode carregar: %s.
actors.hero.hero.you_now_have=Você selecionou: %s.
actors.hero.heroclass.cleric=clérigo
actors.hero.heroclass.cleric_desc=O Clérigo começa com um tomo sagrado único, que pode usar para conjurar várias magias. A maioria dos talentos do Clérigo se concentra em aprender ou aprimorar magias. O Clérigo também começa com um porrete, armadura de tecido, um cantil e uma bolsa de veludo. O Clérigo identifica automaticamente: Pergaminhos de Identificação, Poções de Pureza e Pergaminhos de Remover Maldição.
actors.hero.heroclass.cleric_desc_short=O Clérigo é um conjurador divino que usa seu tomo sagrado único para canalizar magia divina. Ele pode aprender e aprimorar feitiços por meio de talentos.
actors.hero.heroclass.cleric_unlock=Para desbloquear o Clérigo, remova completamente a maldição de qualquer peça de equipamento amaldiçoada.
actors.hero.heroclass.duelist=duelista
actors.hero.heroclass.duelist_desc=O Duelista começa com um florete único com uma habilidade especial que recarrega com o tempo. Cada arma no jogo possui uma habilidade especial diferente que o Duelista pode usar. O Duelista também começa com dois espinhos de arremesso, armadura de tecido, um cantil e uma bolsa de veludo. O Duelista identifica automaticamente: Pergaminhos de Identificação, Poções de Força e Pergaminhos de Imagem Espelhada.
actors.hero.heroclass.duelist_desc_short=A Duelista é uma mestra em armas que pode usar sua arma para ativar uma habilidade especial. Essa habilidade especial é diferente para cada arma.
actors.hero.heroclass.duelist_unlock=Para desbloquear o Duelista, equipe uma arma de nível 2 ou superior sem penalidade de força.
actors.hero.heroclass.huntress=caçadora
actors.hero.heroclass.huntress_desc=A Caçadora começa com um arco espiritual único, que pode disparar um número infinito de flechas conjuradas. A Caçadora pode atravessar grama alta sem pisoteá-la. Ela também começa com luvas cravejadas, armadura de tecido, um cantil e uma bolsa de veludo. A Caçadora identifica automaticamente: Pergaminhos de Identificação, Poções de Visão Mental e Pergaminhos de Canção de Ninar.
actors.hero.heroclass.huntress_desc_short=A Caçadora é uma mestra em armas de arremesso e possui um arco mágico com flechas infinitas. Ela também consegue atravessar a grama alta sem pisoteá-la.
actors.hero.heroclass.huntress_unlock=Para desbloquear a Caçadora, acerte inimigos com armas de arremesso 10 vezes em uma partida.
actors.hero.heroclass.mage=mago
actors.hero.heroclass.mage_desc=O Mago começa com um cajado único, que recarrega significativamente mais rápido que uma varinha e possui uma carga a mais. O cajado pode ser imbuído com qualquer varinha que o Mago encontrar na masmorra. O Mago também começa com uma varinha de mísseis mágicos imbuída em seu cajado, armadura de tecido, um cantil e uma bolsa de veludo. O Mago identifica automaticamente: Pergaminhos de Identificação, Poções de Chama Líquida e Pergaminhos de Aprimoramento.
actors.hero.heroclass.mage_desc_short=O Mago é um especialista em magia arcana e carrega um cajado mágico mais poderoso que uma varinha. O cajado pode ser imbuído com qualquer varinha que o Mago encontrar.
actors.hero.heroclass.mage_unlock=Para desbloquear o Mago, use um pergaminho de aprimoramento para fortalecer um item.
actors.hero.heroclass.rogue=por conta própria
actors.hero.heroclass.rogue_desc=O Ladino começa com uma Capa das Sombras única, que ele pode usar para ficar invisível à vontade. O Ladino pode detectar segredos e armadilhas a uma distância maior. Ele também começa com uma adaga, três facas de arremesso, armadura de tecido, um cantil e uma bolsa de veludo. O Ladino identifica automaticamente: Pergaminhos de Identificação, Poções de Invisibilidade e Pergaminhos de Mapeamento Mágico.
actors.hero.heroclass.rogue_desc_short=O Ladino pode evadir-se dos inimigos e atacar invisível usando seu manto das sombras. Ele também detecta segredos e armadilhas a uma distância maior.
actors.hero.heroclass.rogue_unlock=Para desbloquear o Ladino, realize 10 ataques surpresa em uma única partida.
actors.hero.heroclass.warrior=guerreiro
actors.hero.heroclass.warrior_desc=O Guerreiro começa com um _selo quebrado único_ que lhe concede uma explosão de escudo quando sua saúde está abaixo da metade. O selo pode ser transferido entre armaduras e pode _transferir uma única melhoria_ com ele. O Guerreiro também começa com uma _espada curta gasta_, _três pedras de arremesso_, armadura de tecido, um cantil e uma bolsa de veludo. O Guerreiro identifica automaticamente: Pergaminhos de Identificação, Poções de Cura e Pergaminhos de Fúria.
actors.hero.heroclass.warrior_desc_short=O Guerreiro suporta dano extra com a proteção concedida pelo seu _selo quebrado_. O selo pode ser transferido entre armaduras e _transfere uma única melhoria_.
actors.hero.heroclass.warrior_unlock=O Guerreiro é desbloqueado automaticamente.
actors.hero.herosubclass.assassin=assassino
actors.hero.herosubclass.assassin_desc=O Assassino prepara seu próximo ataque quando fica invisível. Quanto mais tempo ele se preparar, mais poderoso será seu próximo ataque. A preparação pode durar até 9 turnos. Após se preparar, o Assassino causa dano bônus em seu próximo ataque, pode se teletransportar para o alvo e até mesmo eliminar instantaneamente inimigos que estejam fracos o suficiente.
actors.hero.herosubclass.assassin_short_desc=O _Assassino_ pode preparar um ataque mortal enquanto está invisível. Quanto mais tempo ele esperar, mais poderoso será o ataque.
actors.hero.herosubclass.battlemage=mago de batalha
actors.hero.herosubclass.battlemage_desc=O Mago de Batalha recebe um efeito bônus sempre que ataca em combate corpo a corpo com seu cajado, como se o cajado possuísse um encantamento adicional. Esses efeitos dependem da varinha que imbuí o cajado, sendo que cada varinha possui seu próprio efeito. Além dos efeitos da varinha, o cajado do Mago de Batalha também ganha 0,5 cargas ao ser usado em um ataque.
actors.hero.herosubclass.battlemage_short_desc=O _Mago de Batalha_ conjura efeitos bônus ao lutar em combate corpo a corpo com seu cajado. Esses efeitos dependem da varinha que imbuí seu cajado.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=O Berserker acumula fúria ao sofrer dano físico, incluindo dano bloqueado por sua armadura! A fúria diminui gradualmente com o tempo, mas diminui mais lentamente se ele estiver com pouca vida. A fúria pode fazer com que o Berserker cause até +50% de dano. Com a fúria máxima, ele pode entrar em frenesi, ganhando uma explosão de escudo e mantendo a fúria enquanto tiver escudo disponível. O escudo aumenta com o nível da armadura do Berserker e pode ser drasticamente aumentado se ele estiver com pouca vida. O Berserker precisa de tempo para se recuperar após entrar em frenesi.
actors.hero.herosubclass.berserker_short_desc=O Berserker acumula fúria ao sofrer dano. A fúria aumenta seu dano e pode ser ativada a 100% para conceder escudo adicional.
actors.hero.herosubclass.champion=campeão
actors.hero.herosubclass.champion_desc=A Campeã é uma mestra em armas de combate corpo a corpo que pode equipar uma arma secundária além da principal. Seus ataques normais usam sua arma principal, mas ela pode trocar de arma instantaneamente e usar a habilidade de qualquer uma das armas. Ela também ganha 2 cargas adicionais de habilidade de arma e +50% de velocidade de recarga de habilidade de arma.
actors.hero.herosubclass.champion_short_desc=A _Campeã_ pode empunhar duas armas e recebe mais cargas de arma. Seus ataques normais usam sua arma principal, mas ela pode trocar de arma e usar a habilidade de qualquer uma delas.
actors.hero.herosubclass.freerunner=corredor livre
actors.hero.herosubclass.freerunner_desc=Conforme o Corredor Livre se move, ele acumula impulso. Ele pode ganhar até 10 pontos de impulso após correr por 10 turnos, mas os perde rapidamente se parar de se mover. O Corredor Livre pode usar seu impulso para iniciar o parkour, por 2 turnos para cada ponto de impulso. Ao praticar parkour, o Corredor Livre se move com velocidade 2x maior e ganha evasão bônus proporcional ao seu nível. Após o término do parkour, há um período de espera antes que o impulso possa ser acumulado novamente.
actors.hero.herosubclass.freerunner_short_desc=O _Corredor Livre_ ganha impulso enquanto corre, o que pode ser usado para iniciar o parkour. Isso lhe concede bônus de velocidade e evasão por um curto período.
actors.hero.herosubclass.gladiator=gladiador
actors.hero.herosubclass.gladiator_desc=O Gladiador acumula um ponto de combo a cada ataque bem-sucedido com arma corpo a corpo ou de arremesso. Se o Gladiador não realizar um ataque bem-sucedido em 5 turnos (15 turnos após uma eliminação), seu combo é zerado. À medida que acumula combo, o Gladiador pode usar diversas habilidades com acerto garantido: Combo 2: empurra o inimigo para trás, preserva o combo; Combo 3: causa dano baseado na armadura; Combo 4: apara, preserva o combo; Combo 5: causa dano ao alvo e aos inimigos próximos; Combo 6: ataca uma vez para cada ponto de combo.
actors.hero.herosubclass.gladiator_short_desc=O Gladiador acumula combos ao realizar ataques bem-sucedidos. Ele pode gastar combos para usar habilidades únicas.
actors.hero.herosubclass.monk=monge
actors.hero.herosubclass.monk_desc=A Monja é uma mestra da técnica física. Ao derrotar inimigos, ela ganha energia que pode ser usada em diversas habilidades defensivas e utilitárias. Essa energia não se esgota com o tempo, mas possui um limite baseado no nível da Monja. ZXQPH0 ZXQ ZXQPH1 ZXQ1 Energia: ataque rápido com os punhos ZXQPH2 ZXQ2 Energia: concentre-se para esquivar do próximo ataque ZXQPH3 ZXQ3 Energia: avance instantaneamente para perto ZXQPH4 ZXQ4 Energia: chute um inimigo para longe ZXQPH5 ZXQ5 Energia: medite para remover efeitos negativos e restaurar a carga da varinha e do artefato
actors.hero.herosubclass.monk_short_desc=O _Monge_ acumula energia enquanto luta. Essa energia pode ser gasta em diversas habilidades únicas.
actors.hero.herosubclass.paladin=paladino
actors.hero.herosubclass.paladin_desc=O Paladino ganha uma variedade de feitiços novos e aprimorados que enfatizam o combate corpo a corpo e a sinergia com armas e armaduras. Os feitiços _Arma Sagrada_ e _Proteção Sagrada_ do Paladino concedem bônus maiores, não substituem mais encantamentos e glifos existentes e podem ser estendidos ao conjurar outros feitiços. O Paladino também ganha o feitiço _Golpe Divino_, que permite realizar um ataque corpo a corpo garantido com dano bônus e poder de encantamento.
actors.hero.herosubclass.paladin_short_desc=O _Paladino_ ganha novas magias de curto alcance e versões aprimoradas de arma sagrada e proteção sagrada.
actors.hero.herosubclass.priest=padre
actors.hero.herosubclass.priest_desc=O Sacerdote ganha uma variedade de feitiços novos e aprimorados que enfatizam o combate à distância e a sinergia com itens mágicos. O Sacerdote pode conjurar _Luz Guia_ gratuitamente uma vez a cada 50 turnos, iluminando inimigos diretamente alvejados por qualquer um de seus feitiços, e pode consumir o debuff de iluminação com aliados, varinhas e alguns artefatos para causar dano bônus igual ao seu nível + 5. O Sacerdote também ganha o feitiço _Radiância_, que dissipa a escuridão e afeta todos os inimigos visíveis, ativando e aplicando iluminação e atordoando-os brevemente ao custo de 2 cargas.
actors.hero.herosubclass.priest_short_desc=O _Sacerdote_ ganha novas magias de longo alcance e uma versão aprimorada da luz guia.
actors.hero.herosubclass.sniper=atirador de elite
actors.hero.herosubclass.sniper_desc=A Atiradora é uma mestra do combate à distância, cujos ataques perfuram a armadura inimiga. Quando ataca um inimigo com uma arma de arremesso, ela o marca com uma marca de atiradora, permitindo que ela execute um ataque especial com seu arco. Esse ataque especial varia de acordo com o nível de aprimoramento do arco. Um arco sem aprimoramentos dispara um tiro rápido que causa dano reduzido, mas é instantâneo. Um arco de velocidade dispara uma saraivada de três flechas que causam dano reduzido, ainda podem ativar encantamentos e levam 1 turno para disparar. Um arco de dano dispara um tiro de precisão que acerta o alvo com garantia, causa dano bônus com base na distância e leva 2 turnos para disparar.
actors.hero.herosubclass.sniper_short_desc=A _Atiradora_ consegue perfurar armaduras com seus ataques à distância. Após atacar com uma arma arremessada, ela pode realizar um ataque especial com seu arco.
actors.hero.herosubclass.warden=guarda
actors.hero.herosubclass.warden_desc=A Guardiã possui uma forte conexão com a natureza, o que lhe concede uma variedade de efeitos bônus relacionados à grama e às plantas. Ela consegue enxergar através da grama alta e sulcada como se fosse o vazio. A Guardiã faz com que a grama brote ao redor de qualquer semente que ela jogue ou plante, e ganha efeitos especiais ao pisar em plantas. Esses efeitos especiais substituem os efeitos normais das plantas, o que significa que nenhuma planta é prejudicial para ela pisar.
actors.hero.herosubclass.warden_short_desc=A _Guardiã_ consegue enxergar através da grama alta e ganha efeitos bônus ao plantar sementes e pisotear plantas.
actors.hero.herosubclass.warlock=bruxo
actors.hero.herosubclass.warlock_desc=O Bruxo tem uma chance de infligir uma marca de alma nos personagens quando usa varinhas neles. A chance de aplicar uma marca de alma e sua duração aumentam com o nível da varinha. Quando um inimigo é marcado pela alma, o Bruxo cura 2 pontos de vida para cada 5 pontos de dano que causar a ele, mas apenas com ataques de armas corpo a corpo ou de arremesso, não com varinhas!
actors.hero.herosubclass.warlock_short_desc=O _Bruxo_ tem uma chance de marcar a alma dos inimigos com suas varinhas. Ele se curará sempre que causar dano físico a inimigos marcados.
actors.hero.spells.auraofprotection$aurabuff.desc=O Paladino está irradiando energia protetora ao seu redor. Qualquer aliado próximo (incluindo o próprio Paladino) recebe dano reduzido e ganha o efeito do glifo de armadura do Paladino com poder aumentado. Turnos restantes:
actors.hero.spells.auraofprotection$aurabuff.name=aura de proteção
actors.hero.spells.auraofprotection.desc=O Paladino começa a irradiar energia protetora em uma aura brilhante ao seu redor por 20 turnos. Qualquer aliado a até 2 quadrados do Paladino (incluindo ele mesmo) recebe %1$d%% menos dano e ganha o efeito do glifo de armadura do Paladino com +%2$d%% de poder. Essa redução de dano ocorre antes de outros efeitos de redução de dano (por exemplo, armadura). O aumento de poder do glifo sempre será aplicado, mas esta magia não pode fazer com que o glifo do Paladino seja aplicado mais de uma vez se um personagem já estiver se beneficiando dele (por exemplo, o próprio Paladino ou uma imagem prismática).
actors.hero.spells.auraofprotection.name=aura de proteção
actors.hero.spells.auraofprotection.short_desc=Aumenta a defesa do Paladino e dos aliados próximos.
actors.hero.spells.beamingray$beamingrayboost.desc=Este aliado foi recentemente teleportado por Raio Radiante, concedendo-lhe dano bônus contra o inimigo mais próximo após o teleporte. Poder de Muitos também não expirará enquanto este efeito estiver ativo. \n\nTurnos Restantes: %s.
actors.hero.spells.beamingray$beamingrayboost.name=raio brilhante
actors.hero.spells.beamingray.desc=O Clérigo canaliza o poder de seu aliado em um raio de luz que o transporta para um local. Se o raio colidir com um inimigo, ele colocará o aliado próximo e o direcionará para o inimigo. O raio tem um alcance máximo de %1$d quadrados e aumentará o dano bônus de Poder de Muitos para +%2$d%% por 10 turnos contra o inimigo mais próximo em um raio de 4 quadrados. O raio de luz pode até teletransportar aliados normalmente imóveis, mas seu alcance é reduzido pela metade nesses casos.
actors.hero.spells.beamingray.name=raio brilhante
actors.hero.spells.beamingray.no_space=Não há espaço para seu aliado aparecer ali.
actors.hero.spells.beamingray.out_of_range=Essa localização está fora do alcance.
actors.hero.spells.beamingray.short_desc=Teletransporta seu aliado e concede dano bônus.
actors.hero.spells.blessspell.desc=O Clérigo lança uma bênção sagrada sobre si mesmo ou sobre outro personagem que possa ver. Quando lançada sobre si mesmo, o efeito é mais fraco, concedendo ZXQPH0 ZXQ turnos de bênção e ZXQPH1 ZXQ de barreira. Quando lançada sobre outros personagens, a magia é mais poderosa, concedendo ZXQPH2 ZXQ turnos de bênção e ZXQPH3 ZXQ de cura. O excesso de cura é convertido em barreira.
actors.hero.spells.blessspell.name=abençoar
actors.hero.spells.blessspell.short_desc=Abençoa e protege o clérigo, abençoa e cura os outros.
actors.hero.spells.bodyform$bodyformbuff.desc=A forma corporal de Trinity está atualmente concedendo a você o poder de um encantamento ou glifo, como se você o tivesse equipado em sua arma ou armadura atual. Observe que a forma corporal não pode fornecer outra cópia de um efeito do qual você já esteja se beneficiando. Efeito atual: %1$s. Turnos restantes: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=forma do corpo
actors.hero.spells.bodyform.desc=O Clérigo escolhe um encantamento ou glifo que identificou nesta rodada e imbuí Trindade com seu efeito. Quando Trindade é usada, o Clérigo ganha o efeito do encantamento ou glifo escolhido por ZXQPH0 turnos. Este encantamento ou glifo temporário funcionará com qualquer efeito que um encantamento ou glifo normal funcionaria. Esta magia substitui qualquer outro efeito corporal com o qual Trindade esteja atualmente imbuída.
actors.hero.spells.bodyform.name=forma do corpo
actors.hero.spells.bodyform.short_desc=Atribui Trinity a um encantamento ou glifo.
actors.hero.spells.cleanse.desc=O Clérigo remove todos os efeitos negativos de status de si mesmo e dos aliados visíveis. Após o término da magia, todos os personagens afetados também ganham %1$d turnos de imunidade a debuffs e uma barreira de %2$d.
actors.hero.spells.cleanse.name=limpar
actors.hero.spells.cleanse.short_desc=Remove efeitos negativos e concede proteção.
actors.hero.spells.clericspell.charge_cost=Custo da cobrança: %d
actors.hero.spells.clericspell.invalid_enemy=Você não pode selecionar esse inimigo como alvo.
actors.hero.spells.clericspell.invalid_target=Você não pode selecionar esse local como alvo.
actors.hero.spells.clericspell.no_target=Não há alvo ali.
actors.hero.spells.clericspell.prompt=Escolha um alvo
actors.hero.spells.divineintervention.desc=O Clérigo canaliza uma quantidade imensa de poder de seu tomo para si mesmo e para seus aliados, concedendo a todos um escudo de %1$d e estendendo a Forma Ascendida por %2$d turnos. O incrível poder defensivo desta magia é compensado por seu altíssimo custo de carga. Assim como outros escudos concedidos pela Forma Ascendida, este escudo não se dissipa normalmente, mas expira imediatamente ao término da Forma Ascendida.
actors.hero.spells.divineintervention.name=intervenção divina
actors.hero.spells.divineintervention.short_desc=Aumenta consideravelmente o escudo do clérigo e seus aliados.
actors.hero.spells.divinesense$divinesensetracker.desc=Este personagem é temporariamente capaz de ver outras criaturas próximas com a mente!\n\nTurnos restantes: %s.
actors.hero.spells.divinesense$divinesensetracker.name=sentido divino
actors.hero.spells.divinesense.desc=O Clérigo concentra seus sentidos no ambiente ao seu redor, ganhando visão mental com um alcance de %d quadrados por 50 turnos. Esta magia não leva tempo para ser conjurada.
actors.hero.spells.divinesense.name=sentido divino
actors.hero.spells.divinesense.short_desc=Obtenha visão mental temporária em um amplo espectro.
actors.hero.spells.flash.desc=O Clérigo canaliza sua forma ascendida em um local próximo e se teletransporta para lá. Flash pode teletransportar o Clérigo para qualquer local descoberto que esteja ao alcance e desocupado. Esta magia custa mais cargas de tomo a cada vez que é usada na mesma forma ascendida.
actors.hero.spells.flash.name=clarão
actors.hero.spells.flash.prompt=Escolha um local
actors.hero.spells.flash.short_desc=Teletransporte-se para um local próximo.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=O Sacerdote poderá conjurar Luz Guia gratuitamente novamente após 50 turnos.\n\nTurnos restantes: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Luz Guia
actors.hero.spells.guidinglight$illuminated.desc=Este personagem está brilhando por ter sido atingido por uma luz guia. Embora o brilho não seja forte o suficiente para iluminar a área ao redor, o efeito mágico tornará muito mais fácil para o Clérigo acertar golpes nele.
actors.hero.spells.guidinglight$illuminated.desc_generic=Outros heróis ainda podem usar a habilidade Iluminado para se beneficiarem do talento Luz Incandescente, mas não ganharão precisão.
actors.hero.spells.guidinglight$illuminated.desc_priest=O Sacerdote também pode consumir Iluminado com Radiância, um raio de varinha, um ataque de um aliado ou efeitos de alguns artefatos. Usar Iluminado dessa forma causará dano mágico adicional igual ao nível do Sacerdote + 5.
actors.hero.spells.guidinglight$illuminated.name=iluminado
actors.hero.spells.guidinglight.desc=O clérigo dispara um raio de energia mágica que atinge um alvo, causando de 2 a 8 pontos de dano e iluminando-o. O próximo ataque físico não sobrecarregado realizado contra um inimigo iluminado tem garantia de acerto.
actors.hero.spells.guidinglight.desc_priest=_Esta magia é mais poderosa quando conjurada pelo Sacerdote._ O primeiro uso da magia a cada 50 turnos não consome cargas de tomo, e a iluminação será consumida por radiância, varinhas, outros personagens e artefatos que afetam diretamente os inimigos. Quando iluminada é usada desta forma, causa dano mágico bônus igual ao nível do Sacerdote + 5.
actors.hero.spells.guidinglight.name=Luz Guia
actors.hero.spells.guidinglight.short_desc=Causa dano mágico à distância e garante um acerto.
actors.hero.spells.hallowedground$hallowedterrain.desc=Este solo foi consagrado. Solos consagrados reduzem a velocidade dos inimigos, curam aliados e fazem a grama se espalhar.
actors.hero.spells.hallowedground.desc=O Sacerdote concentra sua magia divina no solo próximo, criando uma área de terreno sagrado por 20 turnos. Ao ser conjurada, esta magia cura todos os aliados em 15 PV (aliados saudáveis e o Sacerdote recebem escudo), enraíza brevemente os inimigos e espalha grama baixa. O terreno sagrado cura os aliados em 1 PV por turno (aliados saudáveis e o Sacerdote recebem escudo), incapacita os inimigos e faz crescer grama alta aleatoriamente. O terreno sagrado é destruído pelo fogo e produzirá grama sulcada se os efeitos de regeneração passiva estiverem desativados ou se o Sacerdote não tiver ganhado experiência por um tempo.
actors.hero.spells.hallowedground.name=terra sagrada
actors.hero.spells.hallowedground.prompt=Escolha um local
actors.hero.spells.hallowedground.short_desc=Cura aliados, reduz a velocidade dos inimigos e espalha grama em uma área de efeito.
actors.hero.spells.holyintuition.cursed=Você sente uma magia malévola à espreita neste objeto.
actors.hero.spells.holyintuition.desc=O clérigo concentra seus sentidos em um objeto e determina se ele é amaldiçoado ou não, sem precisar equipá-lo.
actors.hero.spells.holyintuition.name=intuição sagrada
actors.hero.spells.holyintuition.prompt=escolha um item
actors.hero.spells.holyintuition.short_desc=Identifica se um item está amaldiçoado ou não.
actors.hero.spells.holyintuition.uncursed=Este item está livre de magia malévola.
actors.hero.spells.holylance$lancecooldown.desc=O Sacerdote lançou recentemente Lança Sagrada e deve esperar antes de lançá-la novamente.\n\nTurnos restantes: %s.
actors.hero.spells.holylance$lancecooldown.name=tempo de recarga da lança sagrada
actors.hero.spells.holylance.desc=O Sacerdote concentra uma grande quantidade de energia em uma lança de luz devastadora, arremessada. Esta lança causa dano de %1$d a %2$d e sempre causa dano máximo a alvos mortos-vivos e demoníacos. Este feitiço é muito caro e tem um tempo de recarga de 30 turnos.
actors.hero.spells.holylance.name=lança sagrada
actors.hero.spells.holylance.short_desc=Causa dano mágico pesado à distância.
actors.hero.spells.holyward$holyarmbuff.desc=O clérigo imbuíu sua armadura desgastada com energia sagrada, anulando temporariamente qualquer glifo existente e fazendo com que a armadura bloqueie 1 ponto de dano adicional.\n\nTurnos restantes: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=O Paladino imbuíu sua armadura desgastada com energia sagrada, fazendo com que a armadura bloqueie 3 pontos de dano adicionais. \n\nConjurar outras magias enquanto a proteção sagrada estiver ativa estenderá sua duração em 10 turnos por carga gasta. \n\nTurnos Restantes: %s.
actors.hero.spells.holyward$holyarmbuff.name=ala sagrada
actors.hero.spells.holyward.desc=O Clérigo imbuí sua armadura vestida com glifos de luz sagrada, aumentando o bloqueio de dano da armadura em 1. Esta magia não leva tempo para ser conjurada. Este glifo dura 50 turnos e substituirá qualquer glifo benéfico que a armadura possua durante esse período. O Clérigo se beneficiará deste efeito mesmo que não esteja usando armadura.
actors.hero.spells.holyward.desc_paladin=_Esta magia é mais poderosa quando conjurada pelo Paladino._ O bloqueio de dano adicional aumenta para 3, a magia não sobrescreve mais glifos existentes e conjurar outras magias enquanto a proteção sagrada estiver ativa estenderá sua duração em 10 turnos por carga usada.
actors.hero.spells.holyward.glyph_desc=Este glifo aumenta ligeiramente a quantidade de dano que a armadura pode bloquear.
actors.hero.spells.holyward.glyph_name=%s de luz
actors.hero.spells.holyward.name=ala sagrada
actors.hero.spells.holyward.short_desc=Substitui temporariamente os glifos para aumentar o bloqueio de armadura.
actors.hero.spells.holyweapon$holywepbuff.desc=O clérigo imbuíu sua arma equipada com energia sagrada, anulando temporariamente qualquer encantamento existente e fazendo com que a arma cause 2 de dano mágico extra em cada ataque.\n\nTurnos restantes: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=O Paladino imbuíu sua arma equipada com energia sagrada, fazendo com que seus ataques causem 6 de dano mágico adicional. \n\nConjurar outras magias enquanto a arma sagrada estiver ativa estenderá sua duração em 10 turnos por carga gasta. \n\nTurnos Restantes: %s.
actors.hero.spells.holyweapon$holywepbuff.name=arma sagrada
actors.hero.spells.holyweapon.desc=O clérigo encanta sua arma equipada com energia sagrada, fazendo com que ela cause 2 pontos de dano mágico adicionais sempre que atingir um inimigo com ela. Esta magia não leva tempo para ser conjurada. Este encantamento dura 50 turnos e substituirá qualquer outro encantamento benéfico que a arma possua durante esse período. Ataques desarmados também se beneficiam deste efeito.
actors.hero.spells.holyweapon.desc_paladin=_Esta magia é mais poderosa quando conjurada pelo Paladino._ O dano mágico adicional aumenta para 6, a magia não sobrescreve mais encantamentos existentes e conjurar outras magias enquanto Arma Sagrada estiver ativa estenderá sua duração em 10 turnos por carga usada.
actors.hero.spells.holyweapon.ench_desc=Inimigos atingidos por uma arma sagrada sofrerão dano mágico adicional.
actors.hero.spells.holyweapon.ench_name=santo %s
actors.hero.spells.holyweapon.name=arma sagrada
actors.hero.spells.holyweapon.short_desc=Substitui temporariamente os encantamentos para aumentar o dano.
actors.hero.spells.judgement.desc=O Clérigo golpeia o chão com o punho, causando uma erupção de luz que inflige dano a todos os inimigos à vista. Isso causa %1$d-%2$d de dano base, além de 33%% de dano adicional para cada magia que o Clérigo conjurou desde que assumiu a forma ascendida (ou desde a última vez que conjurou Julgamento). Atualmente, Julgamento causa %3$d-%4$d de dano.
actors.hero.spells.judgement.name=julgamento
actors.hero.spells.judgement.short_desc=Causa dano a todos os inimigos visíveis.
actors.hero.spells.layonhands.desc=O Paladino canaliza energia sagrada através de suas mãos, curando ou protegendo tudo o que toca. O Paladino pode conjurar esta magia em qualquer personagem adjacente para conceder-lhe cura, ou em si mesmo para obter proteção. O excesso de cura desta magia é convertido em proteção. Esta magia é conjurada instantaneamente e pode ser conjurada repetidamente, mas não pode conceder proteção equivalente a mais de três conjurações por vez.
actors.hero.spells.layonhands.name=imposição de mãos
actors.hero.spells.layonhands.short_desc=Cura instantaneamente um personagem adjacente ou concede um escudo ao Paladino.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=O Clérigo lançou recentemente Vínculo Vital neste aliado. Além dos benefícios normais de Vínculo Vital, este personagem também recebe dano reduzido, quaisquer magias positivas de Clérigo são aplicadas tanto ao Clérigo quanto a este aliado, em vez de apenas a um, e Poder de Muitos não expirará enquanto este bônus estiver ativo. Turnos restantes:
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=proteção de vínculo vital
actors.hero.spells.lifelinkspell.desc=O Clérigo fortalece o vínculo entre si e seu aliado fortalecido. Com esse vínculo fortalecido, qualquer dano recebido será compartilhado entre o herói e seu aliado por %1$d turnos, e o bônus defensivo de Poder de Muitos será aumentado para -%2$d%% de dano recebido. Observe que o dano é compartilhado após a armadura, mas antes da redução de dano de Poder de Muitos. Enquanto esse efeito estiver ativo, feitiços benéficos de Clérigo de nível 3 ou inferior serão aplicados tanto ao Clérigo quanto ao seu aliado, caso fossem aplicados apenas a um deles.
actors.hero.spells.lifelinkspell.name=ligação vital
actors.hero.spells.lifelinkspell.short_desc=Compartilha o dano com um aliado e reduz o dano recebido por ele.
actors.hero.spells.mindform.desc=O Clérigo escolhe uma varinha ou arma de arremesso que tenha identificado nesta rodada e imbuí Trindade com seu efeito. Quando Trindade é usada, o Clérigo pode fazer um único ataque como se estivesse usando o item escolhido com +ZXQPH0. Isso ativará todos os efeitos que o uso desse tipo de item normalmente ativaria. Esta magia substitui qualquer outro efeito mental com o qual Trindade esteja atualmente imbuída.
actors.hero.spells.mindform.name=forma mental
actors.hero.spells.mindform.short_desc=Atribui o poder Trinity a uma varinha ou arma de arremesso.
actors.hero.spells.mnemonicprayer.desc=O Sacerdote profere uma oração que estende a duração de todos os buffs ou debuffs em um alvo específico por %1$d turnos. Esta magia não leva tempo para ser conjurada. Efeitos positivos durarão mais tempo em aliados (incluindo o próprio Sacerdote), e efeitos negativos durarão mais tempo em inimigos. A Oração Mnemônica só pode estender uma instância específica de um buff ou debuff uma única vez e não pode estender buffs concedidos por habilidades de armadura.
actors.hero.spells.mnemonicprayer.name=oração mnemônica
actors.hero.spells.mnemonicprayer.short_desc=Prolonga os efeitos positivos/negativos de um aliado/inimigo e reaplica o efeito iluminado.
actors.hero.spells.radiance.desc=O Sacerdote irrompe em luz sagrada, atordoando todos os inimigos visíveis por 3 turnos. Se um inimigo já estiver iluminado, Radiância ativará o dano bônus de iluminação e, em seguida, aplicará o debuff de iluminado. Radiância também fará com que o Sacerdote brilhe por 100 turnos se o andar atual estiver escuro.
actors.hero.spells.radiance.name=radiância
actors.hero.spells.radiance.short_desc=Ilumina e atordoa brevemente os inimigos visíveis.
actors.hero.spells.recallinscription$useditemtracker.desc=O Clérigo usou recentemente um item que funciona com a magia de recordação inscrita. O Clérigo pode conjurar a magia para repetir o efeito do item.\n\nItem Usado: %1$s.\n\nTurnos Restantes: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=runa usada recentemente
actors.hero.spells.recallinscription.desc=O Clérigo usa magia sagrada para conjurar novamente o efeito de uma runa mágica encontrada em uma pedra rúnica ou pergaminho que ele usou nos últimos %s turnos. A Inscrição de Recuperação não pode ser usada para replicar pergaminhos de aprimoramento. O custo de carga desta magia varia de acordo com o item usado recentemente: 2 para uma pedra rúnica, 3 para um pergaminho e 4 para um pergaminho exótico. Esse custo de carga também é dobrado ao replicar um pergaminho de transmutação ou itens de alquimia que precisam ser criados usando transmutação ou aprimoramento.
actors.hero.spells.recallinscription.name=inscrição de recordação
actors.hero.spells.recallinscription.short_desc=Repete uma runa ou pergaminho usado recentemente.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Um fino escudo de luz separa este personagem de um inimigo. Não é forte o suficiente para bloquear ataques completamente, mas irá enfraquecê-los. \n\nTurnos restantes: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=escudo de luz
actors.hero.spells.shieldoflight.desc=O Clérigo cria uma fina barreira de luz entre si e um inimigo, aumentando o poder de bloqueio de sua armadura contra esse inimigo em %1$d-%2$d por 5 turnos.\n\nEsta magia não leva tempo para ser conjurada, mas não pode ser usada contra múltiplos alvos simultaneamente.
actors.hero.spells.shieldoflight.name=escudo de luz
actors.hero.spells.shieldoflight.short_desc=Concede proteção temporária contra um alvo.
actors.hero.spells.smite.desc=O Paladino infunde um golpe corpo a corpo com poder destrutivo justo. Além de causar dano corpo a corpo normal, Golpe Divino garante acerto em ataques sem sobrecarga, possui +300 de poder de encantamento e causa dano mágico bônus de ZXQPH1 a ZXQPH2. O dano mágico bônus de Golpe Divino escala com o nível do Paladino e sempre causará o máximo de dano mágico bônus contra inimigos mortos-vivos ou demoníacos.
actors.hero.spells.smite.name=golpe
actors.hero.spells.smite.short_desc=Garante um acerto com dano bônus e poder de encantamento.
actors.hero.spells.spiritform$spiritformbuff.desc=A forma espiritual de Trinity está atualmente concedendo a você o poder de um item, como se você o tivesse equipado. Observe que a forma espiritual não pode fornecer outra cópia de um efeito do qual você já esteja se beneficiando. Efeito atual: %1$s. Turnos restantes: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=forma espiritual
actors.hero.spells.spiritform.desc=O Clérigo escolhe um anel ou artefato que tenha identificado nesta rodada (exceto o tomo sagrado) e imbuí Trindade com seu efeito. Se um anel for escolhido, Trindade concede o efeito desse anel com um bônus de +%1$d por 20 turnos. Se um artefato for escolhido, Trindade replica o efeito desse artefato com um bônus de +%2$d. Cada artefato possui comportamentos específicos e custos de carga de armadura diferentes quando usado com Trindade. Esta magia substitui qualquer outro efeito espiritual com o qual Trindade esteja atualmente imbuída.
actors.hero.spells.spiritform.name=forma espiritual
actors.hero.spells.spiritform.short_desc=Atribui o efeito Trindade a um anel ou artefato.
actors.hero.spells.stasis$stasisbuff.desc=O Clérigo tem atualmente um aliado em estase. Todos os efeitos positivos sobre este aliado são preservados, incluindo Poder de Muitos, e ele reaparecerá ao lado do Clérigo quando o efeito terminar. O efeito também pode ser encerrado antecipadamente conjurando Estase novamente. \n\n Aliado em estase: %1$s.\n Turnos restantes: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Seu aliado imóvel ficou para trás.
actors.hero.spells.stasis$stasisbuff.name=aliado em estase
actors.hero.spells.stasis.desc=O Clérigo concentra sua conexão com o aliado em si mesmo, fazendo com que o aliado fique temporariamente em uma espécie de estase energética dentro do Clérigo. O aliado será preservado por até %d turnos, com todos os efeitos positivos sobre ele permanecendo inalterados durante o tempo em estase. O aliado aparecerá ao lado do Clérigo quando a estase terminar naturalmente, ou poderá conjurar a magia novamente instantaneamente, sem custo, para encerrar o efeito antecipadamente. A estase pode até mesmo mover aliados imóveis, mas não pode transferi-los entre andares.
actors.hero.spells.stasis.name=estase
actors.hero.spells.stasis.short_desc=Remove um aliado da masmorra e o preserva.
actors.hero.spells.sunray.desc=O Clérigo dispara um raio de luz ofuscante em um alvo, causando dano de %1$d a %2$d e cegando-o por %3$d turnos. Raio Solar sempre causa dano máximo a alvos mortos-vivos e demoníacos. Após ser atingido por esta magia, a visão do inimigo se ajustará, impedindo que ele seja cegado novamente. No entanto, se ele for atingido novamente enquanto estiver cego por esta magia, a luz será tão intensa que o paralisará.
actors.hero.spells.sunray.name=raio de sol
actors.hero.spells.sunray.short_desc=Causa dano mágico à distância e cega o alvo uma vez.
actors.hero.spells.walloflight$lightwall.desc=Painéis de luz cintilantes bloqueiam a passagem aqui.
actors.hero.spells.walloflight.desc=O Paladino cria uma parede feita de painéis de luz sólida diretamente à sua frente, com 1 bloco de espessura, %1$d blocos de largura e duração de 20 turnos. Essa parede funciona como uma parede normal, exceto pelo fato de ser possível enxergar através dela. Inimigos presos na parede durante sua criação serão momentaneamente atordoados e repelidos, se possível. Qualquer criatura presa na parede poderá se mover para fora dela. A parede pode ser conjurada em qualquer uma das quatro direções cardinais ou nas quatro diagonais. Se uma parede já estiver ativa, a magia pode ser reutilizada gratuitamente para removê-la instantaneamente.
actors.hero.spells.walloflight.early_end=Você dissipa a barreira de luz.
actors.hero.spells.walloflight.name=parede de luz
actors.hero.spells.walloflight.short_desc=Cria uma parede que bloqueia os inimigos.
actors.hero.talent$aggressivebarriercooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$aggressivebarriercooldown.name=tempo de recarga da barreira agressiva
actors.hero.talent$combinedlethalityabilitytracker.executed=executado
actors.hero.talent$deadlyfollowuptracker.desc=A Duelista atacou recentemente um inimigo com uma arma de arremesso; seus ataques corpo a corpo contra o mesmo alvo terão dano aumentado. \n\nTurnos restantes: %s.
actors.hero.talent$deadlyfollowuptracker.name=acompanhamento mortal
actors.hero.talent$followupstriketracker.desc=A Caçadora atacou recentemente um inimigo com uma arma de arremesso; seu próximo ataque corpo a corpo contra o mesmo alvo terá dano aumentado.\n\nTurnos restantes: %s.
actors.hero.talent$followupstriketracker.name=ataque de acompanhamento
actors.hero.talent$improvisedprojectilecooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$improvisedprojectilecooldown.name=tempo de recarga de projéteis improvisados
actors.hero.talent$lethalhastecooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$lethalhastecooldown.name=tempo de recarga de aceleração letal
actors.hero.talent$lingeringmagictracker.desc=O mago usou recentemente um cajado ou varinha; seu próximo ataque físico causará dano bônus.\n\nTurnos restantes: %s.
actors.hero.talent$lingeringmagictracker.name=magia persistente
actors.hero.talent$liquidagilacctracker.desc=O próximo ataque corpo a corpo normal do Duelista ganhará precisão bônus.\n\nTurnos restantes: %s.
actors.hero.talent$liquidagilacctracker.name=agilidade líquida
actors.hero.talent$patientstriketracker.desc=A Duelista acabou de gastar um turno esperando; seu próximo ataque corpo a corpo causará dano bônus.
actors.hero.talent$patientstriketracker.name=greve de pacientes
actors.hero.talent$preciseassaulttracker.desc=O próximo ataque corpo a corpo normal do Duelista ganhará precisão bônus.\n\nTurnos restantes: %s.
actors.hero.talent$preciseassaulttracker.name=ataque preciso
actors.hero.talent$provokedangertracker.desc=O Guerreiro perdeu recentemente seu escudo, seu próximo ataque físico causará dano bônus.\n\nTurnos restantes: %s.
actors.hero.talent$provokedangertracker.name=provocou raiva
actors.hero.talent$rejuvenatingstepscooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=passos rejuvenescedores relaxamento
actors.hero.talent$satiatedspellstracker.desc=A próxima magia que o clérigo conjurar lhe concederá uma pequena quantidade de proteção.
actors.hero.talent$satiatedspellstracker.name=Feitiço de Proteção
actors.hero.talent$searinglightcooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$searinglightcooldown.name=Luz escaldante
actors.hero.talent$seershotcooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$seershotcooldown.name=tempo de recarga do tiro do vidente
actors.hero.talent$swiftequipcooldown.desc=Você usou este talento recentemente e deve esperar antes de usá-lo novamente.\n\nTurnos restantes: %s.
actors.hero.talent$swiftequipcooldown.name=tempo de recarga de equipamento rápido
actors.hero.talent.adventurers_intuition.desc=_+1:_ A Duelista identifica armas _2,5 vezes mais rápido_ e armaduras _1,75 vezes mais rápido_.\n\n_+2:_ A Duelista identifica armas _quando as equipa_ e armaduras _2,5 vezes mais rápido_.
actors.hero.talent.adventurers_intuition.title=intuição do aventureiro
actors.hero.talent.aggressive_barrier.desc=_+1:_ A Duelista ganha _3 de escudo_ quando usa uma habilidade de arma e está com 50% de vida ou menos.\n\n_+2:_ A Duelista ganha _5 de escudo_ quando usa uma habilidade de arma e está com 50% de vida ou menos.
actors.hero.talent.aggressive_barrier.meta_desc=_Se este talento for adquirido por um herói diferente_, ele concederá escudo ao realizar um ataque corpo a corpo com pouca vida, com um tempo de recarga de 50 turnos.
actors.hero.talent.aggressive_barrier.title=barreira agressiva
actors.hero.talent.ally_warp.desc=_+1:_ O Mago pode selecionar um aliado para trocar de lugar instantaneamente com ele, com um alcance de _2 espaços_.\n\n_+2:_ O Mago pode selecionar um aliado para trocar de lugar instantaneamente com ele, com um alcance de _4 espaços_.\n\n_+3:_ O Mago pode selecionar um aliado para trocar de lugar instantaneamente com ele, com um alcance de _6 espaços_.\n\nO Mago não pode trocar de lugar com aliados imóveis.
actors.hero.talent.ally_warp.title=dobra de aliado
actors.hero.talent.arcane_vision.desc=_+1:_ Quando o Mago atinge um inimigo com um raio, ele ganha visão mental sobre ele por _10 turnos_.\n\n_+2:_ Quando o Mago atinge um inimigo com um raio, ele ganha visão mental sobre ele por _15 turnos_.
actors.hero.talent.arcane_vision.title=visão arcana
actors.hero.talent.assassins_reach.desc=_+1:_ O alcance do teleporte do Assassino por nível de preparação é aumentado para _1/3/4/6 quadrados_, de 1/2/3/4.\n\n_+2:_ O alcance do teleporte do Assassino por nível de preparação é aumentado para _2/4/6/8 quadrados_, de 1/2/3/4.\n\n_+3:_ O alcance do teleporte do Assassino por nível de preparação é aumentado para _2/5/7/10 quadrados_, de 1/2/3/4.\n\nEste teleporte pode atravessar obstáculos e inimigos, mas não terrenos sólidos como paredes.
actors.hero.talent.assassins_reach.title=alcance do assassino
actors.hero.talent.aura_of_protection.desc=+1: O Paladino pode conjurar _Aura de Proteção_, uma magia que concede ao Paladino e a todos os aliados em um raio de 2 quadrados _20% de resistência a dano_ e o efeito do glifo de armadura do Paladino com _+50% de poder_ por 20 turnos, ao custo de 2 cargas. +2: O Paladino pode conjurar _Aura de Proteção_, uma magia que concede ao Paladino e a todos os aliados em um raio de 2 quadrados _30% de resistência a dano_ e o efeito do glifo de armadura do Paladino com _+75% de poder_ por 20 turnos, ao custo de 2 cargas. +3: O Paladino pode conjurar _Aura de Proteção_, uma magia que concede ao Paladino e a todos os aliados em um raio de 2 quadrados _40% de resistência a dano_ e o efeito do glifo de armadura do Paladino com _+100% de poder_ Potência por 20 turnos, ao custo de 2 cargas.
actors.hero.talent.aura_of_protection.title=aura de proteção
actors.hero.talent.backup_barrier.desc=_+1:_ O Mago ganha _3 de escudo_ sempre que gasta a última carga em seu cajado.\n\n_+2:_ O Mago ganha _5 de escudo_ sempre que gasta a última carga em seu cajado.
actors.hero.talent.backup_barrier.meta_desc=_Se esse talento for adquirido por um herói diferente_, ele será ativado pela varinha de nível mais alto desse herói.
actors.hero.talent.backup_barrier.title=barreira de segurança
actors.hero.talent.barkskin.desc=_+1:_ Ao pisar na grama, o Guardião ganha _0-50% do seu nível_ em armadura de pele de árvore, que desaparece a cada turno.\n\n_+2:_ Ao pisar na grama, o Guardião ganha _0-100% do seu nível_ em armadura de pele de árvore, que desaparece a cada turno.\n\n_+3:_ Ao pisar na grama, o Guardião ganha _0-150% do seu nível_ em armadura de pele de árvore, que desaparece a cada turno.
actors.hero.talent.barkskin.title=casca
actors.hero.talent.beaming_ray.desc=O Clérigo pode conjurar _Raio Radiante_ a partir de um aliado fortalecido ao custo de 1 carga. Este raio atravessa paredes e teletransporta o aliado para um local alvo. Se houver um inimigo nesse local, o aliado aparece ao lado do inimigo e o ataca. O Raio Radiante pode até teletransportar aliados normalmente imóveis, mas tem metade do alcance ao fazê-lo. \n\n_+1: O Raio Radiante tem um alcance máximo de 4 quadrados e aumenta o bônus de Poder de Muitos para +35% de dano contra o inimigo mais próximo por 10 turnos. \n\n_+2: O Raio Radiante tem um alcance máximo de 8 quadrados e aumenta o bônus de Poder de Muitos para +40% de dano contra o inimigo mais próximo por 10 turnos. \n\n_+3: O Raio Radiante tem um alcance máximo de 12 quadrados e aumenta o bônus de Poder de Muitos para +45% de dano contra o inimigo mais próximo por 10 turnos. \n\n_+4: O Raio Radiante tem um alcance máximo de 16 quadrados. ladrilhos,_ e aumenta o bônus de Poder de Muitos para _+50% de dano_ contra o inimigo mais próximo por 10 turnos.
actors.hero.talent.beaming_ray.title=raio brilhante
actors.hero.talent.blast_radius.desc=_+1:_ O raio da explosão elemental é aumentado para _5 quadrados_, de 4.\n\n_+2:_ O raio da explosão elemental é aumentado para _6 quadrados_, de 4.\n\n_+3:_ O raio da explosão elemental é aumentado para _7 quadrados_, de 4.\n\n_+4:_ O raio da explosão elemental é aumentado para _8 quadrados_, de 4.
actors.hero.talent.blast_radius.title=raio da explosão
actors.hero.talent.bless.desc=+1: O Clérigo pode conjurar Bênção, uma magia que concede 6 turnos de bênção e 10 de proteção quando conjurada em si mesmo ou 10 turnos de bênção e 10 de cura quando conjurada em outro personagem, ao custo de 1 carga. +2: O Clérigo pode conjurar Bênção, uma magia que concede 10 turnos de bênção e 15 de proteção quando conjurada em si mesmo ou 15 turnos de bênção e 15 de cura quando conjurada em outro personagem, ao custo de 1 carga. O excesso de cura desta magia é convertido em proteção.
actors.hero.talent.bless.meta_desc=_Se este talento for adquirido por um herói diferente_, ele aumentará a precisão e a evasão do herói e de todos os aliados em 3% no nível +1 ou em 5% no nível +2.
actors.hero.talent.bless.title=abençoar
actors.hero.talent.body_form.desc=O Clérigo pode conjurar _Forma Corporal_, que imbuirá Trinity com o poder de um encantamento ou glifo que o Clérigo tenha identificado nesta rodada, ao custo de 2 cargas. _+1:_ Quando Trinity é usada, o Clérigo ganha o efeito escolhido por _20 turnos._ _+2:_ Quando Trinity é usada, o Clérigo ganha o efeito escolhido por _27 turnos._ _+3:_ Quando Trinity é usada, o Clérigo ganha o efeito escolhido por _33 turnos._ _+4:_ Quando Trinity é usada, o Clérigo ganha o efeito escolhido por _40 turnos._ _Trinity só pode ser imbuída com um efeito corporal por vez. O custo de carga da armadura Trinity é maior se o glifo escolhido for raro e poderoso.
actors.hero.talent.body_form.title=forma do corpo
actors.hero.talent.body_replacement.desc=_+1:_ Após piscar, o Ladino deixa para trás uma isca de madeira com _20 de vida e 1-3 de armadura_.\n\n_+2:_ Após piscar, o Ladino deixa para trás uma isca de madeira com _40 de vida e 2-6 de armadura_.\n\n_+3:_ Após piscar, o Ladino deixa para trás uma isca de madeira com _60 de vida e 3-9 de armadura_.\n\n_+4:_ Após piscar, o Ladino deixa para trás uma isca de madeira com _80 de vida e 4-12 de armadura_.\n\n Apenas uma isca pode estar ativa por vez.
actors.hero.talent.body_replacement.title=substituição de corpo
actors.hero.talent.body_slam.desc=_+1:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes sofrem dano igual a _1-4 mais 25%_ do seu poder de bloqueio de dano.\n\n_+2:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes sofrem dano igual a _2-8 mais 50%_ do seu poder de bloqueio de dano.\n\n_+3:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes sofrem dano igual a _3-12 mais 75%_ do seu poder de bloqueio de dano.\n\n_+4:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes sofrem dano igual a _4-16 mais 100%_ do seu poder de bloqueio de dano.
actors.hero.talent.body_slam.title=golpe de corpo
actors.hero.talent.bounty_hunter.desc=_+1:_ Quando o Assassino mata um inimigo com um golpe preparado, sua chance de obter um item aumenta em _2/4/8/16%_, por nível de preparação.\n\n_+2:_ Quando o Assassino mata um inimigo com um golpe preparado, sua chance de obter um item aumenta em _4/8/16/32%_, por nível de preparação.\n\n_+3:_ Quando o Assassino mata um inimigo com um golpe preparado, sua chance de obter um item aumenta em _6/12/24/48%_, por nível de preparação.
actors.hero.talent.bounty_hunter.title=caçador de recompensas
actors.hero.talent.cached_rations.desc=+1: O Ladino pode encontrar 2 rações de suprimentos em baús enquanto explora os próximos andares da masmorra. +2: O Ladino pode encontrar 3 rações de suprimentos em baús enquanto explora os próximos andares da masmorra. As rações de suprimentos são consumidas rapidamente, restauram uma quantidade moderada de saciedade, curam 5 PV e restauram 1 carga para a capa das sombras.
actors.hero.talent.cached_rations.title=rações armazenadas
actors.hero.talent.cleanse.desc=+1: O Clérigo pode conjurar Purificar, uma magia que remove efeitos negativos do Clérigo e de quaisquer aliados próximos, e concede a eles 10 de escudo, ao custo de 2 cargas. +2: O Clérigo pode conjurar Purificar, uma magia que concede 3 turnos de imunidade a efeitos negativos ao Clérigo e a quaisquer aliados próximos, e concede a eles 20 de escudo, ao custo de 2 cargas. +3: O Clérigo pode conjurar Purificar, uma magia que concede 5 turnos de imunidade a efeitos negativos ao Clérigo e a quaisquer aliados próximos, e concede a eles 30 de escudo, ao custo de 2 cargas.
actors.hero.talent.cleanse.meta_desc=_Se este talento for adquirido por um herói diferente_, ele removerá os efeitos negativos do herói após o uso de uma varinha ou artefato, em 10/20/30% das vezes com +1/+2/+3.
actors.hero.talent.cleanse.title=limpar
actors.hero.talent.cleave.desc=_+1:_ O tempo extra que o Gladiador tem para matar um inimigo é aumentado para _30 turnos_, de 15.\n\n_+2:_ O tempo extra que o Gladiador tem para matar um inimigo é aumentado para _45 turnos_, de 15.\n\n_+3:_ O tempo extra que o Gladiador tem para matar um inimigo é aumentado para _60 turnos_, de 15.
actors.hero.talent.cleave.title=clivar
actors.hero.talent.cloned_armor.desc=+1: O clone das sombras ganha 12% do valor da armadura do herói e tem 25% de chance de usar o glifo na armadura do herói. +2: O clone das sombras ganha 24% do valor da armadura do herói e tem 50% de chance de usar o glifo na armadura do herói. +3: O clone das sombras ganha 36% do valor da armadura do herói e tem 75% de chance de usar o glifo na armadura do herói. +4: O clone das sombras ganha 48% do valor da armadura do herói e tem 100% de chance de usar o glifo na armadura do herói.
actors.hero.talent.cloned_armor.title=armadura clonada
actors.hero.talent.close_the_gap.desc=_+1:_ O Duelista se teletransporta _até dois quadrados_ em direção ao seu alvo ao iniciar um duelo.\n\n_+2:_ O Duelista se teletransporta _até três quadrados_ em direção ao seu alvo ao iniciar um duelo.\n\n_+3:_ O Duelista se teletransporta _até quatro quadrados_ em direção ao seu alvo ao iniciar um duelo.\n\n_+4:_ O Duelista se teletransporta _até cinco quadrados_ em direção ao seu alvo ao iniciar um duelo.\n\n Este teletransporte pode atravessar obstáculos e inimigos, mas não terreno sólido como paredes. O teletransporte é levado em consideração ao determinar se um inimigo está ao alcance para ser desafiado.
actors.hero.talent.close_the_gap.title=fechar a lacuna
actors.hero.talent.combined_energy.desc=_+1:_ Se o Monge usar uma habilidade de arma e uma habilidade de _4+ de energia_ dentro de um intervalo de 5 turnos, ele recupera 1 ponto de energia gasto.\n\n_+2:_ Se o Monge usar uma habilidade de arma e uma habilidade de _3+ de energia_ dentro de um intervalo de 5 turnos, ele recupera 1 ponto de energia gasto.\n\n_+3:_ Se o Monge usar uma habilidade de arma e uma habilidade de _2+ de energia_ dentro de um intervalo de 5 turnos, ele recupera 1 ponto de energia gasto.
actors.hero.talent.combined_energy.title=energia combinada
actors.hero.talent.combined_lethality.desc=+1: Se o Campeão atacar com uma arma corpo a corpo imediatamente após usar a habilidade de outra arma, esse ataque executará qualquer inimigo que não seja chefe e que esteja com menos de 13% de HP. +2: Se o Campeão atacar com uma arma corpo a corpo imediatamente após usar a habilidade de outra arma, esse ataque executará qualquer inimigo que não seja chefe e que esteja com menos de 27% de HP. +3: Se o Campeão atacar com uma arma corpo a corpo imediatamente após usar a habilidade de outra arma, esse ataque executará qualquer inimigo que não seja chefe e que esteja com menos de 40% de HP. Este ataque pode ser um ataque corpo a corpo normal ou parte de uma habilidade de arma.
actors.hero.talent.combined_lethality.title=letalidade combinada
actors.hero.talent.conserved_magic.desc=_+1:_ Cada raio de magia selvagem agora usa _0,33 cargas_ em vez de 0,5, e a magia selvagem tem _25% de chance_ de não gastar um turno.\n\n_+2:_ Cada raio de magia selvagem agora usa _0,225 cargas_ em vez de 0,5, e a magia selvagem tem _50% de chance_ de não gastar um turno.\n\n_+3:_ Cada raio de magia selvagem agora usa _0,15 cargas_ em vez de 0,5, e a magia selvagem tem _75% de chance_ de não gastar um turno.\n\n_+4:_ Cada raio de magia selvagem agora usa _0,1 cargas_ em vez de 0,5, e a magia selvagem tem _100% de chance_ de não gastar um turno.
actors.hero.talent.conserved_magic.title=magia conservada
actors.hero.talent.counter_ability.desc=+1: Se a Duelista usar uma habilidade de arma dentro de 3 turnos após seu efeito residual ser atacado, ela recuperará instantaneamente 0,38 cargas. +2: Se a Duelista usar uma habilidade de arma dentro de 3 turnos após seu efeito residual ser atacado, ela recuperará instantaneamente 0,77 cargas. +3: Se a Duelista usar uma habilidade de arma dentro de 3 turnos após seu efeito residual ser atacado, ela recuperará instantaneamente 1,13 cargas. +4: Se a Duelista usar uma habilidade de arma dentro de 3 turnos após seu efeito residual ser atacado, ela recuperará instantaneamente 1,5 cargas.
actors.hero.talent.counter_ability.title=habilidade de contra-ataque
actors.hero.talent.deadly_followup.desc=_+1:_ Quando a Duelista acerta um inimigo com uma arma de arremesso, ela causará _10% a mais de dano corpo a corpo_ a ele por 5 turnos.\n\n_+2:_ Quando a Duelista acerta um inimigo com uma arma de arremesso, ela causará _20% a mais de dano corpo a corpo_ a ele por 5 turnos.\n\n_+3:_ Quando a Duelista acerta um inimigo com uma arma de arremesso, ela causará _30% a mais de dano corpo a corpo_ a ele por 5 turnos.
actors.hero.talent.deadly_followup.title=acompanhamento mortal
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk é ativado automaticamente se o Berserker estiver prestes a morrer e a fúria estiver em 100% ou mais, mas tem um tempo de recarga de _3 níveis de herói_ quando isso acontece.\n\n_+2:_ Berserk é ativado automaticamente se o Berserker estiver prestes a morrer e a fúria estiver em 100% ou mais, mas tem um tempo de recarga de _2 níveis de herói_ quando isso acontece.\n\n_+3:_ Berserk é ativado automaticamente se o Berserker estiver prestes a morrer e a fúria estiver em 100% ou mais, mas tem um tempo de recarga de _1 nível de herói_ quando isso acontece.\n\nObserve que o Berserker ainda morrerá se tiver 0 PV quando o estado de berserk terminar.
actors.hero.talent.deathless_fury.title=fúria imortal
actors.hero.talent.deathly_durability.desc=_+1:_ Inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _13%_ dos seus pontos de vida no momento em que estavam marcados.\n\n_+2:_ Inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _25%_ dos seus pontos de vida no momento em que estavam marcados.\n\n_+3:_ Inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _38%_ dos seus pontos de vida no momento em que estavam marcados.\n\n_+4:_ Inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _50%_ dos seus pontos de vida no momento em que estavam marcados.
actors.hero.talent.deathly_durability.title=durabilidade mortal
actors.hero.talent.desperate_power.desc=_+1:_ As varinhas e o cajado do Mago ganham _+1 nível_ em seu último ataque quando estiverem com a última carga.\n\n_+2:_ As varinhas e o cajado do Mago ganham _+2 níveis_ em seu último ataque quando estiverem com a última carga.\n\n_+3:_ As varinhas e o cajado do Mago ganham _+3 níveis_ em seu último ataque quando estiverem com a última carga.
actors.hero.talent.desperate_power.title=poder desesperado
actors.hero.talent.directed_power.desc=+1: O ataque direto do Golpe Elemental ganha +30% de poder de encantamento para cada inimigo no alcance do efeito do Golpe Elemental, incluindo o alvo do ataque. +2: O ataque direto do Golpe Elemental ganha +60% de poder de encantamento para cada inimigo no alcance do efeito do Golpe Elemental, incluindo o alvo do ataque. +3: O ataque direto do Golpe Elemental ganha +90% de poder de encantamento para cada inimigo no alcance do efeito do Golpe Elemental, incluindo o alvo do ataque. +4: O ataque direto do Golpe Elemental ganha +120% de poder de encantamento para cada inimigo no alcance do efeito do Golpe Elemental, incluindo o alvo do ataque.
actors.hero.talent.directed_power.title=potência direcionada
actors.hero.talent.divine_intervention.desc=+1: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Intervenção Divina, que aumenta a proteção do Clérigo e de todos os aliados em até 150 e estende a Forma Ascendida por 3 turnos. +2: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Intervenção Divina, que aumenta a proteção do Clérigo e de todos os aliados em até 200 e estende a Forma Ascendida por 4 turnos. +3: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Intervenção Divina, que aumenta a proteção do Clérigo e de todos os aliados em até 250 e estende a Forma Ascendida por 5 turnos. +4: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Intervenção Divina_, que aumenta o escudo do Clérigo e de todos os aliados em até 300 e estende a Forma Ascendida por 6 turnos. _Intervenção Divina_ custa 5 cargas de tomo e só pode ser conjurada uma vez na mesma forma ascendida.
actors.hero.talent.divine_intervention.title=intervenção divina
actors.hero.talent.divine_sense.desc=+1: O Clérigo pode conjurar _Senso Divino_, uma magia que lhe concede _8 espaços_ de Visão Mental por 50 turnos e não leva tempo para conjurar, ao custo de 2 cargas. +2: O Clérigo pode conjurar _Senso Divino_, uma magia que lhe concede _12 espaços_ de Visão Mental por 50 turnos e não leva tempo para conjurar, ao custo de 2 cargas.
actors.hero.talent.divine_sense.meta_desc=_Se este talento for adquirido por um herói diferente_, ele concederá a ele visão mental por um breve momento após usar uma varinha ou artefato com alcance de 3 quadrados com +1 ou 5 quadrados com +2.
actors.hero.talent.divine_sense.title=sentido divino
actors.hero.talent.double_jump.desc=_+1:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _16% reduzido_.\n\n_+2:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _30% reduzido_.\n\n_+3:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _40% reduzido_.\n\n_+4:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _50% reduzido_.
actors.hero.talent.double_jump.title=salto duplo
actors.hero.talent.double_mark.desc=_+1:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _30% reduzido_.\n\n_+2:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _50% reduzido_.\n\n_+3:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _65% reduzido_.\n\n_+4:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _75% reduzido_.
actors.hero.talent.double_mark.title=marca dupla
actors.hero.talent.durable_projectiles.desc=_+1:_ Armas de arremesso têm _+50% de durabilidade_ quando usadas pela Caçadora.\n\n_+2:_ Armas de arremesso têm _+75% de durabilidade_ quando usadas pela Caçadora.
actors.hero.talent.durable_projectiles.title=projéteis duráveis
actors.hero.talent.durable_tips.desc=+1: Dardos com ponta têm 2x mais durabilidade quando o Guarda os usa. +2: Dardos com ponta têm 3x mais durabilidade quando o Guarda os usa. +3: Dardos com ponta têm 4x mais durabilidade quando o Guarda os usa.
actors.hero.talent.durable_tips.title=pontas duráveis
actors.hero.talent.eagle_eye.desc=+1: O alcance de visão do falcão espiritual é aumentado de 6 para 7 quadrados. +2: O alcance de visão do falcão espiritual é aumentado de 6 para 8 quadrados. +3: O alcance de visão do falcão espiritual é aumentado de 6 para 9 quadrados e ele ganha 2 quadrados de visão mental. +4: O alcance de visão do falcão espiritual é aumentado de 6 para 10 quadrados e ele ganha 3 quadrados de visão mental.
actors.hero.talent.eagle_eye.title=olho de águia
actors.hero.talent.elemental_power.desc=_+1:_ O poder da explosão elemental é aumentado em _25%_.\n\n_+2:_ O poder da explosão elemental é aumentado em _50%_.\n\n_+3:_ O poder da explosão elemental é aumentado em _75%_.\n\n_+4:_ O poder da explosão elemental é aumentado em _100%_.
actors.hero.talent.elemental_power.title=poder elemental
actors.hero.talent.elemental_reach.desc=_+1:_ O alcance do Golpe Elemental é aumentado de 4 para 5 quadrados, e sua largura é aumentada de 65 para 75 graus.\n\n_+2:_ O alcance do Golpe Elemental é aumentado de 4 para 6 quadrados, e sua largura é aumentada de 65 para 85 graus.\n\n_+3:_ O alcance do Golpe Elemental é aumentado de 4 para 7 quadrados, e sua largura é aumentada de 65 para 95 graus.\n\n_+4:_ O alcance do Golpe Elemental é aumentado de 4 para 8 quadrados, e sua largura é aumentada de 65 para 105 graus.
actors.hero.talent.elemental_reach.title=alcance elemental
actors.hero.talent.elimination_match.desc=_+1:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _16% reduzido_.\n\n_+2:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _30% reduzido_.\n\n_+3:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _40% reduzido_.\n\n_+4:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _50% reduzido_.
actors.hero.talent.elimination_match.title=partida de eliminação
actors.hero.talent.empowered_strike.desc=_+1:_ O primeiro ataque corpo a corpo do Mago de Batalha com seu cajado após usar o raio causa _+16% de dano_ e o efeito bônus do cajado recebe _+50% de poder_.\n\n_+2:_ O primeiro ataque corpo a corpo do Mago de Batalha com seu cajado após usar o raio causa _+33% de dano_ e o efeito bônus do cajado recebe _+100% de poder_.\n\n_+3:_ O primeiro ataque corpo a corpo do Mago de Batalha com seu cajado após usar o raio causa _+50% de dano_ e o efeito bônus do cajado recebe _+150% de poder_.
actors.hero.talent.empowered_strike.title=greve fortalecida
actors.hero.talent.empowering_meal.desc=_+1:_ Comer concede ao Mago _2 de dano bônus_ nas próximas 3 vezes que ele causar dano com uma varinha.\n\n_+2:_ Comer concede ao Mago _3 de dano bônus_ nas próximas 3 vezes que ele causar dano com uma varinha.
actors.hero.talent.empowering_meal.title=refeição fortalecedora
actors.hero.talent.endless_rage.desc=+1: O Berserker pode atingir um máximo de 116% de fúria. +2: O Berserker pode atingir um máximo de 133% de fúria. +3: O Berserker pode atingir um máximo de 150% de fúria. Cada ponto de fúria acima de 100% aumenta o escudo de berserk em 1% e reduz o tempo de recarga em 1%, mas não aumenta o bônus de dano além de +50%.
actors.hero.talent.endless_rage.title=fúria sem fim
actors.hero.talent.energizing_meal.desc=_+1:_ Comer consome 1 turno do Mago e concede a ele _5 turnos de recarga da varinha_.\n\n_+2:_ Comer consome 1 turno do Mago e concede a ele _8 turnos de recarga da varinha_.
actors.hero.talent.energizing_meal.title=refeição energizante
actors.hero.talent.enhanced_combo.desc=_+1:_ Quando o combo do Gladiador for 7 ou mais, o alcance de repulsão do Golpe Baixo aumenta para 3, causa vertigem e pode jogar inimigos em buracos.\n\n_+2:_ Além dos benefícios de +1, quando o combo do Gladiador for 9 ou mais, Aparar funciona em múltiplos ataques.\n\n_+3:_ Além dos benefícios de +1 e +2, o Gladiador pode saltar até o equivalente a um combo/3 quadrados ao usar Golpe Baixo, Esmagamento ou Fúria.
actors.hero.talent.enhanced_combo.title=combinação aprimorada
actors.hero.talent.enhanced_lethality.desc=_+1:_ O Assassino pode assassinar inimigos com menos de _4/13/27/67% de vida_ por nível de preparação, em vez de 3/10/20/50%.\n\n_+2:_ O Assassino pode assassinar inimigos com menos de _5/17/33/83% de vida_ por nível de preparação, em vez de 3/10/20/50%.\n\n_+3:_ O Assassino pode assassinar inimigos com menos de _6/20/40/100% de vida_ por nível de preparação, em vez de 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=letalidade aumentada
actors.hero.talent.enhanced_rings.desc=_+1:_ Quando o Ladino usa um artefato, seus anéis recebem +1 de melhoria por _3 turnos_.\n\n_+2:_ Quando o Ladino usa um artefato, seus anéis recebem +1 de melhoria por _6 turnos_.\n\n_+3:_ Quando o Ladino usa um artefato, seus anéis recebem +1 de melhoria por _9 turnos_.
actors.hero.talent.enhanced_rings.title=anéis aprimorados
actors.hero.talent.enlightening_meal.desc=+1: Comer consome 1 turno do Clérigo e concede a ele 0,67 cargas em seu tomo sagrado. +2: Comer consome 1 turno do Clérigo e concede a ele 1 carga em seu tomo sagrado.
actors.hero.talent.enlightening_meal.meta_desc=_Se este talento for adquirido por um herói diferente_, ele concederá 2 turnos de recarga de varinha e artefato em +1, ou 3 turnos em +2. Isso não pode ser usado para recarregar a própria cornucópia.
actors.hero.talent.enlightening_meal.title=Refeição Iluminadora
actors.hero.talent.enraged_catalyst.desc=+1: Encantamentos e maldições na arma do Berserker são ativados com mais frequência quanto maior for sua fúria, até um máximo de 15% mais vezes com 100% de fúria. +2: Encantamentos e maldições na arma do Berserker são ativados com mais frequência quanto maior for sua fúria, até um máximo de 30% mais vezes com 100% de fúria. +3: Encantamentos e maldições na arma do Berserker são ativados com mais frequência quanto maior for sua fúria, até um máximo de 45% mais vezes com 100% de fúria.
actors.hero.talent.enraged_catalyst.title=catalisador enfurecido
actors.hero.talent.evasive_armor.desc=_+1:_ Durante a corrida livre, o Freerunner ganha _+1 evasão_ adicional por ponto de excesso de força em sua armadura. _+3 de evasão_ por ponto de excesso de força em sua armadura.
actors.hero.talent.evasive_armor.title=armadura evasiva
actors.hero.talent.even_the_odds.desc=_+1:_ O Guerreiro causa _5% de dano bônus adicional para cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.\n\n_+2:_ O Guerreiro causa _10% de dano bônus adicional para cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.\n\n_+3:_ O Guerreiro causa _15% de dano bônus adicional para cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.\n\n_+4:_ O Guerreiro causa _20% de dano bônus adicional para cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.
actors.hero.talent.even_the_odds.title=igualar as probabilidades
actors.hero.talent.excess_charge.desc=_+1:_ Quando o cajado do Mago de Batalha estiver totalmente carregado, seu próximo raio concederá a ele _0,67 de escudo_ por nível do cajado.\n\n_+2:_ Quando o cajado do Mago de Batalha estiver totalmente carregado, seu próximo raio concederá a ele _1,33 de escudo_ por nível do cajado.\n\n_+3:_ Quando o cajado do Mago de Batalha estiver totalmente carregado, seu próximo raio concederá a ele _2 de escudo_ por nível do cajado.
actors.hero.talent.excess_charge.title=cobrança excessiva
actors.hero.talent.expanding_wave.desc=_+1:_ O alcance da Onda de Choque foi aumentado de 5 para 6 blocos, e sua largura foi aumentada de 60 para 75 graus.\n\n_+2:_ O alcance da Onda de Choque foi aumentado de 5 para 7 blocos, e sua largura foi aumentada de 60 para 90 graus.\n\n_+3:_ O alcance da Onda de Choque foi aumentado de 5 para 8 blocos, e sua largura foi aumentada de 60 para 105 graus.\n\n_+4:_ O alcance da Onda de Choque foi aumentado de 5 para 9 blocos, e sua largura foi aumentada de 60 para 120 graus.
actors.hero.talent.expanding_wave.title=onda em expansão
actors.hero.talent.expose_weakness.desc=_+1:_ Inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis por _2 turnos_.\n\n_+2:_ Inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis por _4 turnos_.\n\n_+3:_ Inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis por _6 turnos_.\n\n_+4:_ Inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis por _8 turnos_.
actors.hero.talent.expose_weakness.title=expor fraqueza
actors.hero.talent.fan_of_blades.desc=+1: As lâminas espectrais podem atingir até 1 alvo adicional, causando 50% de dano. O alvo deve estar visível e dentro de um cone de 30 graus. +2: As lâminas espectrais podem atingir até 2 alvos adicionais, causando 50% de dano. Os alvos devem estar visíveis e dentro de um cone de 60 graus. +3: As lâminas espectrais podem atingir até 3 alvos adicionais, causando 50% de dano. Os alvos devem estar visíveis e dentro de um cone de 90 graus. +4: As lâminas espectrais podem atingir até 4 alvos adicionais, causando 50% de dano. Os alvos devem estar visíveis e dentro de um cone de 120 graus.
actors.hero.talent.fan_of_blades.title=leque de lâminas
actors.hero.talent.farsight.desc=_+1:_ O alcance de visão do Atirador é _aumentado em 25%_.\n\n_+2:_ O alcance de visão do Atirador é _aumentado em 50%_.\n\n_+3:_ O alcance de visão do Atirador é _aumentado em 75%_.
actors.hero.talent.farsight.title=visão de longo alcance
actors.hero.talent.fear_the_reaper.desc=_+1:_ Quando um inimigo marcado para morrer chega a 0 PV, ele fica _aleijado_.\n\n_+2:_ Quando um inimigo marcado para morrer chega a 0 PV, ele fica _temido e aleijado_.\n\n_+3:_ Quando um inimigo marcado para morrer chega a 0 PV, ele fica _temido e aleijado_ e os inimigos em um raio de 3 quadrados ficam _aleijados_.\n\n_+4:_ Quando um inimigo marcado para morrer chega a 0 PV, ele fica _temido e aleijado_ e os inimigos em um raio de 3 quadrados ficam _temidos e aleijados_.
actors.hero.talent.fear_the_reaper.title=tema a morte
actors.hero.talent.feigned_retreat.desc=+1: Se um inimigo atacar a imagem residual da Duelista, ela ganha 2 turnos de ímpeto. +2: Se um inimigo atacar a imagem residual da Duelista, ela ganha 4 turnos de ímpeto. +3: Se um inimigo atacar a imagem residual da Duelista, ela ganha 6 turnos de ímpeto. +4: Se um inimigo atacar a imagem residual da Duelista, ela ganha 8 turnos de ímpeto.
actors.hero.talent.feigned_retreat.title=recuo fingido
actors.hero.talent.fire_everything.desc=_+1:_ A magia selvagem agora dispara _5 vezes_, em vez de 4, e cada varinha tem _25% de chance_ de ser usada 3 vezes.\n\n_+2:_ A magia selvagem agora dispara _6 vezes_, em vez de 4, e cada varinha tem _50% de chance_ de ser usada 3 vezes.\n\n_+3:_ A magia selvagem agora dispara _7 vezes_, em vez de 4, e cada varinha tem _75% de chance_ de ser usada 3 vezes.\n\n_+4:_ A magia selvagem agora dispara _8 vezes_, em vez de 4, e cada varinha tem _100% de chance_ de ser usada 3 vezes.
actors.hero.talent.fire_everything.title=fogo em tudo
actors.hero.talent.flash.desc=_+1:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _3 quadrados_ de distância.\n\n_+2:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _4 quadrados_ de distância.\n\n_+3:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _5 quadrados_ de distância.\n\n_+4:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _6 quadrados_ de distância.\n\nFlash custa 2 cargas de tomo inicialmente e 1 carga adicional para cada uso na mesma forma ascendida.
actors.hero.talent.flash.title=clarão
actors.hero.talent.focused_meal.desc=+1: Comer consome 1 turno do Duelista e concede a ele 0,67 cargas em suas armas. +2: Comer consome 1 turno do Duelista e concede a ele 1 carga em suas armas.
actors.hero.talent.focused_meal.meta_desc=_Se este talento for adquirido por um herói diferente_, ele concederá dano bônus ao próximo ataque igual ao seu nível/3 no nível +1, ou nível/2 no nível +2.
actors.hero.talent.focused_meal.title=refeição focada
actors.hero.talent.followup_strike.desc=_+1:_ Quando a Caçadora acerta um inimigo com seu arco ou uma arma de arremesso, seu próximo ataque corpo a corpo contra esse inimigo causa _2 de dano bônus_.\n\n_+2:_ Quando a Caçadora acerta um inimigo com seu arco ou uma arma de arremesso, seu próximo ataque corpo a corpo contra esse inimigo causa _3 de dano bônus_.
actors.hero.talent.followup_strike.title=ataque de acompanhamento
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Os ataques do falcão espiritual cegam os inimigos por _2 turnos_.\n\n_+2:_ Os ataques do falcão espiritual cegam os inimigos por _5 turnos_.\n\n_+3:_ Os ataques do falcão espiritual cegam os inimigos por _5 turnos_ e os incapacitam por _2 turnos_.\n\n_+4:_ Os ataques do falcão espiritual cegam os inimigos por _5 turnos_ e os incapacitam por _5 turnos_.
actors.hero.talent.go_for_the_eyes.title=mire nos olhos
actors.hero.talent.growing_power.desc=_+1:_ Os bônus de ataque e velocidade de movimento do poder da natureza são aumentados para _38% e 125%_, de 33% e 100%.\n\n_+2:_ Os bônus de ataque e velocidade de movimento do poder da natureza são aumentados para _42% e 150%_, de 33% e 100%.\n\n_+3:_ Os bônus de ataque e velocidade de movimento do poder da natureza são aumentados para _46% e 175%_, de 33% e 100%.\n\n_+4:_ Os bônus de ataque e velocidade de movimento do poder da natureza são aumentados para _50% e 200%_, de 33% e 100%.
actors.hero.talent.growing_power.title=poder crescente
actors.hero.talent.hallowed_ground.desc=+1: O Sacerdote pode conjurar _Solo Sagrado_, uma magia que santifica o terreno em uma área de _3x3_ por 20 turnos, ao custo de 2 cargas. +2: O Sacerdote pode conjurar _Solo Sagrado_, uma magia que santifica o terreno em uma área de _5x5_ por 20 turnos, ao custo de 2 cargas. +3: O Sacerdote pode conjurar _Solo Sagrado_, uma magia que santifica o terreno em uma área de _7x7_ por 20 turnos, ao custo de 2 cargas. Quando conjurada, _Solo Sagrado_ cura aliados em 15 PV, imobiliza brevemente inimigos e espalha grama baixa. Depois disso, cura aliados lentamente, enfraquece inimigos e faz com que grama alta cresça aleatoriamente. O solo sagrado concede proteção ao Sacerdote em vez de cura e é destruído pelo fogo.
actors.hero.talent.hallowed_ground.title=terra sagrada
actors.hero.talent.hasty_retreat.desc=_+1:_ Após piscar, o Ladino ganha _1 turno_ de ímpeto e invisibilidade.\n\n_+2:_ Após piscar, o Ladino ganha _2 turnos_ de ímpeto e invisibilidade.\n\n_+3:_ Após piscar, o Ladino ganha _3 turnos_ de ímpeto e invisibilidade.\n\n_+4:_ Após piscar, o Ladino ganha _4 turnos_ de ímpeto e invisibilidade.
actors.hero.talent.hasty_retreat.title=retirada precipitada
actors.hero.talent.hearty_meal.desc=_+1:_ Comer comida cura o Guerreiro em _4 PV_ quando ele estiver com 33% de vida ou menos.\n\n_+2:_ Comer comida cura o Guerreiro em _6 PV_ quando ele estiver com 33% de vida ou menos.
actors.hero.talent.hearty_meal.title=refeição farta
actors.hero.talent.heightened_senses.desc=_+1:_ A Caçadora ganha visão mental em personagens dentro de _2 espaços de sua posição_.\n\n_+2:_ A Caçadora ganha visão mental em personagens dentro de _3 espaços de sua posição_.
actors.hero.talent.heightened_senses.title=sentidos aguçados
actors.hero.talent.heroic_energy.desc=_+1:_ A habilidade de armadura do herói tem um custo de carga _12% reduzido_.\n\n_+2:_ A habilidade de armadura do herói tem um custo de carga _23% reduzido_.\n\n_+3:_ A habilidade de armadura do herói tem um custo de carga _32% reduzido_.\n\n_+4:_ A habilidade de armadura do herói tem um custo de carga _40% reduzido_.
actors.hero.talent.heroic_energy.rat_title=energia ratoica
actors.hero.talent.heroic_energy.title=energia heroica
actors.hero.talent.hold_fast.desc=_+1:_ Quando o Guerreiro espera, ele ganha _1-2 de armadura_ e reduz a redução dos bônus de combo e escudo em _50%_ até se mover.\n\n_+2:_ Quando o Guerreiro espera, ele ganha _2-4 de armadura_ e reduz a redução dos bônus de combo e escudo em _75%_ até se mover.\n\n_+3:_ Quando o Guerreiro espera, ele ganha _3-6 de armadura_ e reduz a redução dos bônus de combo e escudo em _100%_ até se mover.
actors.hero.talent.hold_fast.title=agarrar-se
actors.hero.talent.holy_intuition.desc=+1: O Clérigo pode conjurar _Intuição Sagrada_, uma magia que revela se um item está amaldiçoado, ao custo de _3 cargas._ +2: O Clérigo pode conjurar _Intuição Sagrada_, uma magia que revela se um item está amaldiçoado, ao custo de _2 cargas._
actors.hero.talent.holy_intuition.meta_desc=_Se este talento for adquirido por um herói diferente_, ele permitirá que o herói identifique o status de maldição em um item amaldiçoado imediatamente antes de equipá-lo, 15% das vezes em +1 ou 25% das vezes em +2.
actors.hero.talent.holy_intuition.title=intuição sagrada
actors.hero.talent.holy_lance.desc=+1: O Sacerdote pode conjurar Lança Sagrada, uma magia devastadora que causa de 30 a 55 de dano ao custo de 4 cargas. +2: O Sacerdote pode conjurar Lança Sagrada, uma magia devastadora que causa de 45 a 83 de dano ao custo de 4 cargas. +3: O Sacerdote pode conjurar Lança Sagrada, uma magia devastadora que causa de 60 a 110 de dano ao custo de 4 cargas. Lança Sagrada sempre causa dano máximo a inimigos demoníacos e mortos-vivos. Lança Sagrada tem um tempo de recarga de 30 turnos antes de poder ser conjurada novamente.
actors.hero.talent.holy_lance.title=lança sagrada
actors.hero.talent.impact_wave.desc=_+1:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes são empurrados _2 casas_ para trás e têm _25% de chance_ de ficarem vulneráveis por 5 turnos.\n\n_+2:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes são empurrados _3 casas_ para trás e têm _50% de chance_ de ficarem vulneráveis por 5 turnos.\n\n_+3:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes são empurrados _4 casas_ para trás e têm _75% de chance_ de ficarem vulneráveis por 5 turnos.\n\n_+4:_ Quando o Guerreiro aterrissa após o salto, todos os inimigos adjacentes são empurrados _5 casas_ para trás e têm _100% de chance_ de ficarem vulneráveis por 5 turnos.
actors.hero.talent.impact_wave.title=onda de impacto
actors.hero.talent.improvised_projectiles.desc=+1: O Guerreiro pode cegar um inimigo por 2 turnos arremessando qualquer item que não seja uma arma de arremesso nele. Esta habilidade tem um tempo de recarga de 50 turnos. +2: O Guerreiro pode cegar um inimigo por 3 turnos arremessando qualquer item que não seja uma arma de arremesso nele. Esta habilidade tem um tempo de recarga de 50 turnos.
actors.hero.talent.improvised_projectiles.title=projéteis improvisados
actors.hero.talent.inscribed_power.desc=_+1:_ Quando o Mago lê um pergaminho ou usa um item mágico, seus _próximos 2 ataques de varinha_ recebem +2 níveis.\n\n_+2:_ Quando o Mago lê um pergaminho ou usa um item mágico, seus _próximos 3 ataques de varinha_ recebem +2 níveis.\n\nO número de ataques de varinha aprimorados é dobrado ao usar um pergaminho de aprimoramento, transmutação ou itens de alquimia que devem ser criados usando esses pergaminhos.\n\nPara itens de alquimia com quantidades de produção maiores (por exemplo, a maioria das magias), este talento tem uma chance de ser ativado com base em quantos itens desse tipo são produzidos.
actors.hero.talent.inscribed_power.title=poder inscrito
actors.hero.talent.inscribed_stealth.desc=+1: O Ladino ganha 3 turnos de invisibilidade após ler um pergaminho ou usar um item mágico. +2: O Ladino ganha 5 turnos de invisibilidade após ler um pergaminho ou usar um item mágico. A duração da invisibilidade é dobrada ao usar um pergaminho de aprimoramento, pergaminho de transmutação ou itens de alquimia que precisam ser criados usando esses pergaminhos. Para itens de alquimia com maior quantidade de produção (por exemplo, a maioria das magias), este talento tem uma chance de ser ativado com base na quantidade do item produzido.
actors.hero.talent.inscribed_stealth.title=furtividade inscrita
actors.hero.talent.invigorating_meal.desc=_+1:_ Comer comida leva 1 turno para a Caçadora (as frutas são comidas instantaneamente) e concede a ela _1 turno de aceleração_.\n\n_+2:_ Comer comida leva 1 turno para a Caçadora (as frutas são comidas instantaneamente) e concede a ela _2 turnos de aceleração_.
actors.hero.talent.invigorating_meal.title=refeição revigorante
actors.hero.talent.invigorating_victory.desc=+1: Se a Duelista derrotar seu alvo antes do fim do duelo, ela recupera 5 PV mais 30% do dano sofrido durante o duelo. +2: Se a Duelista derrotar seu alvo antes do fim do duelo, ela recupera 10 PV mais 50% do dano sofrido durante o duelo. +3: Se a Duelista derrotar seu alvo antes do fim do duelo, ela recupera 15 PV mais 65% do dano sofrido durante o duelo. +4: Se a Duelista derrotar seu alvo antes do fim do duelo, ela recupera 20 PV mais 75% do dano sofrido durante o duelo.
actors.hero.talent.invigorating_victory.title=vitória revigorante
actors.hero.talent.iron_stomach.desc=_+1:_ Comer consome 1 turno do Guerreiro e concede a ele _75% de resistência a dano_ enquanto come.\n\n_+2:_ Comer consome 1 turno do Guerreiro e concede a ele _100% de resistência a dano_ enquanto come.
actors.hero.talent.iron_stomach.title=estômago de ferro
actors.hero.talent.iron_will.desc=_+1:_ O escudo fornecido pelo selo do Guerreiro é _aumentado em 1_.\n\n_+2:_ O escudo fornecido pelo selo do Guerreiro é _aumentado em 2_.
actors.hero.talent.iron_will.meta_desc=_Se esse talento for adquirido por um herói diferente_, ele concederá passivamente uma versão com 1 ou 2 escudos máximos do efeito de selo quebrado do Guerreiro.
actors.hero.talent.iron_will.title=vontade de ferro
actors.hero.talent.judgement.desc=+1: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Julgamento, que causa de 10 a 20 de dano a todos os inimigos visíveis. +2: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Julgamento, que causa de 15 a 30 de dano a todos os inimigos visíveis. +3: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Julgamento, que causa de 20 a 40 de dano a todos os inimigos visíveis. +4: Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar Julgamento, que causa de 25 a 50 de dano a todos os inimigos visíveis. Julgamento custa 3 cargas de tomo. O Julgamento causa +33% de dano para cada magia que o Clérigo conjurou desde que entrou na forma ascendida ou desde a última conjuração de Julgamento.
actors.hero.talent.judgement.title=julgamento
actors.hero.talent.lay_on_hands.desc=+1: O Paladino pode conjurar Imposição de Mãos, uma magia que cura instantaneamente um personagem próximo em 15 PV ou concede ao Paladino 15 de escudo, ao custo de 1 carga. +2: O Paladino pode conjurar Imposição de Mãos, uma magia que cura instantaneamente um personagem próximo em 20 PV ou concede ao Paladino 20 de escudo, ao custo de 1 carga. +3: O Paladino pode conjurar Imposição de Mãos, uma magia que cura instantaneamente um personagem próximo em 25 PV ou concede ao Paladino 25 de escudo, ao custo de 1 carga. O excesso de cura desta magia é convertido em escudo. A Imposição de Mãos pode ser conjurada repetidamente, mas não pode aplicar mais do que o equivalente a três conjurações de proteção de uma só vez.
actors.hero.talent.lay_on_hands.title=imposição de mãos
actors.hero.talent.lethal_defense.desc=_+1:_ Quando o Gladiador elimina um inimigo com um golpe combinado, o tempo de recarga do seu escudo de selo quebrado é reduzido em 50 turnos. \n\n_+2:_ Quando o Gladiador elimina um inimigo com um golpe combinado, o tempo de recarga do seu escudo de selo quebrado é reduzido em 100 turnos. \n\n_+3:_ Quando o Gladiador elimina um inimigo com um golpe combinado, o tempo de recarga do seu escudo de selo quebrado é reduzido em 150 turnos. \n\n O tempo de recarga do escudo pode ser reduzido para até -150 turnos por este talento, o que significa que ele estará disponível novamente imediatamente após ser ativado.
actors.hero.talent.lethal_defense.title=defesa letal
actors.hero.talent.lethal_haste.desc=_+1:_ Quando a Duelista desfere um golpe fatal em um inimigo com uma habilidade de arma, ela ganha movimento instantâneo equivalente a _3 turnos_.\n\n_+2:_ Quando a Duelista desfere um golpe fatal em um inimigo com uma habilidade de arma, ela ganha movimento instantâneo equivalente a _5 turnos_.
actors.hero.talent.lethal_haste.meta_desc=_Se esse talento for adquirido por um herói diferente_, ele será ativado com ataques normais de armas, com um tempo de recarga de 100 turnos.
actors.hero.talent.lethal_haste.title=pressa letal
actors.hero.talent.lethal_momentum.desc=_+1:_ Quando o Guerreiro desfere um golpe fatal em um inimigo com uma arma física, ele tem _67% de chance_ de não gastar turnos.\n\n_+2:_ Quando o Guerreiro desfere um golpe fatal em um inimigo com uma arma física, ele tem _100% de chance_ de não gastar turnos.
actors.hero.talent.lethal_momentum.title=momento letal
actors.hero.talent.life_link.desc=O Clérigo pode conjurar _Vínculo Vital_ entre si e um aliado fortalecido ao custo de 2 cargas. Esta magia faz com que o dano seja compartilhado entre o Clérigo e seu aliado, e faz com que magias benéficas de clérigo de nível 3 ou inferior se apliquem a ambos se um deles estiver sendo afetado. \n\n_+1:_ Vínculo Vital dura 10 turnos e aumenta o bônus de Poder de Muitos para -35% do dano recebido. \n\n_+2:_ Vínculo Vital dura 13 turnos e aumenta o bônus de Poder de Muitos para -40% do dano recebido. \n\n_+3: Vínculo Vital dura 17 turnos e aumenta o bônus de Poder de Muitos para -45% do dano recebido. \n\n_+4: Vínculo Vital dura 20 turnos e aumenta o bônus de Poder de Muitos para -50% do dano recebido.
actors.hero.talent.life_link.title=ligação vital
actors.hero.talent.light_cloak.desc=_+1:_ O Ladino pode usar sua capa das sombras quando ela não estiver equipada, mas ela recarrega a _25% da velocidade_ quando desequipada.\n\n_+2:_ O Ladino pode usar sua capa das sombras quando ela não estiver equipada, mas ela recarrega a _50% da velocidade_ quando desequipada.\n\n_+3:_ O Ladino pode usar sua capa das sombras quando ela não estiver equipada, mas ela recarrega a _75% da velocidade_ quando desequipada.
actors.hero.talent.light_cloak.meta_desc=_Se este talento for adquirido por um herói diferente_, ele aumentará a velocidade de carregamento de todos os artefatos em 7/13/20% em +1/+2/+3.
actors.hero.talent.light_cloak.title=manto leve
actors.hero.talent.light_reading.desc=_+1:_ O Clérigo pode usar seu tomo sagrado quando ele não estiver equipado, mas ele recarrega a _25% da velocidade_ quando desequipado.\n\n_+2:_ O Clérigo pode usar seu tomo sagrado quando ele não estiver equipado, mas ele recarrega a _50% da velocidade_ quando desequipado.\n\n_+3:_ O Clérigo pode usar seu tomo sagrado quando ele não estiver equipado, mas ele recarrega a _75% da velocidade_ quando desequipado.
actors.hero.talent.light_reading.meta_desc=_Se este talento for adquirido por um herói diferente_, ele aumentará a velocidade de recarga de todas as varinhas em 7/13/20% nos níveis +1/+2/+3.
actors.hero.talent.light_reading.title=Leitura leve
actors.hero.talent.lingering_magic.desc=_+1:_ Quando o Mago usa uma varinha ou cajado para atacar, seu próximo ataque físico causa _1-2 de dano bônus_.\n\n_+2:_ Quando o Mago usa uma varinha ou cajado para atacar, seu próximo ataque físico causa _2 de dano bônus_.
actors.hero.talent.lingering_magic.title=magia persistente
actors.hero.talent.liquid_agility.desc=+1: Ao beber ou arremessar uma poção, bebida ou elixir, o Duelista tem evasão triplicada e precisão triplicada em seu próximo ataque corpo a corpo dentro de 5 turnos. +2: Ao beber ou arremessar uma poção, bebida ou elixir, o Duelista tem evasão infinita e precisão infinita em seu próximo ataque corpo a corpo dentro de 5 turnos. Este bônus dura um turno e ataque adicionais ao usar poções de força, experiência ou itens de alquimia que precisam ser criados com essas poções. Para itens de alquimia com maior quantidade de produção (por exemplo, bebida aquosa), este talento tem uma chance de ser ativado com base na quantidade desse item produzida.
actors.hero.talent.liquid_agility.title=agilidade líquida
actors.hero.talent.liquid_nature.desc=_+1:_ Quando a Caçadora bebe ou arremessa uma poção, infusão ou elixir, _até 4 quadrados de grama_ brotam na área ao redor e os inimigos adjacentes ficam enraizados por _1 turno_.\n\n_+2:_ Quando a Caçadora bebe ou arremessa uma poção, infusão ou elixir, _até 6 quadrados de grama_ brotam na área ao redor e os inimigos adjacentes ficam enraizados por _2 turnos_.\n\nA quantidade de grama e a duração do enraizamento são dobradas ao usar poções de força, experiência ou itens de alquimia que precisam ser criados com essas poções.\n\nPara itens de alquimia com maior quantidade de produção (por exemplo, infusão aquática), este talento tem uma chance de ser ativado com base na quantidade desse item produzida.
actors.hero.talent.liquid_nature.title=natureza líquida
actors.hero.talent.liquid_willpower.desc=_+1:_ O Guerreiro ganha _6,5% de seu HP máximo em escudo_ ao beber ou arremessar uma poção, infusão ou elixir.\n\n_+2:_ O Guerreiro ganha _10% de seu HP máximo em escudo_ ao beber ou arremessar uma poção, infusão ou elixir.\n\nA quantidade de escudo é dobrada ao usar poções de força, experiência ou itens de alquimia que precisam ser criados com essas poções.\n\nPara itens de alquimia com quantidades de produção maiores (por exemplo, infusão aquática), este talento tem uma chance de ser ativado com base em quantos itens desse item são produzidos.
actors.hero.talent.liquid_willpower.title=força de vontade líquida
actors.hero.talent.longrange_warp.desc=_+1:_ O Mago agora pode se teletransportar entre andares, com um custo de carga de _150%_.\n\n_+2:_ O Mago agora pode se teletransportar entre andares, com um custo de carga de _117%_.\n\n_+3:_ O Mago agora pode se teletransportar entre andares, com um custo de carga de _83%_.\n\n_+4:_ O Mago agora pode se teletransportar entre andares, com um custo de carga de _50%_.\n\nO Mago não pode usar teletransporte de longo alcance para sair de um andar bloqueado.
actors.hero.talent.longrange_warp.title=Dobra de longo alcance
actors.hero.talent.mind_form.desc=O Clérigo pode conjurar _Forma Mental_, que imbuí Trinity com o poder de uma varinha ou arma de arremesso que o Clérigo tenha usado nesta rodada, ao custo de 3 cargas. \n\n_+1:_ Quando Trinity é usada, o Clérigo usa o efeito de raio ou arremesso do item escolhido, como se fosse _+3._\n\n_+2:_ Quando Trinity é usada, o Clérigo usa o efeito de raio ou arremesso do item escolhido, como se fosse _+4._\n\n_+3:_ Quando Trinity é usada, o Clérigo usa o efeito de raio ou arremesso do item escolhido, como se fosse _+5._\n\n_+4:_ Quando Trinity é usada, o Clérigo usa o efeito de raio ou arremesso do item escolhido, como se fosse _+6._\n\nTrinity só pode ser imbuída com um efeito mental por vez.
actors.hero.talent.mind_form.title=forma mental
actors.hero.talent.mnemonic_prayer.desc=+1: O Sacerdote pode conjurar _Oração Mnemônica_, uma magia que estende efeitos positivos/negativos em um aliado/inimigo por _3 turnos_ ao custo de 1 carga. +2: O Sacerdote pode conjurar _Oração Mnemônica_, uma magia que estende efeitos positivos/negativos em um aliado/inimigo por _4 turnos_ ao custo de 1 carga. +3: O Sacerdote pode conjurar _Oração Mnemônica_, uma magia que estende efeitos positivos/negativos em um aliado/inimigo por _5 turnos_ ao custo de 1 carga. A Oração Mnemônica não leva tempo para ser conjurada. A Oração Mnemônica só pode estender uma instância específica de um efeito positivo/negativo uma vez e não pode estender efeitos positivos de habilidades de armadura.
actors.hero.talent.mnemonic_prayer.title=oração mnemônica
actors.hero.talent.monastic_vigor.desc=_+1:_ Se o Monge tiver _100% de energia_, suas habilidades são fortalecidas.\n\n_+2:_ Se o Monge tiver _80% ou mais de energia_, suas habilidades são fortalecidas.\n\n_+3:_ Se o Monge tiver _60% ou mais de energia_, suas habilidades são fortalecidas.\n\nQuando fortalecidas:\n- Rajada aplica o encantamento da sua arma\n- Foco é instantâneo\n- Investida ganha +4 de alcance\n- Chute do Dragão causa +50% de dano e aplica seu efeito de repulsão e atordoamento a todos os inimigos adjacentes\n- Meditar cura lentamente 20% dos PV perdidos e concede 80% de resistência a dano.
actors.hero.talent.monastic_vigor.title=vigor monástico
actors.hero.talent.mystical_charge.desc=_+1:_ Atacar com seu cajado concede ao Mago de Batalha _0,5 turnos_ de recarga de artefato.\n\n_+2:_ Atacar com seu cajado concede ao Mago de Batalha _1 turno_ de recarga de artefato.\n\n_+3:_ Atacar com seu cajado concede ao Mago de Batalha _1,5 turnos_ de recarga de artefato.
actors.hero.talent.mystical_charge.title=carga mística
actors.hero.talent.mystical_meal.desc=+1: Comer consome 1 turno do Ladino (rações de suprimentos são consumidas instantaneamente) e concede a ele 3 turnos de recarga do artefato. +2: Comer consome 1 turno do Ladino (rações de suprimentos são consumidas instantaneamente) e concede a ele 5 turnos de recarga do artefato. Este talento não pode ser usado para recarregar a Cornualha da Abundância.
actors.hero.talent.mystical_meal.title=refeição mística
actors.hero.talent.natures_aid.desc=_+1:_ A Caçadora ganha 0-2 de armadura de pele de árvore, que desaparece a cada _3 turnos_ quando o efeito de uma planta é ativado em sua visão.\n\n_+2:_ A Caçadora ganha 0-2 de armadura de pele de árvore, que desaparece a cada _5 turnos_ quando o efeito de uma planta é ativado em sua visão.
actors.hero.talent.natures_aid.title=ajuda da natureza
actors.hero.talent.natures_bounty.desc=+1: A Caçadora pode encontrar 4 frutinhas escondidas na grama alta enquanto explora os próximos andares da masmorra. +2: A Caçadora pode encontrar 6 frutinhas escondidas na grama alta enquanto explora os próximos andares da masmorra. As frutinhas são consumidas rapidamente, restauram uma pequena quantidade de saciedade e podem conter uma semente utilizável.
actors.hero.talent.natures_bounty.title=generosidade da natureza
actors.hero.talent.natures_wrath.desc=_+1:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 8% de chance de ativar um efeito aleatório de planta nociva.\n\n_+2:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 17% de chance de ativar um efeito aleatório de planta nociva.\n\n_+3:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 25% de chance de ativar um efeito aleatório de planta nociva.\n\n_+4:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 33% de chance de ativar um efeito aleatório de planta nociva.\n\nAs plantas que podem ser ativadas são: erva-cega, flor-de-fogo, calota de gelo, musgo-da-tristeza e videira-da-tempestade.
actors.hero.talent.natures_wrath.title=a fúria da natureza
actors.hero.talent.necromancers_minions.desc=_+1:_ Quando um inimigo marcado pela alma morre, o Bruxo tem _13% de chance_ de ressuscitá-lo como um espectro corrompido.\n\n_+2:_ Quando um inimigo marcado pela alma morre, o Bruxo tem _27% de chance_ de ressuscitá-lo como um espectro corrompido.\n\n_+3:_ Quando um inimigo marcado pela alma morre, o Bruxo tem _40% de chance_ de ressuscitá-lo como um espectro corrompido.
actors.hero.talent.necromancers_minions.title=lacaios do necromante
actors.hero.talent.patient_strike.desc=_+1:_ Se a Duelista esperar antes de realizar um ataque corpo a corpo, ela causará _1-2 de dano bônus_.\n\n_+2:_ Se a Duelista esperar antes de realizar um ataque corpo a corpo, ela causará _2 de dano bônus_.
actors.hero.talent.patient_strike.title=greve de pacientes
actors.hero.talent.perfect_copy.desc=+1: O clone das sombras ganha 10% do HP máximo do herói e pode trocar de lugar instantaneamente com ele a até 1 quadrado de distância. +2: O clone das sombras ganha 20% do HP máximo do herói e pode trocar de lugar instantaneamente com ele a até 2 quadrados de distância. +3: O clone das sombras ganha 30% do HP máximo do herói e pode trocar de lugar instantaneamente com ele a até 3 quadrados de distância. +4: O clone das sombras ganha 40% do HP máximo do herói e pode trocar de lugar instantaneamente com ele a até 4 quadrados de distância.
actors.hero.talent.perfect_copy.title=cópia perfeita
actors.hero.talent.point_blank.desc=+1: Quando a Caçadora usa seu arco ou uma arma de arremesso em alcance corpo a corpo, ela tem -25% de precisão, em vez de -50%. +2: Quando a Caçadora usa seu arco ou uma arma de arremesso em alcance corpo a corpo, ela tem precisão normal, em vez de -50%. +3: Quando a Caçadora usa seu arco ou uma arma de arremesso em alcance corpo a corpo, ela tem +25% de precisão, em vez de -50%. Observe que armas de arremesso ou o arco espiritual sempre têm +50% de precisão quando usados à distância.
actors.hero.talent.point_blank.title=à queima-roupa
actors.hero.talent.precise_assault.desc=+1: Quando a Duelista usa uma habilidade de arma, ela ganha 2x de precisão em seu próximo ataque corpo a corpo dentro de 5 turnos. +2: Quando a Duelista usa uma habilidade de arma, ela ganha 5x de precisão em seu próximo ataque corpo a corpo dentro de 5 turnos. +3: Quando a Duelista usa uma habilidade de arma, ela ganha _precisão infinita_ em seu próximo ataque corpo a corpo dentro de 5 turnos.
actors.hero.talent.precise_assault.meta_desc=_Se este talento for adquirido por um herói diferente_, ele aumentará a precisão corpo a corpo em 10% no nível +1, 20% no nível +2 ou 30% no nível +3.
actors.hero.talent.precise_assault.title=ataque preciso
actors.hero.talent.projectile_momentum.desc=_+1:_ Enquanto pratica parkour, o Corredor ganha _+50% de precisão e +15% de dano_ com armas de arremesso.\n\n_+2:_ Enquanto pratica parkour, o Corredor ganha _+100% de precisão e +30% de dano_ com armas de arremesso.\n\n_+3:_ Enquanto pratica parkour, o Corredor ganha _+150% de precisão e +45% de dano_ com armas de arremesso.
actors.hero.talent.projectile_momentum.title=momento do projétil
actors.hero.talent.projecting_blades.desc=_+1:_ Lâminas espectrais têm _+25% de precisão_ e podem penetrar até _2 blocos sólidos_.\n\n_+2:_ Lâminas espectrais têm _+50% de precisão_ e podem penetrar até _4 blocos sólidos_.\n\n_+3:_ Lâminas espectrais têm _+75% de precisão_ e podem penetrar até _6 blocos sólidos_.\n\n_+4: Lâminas espectrais têm _+100% de precisão_ e podem penetrar até _8 blocos sólidos_.
actors.hero.talent.projecting_blades.title=lâminas salientes
actors.hero.talent.protective_shadows.desc=_+1:_ O Ladino ganha um escudo _a cada dois turnos_ em que estiver invisível, _até um máximo de 3_.\n\n_+2:_ O Ladino ganha um escudo _a cada turno_ em que estiver invisível, _até um máximo de 5_.
actors.hero.talent.protective_shadows.title=sombras protetoras
actors.hero.talent.provoked_anger.desc=_+1:_ Quando qualquer escudo aplicado ao Guerreiro for quebrado por dano, seu próximo ataque físico causará _3 de dano bônus_.\n\n_+2:_ Quando qualquer escudo aplicado ao Guerreiro for quebrado por dano, seu próximo ataque físico causará _5 de dano bônus_.
actors.hero.talent.provoked_anger.title=provocou raiva
actors.hero.talent.ratforcements.desc=_+1:_ Usar a habilidade de transformação em rato em si mesmo _invoca 1_ rato marsupial aliado próximo a você.\n\n_+2:_ Usar a habilidade de transformação em rato em si mesmo _invoca 2_ ratos marsupiais aliados próximos a você.\n\n_+3:_ Usar a habilidade de transformação em rato em si mesmo _invoca 3_ ratos marsupiais aliados próximos a você.\n\n_+4:_ Usar a habilidade de transformação em rato em si mesmo _invoca 4_ ratos marsupiais aliados próximos a você.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratlomacy.desc=_+1:_ Usar a habilidade de transformar em rato em um inimigo transformado em rato o torna amigável e torna a transformação permanente.\n\n_+2:_ Usar a habilidade de transformar em rato em um inimigo transformado em rato o torna amigável, torna a transformação permanente e lhe dá _2 turnos_ de adrenalina.\n\n_+3:_ Usar a habilidade de transformar em rato em um inimigo transformado em rato o torna amigável, torna a transformação permanente e lhe dá _4 turnos_ de adrenalina.\n\n_+4:_ Usar a habilidade de transformar em rato em um inimigo transformado em rato o torna amigável, torna a transformação permanente e lhe dá _6 turnos_ de adrenalina.
actors.hero.talent.ratlomacy.title=ratlomacia
actors.hero.talent.ratsistance.desc=_+1:_ Inimigos hostis transformados em ratos causam _-10% de dano_.\n\n_+2:_ Inimigos hostis transformados em ratos causam _-19% de dano_.\n\n_+3:_ Inimigos hostis transformados em ratos causam _-27% de dano_.\n\n_+4:_ Inimigos hostis transformados em ratos causam _-35% de dano_.
actors.hero.talent.ratsistance.title=ratistão
actors.hero.talent.reactive_barrier.desc=+1: O Mago ganha 2,5 de escudo para cada personagem afetado por explosão elemental, até um máximo de 5 personagens. +2: O Mago ganha 5 de escudo para cada personagem afetado por explosão elemental, até um máximo de 6 personagens. +3: O Mago ganha 7,5 de escudo para cada personagem afetado por explosão elemental, até um máximo de 7 personagens. +4: O Mago ganha 10 de escudo para cada personagem afetado por explosão elemental, até um máximo de 8 personagens.
actors.hero.talent.reactive_barrier.title=barreira reativa
actors.hero.talent.recall_inscription.desc=+1: O Clérigo pode conjurar _Recuperar Inscrição_, uma magia que permite repetir o efeito da última runa ou pergaminho usado em até 10 turnos. +2: O Clérigo pode conjurar _Recuperar Inscrição_, uma magia que permite repetir o efeito da última runa ou pergaminho usado em até 300 turnos. _Recuperar Inscrição_ não pode ser usada com pergaminhos de aprimoramento. O custo de carga desta magia varia de acordo com o item usado recentemente: 2 para uma runa, 3 para um pergaminho e 4 para um pergaminho exótico. Este custo de carga também é dobrado quando usado com um pergaminho de transmutação ou itens de alquimia que precisam ser criados usando transmutação ou aprimoramento.
actors.hero.talent.recall_inscription.meta_desc=_Se este talento for adquirido por um herói diferente_, ele reembolsará qualquer pergaminho ou runa em 10% das vezes no nível +1 ou em 15% das vezes no nível +2. Pergaminhos de Aprimoramento são isentos deste efeito.
actors.hero.talent.recall_inscription.refunded=Seu item foi reembolsado!
actors.hero.talent.recall_inscription.title=inscrição de recordação
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Quando a Caçadora pisa em grama curta ou brasas, elas brotam e se transformam em grama alta, que a Caçadora imediatamente sulca. Isso tem um tempo de recarga de 10 turnos._+2:_ Quando a Caçadora pisa em grama curta ou brasas, elas brotam e se transformam em grama alta, que a Caçadora imediatamente sulca. Isso tem um tempo de recarga de 5 turnos._ Este talento produzirá grama sulcada se os efeitos de regeneração passiva estiverem desativados ou se o herói não tiver ganhado experiência por um longo período.
actors.hero.talent.rejuvenating_steps.title=passos rejuvenescedores
actors.hero.talent.remote_beacon.desc=_+1:_ O Mago pode colocar um farol em qualquer local dentro de _4 quadrados_.\n\n_+2:_ O Mago pode colocar um farol em qualquer local dentro de _8 quadrados_.\n\n_+3:_ O Mago pode colocar um farol em qualquer local dentro de _12 quadrados_.\n\n_+4:_ O Mago pode colocar um farol em qualquer local dentro de _16 quadrados_.\n\nO Mago não pode colocar faróis em locais inacessíveis.
actors.hero.talent.remote_beacon.title=Sinalizador remoto
actors.hero.talent.rogues_foresight.desc=_+1:_ Quando o Ladino está em um nível com uma sala secreta, ele tem _75% de chance de perceber_ que o nível contém um segredo.\n\n_+2:_ Quando o Ladino está em um nível com uma sala secreta, ele tem _100% de chance de perceber_ que o nível contém um segredo.
actors.hero.talent.rogues_foresight.title=previsão do malandro
actors.hero.talent.runic_transference.desc=_+1:_ O selo quebrado do Guerreiro pode transferir _glifos regulares_ da mesma forma que transfere uma melhoria.\n\n_+2:_ O selo quebrado do Guerreiro pode transferir _glifos regulares, poderosos e amaldiçoados_ da mesma forma que transfere uma melhoria.\n\nO selo só pode transferir glifos se eles já estavam aplicados à armadura quando o selo foi anexado.
actors.hero.talent.runic_transference.meta_desc=_Se este talento for adquirido por um herói diferente_, ele ajudará os glifos em sua armadura a resistirem à remoção por pergaminhos de aprimoramento. Os glifos começarão a ser perdidos ao aprimorar do nível 6 (antes era 4) com +1, ou do nível 7 (antes era 4) com +2. O nível em que a perda de glifos é garantida permanece inalterado em +8.
actors.hero.talent.runic_transference.title=transferência rúnica
actors.hero.talent.satiated_spells.desc=+1: Comer faz com que o Clérigo ganhe 3 de escudo na próxima vez que conjurar uma magia. +2: Comer faz com que o Clérigo ganhe 5 de escudo na próxima vez que conjurar uma magia.
actors.hero.talent.satiated_spells.meta_desc=_Se esse talento for adquirido por um herói diferente_, ele concederá proteção imediatamente, que começará a decair normalmente após 10 turnos.
actors.hero.talent.satiated_spells.title=Feitiços de Saciação
actors.hero.talent.scholars_intuition.desc=_+1:_ O Mago identifica varinhas _3x mais rápido_.\n\n_+2:_ O Mago identifica varinhas _quando as usa_.
actors.hero.talent.scholars_intuition.title=intuição do acadêmico
actors.hero.talent.searing_light.desc=+1: Os ataques físicos do Clérigo contra inimigos iluminados por Luz Guia causam +3 de dano. +2: Os ataques físicos do Clérigo contra inimigos iluminados por Luz Guia causam +5 de dano.
actors.hero.talent.searing_light.meta_desc=_Se este talento for adquirido por um herói diferente_, ele concederá seu dano bônus após o uso de uma varinha ou artefato em um inimigo, com um tempo de recarga de 20 turnos.
actors.hero.talent.searing_light.title=Luz escaldante
actors.hero.talent.seer_shot.desc=_+1:_ Quando a Caçadora dispara uma flecha no chão, ela concede visão em uma área de 3x3 ao redor dela por _5 turnos_. Isso tem um tempo de recarga de 20 turnos.\n\n_+2:_ Quando a Caçadora dispara uma flecha no chão, ela concede visão em uma área de 3x3 ao redor dela por _10 turnos_. Isso tem um tempo de recarga de 20 turnos.\n\n_+3:_ Quando a Caçadora dispara uma flecha no chão, ela concede visão em uma área de 3x3 ao redor dela por _15 turnos_. Isso tem um tempo de recarga de 20 turnos.
actors.hero.talent.seer_shot.meta_desc=_Se esse talento for adquirido por um herói diferente_, ele será ativado por qualquer arma arremessada.
actors.hero.talent.seer_shot.title=tiro vidente
actors.hero.talent.shadow_blade.desc=+1: O clone das sombras ganha 8% do dano do herói por turno e tem 25% de chance de usar o encantamento na arma do herói. +2: O clone das sombras ganha 16% do dano do herói por turno e tem 50% de chance de usar o encantamento na arma do herói. +3: O clone das sombras ganha 24% do dano do herói por turno e tem 75% de chance de usar o encantamento na arma do herói. +4: O clone das sombras ganha 32% do dano do herói por turno e tem 100% de chance de usar o encantamento na arma do herói.
actors.hero.talent.shadow_blade.title=lâmina sombria
actors.hero.talent.shadow_step.desc=+1: Se o ladino usar a bomba de fumaça enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 16%, mas também não cega os inimigos nem ativa outros talentos. +2: Se o ladino usar a bomba de fumaça enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 30%, mas também não cega os inimigos nem ativa outros talentos. +3: Se o ladino usar a bomba de fumaça enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 41%, mas também não cega os inimigos nem ativa outros talentos. +4: Se o ladino usar a bomba de fumaça enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 50%, mas também não cega os inimigos nem ativa outros talentos.
actors.hero.talent.shadow_step.title=passo de sombra
actors.hero.talent.shared_enchantment.desc=+1: Armas de arremesso têm 33% de chance de usar o encantamento no arco do Atirador. +2: Armas de arremesso têm 67% de chance de usar o encantamento no arco do Atirador. +3: Armas de arremesso têm 100% de chance de usar o encantamento no arco do Atirador. O encantamento do arco pode ser ativado em conjunto com qualquer encantamento que a arma de arremesso já possua.
actors.hero.talent.shared_enchantment.title=encantamento compartilhado
actors.hero.talent.shared_upgrades.desc=+1: Quando a Atiradora ataca com uma arma de arremesso aprimorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano de seu ataque especial em 16%, até um máximo de 2 turnos e +33% de dano em +2. +2: Quando a Atiradora ataca com uma arma de arremesso aprimorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano de seu ataque especial em 16%, até um máximo de 4 turnos e +67% de dano em +4. +3: Quando a Atiradora ataca com uma arma de arremesso aprimorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano de seu ataque especial em 16%, até um máximo de 6 turnos e +100% de dano em +6.
actors.hero.talent.shared_upgrades.title=atualizações compartilhadas
actors.hero.talent.shield_battery.desc=_+1:_ O Mago pode usar uma varinha em si mesmo para converter todas as suas cargas em escudo a uma taxa de _4% do HP máximo por carga_.\n\n_+2:_ O Mago pode usar uma varinha em si mesmo para converter todas as suas cargas em escudo a uma taxa de _6% do HP máximo por carga_.
actors.hero.talent.shield_battery.title=bateria de blindagem
actors.hero.talent.shield_of_light.desc=+1: O Clérigo pode conjurar Escudo de Luz, uma magia instantânea que concede de 2 a 4 de armadura contra um alvo por 5 turnos ao custo de 1 carga. +2: O Clérigo pode conjurar Escudo de Luz, uma magia instantânea que concede de 3 a 6 de armadura contra um alvo por 5 turnos ao custo de 1 carga.
actors.hero.talent.shield_of_light.meta_desc=_Se este talento for adquirido por um herói diferente_, ele reduzirá o dano físico recebido do inimigo alvo em 1, 33% das vezes no nível +1 ou 50% das vezes no nível +2.
actors.hero.talent.shield_of_light.title=escudo de luz
actors.hero.talent.shielding_dew.desc=_+1:_ Gotas de orvalho podem proteger a Guardiã quando sua saúde estiver completa, até _20% de seu HP máximo_.\n\n_+2:_ Gotas de orvalho podem proteger a Guardiã quando sua saúde estiver completa, até _40% de seu HP máximo_.\n\n_+3:_ Gotas de orvalho podem proteger a Guardiã quando sua saúde estiver completa, até _60% de seu HP máximo_.
actors.hero.talent.shielding_dew.title=orvalho protetor
actors.hero.talent.shock_force.desc=_+1:_ Onda de choque causa _20% mais dano_ e tem _25% de chance_ de atordoar em vez de incapacitar.\n\n_+2:_ Onda de choque causa _40% mais dano_ e tem _50% de chance_ de atordoar em vez de incapacitar.\n\n_+3:_ Onda de choque causa _60% mais dano_ e tem _75% de chance_ de atordoar em vez de incapacitar.\n\n_+4:_ Onda de choque causa _80% mais dano_ e tem _100% de chance_ de atordoar em vez de incapacitar.
actors.hero.talent.shock_force.title=força de choque
actors.hero.talent.shrug_it_off.desc=_+1:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 60%_, de 50%.\n\n_+2:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 68%_, de 50%.\n\n_+3:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 74%_, de 50%.\n\n_+4:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 80%_, de 50%.
actors.hero.talent.shrug_it_off.title=dar de ombros
actors.hero.talent.silent_steps.desc=_+1:_ O Ladino não acordará inimigos adormecidos enquanto estiver a _3 ou mais quadrados de distância deles_.\n\n_+2:_ O Ladino não acordará inimigos adormecidos enquanto não estiver adjacente a eles.
actors.hero.talent.silent_steps.title=passos silenciosos
actors.hero.talent.soul_eater.desc=+1: A marca da alma concede 0,33 turnos de saciedade para cada dano físico causado. Inimigos marcados pela alma têm 10% de chance de ativar efeitos ao serem consumidos quando morrem. +2: A marca da alma concede 0,67 turnos de saciedade para cada dano físico causado. Inimigos marcados pela alma têm 20% de chance de ativar efeitos ao serem consumidos quando morrem. +3: A marca da alma concede 1 turno de saciedade para cada dano físico causado. Inimigos marcados pela alma têm 30% de chance de ativar efeitos ao serem consumidos quando morrem.
actors.hero.talent.soul_eater.title=devorador de almas
actors.hero.talent.soul_siphon.desc=_+1:_ Dano físico causado por outros personagens ativa a marca da alma do Bruxo com _13% de eficácia_.\n\n_+2:_ Dano físico causado por outros personagens ativa a marca da alma do Bruxo com _27% de eficácia_.\n\n_+3:_ Dano físico causado por outros personagens ativa a marca da alma do Bruxo com _40% de eficácia_.
actors.hero.talent.soul_siphon.title=sifão de almas
actors.hero.talent.speedy_stealth.desc=_+1:_ O Corredor Livre ganha 2 acúmulos de impulso por turno enquanto estiver invisível.\n\n_+2:_ Além dos benefícios de +1, o Corredor Livre não conta mais enquanto estiver invisível.\n\n_+3:_ Além dos benefícios de +1 e +2, o Corredor Livre se move com velocidade 2x maior enquanto invisível, independentemente de estar praticando Corredor Livre ou não.
actors.hero.talent.speedy_stealth.title=furtividade rápida
actors.hero.talent.spirit_blades.desc=+1: Lâminas Espectrais tem 30% de chance de também usar o encantamento no arco espiritual. +2: Lâminas Espectrais tem 60% de chance de também usar o encantamento no arco espiritual. +3: Lâminas Espectrais tem 90% de chance de também usar o encantamento no arco espiritual. +4: Lâminas Espectrais tem 100% de chance de também usar o encantamento no arco espiritual e concede +10% de poder a cada encantamento.
actors.hero.talent.spirit_blades.title=lâminas espirituais
actors.hero.talent.spirit_form.desc=O Clérigo pode conjurar _Forma Espiritual_, que imbuirá Trinity com o poder de um anel ou artefato que o Clérigo tenha identificado nesta rodada (exceto o tomo sagrado), ao custo de 4 cargas. \n\n_+1:_ Quando Trinity for usada, o Clérigo ganhará o efeito de um anel em _+1_ por 20 turnos, ou ativará o efeito de um artefato em _+4_. \n\n_+2:_ Quando Trinity for usada, o Clérigo ganhará o efeito de um anel em _+2_ por 20 turnos, ou ativará o efeito de um artefato em _+6_. \n\n_+3:_ Quando Trinity for usada, o Clérigo ganhará o efeito de um anel em _+3_ por 20 turnos, ou ativará o efeito de um artefato em _+8._\n\n_+4:_ Quando Trindade é usada, o Clérigo ganha o efeito de um anel em _+4_ por 20 turnos, ou ativa o efeito de um artefato em _+10._\n\n. Trindade só pode ser imbuída com um efeito espiritual por vez. Artefatos têm efeitos e custos de carga de armadura variados quando ativados por Trindade.
actors.hero.talent.spirit_form.title=forma espiritual
actors.hero.talent.stasis.desc=O Clérigo pode conjurar _Estase_ em um aliado fortalecido ao custo de 2 cargas. Estase remove temporariamente o aliado da masmorra e preserva o tempo restante de todos os buffs, incluindo Poder de Muitos. O aliado reaparecerá ao seu lado quando o efeito terminar. Estase pode ser conjurada novamente instantaneamente e sem custo para encerrar o efeito antecipadamente. A Estase funciona em aliados imóveis, mas não pode movê-los entre os andares da masmorra. ZXQPH0 ZXQ ZXQPH1 ZXQ_+1: A Estase dura no máximo 60 turnos. ZXQPH2 ZXQ ZXQPH3 ZXQ_+2: A Estase dura no máximo 90 turnos. ZXQPH4 ZXQ ZXQPH5 ZXQ_+3: A Estase dura no máximo 120 turnos. ZXQPH6 ZXQ ZXQPH7 ZXQ_+4: A Estase dura no máximo 150 turnos. ZXQPH8 ZXQ ZXQPH9 ZXQ O Clérigo também pode conjurar Raio Radiante quando um aliado estiver em Estase para invocá-lo novamente, ou conjurar Vínculo Vital para aplicar seu efeito preventivamente. No entanto, os aliados não se beneficiam do Vínculo Vital enquanto estiverem em Estase.
actors.hero.talent.stasis.title=estase
actors.hero.talent.strengthening_meal.desc=_+1:_ Comer concede ao Duelista 3 de dano bônus nas próximas _2 vezes_ que ele acertar um inimigo com um ataque físico.\n\n_+2:_ Comer concede ao Duelista 3 de dano bônus nas próximas _3 vezes_ que ele acertar um inimigo com um ataque físico.
actors.hero.talent.strengthening_meal.title=refeição fortalecedora
actors.hero.talent.striking_force.desc=_+1:_ O poder do efeito do golpe elemental é aumentado em _30%_.\n\n_+2:_ O poder do efeito do golpe elemental é aumentado em _60%_.\n\n_+3:_ O poder do efeito do golpe elemental é aumentado em _90%_.\n\n_+4:_ O poder do efeito do golpe elemental é aumentado em _120%_.
actors.hero.talent.striking_force.title=força de ataque
actors.hero.talent.striking_wave.desc=_+1:_ Onda de Choque tem _30% de chance_ de também usar efeitos de acerto, como encantamentos e combos.\n\n_+2:_ Onda de Choque tem _60% de chance_ de também usar efeitos de acerto, como encantamentos e combos.\n\n_+3:_ Onda de Choque tem _90% de chance_ de também usar efeitos de acerto, como encantamentos e combos.\n\n_+4:_ Onda de Choque tem _100% de chance_ de também usar efeitos de acerto, como encantamentos e combos, e concede _+20% de poder_ aos encantamentos.
actors.hero.talent.striking_wave.title=onda impressionante
actors.hero.talent.strongman.desc=+1: A força do Guerreiro aumenta em 8%, arredondado para baixo. +2: A força do Guerreiro aumenta em 13%, arredondado para baixo. +3: A força do Guerreiro aumenta em 18%, arredondado para baixo.
actors.hero.talent.strongman.title=homem forte
actors.hero.talent.sucker_punch.desc=_+1:_ O Ladino causa _1-2 de dano bônus_ na primeira vez que ele ataca um inimigo de surpresa.\n\n_+2:_ O Ladino causa _2 de dano bônus_ na primeira vez que ele ataca um inimigo de surpresa.
actors.hero.talent.sucker_punch.title=golaço
actors.hero.talent.sunray.desc=+1: O Clérigo pode conjurar Raio Solar, uma magia que causa de 4 a 8 de dano e cega o alvo por 4 turnos, ao custo de 1 carga. +2: O Clérigo pode conjurar Raio Solar, uma magia que causa de 6 a 12 de dano e cega o alvo por 6 turnos, ao custo de 1 carga. Raio Solar só pode cegar cada alvo uma vez, mas se o alvo já estiver cego por Raio Solar, ele o paralisa. Raio Solar sempre causa dano máximo a inimigos demoníacos e mortos-vivos.
actors.hero.talent.sunray.meta_desc=_Se este talento for adquirido por um herói diferente_, ele fará com que varinhas e artefatos ceguem os inimigos por 4 turnos, 15% das vezes no nível +1 ou 25% das vezes no nível +2.
actors.hero.talent.sunray.title=raio de sol
actors.hero.talent.survivalists_intuition.desc=_+1:_ A Caçadora identifica armas arremessadas 3 vezes mais rápido.\n\n_+2:_ A Caçadora identifica armas arremessadas quando acerta com elas.
actors.hero.talent.survivalists_intuition.title=intuição de sobrevivencialista
actors.hero.talent.sustained_retribution.desc=+1: O Guerreiro causa 115% de dano bônus distribuído em 2 golpes, em vez de 100% de dano bônus em 1 golpe. +2: O Guerreiro causa 130% de dano bônus distribuído em 3 golpes, em vez de 100% de dano bônus em 1 golpe. +3: O Guerreiro causa 145% de dano bônus distribuído em 4 golpes, em vez de 100% de dano bônus em 1 golpe. +4: O Guerreiro causa 160% de dano bônus distribuído em 5 golpes, em vez de 100% de dano bônus em 1 golpe.
actors.hero.talent.sustained_retribution.title=retribuição sustentada
actors.hero.talent.swift_equip.desc=_+1:_ A Duelista pode trocar sua arma equipada instantaneamente _uma vez_ a cada 20 turnos.\n\n_+2:_ A Duelista pode trocar sua arma equipada instantaneamente _duas vezes_ a cada 20 turnos.\n\nSe a Duelista possuir este talento e ele não estiver em recarga, usar rapidamente uma arma não equipada a equipará.
actors.hero.talent.swift_equip.title=equipar rapidamente
actors.hero.talent.swift_spirit.desc=+1: A velocidade de movimento do falcão espiritual aumenta de 2 para 2,5 quadrados e ele tem garantia de esquivar dos primeiros 2 ataques recebidos. +2: A velocidade de movimento do falcão espiritual aumenta de 2 para 3 quadrados e ele tem garantia de esquivar dos primeiros 4 ataques recebidos. +3: A velocidade de movimento do falcão espiritual aumenta de 2 para 3,5 quadrados e ele tem garantia de esquivar dos primeiros 6 ataques recebidos. +4: A velocidade de movimento do falcão espiritual aumenta de 2 para 4 quadrados e ele tem garantia de esquivar dos primeiros 8 ataques recebidos.
actors.hero.talent.swift_spirit.title=espírito veloz
actors.hero.talent.telefrag.desc=+1: Se o Mago se teletransportar para outro personagem, ele causa de 10 a 15 de dano a ele, mas também recebe 5 de dano. +2: Se o Mago se teletransportar para outro personagem, ele causa de 20 a 30 de dano a ele, mas também recebe 10 de dano. +3: Se o Mago se teletransportar para outro personagem, ele causa de 30 a 45 de dano a ele, mas também recebe 15 de dano. +4: Se o Mago se teletransportar para outro personagem, ele causa de 40 a 60 de dano a ele, mas também recebe 20 de dano. O herói não pode ser morto por este talento; o dano recebido pode ser reduzido por efeitos de resistência mágica.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ O Ladino identifica anéis _2x mais rápido_ e identifica o tipo de um anel _quando o equipa_.\n\n_+2:_ O Ladino identifica anéis _quando os equipa_ e identifica o tipo de um anel _quando o pega_.
actors.hero.talent.thiefs_intuition.title=intuição de ladrão
actors.hero.talent.twin_upgrades.desc=_+1:_ Se uma das duas armas equipadas do Campeão tiver um nível inferior e for _2 ou mais níveis abaixo_ da outra arma, ela será aprimorada para o nível da outra arma.\n\n_+2:_ Se uma das duas armas equipadas do Campeão tiver um nível inferior e for _1 ou mais níveis abaixo_ da outra arma, ela será aprimorada para o nível da outra arma.\n\n_+3:_ Se uma das duas armas equipadas do Campeão tiver um nível inferior e for _do mesmo nível ou inferior_ à outra arma, ela será aprimorada para o nível da outra arma.
actors.hero.talent.twin_upgrades.title=atualizações gêmeas
actors.hero.talent.unencumbered_spirit.desc=+1: A Monja ganha 50% mais energia para cada peça de equipamento de nível 3 ou inferior que estiver usando. +2: A Monja ganha 75% mais energia para cada peça de equipamento de nível 2 ou inferior que estiver usando. O benefício de nível 3 permanece inalterado. +3: A Monja ganha 100% mais energia para cada peça de equipamento de nível 1 ou inferior que estiver usando. Os benefícios de níveis 2 e 3 permanecem inalterados. Ela também ganha uma armadura de tecido e luvas tachonadas gratuitas. Observe que este talento não oferece nenhum benefício por estar desarmada ou atacar com um Anel da Força.
actors.hero.talent.unencumbered_spirit.title=espírito livre
actors.hero.talent.varied_charge.desc=_+1:_ A Campeã recupera instantaneamente _0,17 cargas de arma_ ao usar duas habilidades de arma diferentes, sem limite de tempo.\n\n_+2:_ A Campeã recupera instantaneamente _0,33 cargas de arma_ ao usar duas habilidades de arma diferentes, sem limite de tempo.\n\n_+3:_ A Campeã recupera instantaneamente _0,5 cargas de arma_ ao usar duas habilidades de arma diferentes, sem limite de tempo.
actors.hero.talent.varied_charge.title=carga variável
actors.hero.talent.veterans_intuition.desc=_+1:_ O Guerreiro identifica armas _1,75x mais rápido_ e armaduras _2,5x mais rápido_.\n\n_+2:_ O Guerreiro identifica armas _2,5x mais rápido_ e armaduras _quando as equipa_.
actors.hero.talent.veterans_intuition.title=intuição de veterano
actors.hero.talent.wall_of_light.desc=+1: O Paladino pode conjurar _Muralha de Luz_, uma magia que cria uma parede sólida de _3 quadrados de largura_ à sua frente, que repele inimigos e dura 20 turnos, ao custo de 3 cargas. +2: O Paladino pode conjurar _Muralha de Luz_, uma magia que cria uma parede sólida de _5 quadrados de largura_ à sua frente, que repele inimigos e dura 20 turnos, ao custo de 3 cargas. +3: O Paladino pode conjurar _Muralha de Luz_, uma magia que cria uma parede sólida de _7 quadrados de largura_ à sua frente, que repele inimigos e dura 20 turnos, ao custo de 3 cargas. A parede pode ser posicionada na horizontal ou na diagonal, e apenas uma parede pode existir em cada ponto. tempo.
actors.hero.talent.wall_of_light.title=parede de luz
actors.hero.talent.wand_preservation.desc=+1: Quando o Mago imbuí uma nova varinha em seu cajado, a varinha antiga retorna com +0, mas isso só pode ser feito uma vez. +2: Quando o Mago imbuí uma nova varinha em seu cajado, a varinha antiga retorna com +0. Isso pode ser repetido com um tempo de recarga de um nível de herói.
actors.hero.talent.wand_preservation.meta_desc=_Se este talento for adquirido por um herói diferente_, ele aumentará a quantidade de resina arcana obtida ao colocar uma varinha em um caldeirão de alquimia em 1 no nível +1, ou em 2 no nível +2.
actors.hero.talent.wand_preservation.title=preservação de varinhas
actors.hero.talent.weapon_recharging.desc=_+1:_ O Duelista ganha uma carga de arma a cada _15 turnos_ quando sob o efeito de buffs de recarga de varinha ou artefato.\n\n_+2:_ O Duelista ganha uma carga de arma a cada _10 turnos_ quando sob o efeito de buffs de recarga de varinha ou artefato.
actors.hero.talent.weapon_recharging.meta_desc=_Se este talento for adquirido por um herói diferente_, ele causará +5% de dano corpo a corpo enquanto recarrega em +1, ou +7,5% de dano corpo a corpo enquanto recarrega em +2.
actors.hero.talent.weapon_recharging.title=recarga de armas
actors.hero.talent.wide_search.desc=_+1:_ O raio de busca do Ladino é aumentado de um quadrado 5x5 para um círculo 7x7.\n\n_+2:_ O raio de busca do Ladino é aumentado de um quadrado 5x5 para um quadrado 7x7.
actors.hero.talent.wide_search.meta_desc=_Se este talento for adquirido por um herói diferente_, ele aumentará seu raio de busca de um quadrado 3x3 para um círculo 5x5 em +1, ou um quadrado 5x5 em +2.
actors.hero.talent.wide_search.title=busca ampla
actors.hero.talent.wild_momentum.desc=+1: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 1 turno. A duração pode ser estendida em um máximo de 2 turnos. +2: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 2 turnos. A duração pode ser estendida em um máximo de 4 turnos. +3: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 3 turnos. A duração pode ser estendida em um máximo de 6 turnos. +4: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 4 turnos. A duração pode ser estendida em um máximo de 8 turnos.
actors.hero.talent.wild_momentum.title=impulso selvagem
actors.hero.talent.wild_power.desc=_+1:_ Ao usar magia selvagem, as varinhas serão aprimoradas em _2 ou 3, até +4_.\n\n_+2:_ Ao usar magia selvagem, as varinhas serão aprimoradas em _3, até +5_.\n\n_+3:_ Ao usar magia selvagem, as varinhas serão aprimoradas em _3 ou 4, até +6_.\n\n_+4:_ Ao usar magia selvagem, as varinhas serão aprimoradas em _4, até +7_.
actors.hero.talent.wild_power.title=poder selvagem
actors.mobs.acidic.desc=Essas enormes criaturas demoníacas, semelhantes a aracnídeos, evitam o combate corpo a corpo, preferindo disparar espinhos serrilhados incapacitantes a longas distâncias. Esta parece estar pingando um líquido corrosivo.
actors.mobs.acidic.name=escorpião ácido
actors.mobs.albino.desc=Esta é uma raça rara de rato marsupial, com pelagem totalmente branca e dentes serrilhados.
actors.mobs.albino.discover_hint=Você raramente encontrará esse inimigo em uma região específica da masmorra.
actors.mobs.albino.name=rato albino
actors.mobs.armoredbrute.desc=Os brutos gnolls mais experientes costumam usar armaduras poderosas para demonstrar seu status. A armadura torna esses brutos muito mais resistentes a danos físicos, e sua maior disciplina significa que eles podem entrar em fúria por muito mais tempo antes de sucumbir aos ferimentos.
actors.mobs.armoredbrute.name=bruto blindado
actors.mobs.armoredstatue.desc=Você poderia pensar que é apenas mais uma das estátuas inanimadas desta masmorra, mas seus olhos vermelhos brilhantes a denunciam. Parece estar em ótimas condições por causa da armadura que veste; pode ser muito difícil de matar.
actors.mobs.armoredstatue.desc_arm_wep=Embora a estátua em si seja feita de pedra, os _%1$s_ e _%2$s_ que ela empunha parecem reais.
actors.mobs.armoredstatue.name=estátua blindada
actors.mobs.bandit.desc=Um ladrão de elite, distinguido por seu manto púrpura mais opulento. Apesar de sua maior habilidade, eles se tornaram tão irracionais quanto os ladrões comuns. Além de roubar de você, bandidos enlouquecidos irão cegá-lo, aleijá-lo e envenená-lo brevemente! No entanto, é muito mais provável que estejam carregando itens extras do que um ladrão comum.
actors.mobs.bandit.name=bandido louco
actors.mobs.bat.desc=Esses habitantes ágeis e tenazes das cavernas são muito mais perigosos do que aparentam. Eles recuperam a saúde a cada ataque bem-sucedido, o que lhes permite derrotar oponentes muito maiores.
actors.mobs.bat.name=morcego vampiro
actors.mobs.bee.desc=Apesar do seu pequeno tamanho, as abelhas douradas tendem a proteger ferozmente o seu ninho. Esta aqui está muito brava, melhor manter distância.
actors.mobs.bee.desc_honey=Apesar do seu pequeno tamanho, as abelhas douradas tendem a proteger ferozmente o seu ninho. Esta já foi apaziguada e parece querer segui-lo.
actors.mobs.bee.discover_hint=Você pode encontrar esse personagem com um item específico.
actors.mobs.bee.name=abelha dourada
actors.mobs.brute$bruterage.desc=Este bruto gnoll está morrendo, mas quer levar você junto! O bruto morrerá quando seu escudo se esgotar, seja por tempo ou por dano. Enquanto isso, ele causará dano muito maior, então tome cuidado! Escudo restante:
actors.mobs.brute$bruterage.name=fúria bruta
actors.mobs.brute.def_verb=bloqueado
actors.mobs.brute.desc=Os Brutos são os maiores, mais fortes e mais resistentes de todos os gnolls. Quando mortalmente feridos, entram em fúria, ganhando proteção temporária e um grande aumento de dano.
actors.mobs.brute.enraged=enfurecido
actors.mobs.brute.name=bruto gnoll
actors.mobs.causticslime.desc=Essa gosma parece ter sido contaminada pela magia negra que emana de baixo. Perdeu sua cor verde habitual e goteja um líquido cáustico.
actors.mobs.causticslime.discover_hint=Você raramente encontrará esse inimigo em uma região específica da masmorra.
actors.mobs.causticslime.name=lodo cáustico
actors.mobs.crab.desc=Esses enormes caranguejos estão no topo da cadeia alimentar nos esgotos. Eles são extremamente rápidos e sua carapaça grossa pode suportar golpes fortes.
actors.mobs.crab.name=caranguejo de esgoto
actors.mobs.crystalguardian.def_verb=bloqueado
actors.mobs.crystalguardian.desc=Esses grandes guardiões cristalinos quase parecem estátuas, não fosse por seus olhos brilhantes e luminosos. O cristal endurecido de que são feitos os torna lentos, mas muito resistentes, então é melhor deixá-los dormir em seu ninho de cristal pelo maior tempo possível. Devido ao seu tamanho, os guardiões de cristal se movem muito mais lentamente em espaços fechados. Eles também são tão resistentes que é impossível matá-los de vez. Podem ser derrotados e temporariamente incapacitados, mas se levantam novamente depois de um tempo.
actors.mobs.crystalguardian.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.crystalguardian.name=guardião de cristal
actors.mobs.crystalmimic.ate=O imitador comeu seu %s!
actors.mobs.crystalmimic.desc=Os mímicos são criaturas mágicas que podem assumir qualquer forma que desejarem. Em masmorras, eles quase sempre escolhem a forma de um baú de tesouro para atrair aventureiros desavisados. Os mímicos de cristal são mais ardilosos que seus primos comuns e preferem evitar conflitos enquanto roubam tesouros. Eles tentarão fugir correndo assim que forem descobertos e têm a habilidade de reposicionar os inimigos quando atacam.
actors.mobs.crystalmimic.escaped=O imitador de cristal escapou!
actors.mobs.crystalmimic.name=imitação de cristal
actors.mobs.crystalspire.alert=A vibração cresce e ressoa por toda a caverna!
actors.mobs.crystalspire.desc=Esta gigantesca torre de cristal ultrarresistente é provavelmente a fonte de todas as estranhas criaturas cristalinas desta caverna. Suas armas comuns são ineficazes contra ela, então você precisará usar sua picareta se quiser destruí-la. Certifique-se de estar preparado antes de começar a quebrá-la. Um cristal tão grande provavelmente levará um tempo para ser minerado, e você provavelmente não conseguirá fazê-lo sem ser incomodado. A própria torre pode até ter algum meio de se defender. Talvez os próprios ataques da torre possam ser usados contra seus lacaios.
actors.mobs.crystalspire.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.crystalspire.name=torre de cristal
actors.mobs.crystalspire.warning=O cristal vibra quando você o golpeia. Continuar fazendo isso certamente chamará a atenção para você...
actors.mobs.crystalwisp.beam_kill=O feixe de luz te matou...
actors.mobs.crystalwisp.desc=Um pequeno pedaço flutuante e furioso de cristal endurecido que emite um brilho intenso. Embora não sejam particularmente fortes, os filamentos de cristal podem disparar um feixe de luz prejudicial se tiverem uma linha de visão desobstruída. Os filamentos são pequenos o suficiente para se moverem facilmente entre as diversas formações de cristal, mas não conseguem atravessá-las.
actors.mobs.crystalwisp.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.crystalwisp.name=fio de cristal
actors.mobs.demonspawner.desc=Essa amálgama retorcida de carne anã é responsável por criar demônios estripadores a partir dos anões que morreram nesta região. Claramente, os demônios não veem problema em usar todos os recursos disponíveis contra seus inimigos. Embora visualmente aterrorizantes, os geradores de demônios não têm meios de se mover ou se defender diretamente. Sua massa considerável, no entanto, dificulta sua eliminação rápida, e eles gerarão demônios estripadores mais rapidamente quando estiverem sob ameaça. Os geradores de demônios parecem estar conectados a alguma fonte central de poder demoníaco. Matá-los pode enfraquecê-la.
actors.mobs.demonspawner.name=gerador de demônios
actors.mobs.demonspawner.on_death=A energia demoníaca aqui parece diminuir à medida que o gerador morre.
actors.mobs.dm100.desc=O DM-100 é um modelo antigo de "máquina de defesa" anã, projetado para proteger os mineiros anões nas cavernas abaixo desta prisão. Seus choques elétricos, no entanto, provaram ser muito fracos, e por isso foram doados à cidade humana acima. Permaneceram sem uso por anos e eventualmente chegaram à prisão, onde o carcereiro inicialmente os considerou cruéis demais para serem usados. Contudo, à medida que os prisioneiros se tornaram mais indisciplinados, eles se tornaram uma necessidade.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=O raio te matou...
actors.mobs.dm200.desc=O DM-200 é a segunda geração de "máquina de defesa" anã, projetada para proteger os mineiros anões nas cavernas e na cidade subterrânea. São muito maiores e mais robustos que seus antecessores, e atacam com punhos hidráulicos devastadores. Seu tamanho avantajado também é sua principal fraqueza, pois não conseguem passar pelos túneis e entradas estreitas da masmorra. Os anões conseguiram compensar a falta de mobilidade do DM-200 permitindo que ele liberasse seus gases tóxicos contra inimigos distantes ou fora de seu alcance.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=O DM-200 dispara um jato de gases tóxicos!
actors.mobs.dm201.desc=Os anões experimentaram brevemente enfatizar mais a falta de mobilidade do DM-200 e criaram alguns modelos DM completamente estacionários. O DM-201 é um DM-200 modernizado que funciona como uma torre de sentinela sem capacidade de movimento. Em troca da falta de mobilidade, os DM-201 têm durabilidade e poder de ataque significativamente maiores. Como os DM-201 não têm motor para expelir gases de escape, os anões os equiparam com granadas de gás corrosivo! Os DM-201 são cautelosos com essas granadas, no entanto, e só as lançam quando atacados à distância.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=O DM-201 lança uma granada corrosiva!
actors.mobs.dm300.charge_lost=Torre de transmissão destruída! Retornando à energia local!
actors.mobs.dm300.charging=SOFRENDO DANOS! ATIVANDO O TORRE DE ENERGIA!
actors.mobs.dm300.charging_hint=O DM-300 é invulnerável enquanto estiver sendo energizado por um pilar!
actors.mobs.dm300.def_verb=bloqueado
actors.mobs.dm300.defeated=DANO CRÍTICO! TENTANDO DESLIGAR-
actors.mobs.dm300.desc=O DM-300 é a maior e mais poderosa "máquina de defesa" já construída pelos anões. Uma máquina tão impressionante é difícil de fabricar, por isso os anões construíram apenas algumas para guardar as entradas de sua metrópole subterrânea. Ele é equipado com dutos para expelir seus gases tóxicos e uma broca de alta potência que pode ser usada tanto para atacar quanto para destruir a terra. O DM-300 também pode se conectar a uma rede elétrica, aumentando ainda mais seu poder.
actors.mobs.dm300.desc_supercharged=O DM-300 está atualmente totalmente carregado com energia elétrica. Nessa forma, o DM-300 é indestrutível e se move com o dobro da velocidade! Além disso, sua broca agora gira rápido o suficiente para perfurar rocha sólida, embora se mova muito mais lentamente ao fazer isso. Atacar o DM-300 diretamente é inútil enquanto ele estiver supercarregado, mas algo na área deve estar fornecendo essa energia a ele; destruir isso pode enfraquecê-lo.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=PESSOAL NÃO AUTORIZADO DETECTADO!
actors.mobs.dm300.pylons_destroyed=ALERTA! INSTABILIDADE DETECTADA NA REDE ELÉTRICA!
actors.mobs.dm300.rankings_desc=Esmagado pelo DM-300
actors.mobs.dm300.shield=O DM-300 extrai energia dos fios expostos e se blinda!
actors.mobs.dm300.supercharged=DESTRUIR! DESTRUIR! DESTRUIR!
actors.mobs.dwarfking$dkghoul.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking$dkgolem.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking$dkmonk.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking$dkwarlock.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking.defeated=Você... nos condenou a todos...
actors.mobs.dwarfking.desc=Há muitos anos, um dos mais poderosos magos da corte anã descobriu segredos que lhe conferiram um poder imenso sobre a vida e a morte. Ele logo pôs esse poder em prática, subjugando e corrompendo seus pares, seu rei e, por fim, todos os cidadãos anões. Agora ele é rei, governante de uma legião de súditos mortos-vivos. O Rei dos Anões é um inimigo agressivo, que tentará cercar e subjugar seus adversários com sua horda de lacaios mortos-vivos.
actors.mobs.dwarfking.enraged=Você não pode me matar %s. EU. SOU. IMORTAL!
actors.mobs.dwarfking.lifelink_1=Preciso da sua essência, escravo!
actors.mobs.dwarfking.lifelink_2=Sangre por mim, escravo!
actors.mobs.dwarfking.losing=Não! Você não pode fazer isso... você não tem ideia do que há lá embaixo...
actors.mobs.dwarfking.name=Rei dos Anões
actors.mobs.dwarfking.notice=Como você se atreve! Você não tem ideia do que está se metendo!
actors.mobs.dwarfking.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking.teleport_1=Dê um jeito neles, escravo!
actors.mobs.dwarfking.teleport_2=Mantenha-os ocupados, escravo!
actors.mobs.dwarfking.wave_1=Basta! Levantem-se, meus escravos!
actors.mobs.dwarfking.wave_2=Mais! Sangre pelo seu rei!
actors.mobs.dwarfking.wave_3=Inúteis! MATEM-NOS AGORA!
actors.mobs.ebonymimic.desc=Os mímicos são criaturas mágicas que podem assumir qualquer forma que desejarem. Em masmorras, eles quase sempre escolhem a forma de um baú de tesouro para atrair aventureiros desavisados. Os mímicos de ébano são furtivos e têm a capacidade de se tornarem quase invisíveis. Eles se escondem em objetos com os quais os aventureiros provavelmente interagirão, mas também carregam tesouros próprios. Uma vez descobertos, não são mais resistentes do que um mímico comum, mas sua mordida surpresa é devastadora.
actors.mobs.ebonymimic.discover_hint=Você pode encontrar esse inimigo com um objeto específico.
actors.mobs.ebonymimic.hidden_desc=Parece haver algo aqui, mas é quase totalmente transparente.
actors.mobs.ebonymimic.hidden_name=contorno suspeito
actors.mobs.ebonymimic.name=imitador de ébano
actors.mobs.ebonymimic.reveal=Havia um imitador ali!
actors.mobs.elemental$chaoselemental.desc=Elementais são criaturas caóticas que geralmente são criadas quando magia oculta poderosa não é controlada adequadamente. Os elementais têm inteligência mínima e geralmente estão associados a um tipo específico de magia. Elementais do Caos são raros e perigosos, não tendo se estabilizado em um elemento específico. Eles liberam magia selvagem e imprevisível quando atacam.
actors.mobs.elemental$chaoselemental.name=elemental do caos
actors.mobs.elemental$fireelemental.desc=Elementais são criaturas caóticas que geralmente são criadas quando magia oculta poderosa não é controlada adequadamente. Possuem inteligência mínima e geralmente estão associados a um tipo específico de magia. Elementais de fogo são um tipo comum de elemental que causa dano com magia ígnea. Eles incendeiam seus alvos com ataques corpo a corpo e, ocasionalmente, podem disparar raios de fogo.
actors.mobs.elemental$fireelemental.name=elemental de fogo
actors.mobs.elemental$frostelemental.desc=Elementais são criaturas caóticas que geralmente são criadas quando magia oculta poderosa não é controlada adequadamente. Possuem inteligência mínima e geralmente estão associados a um tipo específico de magia. Elementais de gelo são um tipo comum de elemental que enfraquece os inimigos com magia congelante. Eles congelam seus alvos com ataques corpo a corpo e, ocasionalmente, à distância. Sua magia é muito mais eficaz na água.
actors.mobs.elemental$frostelemental.name=elemental de gelo
actors.mobs.elemental$newbornfireelemental.charging=O elemental está carregando energia!
actors.mobs.elemental$newbornfireelemental.desc=Elementais são criaturas caóticas que geralmente são criadas quando magia oculta poderosa não é controlada adequadamente. Elementais têm inteligência mínima e geralmente estão associados a um tipo específico de magia. Este elemental de fogo foi invocado recentemente, mas ainda é bastante perigoso!
actors.mobs.elemental$newbornfireelemental.desc_ally=Como esse elemental foi invocado por um feitiço, ele tem um pouco mais de controle sobre suas chamas. Ele é incapaz de realizar ataques à distância, mas incendiará os inimigos que atacar em combate corpo a corpo.
actors.mobs.elemental$newbornfireelemental.desc_boss=Devido à natureza caótica de sua invocação, este elemental só consegue espalhar fogo em rajadas imprecisas após carregar por um turno.
actors.mobs.elemental$newbornfireelemental.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.elemental$newbornfireelemental.name=elemental de fogo recém-nascido
actors.mobs.elemental$shockelemental.desc=Elementais são criaturas caóticas que geralmente são criadas quando magia oculta poderosa não é controlada adequadamente. Os elementais têm inteligência mínima e geralmente estão associados a um tipo específico de magia. Elementais de choque são um tipo menos comum de elemental que perturba seus inimigos com eletricidade e flashes de luz. Em combate corpo a corpo, eles lançam eletricidade em direção a inimigos próximos e causam dano bônus ao seu alvo principal se este estiver na água. Ocasionalmente, eles também concentram um raio de luz à distância em seu alvo, cegando-o temporariamente.
actors.mobs.elemental$shockelemental.name=choque elemental
actors.mobs.eye.deathgaze_kill=O olhar mortal te matou...
actors.mobs.eye.desc=Os Olhos Malignos são esferas flutuantes de energia demoníaca acumulada. Embora sejam capazes de combate corpo a corpo, sua verdadeira força reside em sua magia. Após acumular energia por um curto período, um Olho Maligno libera um raio devastador chamado olhar da morte. Tudo que estiver no campo de visão do Olho Maligno sofrerá danos tremendos; aventureiros sábios correrão para se proteger.
actors.mobs.eye.name=mau-olhado
actors.mobs.fetidrat.desc=Algo está claramente errado com este rato. Sua pelagem preta e oleosa e sua pele em decomposição são muito diferentes dos ratos saudáveis que você viu anteriormente. Seus olhos verde-claros o tornam especialmente ameaçador. O rato exala um odor horrível, insuportavelmente forte de perto. Um líquido escuro e viscoso escorre da boca do rato, que corrói o chão, mas parece se dissolver na água.
actors.mobs.fetidrat.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.fetidrat.name=rato fétido
actors.mobs.fungalcore.desc=Este cogumelo gigantesco deve ser a fonte de toda a atividade fúngica nesta caverna.
actors.mobs.fungalcore.name=núcleo fúngico
actors.mobs.fungalsentry.desc=Este cogumelo particularmente alto serve como ponto de defesa para a extensa rede de fungos que habita esta caverna. Ele é imóvel, mas dispara rajadas precisas de veneno contra qualquer coisa que entre em seu campo de visão. Embora o impacto dessas rajadas seja relativamente fraco, elas podem acumular quantidades letais de veneno muito rapidamente. Embora possa ser morto, é provavelmente melhor evitá-lo.
actors.mobs.fungalsentry.name=sentinela fúngica
actors.mobs.fungalspinner.desc=Esta criatura tecelã das cavernas parece estar sendo controlada por um fungo parasita. O fungo também alterou suas habilidades, substituindo sua teia e bolsas de veneno por crescimento fúngico. A criatura tecelã fúngica cuspirá vegetação em você em vez de teias, espalhando fungos e potencialmente enraizando-o. Embora não possa envenenar, a criatura tecelã fúngica ganhará resistência substancial a danos se estiver adjacente a qualquer cogumelo.
actors.mobs.fungalspinner.name=fiador fúngico
actors.mobs.ghoul.desc=À medida que a sociedade anã começou a ruir lentamente e o atual rei dos anões tomou o poder absoluto, aqueles que eram fracos ou que resistiam a ele não eram bem tratados. Conforme o rei se tornava mais hábil no uso da magia negra, ele subjugou esses anões à sua vontade, e agora eles compõem a infantaria de seu exército. Os ghouls não são particularmente fortes sozinhos, mas sempre viajam em grupos e são muito mais difíceis de matar em grande número. _Quando um ghoul é derrotado, ele ressuscita após alguns turnos, contanto que outro ghoul esteja por perto._
actors.mobs.ghoul.name=carniçal anão
actors.mobs.gnoll.desc=Os gnolls são humanoides semelhantes a hienas. Habitam esgotos e masmorras, aventurando-se ocasionalmente à superfície para realizar incursões. Os batedores gnolls são membros regulares de seus bandos; não são tão fortes quanto os brutamontes nem tão inteligentes quanto os xamãs.
actors.mobs.gnoll.name=batedor gnoll
actors.mobs.gnollexile.desc=Este gnoll de pelagem cinza tem uma grande marca no ombro, indicando que é um exilado. Os gnolls geralmente são exilados de sua sociedade por ignorarem ordens ou infringirem leis. Os exilados precisam ser fortes e astutos para sobreviver, e este parece saber usar a lança que empunha.
actors.mobs.gnollexile.desc_aggro=O gnoll exilado olha em volta com raiva. Parece que algo o fez decidir lutar, afinal. Cuidado com aquela lança!
actors.mobs.gnollexile.desc_passive=O gnoll exilado não está se movendo para atacar. Ele não parece tão agressivo quanto os outros gnolls por aqui, e provavelmente não acha que lutar com você valha a pena. Você poderia simplesmente deixá-lo passar, mas ele tem uma mochila que pode estar cheia de itens úteis...
actors.mobs.gnollexile.name=exílio gnoll
actors.mobs.gnollexile.seen_aggro=O gnoll armado com a lança avança para atacar!
actors.mobs.gnollexile.seen_passive=O gnoll que empunha a lança olha para você com cautela, mas não se move para atacar.
actors.mobs.gnollgeomancer.alert=O geomante desperta! Toda a caverna parece se mover enquanto ele salta para longe, rindo loucamente!
actors.mobs.gnollgeomancer.desc=Este gnoll sênior, de estatura impressionante, deve ser a fonte de toda a magia de movimentação de terra por aqui e o organizador de toda a atividade gnoll. Ao contrário dos sapadores gnoll da região, o geomante é bastante hábil com sua magia e não pode ser ferido por pedras arremessadas ou que caem. Contudo, ele não possui nenhuma habilidade para lutar em combate corpo a corpo.
actors.mobs.gnollgeomancer.desc_armor=O geomante está atualmente envolto em uma camada de armadura de pedra. _Você precisará se aproximar e quebrá-la com sua picareta antes de poder causar dano ao geomante._
actors.mobs.gnollgeomancer.desc_armor_sapper=Um gnoll sapador próximo está segurando um dispositivo que está fortalecendo a armadura de pedra do geomante. Você não conseguirá danificá-la de forma alguma agora!
actors.mobs.gnollgeomancer.desc_sleeping=Este xamã gnoll, de estatura impressionante, está cercado por uma camada de rocha e parece quase uma estátua. Observando atentamente, você pode ver a rocha se mover magicamente em sincronia com a respiração do gnoll ancião. Ele não pode ser ferido enquanto estiver envolto em rocha dessa forma e parece estar desfrutando de um cochilo literal na terra. Você provavelmente consegue quebrar as camadas de rocha com sua picareta, mas esteja preparado para uma luta. O geomante deve ser a fonte das várias magias de movimentação de terra por aqui e o organizador de toda a atividade gnoll. Derrotar os gnolls espalhados por aqui antes de enfrentá-lo pode ser uma boa ideia.
actors.mobs.gnollgeomancer.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.gnollgeomancer.name=geomante gnoll
actors.mobs.gnollgeomancer.rock_kill=A pedra voadora te matou...
actors.mobs.gnollgeomancer.rockfall_kill=As pedras que caíram te mataram...
actors.mobs.gnollgeomancer.warning=O geomante começa a se mexer. Certifique-se de estar preparado antes de continuar!
actors.mobs.gnollguard.def_verb=bloqueado
actors.mobs.gnollguard.desc=Um gnoll grande e de aparência robusta, empunhando uma lança e um escudo, mas sem capacete. Esses guardas provavelmente são brutamontes em treinamento, recrutados para ajudar a proteger a mina da vida selvagem invasora. O guarda gnoll é forte o suficiente para empunhar a lança com uma mão, mas não a utiliza muito bem. Ele precisará de um espaço relativamente aberto para atacar à distância e causará consideravelmente menos dano se você se aproximar.
actors.mobs.gnollguard.desc_armor=Um sapador gnoll próximo está segurando um dispositivo que concede a este guarda uma armadura de terra, reduzindo drasticamente o dano que ele recebe.
actors.mobs.gnollguard.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.gnollguard.name=guarda gnoll
actors.mobs.gnollguard.spear_warn=O gnoll desfere um golpe violento com a ponta de sua lança!
actors.mobs.gnollsapper.desc=Um gnoll pequeno e frágil, porém inteligente, com pelagem pálida e uma sacola cheia de diversos apetrechos. Provavelmente está ali para auxiliar na prospecção e mineração de ouro negro, e conta com um guarda por perto para proteção. É capaz de lutar, mas seus ataques são lamentavelmente fracos, não mais fortes que os de um batedor gnoll. Em vez de lutar diretamente, os sapadores preferem usar os diversos apetrechos que possuem para fazer o ambiente rochoso atacar por eles. Contudo, eles próprios não dominam a magia de movimentação de terra, e por isso é bem provável que usem seus apetrechos de forma imprudente. _Deve haver muitas maneiras de usar seus ataques contra eles ou contra seu guarda._
actors.mobs.gnollsapper.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.gnollsapper.name=sapador gnoll
actors.mobs.gnolltrickster.desc=Uma criatura de aparência estranha, mesmo para os padrões dos gnolls. Ela se inclina para a frente com um sorriso malicioso, quase como se estivesse embalando a sacola pendurada no ombro. Seus olhos estão arregalados com uma estranha mistura de medo e excitação. Há uma grande coleção de dardos malfeitos em sua sacola, todos aparentemente com pontas contendo diversas substâncias nocivas.
actors.mobs.gnolltrickster.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.gnolltrickster.name=trapaceiro gnoll
actors.mobs.goldenmimic.desc=Os mímicos são criaturas mágicas que podem assumir qualquer forma que desejarem. Em masmorras, eles quase sempre escolhem a forma de um baú de tesouro para atrair aventureiros desavisados. Os mímicos dourados são mais resistentes e tentam atrair os aventureiros mais fortes. Eles possuem tesouros melhores, mas também são muito mais fortes do que os mímicos comuns.
actors.mobs.goldenmimic.name=imitador dourado
actors.mobs.golem.def_verb=bloqueado
actors.mobs.golem.desc=Os golens são uma tentativa de corrigir as falhas anteriores nas máquinas anãs através do uso recém-descoberto da magia pelos anões. Eles são muito mais compactos e eficientes em comparação com o DM-300, embora ainda sejam muito letais. Apesar de os golens ainda serem grandes demais para passar por corredores, os anões lhes deram novas habilidades mágicas para compensar. Os golens podem se teletransportar entre salas e teletransportar inimigos até eles quando estiverem fora de alcance.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Pouco se sabe sobre a Gosma. É bem possível que nem seja uma criatura, mas sim um conglomerado de substâncias repugnantes dos esgotos que, de alguma forma, adquiriu inteligência básica. De qualquer forma, a magia negra certamente permitiu a existência da Gosma. Sua natureza gelatinosa permite que ela absorva muita energia sombria; você sente um arrepio só de estar perto dela. Se a Gosma for capaz de atacar com essa energia, você não sobreviverá por muito tempo.
actors.mobs.goo.enraged=enfurecido
actors.mobs.goo.gluuurp=GLÚUUURP!
actors.mobs.goo.name=Gosma
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=A gosma está se expandindo!
actors.mobs.goo.rankings_desc=Absorvido pela gosma
actors.mobs.greatcrab.def_verb=bloqueado
actors.mobs.greatcrab.desc=Este caranguejo é gigantesco, mesmo comparado a outros caranguejos de esgoto. Sua carapaça azul está coberta de rachaduras e cracas, mostrando grande idade. Ele se move lentamente, mal conseguindo manter o equilíbrio com sua enorme garra. Embora o caranguejo tenha apenas uma garra, seu tamanho compensa facilmente. Ele mantém a garra à frente de qualquer ameaça, protegendo-se atrás de uma carapaça impenetrável. No entanto, o caranguejo não consegue bloquear ataques que não vê chegando, ou ataques de múltiplos inimigos ao mesmo tempo.
actors.mobs.greatcrab.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.greatcrab.name=grande caranguejo
actors.mobs.greatcrab.noticed=O caranguejo bloqueia com sua enorme garra.
actors.mobs.guard.def_verb=bloqueado
actors.mobs.guard.desc=Outrora guardiões da prisão, esses guardas há muito se tornaram indistinguíveis dos prisioneiros. Cambaleiam como zumbis, vagando sem cérebro pelos corredores em busca de qualquer coisa fora do lugar, como você! \n\n Eles carregam correntes na cintura, possivelmente usadas para atrair inimigos para perto.
actors.mobs.guard.name=guarda prisional
actors.mobs.guard.scorpion=Venha aqui!
actors.mobs.hermitcrab.def_verb=bloqueado
actors.mobs.hermitcrab.desc=Por algum motivo, este caranguejo do esgoto decidiu usar a parte superior quebrada de um barril na cabeça! O peso extra reduziu sua velocidade para o normal, mas também lhe conferiu uma defesa consideravelmente maior. Você acha que consegue ouvir algo se mexendo dentro do barril...
actors.mobs.hermitcrab.name=caranguejo-eremita
actors.mobs.mimic.desc=Os mímicos são criaturas mágicas que podem assumir qualquer forma que desejarem. Em masmorras, eles quase sempre escolhem a forma de um baú de tesouro para atrair aventureiros desavisados. Os mímicos têm uma mordida dolorosa, mas geralmente guardam mais tesouros do que um baú comum.
actors.mobs.mimic.discover_hint=Você pode encontrar esse inimigo em qualquer lugar da masmorra.
actors.mobs.mimic.hidden_hint=Tem algo de estranho nesse baú... Aproximar-me e tentar abri-lo talvez seja uma má ideia.
actors.mobs.mimic.name=imitar
actors.mobs.mimic.reveal=Esse baú é um imitador!
actors.mobs.mob.died=Você ouve algo morrer à distância.
actors.mobs.mob.discover_hint=Você pode encontrar esse inimigo em uma região específica da masmorra.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Morto por: %s
actors.mobs.monk$focus.desc=Este monge está perfeitamente focado em seu alvo e parece antecipar seus movimentos antes mesmo que eles aconteçam. Enquanto estiver concentrado, o próximo ataque físico desferido contra este personagem certamente errará, independentemente das circunstâncias. Aparar este ataque consumirá o foco do monge, que precisará recuperá-lo para aparar outro ataque. Monges acumulam foco mais rapidamente enquanto estão em movimento.
actors.mobs.monk$focus.name=focado
actors.mobs.monk.def_verb=bloqueado
actors.mobs.monk.desc=Esses monges são fanáticos que se dedicaram a proteger seu rei com força física. Tão grande é sua devoção que eles entregaram completamente suas mentes ao rei e agora vagam pela cidade anã como zumbis sem mente. Os monges dependem exclusivamente da arte do combate corpo a corpo e são capazes de usar seus punhos desarmados tanto para ataque quanto para defesa. Quando se concentram, os monges apararão o próximo ataque físico direcionado a eles, mesmo que o acerto fosse garantido. Os monges acumulam concentração mais rapidamente enquanto se movem e mais lentamente em combate direto.
actors.mobs.monk.name=monge anão
actors.mobs.monk.parried=aparado
actors.mobs.necromancer$necroskeleton.desc=Este esqueleto foi invocado por um necromante. Ele se comporta como um esqueleto comum e morrerá quando o necromante que o invocou for morto.
actors.mobs.necromancer$necroskeleton.name=esqueleto de necromante
actors.mobs.necromancer.desc=Esses aprendizes de magos das trevas acorreram à prisão, pois é o lugar perfeito para praticar suas artes malignas. Necromantes invocam e fortalecem esqueletos para lutar por eles. Matar o necromante também mata o esqueleto que ele invoca.
actors.mobs.necromancer.name=necromante
actors.mobs.npcs.blacksmith.cant_enter_old=Essa área não está acessível nesta partida. Inicie um novo jogo para tentar a nova missão!
actors.mobs.npcs.blacksmith.def_verb=bloqueado
actors.mobs.npcs.blacksmith.desc=Este ferreiro troll tem a aparência típica de todos os trolls: alto e magro, com pele que lembra pedra tanto na cor quanto na textura. O ferreiro troll está mexendo com ferramentas desproporcionalmente pequenas.
actors.mobs.npcs.blacksmith.enter_no=Ainda não
actors.mobs.npcs.blacksmith.enter_yes=Estou pronto
actors.mobs.npcs.blacksmith.entrance_blocked=A descida está bloqueada.
actors.mobs.npcs.blacksmith.exit_no=Ainda não
actors.mobs.npcs.blacksmith.exit_warn_crystal=Aquele cristal gigante ainda está lá embaixo também. Eu pago a mais se você o destruir.
actors.mobs.npcs.blacksmith.exit_warn_full=Terminou? Você tem muito ouro, mas certifique-se de não ter deixado nenhum dos seus equipamentos para trás. Lembre-se, não vou deixar você voltar depois que subir.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Aquele cogumelo gigante ainda está lá embaixo também. Eu pago a mais se você o matar.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Aquele geomante gnoll ainda está lá embaixo também. Eu pago a mais se você o matar.
actors.mobs.npcs.blacksmith.exit_warn_high=Você terminou? Parece que você conseguiu uma boa quantidade de ouro, mas eu poderia usar um pouco mais. Você deve conseguir 40 peças. Lembre-se, eu não vou deixar você voltar depois que você subir.
actors.mobs.npcs.blacksmith.exit_warn_low=Você já terminou? Não parece que você tenha muito ouro. Você deveria conseguir 40 peças. Lembre-se, eu não vou deixar você voltar depois que você subir.
actors.mobs.npcs.blacksmith.exit_warn_med=Você terminou? Pelo menos você conseguiu um pouco de ouro, mas com certeza tem mais na mina. Você deve conseguir _40 peças_._\n\n_Lembre-se, eu não vou deixar você voltar depois que você subir._
actors.mobs.npcs.blacksmith.exit_warn_none=Você já terminou? Você quase não tem ouro nenhum! Você deveria conseguir 40 peças. Lembre-se, eu não vou deixar você voltar depois que você subir.
actors.mobs.npcs.blacksmith.exit_yes=Terminei
actors.mobs.npcs.blacksmith.get_lost=Estou ocupado. Some daqui!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Ei, humano! Você parece ser uma pessoa importante.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Mas cuidado, a mina é perigosa para um humanozinho como você. Ela está abandonada há um tempo, e vários cristais começaram a crescer. Eles são brilhantes, mas frágeis demais para valerem alguma coisa, e têm alguma proteção mágica. Eles são bem fortes, então _tome cuidado onde você minera_ ou você vai chamar a atenção deles. Há um _cristal gigante_ em algum lugar também. Ele é bem mais resistente, então prepare-se para uma luta se você começar a quebrá-lo. Aposto que quebrá-lo vai diminuir o crescimento de todos os outros cristais, então eu pago um extra se você conseguir fazer isso.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Ei, humano! Você parece ser uma pessoa corajosa.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Mas cuidado, a mina é perigosa para um humano pequeno como você. Há uma espécie de monstro fungo crescendo lá embaixo. Ele tem sentinelas de cogumelo que são realmente mortais se te virem, mas pelo menos não conseguem se levantar e te perseguir. _Mantenha-se fora de vista_ se quiser sobreviver. Pagarei um extra se você conseguir derrotar o _maior cogumelo_, mas vai exigir um esforço considerável. Ele está conectado a vários nós de micélio escondidos nas paredes. Você terá que quebrar a maioria deles antes de conseguir causar dano real.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Mas cuidado, a mina é perigosa para um humanozinho como você. Uns gnolls também querem o ouro e agora estão destruindo tudo. Eles são uns idiotas, então a mineração deles causou todo tipo de desabamento e desmoronamento. Você vai ter que minerar por ali, então procure por rochas recentemente perturbadas. Acho que um dos gnolls está causando a maior parte dos problemas, provavelmente um xamã geomante ou algo assim. Eu pago um extra se você conseguir encontrá-lo e matá-lo, mas tenho certeza de que ele vai lutar.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Ei, humano! Você parece ser bem rápido.
actors.mobs.npcs.blacksmith.intro_quest_mage=Ei, humano! Você parece ser inteligente.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Ei, humano! Você parece ser bem esperto.
actors.mobs.npcs.blacksmith.intro_quest_start=Quer ser útil, é? É, tenho algo que você pode fazer. Construí esta oficina em cima de uma mina antiga, é só descer aquela escada. Pegue esta picareta e mine um pouco de minério de ouro escuro para mim. Quarenta peças devem ser suficientes. A rocha lá embaixo é bem macia, então você conseguirá minerar através das paredes com um pouco de esforço. O que você quer dizer com "como vou pagar"? Seu ganancioso... Ok, ok, posso fazer um trabalho de ferreiro para você. Considere-se com sorte, sou o único ferreiro por aqui.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Ei, humano! Você parece ser durão.
actors.mobs.npcs.blacksmith.lost_pick=Você está brincando comigo? Onde está minha picareta?!
actors.mobs.npcs.blacksmith.name=ferreiro troll
actors.mobs.npcs.blacksmith.quest_start_prompt=Pronto para descer? Certifique-se de ter espaço livre para o ouro. \n\n_Só vou te decepcionar uma vez!_
actors.mobs.npcs.blacksmith.reminder=Você já terminou de me fazer perder tempo? A entrada da mina é por ali.
actors.mobs.npcs.blacksmith.reminder_crystal=Traga-me o máximo de ouro que puder e tente quebrar o grande cristal também.
actors.mobs.npcs.blacksmith.reminder_fungi=Traga-me o máximo de ouro que puder e tente matar o cogumelo gigante também.
actors.mobs.npcs.blacksmith.reminder_gnoll=Traga-me o máximo de ouro que puder e tente matar o geomante gnoll também.
actors.mobs.npcs.ghost.crab_1=Olá %s... Um dia eu fui como você - forte e confiante... Mas fui morto por uma criatura ancestral... Não posso sair deste lugar... Não até que eu tenha minha vingança... Mate o _grande caranguejo_ que tirou minha vida... \n\n Ele é anormalmente antigo... Com uma única garra enorme e uma carapaça grossa... _Cuidado com sua garra, você deve surpreender o caranguejo ou ele o usará para bloquear..._
actors.mobs.npcs.ghost.crab_2=Por favor... Me ajude... Derrote o crustáceo... \n\n_Ele sempre bloqueará... Quando te vir chegando..._
actors.mobs.npcs.ghost.desc=O fantasma é quase invisível. Parece um ponto disforme de luz fraca com um rosto triste.
actors.mobs.npcs.ghost.find_me=Obrigado... venha me encontrar...
actors.mobs.npcs.ghost.gnoll_1=Olá %s... Um dia eu fui como você - forte e confiante... Mas fui morto por um inimigo traiçoeiro... Não posso sair deste lugar... Não até que eu tenha minha vingança... Mate o gnoll trapaceiro que tirou minha vida... \n\n Ele não é como os outros gnolls... Ele se esconde e usa armas de arremesso... Cuidado com seus dardos venenosos e incendiários, não ataque à distância...
actors.mobs.npcs.ghost.gnoll_2=Por favor... Ajude-me... Derrote o trapaceiro... \n\n_Não deixe que ele te atinja... Chegue perto dele..._
actors.mobs.npcs.ghost.name=fantasma triste
actors.mobs.npcs.ghost.rat_1=Olá %s... Um dia eu fui como você - forte e confiante... Mas fui morto por uma besta imunda... Não posso sair deste lugar... Não até que eu tenha minha vingança... Mate o rato fétido que tirou minha vida... \n\n Ele espreita neste andar... Espalhando imundície por toda parte... Cuidado com sua nuvem de fedor e mordida corrosiva, o ácido se dissolve na água...
actors.mobs.npcs.ghost.rat_2=Por favor... Ajude-me... Derrote a abominação... \n\n_Lute perto da água... Evite o fedor..._
actors.mobs.npcs.imp.cya=Até logo, %s!
actors.mobs.npcs.imp.desc=Os diabinhos são demônios menores. Não se destacam nem pela força nem pelo talento mágico, mas são bastante inteligentes e sociáveis. Muitos diabinhos preferem viver entre não-demônios.
actors.mobs.npcs.imp.golems_1=No meu caso, são os _golems_ que precisam ser mortos. Veja bem, vou começar um pequeno negócio aqui, mas esses golems estúpidos atrapalham os negócios! É muito difícil negociar com esses pedaços de granito errantes, malditos! Então, por favor, mate... digamos, _4 deles_ e você receberá uma recompensa.
actors.mobs.npcs.imp.golems_2=Como está indo seu safari de golems? Só não se esqueça de pegar as fichas.
actors.mobs.npcs.imp.hey=Psiu, %s!
actors.mobs.npcs.imp.intro=Você é um aventureiro? Eu adoro aventureiros! Sempre podemos contar com eles quando precisamos matar alguém, não é? Por uma recompensa, é claro ;)
actors.mobs.npcs.imp.monks_1=No meu caso, são os _monges_ que precisam ser mortos. Veja bem, vou começar um pequeno negócio aqui, mas esses lunáticos não compram nada e vão espantar os outros clientes. Então, por favor, mate... digamos, _5 deles_ e você receberá uma recompensa.
actors.mobs.npcs.imp.monks_2=Ah, você ainda está vivo! Eu sabia que seu kung-fu seria mais forte ;) Só não se esqueça de pegar as fichas.
actors.mobs.npcs.imp.name=ambicioso imp
actors.mobs.npcs.impshopkeeper.buyback=O duende devolve alegremente o seu objeto.
actors.mobs.npcs.impshopkeeper.desc=O duende montou uma lojinha na entrada dos corredores internos. É bom ver um rosto amigo, mas seus preços certamente não parecem amigáveis.
actors.mobs.npcs.impshopkeeper.greetings=Olá, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=O que você fez, %s? Compre rápido, preciso sair daqui!
actors.mobs.npcs.impshopkeeper.name=ambicioso imp
actors.mobs.npcs.impshopkeeper.thief=Pensei que podia confiar em você!
actors.mobs.npcs.mirrorimage.desc=Essa ilusão se assemelha muito a você, chegando a parecer empunhar sua arma e armadura atuais. As imagens espelhadas buscarão e atacarão inimigos usando suas armas imitadas, que se comportam da mesma forma que as suas, mas causam menos dano. Elas começam quase invisíveis, mas precisam assumir uma forma mais visível para atacar. Embora seu poder ofensivo possa ser considerável, as imagens espelhadas não têm durabilidade e desaparecem assim que sofrem dano.
actors.mobs.npcs.mirrorimage.discover_hint=Você pode encontrar esse personagem com um pergaminho específico.
actors.mobs.npcs.mirrorimage.name=imagem espelhada
actors.mobs.npcs.npc.discover_hint=Você pode encontrar esse personagem em uma região específica da masmorra.
actors.mobs.npcs.prismaticimage.desc=Essa ilusão cintilante se assemelha muito a você, chegando a parecer empunhar sua arma e armadura atuais. As imagens prismáticas tentarão atrair e desviar a atenção dos inimigos, usando sua defesa e saúde aprimoradas para protegê-lo. Embora não possuam o mesmo poder ofensivo que as imagens espelhadas, elas têm durabilidade aprimorada, incluindo benefícios da sua armadura. Quando reduzidas a 0 pontos de vida, as imagens prismáticas desaparecerão ao longo de vários turnos, podendo ainda ser curadas durante esse período. Quando não houver inimigos presentes, as imagens prismáticas desaparecerão e retornarão ao seu mestre.
actors.mobs.npcs.prismaticimage.discover_hint=Você pode encontrar esse personagem com um pergaminho específico.
actors.mobs.npcs.prismaticimage.name=imagem prismática
actors.mobs.npcs.ratking.confused=O quê... Onde estou? Meu reino precisa de mim!
actors.mobs.npcs.ratking.crown_after=Gostando da sua nova armadura? Sem volta!
actors.mobs.npcs.ratking.crown_clothes=Vista-se! Você não está em condições de falar com a realeza!
actors.mobs.npcs.ratking.crown_desc=Oooh, essa coroa é para mim!? Ela parece muito mais brilhante que a minha, então eu a aceito de bom grado! Na verdade, acho que posso lhe oferecer algo como recompensa por esta coroa. Um poder tremendo, digno de um herói como você! Gostaria disso?
actors.mobs.npcs.ratking.crown_fine=Ótimo! Não é como se eu quisesse isso de qualquer forma...
actors.mobs.npcs.ratking.crown_info=Conte-me mais primeiro.
actors.mobs.npcs.ratking.crown_no=Eu preferiria não...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, obrigada! Agora vá e faça seu rei se orgulhar!
actors.mobs.npcs.ratking.crown_yes=Claro!
actors.mobs.npcs.ratking.desc=Este rato é um pouco maior que um rato marsupial comum. Ele está usando uma pequena coroa na cabeça.
actors.mobs.npcs.ratking.desc_birthday=Este rato é um pouco maior que um rato marsupial comum. Ele está usando um pequeno chapéu de festa verde em vez de sua coroa habitual. Feliz aniversário, Rei dos Ratos!
actors.mobs.npcs.ratking.desc_crown=Este rato é um pouco maior que um rato marsupial comum. Ele está usando uma coroa de rei anão na cabeça.
actors.mobs.npcs.ratking.desc_winter=Este rato é um pouco maior que um rato marsupial comum. Ele está usando um pequeno chapéu festivo em vez de sua coroa habitual. Boas Festas!
actors.mobs.npcs.ratking.discover_hint=Você pode encontrar esse personagem no final de uma região específica da masmorra.
actors.mobs.npcs.ratking.name=rei dos ratos
actors.mobs.npcs.ratking.not_sleeping=Não estou conseguindo dormir!
actors.mobs.npcs.ratking.what_is_it=O que é isso? Não tenho tempo para essas bobagens. Meu reino não se governará sozinho!
actors.mobs.npcs.sheep.baa!=Bééé!
actors.mobs.npcs.sheep.baa.=Bééé.
actors.mobs.npcs.sheep.baa...=Béé...
actors.mobs.npcs.sheep.baa?=Bééé?
actors.mobs.npcs.sheep.def_verb=bloqueado
actors.mobs.npcs.sheep.desc=Esta é uma ovelha mágica. O que tem de mágico nela? Você não pode matá-la. Ela ficará parada até desaparecer magicamente, ruminando o tempo todo com um olhar vago.
actors.mobs.npcs.sheep.discover_hint=Você pode encontrar esse personagem com um item ou armadilha específica.
actors.mobs.npcs.sheep.name=ovelha
actors.mobs.npcs.shopkeeper.buyback=O lojista, a contragosto, devolve o seu produto.
actors.mobs.npcs.shopkeeper.desc=Esse sujeito robusto parece mais apropriado para um distrito comercial de uma grande cidade do que para uma masmorra. Seus preços explicam por que ele prefere fazer negócios aqui.
actors.mobs.npcs.shopkeeper.flee=O lojista foge!
actors.mobs.npcs.shopkeeper.name=lojista
actors.mobs.npcs.shopkeeper.sell=Venda um item
actors.mobs.npcs.shopkeeper.talk=Falar
actors.mobs.npcs.shopkeeper.talk_ascent=Não sei o que você pretende fazer com esse amuleto, mas não quero ter nada a ver com isso. Compre alguma coisa e vá embora, nós dois precisamos sair daqui!
actors.mobs.npcs.shopkeeper.talk_caves=Gaste dinheiro, viva mais. \n\n Ah, e mande um abraço para aquele ferreiro troll se você o vir. Lembre o otário que ele ainda me deve dinheiro pelo martelo que vendi para ele semana passada!
actors.mobs.npcs.shopkeeper.talk_city=Meus produtos podem te manter seguro aqui embaixo. \n\n... E, por favor, não fique por aqui. Demorou uma eternidade para convencer os moradores locais a me deixarem em paz, não quero que você arrume confusão!
actors.mobs.npcs.shopkeeper.talk_halls=Olá! Tenho preços especiais para caçadores de demônios! ZXQPH0 ZXQ ZXQPH1 ZXQ Ah, e cuidado lá embaixo! Os demônios não se importam com a sua coragem. Você não poderá voltar e gastar mais dinheiro se estiver morto! ;) ZXQPH2 ZXQ ZXQPH3 ZXQ Os demônios são como eu? Hehe, de jeito nenhum. Sou apenas um sujeito pequeno, não sou lá um grande lutador, e consegui manter minha sanidade intacta. Os demônios lá embaixo são criaturas muito mais fortes, e todos foram escravizados por... bem... apenas tome cuidado lá embaixo.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Olá, Alteza, ou seria Santidade agora? Hehe, de qualquer forma, este não é lugar para você. Muita gente ficaria arrasada se você acabasse morto. Mas certamente você tem algumas moedas, por que não comprar algo para evitar isso?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ora, se não é o herói viajante! Se você está tentando salvar outra cidade, boa sorte, os perigos aqui são muito piores do que gangues de bandidos insignificantes. Tenho certeza de que você se sairá melhor do que qualquer um, só tente não morrer bem na porta da minha loja.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Você parece estar fora do seu elemento, senhorita. Os corredores estreitos das masmorras não são tão espaçosos quanto os grandes salões ou as florestas que cercam a cidade, não é? Hehe, ah, não se importe com o meu devaneio, por que não compra alguma coisa?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Tenho tudo o que você precisa para uma aventura de sucesso!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, acho que já vi um cartaz de procurado com seu nome em algum lugar da cidade. Está foragido, é? Ah, você é inocente, não é? Claro, claro... Não se preocupe, tenho coisas melhores para fazer do que escrever sobre você, mas talvez devesse comprar alguma coisa para ter certeza?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Você veio da guilda dos ladrões para limpar a área? Não, só estava fazendo compras? Bom, mate alguns monstros enquanto estiver aqui. E não espere desconto, eu pago uma boa grana de proteção para vocês e mal me protegem aqui embaixo.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Que selo interessante você tem aí, geralmente eles vêm inteiros. Você é um herói em desgraça ou algo assim? Bem, seja lá o que você tenha feito, não é da minha conta, suas moedas ainda valem.
actors.mobs.npcs.shopkeeper.thief=Ladrão, ladrão!
actors.mobs.npcs.shopkeeper.warn=Cuidado! Não vou avisar novamente.
actors.mobs.npcs.vaultlaser.desc=Esta sentinela está disparando lasers em intervalos regulares. _Como esta é apenas uma área de testes, os lasers não irão realmente te ferir._
actors.mobs.npcs.vaultlaser.name=sentinela laser do cofre
actors.mobs.npcs.vaultsentry.desc=Esta sentinela está escaneando a área seguindo um padrão. _Como esta é apenas uma área de teste, a sentinela não fará nada se detectar você._
actors.mobs.npcs.vaultsentry.name=sentinela de varredura do cofre
actors.mobs.npcs.wandmaker.def_verb=bloqueado
actors.mobs.npcs.wandmaker.desc=Este senhor idoso, porém vigoroso, exibe uma expressão ligeiramente confusa. Ele está protegido por um escudo mágico.
actors.mobs.npcs.wandmaker.intro_1=Vim aqui para encontrar um ingrediente raro para uma varinha, mas me perdi e meu escudo mágico está enfraquecendo. Preciso partir em breve, mas não suporto ir embora sem conseguir o que vim buscar.
actors.mobs.npcs.wandmaker.intro_2=Se você conseguir isso para mim, terei o maior prazer em lhe pagar com uma das minhas varinhas finamente trabalhadas! Trouxe duas comigo, então você pode escolher a que preferir.
actors.mobs.npcs.wandmaker.intro_berry=O antigo carcereiro desta prisão mantinha uma planta de _podberry_, e eu estou atrás de uma de suas sementes. A planta provavelmente já se espalhou descontroladamente, então conseguir que ela dê uma semente pode ser complicado. Seu jardim deve estar por aqui. Tente _ficar longe de seus espinhos_ se quiser sair ileso. Usar fogo pode ser tentador, mas por favor, não faça isso, você matará a planta e destruirá suas sementes.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, olá, Alteza! Que agradável surpresa encontrá-lo num lugar tão deprimente! Detesto incomodar, mas talvez eu tenha uma tarefa para o senhor.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, olá, senhorita! Que agradável surpresa encontrar um herói num lugar tão deprimente! Se estiver disposta a ajudar um velhinho, talvez eu tenha uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_dust=Estou procurando por pó de cadáver. É um tipo especial de farinha de osso amaldiçoada que costuma aparecer em lugares como este. Deve haver uma sala barricada por aqui em algum lugar, tenho certeza de que você encontrará um pouco de pó lá. Mas tenha cuidado, a maldição que o pó carrega é muito forte. Volte o mais rápido possível e eu o purificarei para você.
actors.mobs.npcs.wandmaker.intro_ember=Estou procurando por brasas frescas de um elemental de fogo recém-nascido. Elementais geralmente aparecem quando um ritual de invocação não é controlado, então basta encontrar algumas velas e um local para o ritual e tenho certeza de que você conseguirá fazer um aparecer. No entanto, você deve evitar se encurralar durante a luta, ou pode manter algum item congelante por perto. Elementais recém-nascidos são bastante poderosos e caóticos, mas não suportam o frio.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, olá, senhorita! Um rosto amigável é uma agradável surpresa por aqui, não é? Aliás, juro que já vi seu rosto antes, mas não consigo me lembrar de onde... Ah, deixa pra lá, se você está aqui em busca de aventura, talvez eu tenha uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_mage=Ah, olá %s! Ouvi dizer que houve alguma confusão envolvendo você e o instituto de magos? Ah, deixa pra lá, nunca gostei daqueles chatos mesmo. Se você estiver disposto, talvez eu tenha uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_rogue=Nossa, você me assustou! Nunca encontrei um bandido deste lugar que ainda estivesse são, então você deve ser da superfície! Se estiver disposto a ajudar um estranho, talvez eu tenha uma tarefa para você.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, olá! Que agradável surpresa encontrar um guerreiro do norte num lugar tão deprimente! Você deve ter viajado bastante para chegar aqui. Se estiver em busca de aventura, talvez eu tenha uma tarefa para você.
actors.mobs.npcs.wandmaker.name=velho fabricante de varinhas
actors.mobs.npcs.wandmaker.reminder_berry=Teve sorte com a semente de Rotberry, %s? Procure por uma sala cheia de vegetação.
actors.mobs.npcs.wandmaker.reminder_dust=Alguma sorte com o pó de cadáver, %s? Procure por algumas barricadas.
actors.mobs.npcs.wandmaker.reminder_ember=Teve sorte com aquelas brasas, %s? Você vai precisar encontrar quatro velas e o local do ritual.
actors.mobs.phantompiranha.desc=As piranhas fantasmas são uma espécie rara de piranha com habilidades mágicas e corpos translúcidos e misteriosos. Elas são capazes de se teletransportar quando atacadas, seja para escapar ou para se aproximar rapidamente do inimigo! Embora sejam irritantes de enfrentar, sua carne é valorizada por suas propriedades mágicas.
actors.mobs.phantompiranha.name=piranha fantasma
actors.mobs.phantompiranha.teleport_away=A piranha fantasma se teletransporta para longe...
actors.mobs.piranha.desc=Esses peixes carnívoros são criados especificamente para proteger áreas alagadas. Sua mordida é mortal, por isso é melhor evitar o contato direto com eles.
actors.mobs.piranha.discover_hint=Você pode encontrar esse inimigo em qualquer lugar da masmorra.
actors.mobs.piranha.name=piranha gigante
actors.mobs.pylon.desc_active=Um poste de energia, projetado para ajudar a regular a eletricidade que alimenta as máquinas nesta área. O poste está atualmente carregado com energia elétrica; deve ser isso que está sobrecarregando o DM-300! \n\n Neste estado, os postes são vulneráveis, mas emitem arcos elétricos para as células próximas em sentido horário. Devido à sua construção robusta em metal, os postes são resistentes a grandes danos.
actors.mobs.pylon.desc_inactive=Uma torre de transmissão de energia, destinada a ajudar a regular a eletricidade que alimenta as máquinas nesta área. A torre encontra-se atualmente inativa e imune a danos.
actors.mobs.pylon.name=torre de energia
actors.mobs.rat.desc=Os ratos marsupiais são habitantes agressivos, porém relativamente frágeis, dos esgotos. Possuem uma mordida dolorosa, mas só representam risco de vida em grande número.
actors.mobs.rat.name=rato marsupial
actors.mobs.ripperdemon.desc=Essas criaturas horripilantes são o resultado dos inúmeros cadáveres de anões nesta região, que foram utilizados por forças demoníacas. Os Estripadores são criaturas emaciadas e grotescas que se assemelham a anões, mas com corpos mutilados e longas garras afiadas feitas de osso. Os demônios Estripadores não são particularmente resistentes, mas são ágeis e perigosos. Eles são capazes de saltar grandes distâncias para alcançar rapidamente seus alvos antes de dilacerá-los com suas garras.
actors.mobs.ripperdemon.leap=O demônio estripador se prepara para atacar!
actors.mobs.ripperdemon.name=demônio estripador
actors.mobs.rotheart.desc=O fruto da Rotberry é muito singular. Em vez de apodrecer e liberar nutrientes, ele cresce, endurece e envolve a semente. Isso proporciona proteção aos órgãos internos que se desenvolvem dentro do fruto. Essa esfera gigante é considerada o coração da planta adulta de Rotberry.
actors.mobs.rotheart.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.rotheart.name=coração podre
actors.mobs.rotlasher.desc=O chicote da podridão faz parte da estrutura radicular de uma planta de podridão madura e também é seu principal meio de defesa. Os chicotes são cegos e ficam presos no chão, mas atacam violentamente qualquer ameaça próxima após detectá-la por um instante. Quando não há inimigos por perto, eles permanecem imóveis, tentando se camuflar com a vegetação ao redor.
actors.mobs.rotlasher.discover_hint=Você pode encontrar esse inimigo durante uma missão específica.
actors.mobs.rotlasher.name=chicoteador de podridão
actors.mobs.scorpio.desc=Essas enormes criaturas demoníacas, semelhantes a aracnídeos, evitam o combate corpo a corpo, preferindo disparar espinhos serrilhados incapacitantes a longas distâncias.
actors.mobs.scorpio.name=Escorpião
actors.mobs.senior.desc=Esses monges são fanáticos que se dedicaram a proteger seu rei com força física. Tão grande é sua devoção que entregaram completamente suas mentes ao rei e agora vagam pela cidade anã como zumbis sem cérebro. Este monge domina a arte do combate corpo a corpo e consegue se concentrar enquanto se move muito mais rapidamente do que monges comuns. Quando se concentram, os monges apararão o próximo ataque físico usado contra eles, mesmo que o acerto fosse garantido. Os monges acumulam concentração mais rapidamente enquanto se movem e mais lentamente em combate direto.
actors.mobs.senior.name=monge sênior
actors.mobs.shaman$blueshaman.spell_desc=Este xamã usa uma máscara azul e utiliza magia que aumenta temporariamente o dano recebido.
actors.mobs.shaman$purpleshaman.spell_desc=Este xamã usa uma máscara roxa e utilizará magia que reduz temporariamente sua precisão e evasão.
actors.mobs.shaman$redshaman.spell_desc=Este xamã usa uma máscara vermelha e utilizará magia que enfraquece temporariamente seu poder de ataque.
actors.mobs.shaman.bolt_kill=O raio mágico te matou...
actors.mobs.shaman.desc=Os xamãs gnolls são gnolls inteligentes que usam magias de batalha para compensar sua falta de força física. Eles têm uma posição muito respeitada na sociedade gnoll, apesar de sua força inferior.
actors.mobs.shaman.name=xamã gnoll
actors.mobs.skeleton.def_verb=bloqueado
actors.mobs.skeleton.desc=Os esqueletos são compostos pelos ossos de aventureiros azarados e habitantes da prisão, animados por emanações de magia maligna das profundezas. Após sofrerem danos suficientes, os esqueletos se desintegram em uma explosão de ossos. Os estilhaços dessa explosão são nocivos a tudo que estiver por perto, mas armaduras são muito eficazes para mitigar o dano.
actors.mobs.skeleton.explo_kill=Você foi morto pela explosão de ossos...
actors.mobs.skeleton.name=esqueleto
actors.mobs.slime.def_verb=bloqueado
actors.mobs.slime.desc=Os slimes são criaturas estranhas, ligeiramente mágicas, com um corpo externo emborrachado e um núcleo líquido. Os esgotos da cidade fornecem-lhes um amplo suprimento de água e nutrientes. Devido à sua membrana externa elástica, é difícil causar mais de 6 de dano a um slime com um único ataque.
actors.mobs.slime.name=gosma
actors.mobs.snake.desc=Essas serpentes gigantescas são capazes de se esquivar rapidamente dos golpes, tornando-as bastante difíceis de acertar. Ataques mágicos ou ataques surpresa, no entanto, podem pegá-las desprevenidas. Você pode realizar um ataque surpresa atacando enquanto estiver fora do campo de visão da serpente. Uma maneira é deixar uma serpente persegui-lo por uma porta e então atacar logo após ela entrar.
actors.mobs.snake.hint=Experimente usar o botão de examinar em uma cobra para aprender como combatê-la.
actors.mobs.snake.name=cobra de esgoto
actors.mobs.spectralnecromancer.desc=Embora esqueletos sejam o ganha-pão de um necromante, alguns preferem explorar outros lacaios menos corpóreos. Necromantes espectrais escolheram espectros como seus lacaios prediletos! Espectros individuais não são tão fortes quanto esqueletos, mas esses necromantes não têm medo de invocar vários deles!
actors.mobs.spectralnecromancer.name=necromante espectral
actors.mobs.spinner.desc=Essas aranhas-das-cavernas esverdeadas e peludas tentam evitar o combate direto. Em vez disso, preferem esperar à distância enquanto sua vítima se debate em sua teia excretada, morrendo lentamente devido à sua picada venenosa. Elas são capazes de lançar suas teias a grandes distâncias e tentarão bloquear qualquer caminho que sua presa esteja seguindo.
actors.mobs.spinner.name=fiandeiro de caverna
actors.mobs.statue.def_verb=bloqueado
actors.mobs.statue.desc=Você poderia pensar que é apenas mais uma das estátuas inanimadas desta masmorra, mas seus olhos vermelhos brilhantes a denunciam.
actors.mobs.statue.desc_weapon=Embora a estátua em si seja feita de pedra, o _%s_ que ela empunha parece real.
actors.mobs.statue.discover_hint=Você pode encontrar esse inimigo em qualquer lugar da masmorra.
actors.mobs.statue.name=estátua animada
actors.mobs.succubus.desc=Súcubos são demônios metamorfos que manipulam as mentes de suas presas. Este assumiu a forma de um humanoide gótico pálido, talvez para atrair feiticeiros anões? Os súcubos podem enfeitiçar temporariamente seus inimigos ao atacá-los, tornando-os incapazes de atacá-los diretamente. Quando atacam um inimigo enfeitiçado, roubam parte de sua essência vital.
actors.mobs.succubus.name=súcubo
actors.mobs.swarm.desc=O enxame mortal de moscas zumbia furiosamente. Qualquer ataque não mágico o dividiria em dois enxames menores, mas igualmente perigosos.
actors.mobs.swarm.name=enxame de moscas
actors.mobs.tengu$bombability$bombblob.desc=Uma nuvem de fumaça superaquecida está se formando aqui. Cuidado, ela vai explodir!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Está grudado no chão, você não consegue movê-lo!
actors.mobs.tengu$bombability$bombitem.desc=Tengu lançou uma bomba de fumaça de aparência estranha aqui, que está expelindo uma fumaça densa e quente. Ela está fazendo um barulho alto de tique-taque, como se estivesse fazendo a contagem regressiva para uma explosão! A bomba se fixou no chão, então você não pode pegá-la.
actors.mobs.tengu$bombability$bombitem.name=bomba de fumaça
actors.mobs.tengu$fireability$fireblob.desc=Tengu lançou um pó fino que parece estar se transformando em vapor, prestes a inflamar!
actors.mobs.tengu$shockerability$shockerblob.desc=Energia elétrica está se acumulando aqui, qualquer coisa que estiver sobre esta peça levará um choque na próxima jogada!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Está emitindo muita eletricidade, você não consegue pegá-lo!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu jogou aqui uma máquina curiosa, que parece ser feita de peças DM-100. A máquina está constantemente emitindo faíscas elétricas ao seu redor, mas parece seguir um padrão previsível. Com toda essa eletricidade emitindo faíscas, é impossível pegá-la.
actors.mobs.tengu$shockerability$shockeritem.name=Chocante
actors.mobs.tengu.defeated=Finalmente livre...
actors.mobs.tengu.desc=Um assassino famoso e enigmático, cujo nome deriva da máscara colada em seu rosto. Tengu está preso por grandes algemas nos pulsos e joelhos, embora pareça ter se livrado de suas correntes há muito tempo. Ele tentará usar armadilhas, magia enganosa e ataques precisos para eliminar a única coisa que impede sua fuga: você.
actors.mobs.tengu.interesting=Vamos tornar isso interessante...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Entendi, %s!
actors.mobs.tengu.notice_have=Agora te peguei, %s!
actors.mobs.tengu.rankings_desc=Assassinado pelo Tengu
actors.mobs.thief.carries=O ladrão está carregando um %s. Obviamente roubado.
actors.mobs.thief.desc=Embora esses prisioneiros circulem livremente fora de suas celas, este lugar ainda é a prisão deles. Com o tempo, este lugar também lhes roubou a mente e a liberdade. Há muito tempo, esses ladrões e bandidos insanos esqueceram quem são e por que roubam. Esses inimigos têm mais probabilidade de roubar e fugir do que de lutar. Certifique-se de mantê-los à vista, ou você pode nunca mais ver seu item roubado.
actors.mobs.thief.escapes=O ladrão fugiu com seu %s!
actors.mobs.thief.name=ladrão louco
actors.mobs.thief.stole=O ladrão roubou %s de você!
actors.mobs.tormentedspirit.desc=Espíritos atormentados são espíritos de boa índole que foram afligidos por uma maldição. Enquanto estiverem amaldiçoados, atacarão como um espectro e serão ainda mais poderosos! Pode ser possível remover a maldição usando o item certo perto do espírito. Se a maldição for removida, o espírito certamente ficará grato...
actors.mobs.tormentedspirit.name=espírito atormentado
actors.mobs.tormentedspirit.thank_you=Obrigado...
actors.mobs.vaultrat.desc=Este rato apresenta algumas mudanças de comportamento para testar a nova IA dos inimigos do cofre: \n_-_ Seu movimento pode ser 'ouvido' através das paredes. \n_-_ Ele irá percorrer uma rota predefinida. \n_-_ Enquanto estiver vagando, seu alcance de detecção é drasticamente reduzido na direção em que se move. \n_-_ Enquanto estiver dormindo, seu alcance de detecção também é reduzido. \n_-_ Quando ele detectar você, irá 'investigar' antes de começar a caçar. Inimigos investigando se movem em sua direção, mas não atacam e são mais fáceis de despistar atrás de portas e cantos.
actors.mobs.warlock.bolt_kill=O raio sombrio te matou...
actors.mobs.warlock.desc=À medida que os interesses dos anões se deslocavam da engenharia para as artes arcanas, os feiticeiros ascenderam ao poder na cidade. Começaram com magia elemental, mas logo migraram para a demonologia e a necromancia. O mais poderoso desses feiticeiros tomou o trono da cidade anã, e seus seguidores foram autorizados a continuar praticando sua magia negra, contanto que lhe entregassem seu livre-arbítrio. Esses feiticeiros possuem uma poderosa magia disruptiva e são capazes de impedir temporariamente a magia de aprimoramento aplicada aos seus equipamentos. Quanto mais aprimorado for um item, mais fortemente ele será afetado.
actors.mobs.warlock.name=feiticeiro anão
actors.mobs.wraith.desc=Um espectro é o espírito vingativo de um pecador, cujo túmulo ou sepultura foi violado. Por ser uma entidade etérea, é muito difícil atingi-lo com uma arma comum.
actors.mobs.wraith.discover_hint=Você pode encontrar esse inimigo em qualquer lugar da masmorra.
actors.mobs.wraith.name=espectro
actors.mobs.yogdzewa$larva.desc=Essas minúsculas crias de Yog-Dzewa são lacaios simples e fáceis de produzir. Embora individualmente fracos, são invocados rapidamente e podem se tornar opressores em grande número.
actors.mobs.yogdzewa$larva.name=larva de deus
actors.mobs.yogdzewa$larva.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa.darkness=A escuridão se aproxima...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa é um Deus Antigo; uma grande monstruosidade que invade mundos mortais e os devora para alimentar seu crescimento infinito. Os anões devem ter atraído a atenção desse horror cósmico enquanto brincavam com magias negras e, desde então, vêm tentando mantê-lo contido. Yog-Dzewa se origina de uma dimensão de puro caos mágico e não pode trazer sua verdadeira forma para este mundo. Em vez disso, criou avatares e invocou lacaios demoníacos para cumprir suas ordens aqui. Este olho gigante é o ponto focal do poder de Yog-Dzewa neste mundo. Embora o olho em si seja imóvel, ele é capaz de disparar poderosos raios de magia demoníaca e invocar uma variedade de lacaios para auxiliá-lo.
actors.mobs.yogdzewa.desc_spawners=Você consegue sentir ondas de energia demoníaca irradiando dos andares superiores até seus olhos. Algo que você deixou vivo lá em cima deve estar canalizando poder de volta para Yog-Dzewa. _Yog usará essa energia para invocar lacaios mais poderosos!_
actors.mobs.yogdzewa.hope=SUA. ESPERANÇA. É. UMA. ILUSÃO!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=EU TE VEJO.
actors.mobs.yogdzewa.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Este punho é formado de pura energia luminosa. Ele é capaz de disparar poderosos raios de luz escaldante a cada turno! Esses raios irão cegá-lo temporariamente, além de causar dano pesado. O punho também é capaz de envolver brevemente a arena em uma luz ofuscante para escapar! O punho não possui habilidades especiais que possam ser usadas em combate corpo a corpo.
actors.mobs.yogfist$brightfist.name=punho brilhante
actors.mobs.yogfist$brightfist.teleport=O punho se teletransporta num clarão de luz que te cega seriamente!
actors.mobs.yogfist$burningfist.desc=Este punho é formado por magia ígnea caótica. Ao se mover, ele incendeia constantemente o terreno ao seu redor. Ele também é capaz de disparar rajadas de poder ígneo, que espalham chamas onde impactam. A capacidade do punho de espalhar chamas é suprimida quando próximo à água, mas seu calor é tão intenso que qualquer água ao seu redor evapora em pouco tempo!
actors.mobs.yogfist$burningfist.name=punho em chamas
actors.mobs.yogfist$darkfist.desc=Este punho é formado de pura energia negra. Ele é capaz de disparar poderosas rajadas de magia negra a cada turno! Essas rajadas enfraquecerão sua fonte de luz, além de causar dano pesado. O punho também é capaz de envolver brevemente a arena em escuridão para escapar! O punho não possui habilidades especiais que possam ser usadas em combate corpo a corpo.
actors.mobs.yogfist$darkfist.name=punho negro
actors.mobs.yogfist$darkfist.teleport=O punho se teletransporta em uma explosão de escuridão que extingue sua fonte de luz!
actors.mobs.yogfist$rottingfist.desc=Este punho é formado pela corrupção viva. É uma massa imponente de carne em decomposição que pode espalhar um líquido cáustico em combate corpo a corpo e gás tóxico à distância. Pior ainda, a grande massa do punho faz com que ele sangre em vez de sofrer dano diretamente. Água pode ser usada para lavar o líquido, mas o punho também é capaz de absorvê-lo para se curar! Além disso, causar dano ao punho enquanto ele estiver sangrando fará com que o sangramento se renove, mas não acumule!
actors.mobs.yogfist$rottingfist.name=punho apodrecido
actors.mobs.yogfist$rustedfist.desc=Este punho é formado de metal vivo. É uma massa imponente de metal em constante transformação, capaz de realizar poderosos ataques corpo a corpo e incapacitar seus alvos à distância. Devido à sua enorme massa, o punho absorverá qualquer dano sofrido ao longo do tempo, em vez de imediatamente. Contudo, ele é inflexível e não consegue se mover por passagens estreitas. Além disso, embora possa sofrer dano lentamente, o dano diferido continuará a aumentar se o punho for atingido várias vezes.
actors.mobs.yogfist$rustedfist.name=punho enferrujado
actors.mobs.yogfist$soiledfist.desc=Este punho é formado por magia terrena caótica. Ao se mover, ele fará com que a vegetação brote constantemente ao seu redor. Ele também pode disparar rajadas concentradas de terra que aprisionarão seu alvo em vinhas e raízes de crescimento rápido! O punho deriva poder dessa vida vegetal e resistirá a danos com base na quantidade de vegetação alta ou sulcada próxima a ele!
actors.mobs.yogfist$soiledfist.name=punho sujo
actors.mobs.yogfist.desc=Este punho é um aspecto do poder de Yog-Dzewa. Os punhos estão ligados ao poder de Yog-Dzewa e ficam protegidos de qualquer dano quando estão próximos aos olhos.
actors.mobs.yogfist.invuln_warn=O punho é invulnerável enquanto estiver perto do olho!
actors.mobs.yogfist.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.raisedskeleton.desc=Um esqueleto erguido para lutar ao lado do Necromante.
actors.mobs.raisedskeleton.name=Esqueleto erguido
actors.mobs.raisedskeletonarcher.desc=Um arqueiro esqueleto erguido por um Lich. Ele segue seu mestre e dispara flechas contra os inimigos.
actors.mobs.raisedskeletonarcher.name=Arqueiro esqueleto erguido
actors.mobs.summonedghost.desc=Um fantasma invocado que voa junto do Necromante e luta por ele por pouco tempo.
actors.mobs.summonedghost.name=Fantasma invocado
