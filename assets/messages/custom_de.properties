custom.generated.warriors_are_physically_tough_and_02774ddc7a=Krieger sind körperlich robust und können viel Schaden einstecken. Allerdings sind sie im Umgang mit Fernkampfwaffen und Magie unterlegen. Das Erlernen solcher Fertigkeiten ist zwar möglich, erfordert aber mehr Aufwand.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Schurken verlassen sich auf Wendigkeit, Heimlichkeit und Präzision. Sie zeichnen sich durch Mobilität, Hinterhalte, Gift und Ausweichmanöver aus, büßen dafür aber etwas von der rohen Zähigkeit eines Frontkämpfers ein.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Zauberer beherrschen die Künste der Magie. Ihnen mangelt es jedoch an körperlicher Kraft und Beweglichkeit. Das Erlernen solcher Fähigkeiten ist zwar möglich, erfordert aber mehr Anstrengung.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Jägerinnen zeichnen sich durch ihre Fähigkeit zum Fernkampf und ihre Mobilität aus. Sie beherrschen Kämpfe mit Bögen, gezielten Schüssen und zuverlässigen Überlebenswerkzeugen, fühlen sich aber in längeren Nahkämpfen weniger wohl.
