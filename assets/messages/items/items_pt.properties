items.waterskin.name=cano de água
items.weapon.curses.annoying.desc=Armas irritantes são capazes de falar, mas são um pouco energéticas demais. Elas costumam chamar a atenção para você sem querer.
items.weapon.curses.annoying.elestrike_desc=Um ataque elemental com uma maldição irritante tem 20% de chance de enlouquecer todos os inimigos ao alcance por 6 turnos.
items.weapon.curses.annoying.msg_1=OOH, ESTAMOS BRIGANDO COM ALGUMA COISA!?
items.weapon.curses.annoying.msg_10=MUITO BEM FEITO!
items.weapon.curses.annoying.msg_11=Eu não queria ser uma arma, eu queria ser o machado de um lenhador.
items.weapon.curses.annoying.msg_12=Lembre-se: o excesso de confiança é um assassino lento e insidioso.
items.weapon.curses.annoying.msg_13=TODAS AS SUAS BASES NOS PERTENCEM!
