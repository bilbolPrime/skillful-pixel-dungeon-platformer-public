custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Las cazadoras destacan en el combate a distancia y la movilidad. Controlan las peleas con arcos, disparos de utilidad y herramientas de supervivencia fiables, pero se desenvuelven peor en combates cuerpo a cuerpo prolongados.
