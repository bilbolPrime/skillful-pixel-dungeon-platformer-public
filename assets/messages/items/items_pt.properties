items.weapon.melee.glaive.ability_desc=O Duelista pode usar a ponta de uma glaive para _espetar_ um inimigo que esteja ao alcance, mas não adjacente. Isso causa _%1$d-%2$d de dano_, empurra o inimigo para trás e tem acerto garantido.
