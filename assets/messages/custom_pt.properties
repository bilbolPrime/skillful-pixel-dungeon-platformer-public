custom.theme.sewers.intro=A Masmorra fica bem abaixo da Cidade, e seus níveis superiores constituem, na verdade, o sistema de esgoto da Cidade. Por ser nominalmente parte da Cidade, esses níveis não são tão perigosos. Ninguém diria que é um lugar seguro, mas pelo menos você não terá que lidar com magia maligna aqui.
custom.theme.prison.intro=Há muitos anos, uma prisão subterrânea foi construída aqui para os criminosos mais perigosos. Na época, pareceu uma ideia muito inteligente, pois de fato era muito difícil escapar deste lugar. Mas logo uma névoa escura começou a emanar do subsolo, enlouquecendo prisioneiros e guardas. No fim, a prisão foi abandonada, embora alguns condenados tenham permanecido trancados lá dentro.
custom.theme.caves.intro=As cavernas, que se estendem sob a prisão abandonada, são pouco povoadas. Elas ficam muito profundas para serem exploradas pela Cidade e são muito pobres em minerais para interessar os anões. No passado, havia um posto comercial em algum lugar aqui na rota entre esses dois reinos, mas ele desapareceu com o declínio da Metrópole Anã. Apenas gnolls onipresentes e animais subterrâneos habitam este lugar agora.
custom.theme.city.intro=A Metrópole Anã já foi a maior das cidades-estado anãs. Em seu auge, o exército mecanizado de anões repeliu com sucesso a invasão do deus antigo e seu exército de demônios. Mas dizem que os guerreiros que retornaram trouxeram consigo sementes de corrupção, e que a vitória foi o princípio do fim para o reino subterrâneo.
custom.theme.halls.intro=No passado, esses níveis eram os arredores da Metrópolis. Após a custosa vitória na guerra contra o deus antigo, os anões ficaram muito enfraquecidos para expulsá-los dos demônios remanescentes. Gradualmente, os demônios fortaleceram seu domínio sobre este lugar, que agora é chamado de Salões Demoníacos. Pouquíssimos aventureiros se aventuraram tão longe...
custom.theme.sewers.sign.1=Não superestime sua força, use armas e armaduras que você consiga manejar.
custom.theme.sewers.sign.2=Alguns perigos nos esgotos são fáceis de passar despercebidos à primeira vista. Se uma sala parecer suspeita, diminua o ritmo e observe com atenção.
custom.theme.sewers.sign.3=Lembre-se de que aumentar sua força não é a única maneira de acessar equipamentos melhores. Você também pode diminuir o requisito de força com Pergaminhos de Aprimoramento.
custom.theme.sewers.sign.4=Você pode gastar seu ouro nas lojas espalhadas pela masmorra. Há até um mercador no primeiro andar agora.
custom.theme.sewers.sign.5=Cuidado com a gosma!
custom.theme.prison.sign.1=Pixel-Mart - tudo o que você precisa para uma aventura de sucesso!
custom.theme.prison.sign.2=Identifique suas poções e pergaminhos o mais rápido possível. Não deixe para a última hora, quando realmente precisar deles.
custom.theme.prison.sign.3=Ter fome não dói, mas morrer de fome dói.
custom.theme.prison.sign.4=Um ataque surpresa tem maior probabilidade de acertar. Você ainda pode pegar os inimigos desprevenidos ao controlar o espaço ao redor de uma porta.
custom.theme.prison.sign.5=Não deixem o Tengu escapar!
custom.theme.caves.sign.1=Pixel-Mart. Gaste dinheiro. Viva mais.
custom.theme.caves.sign.2=Quando você for atacado por vários monstros ao mesmo tempo, tente se refugiar atrás de uma porta.
custom.theme.caves.sign.3=Se você estiver com queimaduras solares, não se deixe encurralar. O movimento vertical é mais importante nas cavernas.
custom.theme.caves.sign.4=Não faz sentido possuir mais de um Ankh ao mesmo tempo, pois você os perderá ao ressuscitar.
custom.theme.caves.sign.5=PERIGO! Máquinas pesadas podem causar ferimentos, perda de membros ou morte!
custom.theme.city.sign.1=Pixel-Mart. Uma vida mais segura na masmorra.
custom.theme.city.sign.2=Ao aprimorar uma arma encantada, existe a chance de destruir o encantamento.
custom.theme.city.sign.3=Armas e armaduras se deterioram mais rápido do que varinhas e anéis, mas existem mais maneiras de consertá-las.
custom.theme.city.sign.4=A única maneira de obter um Pergaminho de Extermínio é recebê-lo como um presente dos espíritos da masmorra.
custom.theme.city.sign.5=É proibido portar armas na presença de Sua Majestade!
custom.theme.halls.sign.1=Ao tentar ler a placa, ela explode em chamas esverdeadas.
