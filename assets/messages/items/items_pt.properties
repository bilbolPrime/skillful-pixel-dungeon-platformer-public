items.equipableitem.unequip_cursed=Você não pode remover um item amaldiçoado!
items.food.berry.desc=Esta pequena baga foi encontrada pela Caçadora entre a vegetação da masmorra. Ela pode ser consumida rapidamente, restaura um pouco da saciedade e pode conter uma semente útil!
items.food.berry.discover_hint=Você pode encontrar este item usando um talento específico do herói.
