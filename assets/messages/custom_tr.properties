versionnewsinfo.message=Skillful PixelDungeon'a hoş geldiniz! \n \nZXQ0ZXQ sürümünden (%2$d sürümü) güncellemeler: \n- Pencere Modu eklendi (ayarlardan değiştirildi). \n- Oyunda ESC tuşu menüyü açacak. \n- Alt+Tab tuş kombinasyonundan kaynaklanan sorun düzeltildi. \n\nİyi eğlenceler :D
