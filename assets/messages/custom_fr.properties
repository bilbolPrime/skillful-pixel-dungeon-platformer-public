versionnewsinfo.message=Bienvenue sur Skillful PixelDungeon !\n \nA partir de %1$s (Build %2$d) :\n- Ajout du mode fenêtré (modifié dans les paramètres).\n- Echapper dans le jeu ouvrira le menu.\n- Correction d'un problème causé par l'utilisation de la touche alt-tabbing.\n\nAmusez-vous bien :D
