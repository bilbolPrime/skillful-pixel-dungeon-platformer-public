custom.theme.sewers.intro=Podzemí leží přímo pod Městem, jeho horní patra ve skutečnosti tvoří městskou kanalizaci. Jelikož jsou nominálně součástí Města, nejsou tato patra tak nebezpečná. Nikdo to nenazve bezpečným místem, ale alespoň se zde nebudete muset potýkat se zlou magií.
custom.theme.prison.intro=Před mnoha lety zde byla vybudována podzemní věznice pro nejnebezpečnější zločince. V té době se to zdálo jako velmi chytrý nápad, protože z tohoto místa bylo skutečně velmi těžké uniknout. Brzy se však zespodu začaly šířit temné výpary, které vězně a dozorce doháněly k šílenství. Nakonec byla věznice opuštěna, i když někteří trestanci zde zůstali zavření.
custom.theme.caves.intro=Jeskyně, které se táhnou pod opuštěnou věznicí, jsou řídce osídlené. Leží příliš hluboko na to, aby je Město využívalo, a jsou příliš chudé na minerály, aby zajímaly trpaslíky. V minulosti zde někde na cestě mezi těmito dvěma státy stávala obchodní základna, ale ta zanikla od úpadku Trpasličí metropole. Nyní zde žijí pouze všudypřítomní gnollové a podzemní zvířata.
custom.theme.city.intro=Trpasličí metropole byla kdysi největším z trpasličích městských států. V dobách svého rozkvětu mechanizovaná armáda trpaslíků úspěšně odrazila invazi starého boha a jeho démonické armády. Říká se však, že vracející se válečníci s sebou přinesli semena zkaženosti a že vítězství bylo začátkem konce podzemního království.
custom.theme.halls.intro=V minulosti byly tyto úrovně okrajem Metropolis. Po nákladném vítězství ve válce se starými bohy byli trpaslíci příliš oslabeni na to, aby je zbavili zbývajících démonů. Démoni postupně upevnili své sevření tohoto místa a nyní se mu říká Démonické síně.\n\nJen velmi málo dobrodruhů sestoupilo tak hluboko...
custom.theme.sewers.sign.1=Nepřeceňujte své síly, používejte zbraně a brnění, které zvládnete.
custom.theme.sewers.sign.2=Některá nebezpečí v kanalizaci lze na první pohled snadno přehlédnout. Pokud se vám místnost zdá být nepříjemná, zpomalte a pozorně se podívejte.
custom.theme.sewers.sign.3=Nezapomeňte, že zvýšení síly není jediný způsob, jak získat přístup k lepšímu vybavení. Požadavek na sílu můžete také snížit pomocí Svitků vylepšení.
custom.theme.sewers.sign.4=Zlato můžete utratit v obchodech po celém podzemí. V prvním patře je nyní dokonce i obchodník.
custom.theme.sewers.sign.5=Pozor na Goo!
custom.theme.prison.sign.1=Pixel-Mart - vše, co potřebujete pro úspěšné dobrodružství!
custom.theme.prison.sign.2=Co nejdříve si najděte své lektvary a svitky. Neodkládejte to na okamžik, kdy je budete skutečně potřebovat.
custom.theme.prison.sign.3=Mít hlad nebolí, ale hladovění ano.
custom.theme.prison.sign.4=Překvapivý útok má větší šanci na zásah. Nepřátele můžete stále zaskočit, když ovládáte prostor kolem dveří.
custom.theme.prison.sign.5=Nepouštějte Tengu ven!
custom.theme.caves.sign.1=Pixel-Mart. Utrácejte peníze. Žijte déle.
custom.theme.caves.sign.2=Když vás napadne několik monster najednou, zkuste se schovat za dveře.
custom.theme.caves.sign.3=Pokud hoříte, nenechte se svázat. V jeskyních je důležitější vertikální pohyb.
custom.theme.caves.sign.4=Nemá smysl vlastnit více než jeden Ankh najednou, protože o ně přijdete po vzkříšení.
custom.theme.caves.sign.5=NEBEZPEČÍ! Těžké stroje mohou způsobit zranění, ztrátu končetin nebo smrt!
custom.theme.city.sign.1=Pixel-Mart. Bezpečnější život v podzemí.
custom.theme.city.sign.2=Když vylepšíte očarovanou zbraň, existuje šance toto očarování zničit.
custom.theme.city.sign.3=Zbraně a brnění se zhoršují rychleji než hůlky a prsteny, ale existuje více způsobů, jak je opravit.
custom.theme.city.sign.4=Jediný způsob, jak získat Svitek vyhlazení, je dostat ho jako dar od duchů podzemí.
custom.theme.city.sign.5=V přítomnosti Jeho Veličenstva nejsou povoleny žádné zbraně!
custom.theme.halls.sign.1=Jakmile se pokusíte přečíst ceduli, vzplane nazelenalými plameny.
