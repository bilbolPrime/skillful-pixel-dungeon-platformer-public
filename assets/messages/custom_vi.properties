custom.theme.sewers.intro=Hầm ngục nằm ngay bên dưới Thành phố, các tầng trên của nó thực chất là hệ thống cống rãnh của Thành phố. Vì về mặt danh nghĩa là một phần của Thành phố, những tầng này không quá nguy hiểm. Không ai gọi nó là nơi an toàn, nhưng ít nhất bạn sẽ không phải đối phó với ma thuật tà ác ở đây.
custom.theme.prison.intro=Nhiều năm trước, một nhà tù ngầm đã được xây dựng ở đây dành cho những tên tội phạm nguy hiểm nhất. Vào thời điểm đó, nó dường như là một ý tưởng rất thông minh, bởi vì nơi này thực sự rất khó trốn thoát. Nhưng chẳng bao lâu sau, một làn khí độc hại bắt đầu lan tỏa từ bên dưới, khiến các tù nhân và lính canh phát điên. Cuối cùng, nhà tù bị bỏ hoang, mặc dù một số tù nhân vẫn bị giam giữ ở đó.
custom.theme.caves.intro=Các hang động, trải dài xuống dưới nhà tù bỏ hoang, có rất ít cư dân. Chúng nằm quá sâu để Thành phố có thể khai thác và quá nghèo khoáng sản để thu hút người lùn. Trong quá khứ, từng có một trạm giao thương ở đâu đó trên tuyến đường giữa hai quốc gia này, nhưng nó đã biến mất kể từ khi Thành phố Người lùn suy tàn. Giờ đây chỉ còn lại lũ gnoll và các loài động vật dưới lòng đất sinh sống ở đây.
custom.theme.city.intro=Thành phố Dwarven Metropolis từng là thành bang vĩ đại nhất của người lùn. Vào thời kỳ hoàng kim, đội quân cơ giới của người lùn đã đẩy lùi thành công cuộc xâm lược của vị thần cổ đại và đội quân quỷ dữ của hắn. Nhưng người ta kể rằng, những chiến binh trở về đã mang theo mầm mống của sự tha hóa, và chiến thắng đó là khởi đầu cho sự kết thúc của vương quốc dưới lòng đất.
custom.theme.halls.intro=Trước đây, những tầng này là vùng ngoại ô của Thành phố lớn. Sau chiến thắng đắt giá trong cuộc chiến với vị thần cổ đại, tộc người lùn đã quá suy yếu để có thể tiêu diệt hết lũ quỷ còn sót lại. Dần dần, lũ quỷ đã siết chặt vòng vây nơi này và giờ đây nó được gọi là Điện Quỷ. Rất ít nhà thám hiểm từng xuống đến tận đây...
custom.theme.sewers.sign.1=Đừng đánh giá quá cao sức mạnh của mình, hãy sử dụng vũ khí và áo giáp mà bạn có thể điều khiển được.
custom.theme.sewers.sign.2=Một số mối nguy hiểm trong cống rãnh rất dễ bị bỏ qua ngay từ cái nhìn đầu tiên. Nếu cảm thấy một căn phòng nào đó có điều gì đó bất thường, hãy đi chậm lại và quan sát kỹ.
custom.theme.sewers.sign.3=Hãy nhớ rằng tăng sức mạnh không phải là cách duy nhất để có được trang bị tốt hơn. Bạn cũng có thể giảm yêu cầu sức mạnh của trang bị bằng Cuộn giấy nâng cấp.
custom.theme.sewers.sign.4=Bạn có thể dùng vàng của mình mua sắm tại các cửa hàng trong hầm ngục. Thậm chí giờ còn có cả một thương nhân ở tầng một nữa.
custom.theme.sewers.sign.5=Cẩn thận với chất nhầy!
custom.theme.prison.sign.1=Pixel-Mart - tất cả những gì bạn cần cho một cuộc phiêu lưu thành công!
custom.theme.prison.sign.2=Hãy xác định các loại thuốc và cuộn phép của bạn càng sớm càng tốt. Đừng trì hoãn đến lúc thực sự cần đến chúng.
custom.theme.prison.sign.3=Đói thì không đau, nhưng chết đói thì đau.
custom.theme.prison.sign.4=Tấn công bất ngờ có tỷ lệ trúng đích cao hơn. Bạn vẫn có thể khiến kẻ địch mất cảnh giác khi kiểm soát được không gian xung quanh cửa ra vào.
custom.theme.prison.sign.5=Đừng để Tengu thoát ra ngoài!
custom.theme.caves.sign.1=Pixel-Mart. Tiêu tiền. Sống lâu hơn.
custom.theme.caves.sign.2=Khi bị nhiều quái vật tấn công cùng lúc, hãy cố gắng lùi về phía sau cánh cửa.
