items.weapon.missiles.darts.healingdart.name=dardo curativo
items.weapon.missiles.darts.holydart.desc=Essas flechas são revestidas com um composto à base de flor-estrela que infunde energia sagrada em seu alvo. Aliados e inimigos comuns serão abençoados, mas inimigos mortos-vivos ou demoníacos sofrerão dano pesado. A flecha em si ainda é prejudicial aos inimigos, mas não afetará os aliados.
