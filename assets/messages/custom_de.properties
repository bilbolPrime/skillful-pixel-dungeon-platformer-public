custom.theme.sewers.intro=Der Kerker liegt direkt unter der Stadt; seine oberen Ebenen bilden das städtische Abwassersystem. Da er nominell zur Stadt gehört, sind diese Ebenen nicht besonders gefährlich. Niemand würde ihn als sicheren Ort bezeichnen, aber zumindest muss man sich hier nicht mit böser Magie herumschlagen.
custom.theme.prison.intro=Vor vielen Jahren wurde hier ein unterirdisches Gefängnis für die gefährlichsten Verbrecher errichtet. Damals schien es eine kluge Idee zu sein, denn ein Ausbruch war tatsächlich äußerst schwierig. Doch bald drang ein finsterer Dunst aus der Tiefe und trieb Gefangene wie Wärter in den Wahnsinn. Schließlich wurde das Gefängnis aufgegeben, einige Häftlinge blieben jedoch dort eingesperrt.
custom.theme.caves.intro=Die Höhlen, die sich unter dem verlassenen Gefängnis erstrecken, sind nur spärlich besiedelt. Sie liegen zu tief, als dass die Stadt sie nutzen könnte, und sind zu mineralienarm, als dass die Zwerge sich dafür interessieren würden. Einst gab es hier irgendwo auf der Route zwischen den beiden Staaten einen Handelsposten, doch dieser ist seit dem Niedergang der Zwergenmetropole verschwunden. Nur allgegenwärtige Gnolle und unterirdische Tiere leben heute noch hier.
custom.theme.city.intro=Zwergenmetropole war einst die mächtigste aller Zwergenstadtstaaten. In ihrer Blütezeit wehrte die mechanisierte Zwergenarmee erfolgreich die Invasion des Alten Gottes und seines Dämonenheeres ab. Doch man sagt, die heimkehrenden Krieger hätten den Samen der Verderbnis mitgebracht, und dieser Sieg sei der Anfang vom Ende des unterirdischen Reiches gewesen.
custom.theme.halls.intro=Einst bildeten diese Ebenen die Außenbezirke von Metropolis. Nach dem verlustreichen Sieg im Krieg gegen den Alten Gott waren die Zwerge zu geschwächt, um die verbliebenen Dämonen zu vertreiben. Nach und nach haben die Dämonen ihren Griff auf diesen Ort verstärkt, und nun wird er Dämonenhallen genannt. Nur sehr wenige Abenteurer sind je so tief hinabgestiegen …
custom.theme.sewers.sign.1=Überschätze deine Stärke nicht, benutze Waffen und Rüstungen, mit denen du umgehen kannst.
custom.theme.sewers.sign.2=Manche Gefahren in der Kanalisation übersieht man leicht auf den ersten Blick. Wenn sich ein Raum unheimlich anfühlt, verlangsamen Sie Ihre Schritte und schauen Sie genau hin.
custom.theme.sewers.sign.3=Bedenke, dass du nicht nur durch Stärkeerhöhung bessere Ausrüstung erhalten kannst. Du kannst die Stärkeanforderung auch mit Aufwertungsrollen senken.
custom.theme.sewers.sign.4=Du kannst dein Gold in den Läden im gesamten Dungeon ausgeben. Es gibt jetzt sogar einen Händler im ersten Stock.
custom.theme.sewers.sign.5=Vorsicht vor Schleim!
custom.theme.prison.sign.1=Pixel-Mart – alles, was du für ein erfolgreiches Abenteuer brauchst!
custom.theme.prison.sign.2=Identifiziere deine Tränke und Schriftrollen so früh wie möglich. Warte nicht bis zu dem Moment, in dem du sie tatsächlich brauchst.
custom.theme.prison.sign.3=Hunger zu haben tut nicht weh, aber zu verhungern tut weh.
custom.theme.prison.sign.4=Überraschungsangriffe haben eine höhere Trefferchance. Auch wenn du den Bereich um einen Türrahmen kontrollierst, kannst du Gegner immer noch überraschen.
custom.theme.prison.sign.5=Lass den Tengu nicht frei!
custom.theme.caves.sign.1=Pixel-Mart. Geld ausgeben. Länger leben.
custom.theme.caves.sign.2=Wenn du von mehreren Monstern gleichzeitig angegriffen wirst, versuche, dich hinter eine Tür zurückzuziehen.
custom.theme.caves.sign.3=Wenn du in Brand gerätst, lass dich nicht einkesseln. Vertikale Bewegung ist in den Höhlen wichtiger.
custom.theme.caves.sign.4=Es macht keinen Sinn, mehr als ein Ankh gleichzeitig zu besitzen, da man sie bei der Wiederbelebung verliert.
custom.theme.caves.sign.5=GEFAHR! Schwere Maschinen können Verletzungen, den Verlust von Gliedmaßen oder den Tod verursachen!
custom.theme.city.sign.1=Pixel-Mart. Ein sichereres Leben im Dungeon.
custom.theme.city.sign.2=Beim Aufwerten einer verzauberten Waffe besteht die Chance, dass diese Verzauberung zerstört wird.
custom.theme.city.sign.3=Waffen und Rüstungen verschleißen schneller als Zauberstäbe und Ringe, aber es gibt mehr Möglichkeiten, sie zu reparieren.
custom.theme.city.sign.4=Die einzige Möglichkeit, eine Schriftrolle der Vernichtung zu erhalten, besteht darin, sie als Geschenk von den Dungeon-Geistern zu bekommen.
custom.theme.city.sign.5=In Gegenwart Seiner Majestät sind keine Waffen erlaubt!
custom.theme.halls.sign.1=Als Sie versuchen, das Schild zu lesen, geht es in grünlichen Flammen auf.
