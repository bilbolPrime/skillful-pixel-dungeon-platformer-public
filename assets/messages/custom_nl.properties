custom.theme.sewers.intro=De kerker ligt direct onder de stad; de bovenste verdiepingen vormen in feite het rioolstelsel van de stad. Omdat deze verdiepingen formeel deel uitmaken van de stad, zijn ze niet zo gevaarlijk. Niemand zal het een veilige plek noemen, maar je hoeft hier in ieder geval niet met duistere magie te maken te krijgen.
custom.theme.prison.intro=Vele jaren geleden werd hier een ondergrondse gevangenis gebouwd voor de gevaarlijkste criminelen. Destijds leek het een heel slim idee, want ontsnappen uit deze plek was inderdaad erg moeilijk. Maar al snel begon er een duistere stank van onderaf op te sijpelen, waardoor gevangenen en bewakers gek werden. Uiteindelijk werd de gevangenis verlaten, hoewel sommige veroordeelden er nog steeds vastzaten.
custom.theme.caves.intro=De grotten, die zich uitstrekken onder de verlaten gevangenis, zijn dunbevolkt. Ze liggen te diep om door de Stad te worden geëxploiteerd en bevatten te weinig mineralen om de dwergen te interesseren. In het verleden was er ergens hier een handelspost op de route tussen deze twee staten, maar die is verdwenen sinds de ondergang van Dwergenmetropool. Nu leven er alleen nog alomtegenwoordige gnolls en ondergrondse dieren.
custom.theme.city.intro=Dwergenmetropool was ooit de grootste van alle dwergensteden. In haar bloeiperiode sloeg het gemechaniseerde dwergenleger met succes de invasie van de oude god en zijn demonenleger af. Maar er wordt gezegd dat de terugkerende krijgers de kiem van verderf met zich meebrachten, en dat die overwinning het begin van het einde betekende voor het ondergrondse koninkrijk.
custom.theme.halls.intro=In het verleden vormden deze gebieden de buitenwijken van Metropolis. Na de kostbare overwinning in de oorlog met de oude god waren de dwergen te verzwakt om de overgebleven demonen te verdrijven. Geleidelijk aan hebben de demonen hun greep op deze plek verstevigd en nu wordt het de Demonenhallen genoemd. Slechts weinig avonturiers zijn ooit zo ver afgedaald...
custom.theme.sewers.sign.1=Onderschat je eigen kracht niet; gebruik wapens en bepantsering die je aankunt.
custom.theme.sewers.sign.2=Sommige gevaren in het riool zijn op het eerste gezicht gemakkelijk over het hoofd te zien. Als een ruimte niet goed aanvoelt, loop dan langzaam en kijk goed rond.
custom.theme.sewers.sign.3=Vergeet niet dat het verhogen van je kracht niet de enige manier is om toegang te krijgen tot betere uitrusting. Je kunt de krachtvereiste ook verlagen met upgrade-rollen.
custom.theme.sewers.sign.4=Je kunt je goud uitgeven in winkels verspreid over de kerker. Er is zelfs een handelaar op de eerste verdieping.
custom.theme.sewers.sign.5=Pas op voor slijm!
custom.theme.prison.sign.1=Pixel-Mart - alles wat je nodig hebt voor een succesvol avontuur!
custom.theme.prison.sign.2=Identificeer je drankjes en spreuken zo snel mogelijk. Stel het niet uit tot het moment dat je ze echt nodig hebt.
custom.theme.prison.sign.3=Honger hebben doet geen pijn, maar verhongeren wel.
custom.theme.prison.sign.4=Een verrassingsaanval heeft een grotere kans om te raken. Je kunt vijanden nog steeds verrassen als je de ruimte rond een deuropening beheerst.
custom.theme.prison.sign.5=Laat de Tengu niet ontsnappen!
custom.theme.caves.sign.1=Pixel-Mart. Geef geld uit. Leef langer.
custom.theme.caves.sign.2=Als je door meerdere monsters tegelijk wordt aangevallen, probeer dan achter een deur te schuilen.
custom.theme.caves.sign.3=Als je het warm hebt, laat je dan niet insluiten. Verticale beweging is belangrijker in grotten.
custom.theme.caves.sign.4=Het heeft geen zin om meer dan één Ankh tegelijk te bezitten, want je verliest ze allemaal bij je wederopstanding.
custom.theme.caves.sign.5=GEVAAR! Zware machines kunnen letsel, amputaties of de dood tot gevolg hebben!
custom.theme.city.sign.1=Pixel-Mart. Een veiliger leven in de kerker.
custom.theme.city.sign.2=Wanneer je een betoverd wapen upgradet, bestaat de kans dat die betovering verloren gaat.
custom.theme.city.sign.3=Wapens en pantsers slijten sneller dan toverstokken en ringen, maar er zijn meer manieren om ze te repareren.
custom.theme.city.sign.4=De enige manier om een Vernietigingsrol te bemachtigen, is door deze als geschenk te ontvangen van de kerkergeesten.
custom.theme.city.sign.5=Wapens zijn niet toegestaan in de aanwezigheid van Zijne Majesteit!
custom.theme.halls.sign.1=Terwijl je het bord probeert te lezen, barst het uit in groenachtige vlammen.
