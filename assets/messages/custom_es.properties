custom.theme.sewers.intro=La Mazmorra se encuentra justo debajo de la Ciudad; sus niveles superiores constituyen, de hecho, el sistema de alcantarillado. Al ser nominalmente parte de la Ciudad, estos niveles no son tan peligrosos. Nadie lo consideraría un lugar seguro, pero al menos aquí no tendrás que lidiar con magia negra.
custom.theme.prison.intro=Hace muchos años se construyó aquí una prisión subterránea para los criminales más peligrosos. En aquel entonces parecía una idea brillante, pues era muy difícil escapar de ese lugar. Pero pronto un hedor oscuro comenzó a emanar del subsuelo, volviendo locos a prisioneros y guardias. Finalmente, la prisión fue abandonada, aunque algunos convictos quedaron encerrados allí.
custom.theme.caves.intro=Las cuevas, que se extienden bajo la prisión abandonada, están escasamente pobladas. Son demasiado profundas para ser explotadas por la Ciudad y demasiado pobres en minerales para interesar a los enanos. Antiguamente existía un puesto comercial en algún lugar de la ruta entre estos dos estados, pero desapareció tras la decadencia de la Metrópolis Enana. Ahora solo habitan aquí los omnipresentes gnolls y animales subterráneos.
custom.theme.city.intro=La Metrópolis Enana fue en su día la más grande de las ciudades-estado enanas. En su apogeo, el ejército mecanizado de enanos repelió con éxito la invasión del antiguo dios y su ejército demoníaco. Pero se dice que los guerreros que regresaron trajeron consigo semillas de corrupción, y que esa victoria marcó el principio del fin para el reino subterráneo.
custom.theme.halls.intro=En el pasado, estos niveles eran las afueras de Metrópolis. Tras la costosa victoria en la guerra contra el antiguo dios, los enanos quedaron demasiado debilitados para librarlos de los demonios restantes. Gradualmente, los demonios han estrechado su control sobre este lugar, que ahora se conoce como las Salas Demoníacas. Muy pocos aventureros han descendido hasta aquí...
custom.theme.sewers.sign.1=No sobreestimes tu fuerza, usa armas y armaduras que puedas manejar.
custom.theme.sewers.sign.2=Algunos peligros en las alcantarillas pueden pasar desapercibidos a simple vista. Si algo te parece extraño en una habitación, reduce la velocidad y observa con atención.
custom.theme.sewers.sign.3=Recuerda que aumentar tu fuerza no es la única forma de acceder a mejor equipo. También puedes reducir el requisito de fuerza con Pergaminos de Mejora.
custom.theme.sewers.sign.4=Puedes gastar tu oro en las tiendas de toda la mazmorra. Incluso hay un mercader en la primera planta.
custom.theme.sewers.sign.5=¡Cuidado con la sustancia pegajosa!
custom.theme.prison.sign.1=Pixel-Mart: ¡todo lo que necesitas para una aventura exitosa!
custom.theme.prison.sign.2=Identifica tus pociones y pergaminos cuanto antes. No lo dejes para el momento en que realmente los necesites.
custom.theme.prison.sign.3=Tener hambre no duele, pero morirse de hambre sí duele.
custom.theme.prison.sign.4=Un ataque sorpresa tiene más probabilidades de acertar. Aún puedes pillar desprevenidos a los enemigos si controlas el espacio alrededor de una puerta.
custom.theme.prison.sign.5=¡No dejes escapar al Tengu!
custom.theme.caves.sign.1=Pixel-Mart. Gasta dinero. Vive más tiempo.
custom.theme.caves.sign.2=Cuando te ataquen varios monstruos al mismo tiempo, intenta refugiarte detrás de una puerta.
custom.theme.caves.sign.3=Si sientes calor, no te quedes atrapado. El movimiento vertical es más importante en las cuevas.
custom.theme.caves.sign.4=No tiene sentido poseer más de un Ankh al mismo tiempo, porque los perderás al resucitar.
custom.theme.caves.sign.5=¡PELIGRO! ¡La maquinaria pesada puede causar lesiones, amputaciones o la muerte!
custom.theme.city.sign.1=Pixel-Mart. Una vida más segura en la mazmorra.
custom.theme.city.sign.2=Al mejorar un arma encantada, existe la posibilidad de destruir dicho encantamiento.
custom.theme.city.sign.3=Las armas y las armaduras se deterioran más rápido que las varitas y los anillos, pero hay más maneras de repararlas.
custom.theme.city.sign.4=La única forma de obtener un Pergamino de Aniquilación es recibirlo como regalo de los espíritus de la mazmorra.
custom.theme.city.sign.5=¡No se permiten armas en presencia de Su Majestad!
custom.theme.halls.sign.1=Al intentar leer el letrero, este estalla en llamas verdosas.
