custom.theme.sewers.intro=地牢位於城市正下方，其上層實際上構成了城市的下水道系統。由於名義上是城市的一部分，這些樓層並不算危險。雖然沒人會稱之為安全之地，但至少你在這裡不必面對邪惡魔法。
custom.theme.prison.intro=多年前，這裡曾建有一座地下監獄，用來關押最危險的罪犯。當時這似乎是個絕妙的主意，因為這裡的確很難逃脫。但不久之後，一股陰森恐怖的氣息開始從地下瀰漫開來，令囚犯和獄卒都幾近瘋狂。最終，這座監獄被廢棄，但仍有一些罪犯被囚禁於此。
custom.theme.caves.intro=這些洞穴綿延至廢棄監獄下方，人煙稀少。它們埋藏太深，城市無法開採，礦產資源又匱乏，矮人也提不起興趣。過去，在這兩個州之間的某處曾有一個貿易站，但隨著矮人都城的衰落，它也隨之消失了。如今，這裡只剩下無處不在的豺狼人和地下生物。
custom.theme.city.intro=矮人大都會曾是矮人城邦中最偉大的城市。在其鼎盛時期，矮人的機械化軍隊曾成功擊退了古神及其惡魔大軍的入侵。但據說，凱旋的戰士們也帶來了腐敗的種子，而那場勝利也正是這座地下王國走向衰落的開端。
custom.theme.halls.intro=過去，這片區域是都市的邊緣地帶。在與古神的戰爭中，矮人們付出了慘痛的代價才取得勝利，但他們自身實力也因此削弱，無力清除殘餘的惡魔。惡魔逐漸控制了這片區域，如今這裡被稱為惡魔大廳。極少有冒險者曾深入到此…
custom.theme.sewers.sign.1=不要高估自己的力量，使用你能駕馭的武器和盔甲。
custom.theme.sewers.sign.2=下水道裡有些危險乍看之下很容易被忽略。如果感覺某個房間不對勁，就放慢腳步，仔細觀察。
custom.theme.sewers.sign.3=記住，提升力量並不是獲得更好裝備的唯一方法。你也可以使用升級捲軸來降低裝備的力量需求。
custom.theme.sewers.sign.4=你可以用金幣在地牢各處的商店購物。現在一樓甚至還有商人。
custom.theme.sewers.sign.5=小心黏液！
custom.theme.prison.sign.1=Pixel-Mart－幫助您成功冒險所需的一切！
custom.theme.prison.sign.2=盡快清點你的藥劑和捲軸。不要等到真正需要它們的時候才去做。
custom.theme.prison.sign.3=飢餓本身並不痛苦，但挨餓卻很痛苦。
custom.theme.prison.sign.4=突襲命中率較高。控制住門口周圍的空間，你仍然可以出其不意地攻擊敵人。
custom.theme.prison.sign.5=別放天狗出來！
custom.theme.caves.sign.1=像素超市。花錢，活得更久。
custom.theme.caves.sign.2=當同時受到多個怪物攻擊時，試著躲到門後。
custom.theme.caves.sign.3=如果你著火了，別讓自己被困住。在洞穴裡，垂直移動更為重要。
custom.theme.caves.sign.4=同時擁有多個安卡是沒有意義的，因為復活後你會失去它們。
custom.theme.caves.sign.5=危險！重型機械可能造成人身傷害、肢體殘缺甚至死亡！
custom.theme.city.sign.1=像素超市。地牢裡更安全的生活。
custom.theme.city.sign.2=升級附魔武器時，有一定幾率會破壞附魔效果。
custom.theme.city.sign.3=武器和盔甲比魔杖和戒指損耗得更快，但修復它們的方法也更多。
custom.theme.city.sign.4=獲得「殲滅捲軸」的唯一方法是從地牢精靈那裡獲得禮物。
custom.theme.city.sign.5=在陛下面前，禁止攜帶任何武器！
custom.theme.halls.sign.1=當你試著看清標誌上的字時，它突然燃起綠色的火焰。
