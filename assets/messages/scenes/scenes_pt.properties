scenes.heroselectscene.daily=Corrida diária
scenes.heroselectscene.daily_desc=Todos os dias, um novo jogo é disponibilizado, sendo o mesmo para todos! Essa "corrida diária" gera a mesma masmorra para todos que a jogam (desde que estejam jogando a mesma versão do jogo). Você pode levar o tempo que quiser para completar uma corrida diária, mas só pode ter uma ativa por vez. As corridas diárias não são elegíveis para emblemas e possuem sua própria página de classificação. Gostaria de começar a corrida diária de hoje com o herói e os desafios que você selecionou?
scenes.heroselectscene.daily_existing=Você já tem uma corrida diária em andamento. Você precisa encerrar essa corrida antes de iniciar outra.
scenes.heroselectscene.daily_no=não
scenes.heroselectscene.daily_nowin=Todos os dias, um novo jogo é disponibilizado, sendo o mesmo para todos! Essa "partida diária" gera a mesma masmorra para todos os jogadores (desde que estejam jogando a mesma versão do jogo). Você precisa vencer pelo menos uma partida para poder participar das partidas diárias.
scenes.heroselectscene.daily_repeat=Você já jogou a missão diária de hoje. Você pode jogá-la novamente, se quiser, mas apenas como uma partida de prática sem classificação. Após concluir a repetição, você poderá visualizá-la na janela de classificação diária por um curto período antes que o registro seja excluído. Deseja jogar novamente a missão diária de hoje com o herói e os desafios que você selecionou?
scenes.heroselectscene.daily_unavailable_long=Parece que você iniciou uma atualização diária que está no futuro! Isso pode acontecer se você mudou de fuso horário recentemente ou se alterou o relógio do sistema. _Sua próxima atualização diária estará disponível em %d dias._
