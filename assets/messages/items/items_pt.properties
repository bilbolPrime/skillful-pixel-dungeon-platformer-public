items.weapon.melee.gauntlet.desc=Esta enorme manopla é feita de tecido carmesim com pesadas camadas de pedra mágica sobrepostas. O tecido se ajusta ao corpo, fazendo com que as grossas placas de pedra se assemelhem quase a uma segunda pele. Empunhar uma arma tão pesada exige força, mas confere uma potência tremenda aos golpes.
