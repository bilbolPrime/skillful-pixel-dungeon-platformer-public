items.artifacts.skeletonkey.wont_open=Por algum motivo, a chave não encaixa nessa fechadura.
items.artifacts.talismanofforesight$foresight.desc=Você se sente muito nervoso, como se houvesse um perigo invisível por perto.
items.artifacts.talismanofforesight$foresight.name=previsão
items.artifacts.talismanofforesight$foresight.uneasy=Você se sente inquieto(a).
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Uma pedra lisa com estranhas gravuras. Você tem a sensação de que ela está observando tudo ao seu redor, atenta a qualquer coisa escondida.
items.artifacts.talismanofforesight.desc_cursed=O talismã amaldiçoado está olhando fixamente para você, embotando seus sentidos.
items.artifacts.talismanofforesight.desc_worn=Ao segurar o talismã, você sente seus sentidos aguçados. O talismã vai acumulando carga lentamente com o passar do tempo e conforme você descobre portas ou armadilhas escondidas. O talismã pode usar sua carga para "espiar" em um formato cônico, revelando todos os quadrados e segredos na área escaneada, e concedendo a você a visão de inimigos e itens por um curto período.
items.artifacts.talismanofforesight.full_charge=Seu Talismã está totalmente carregado!
items.artifacts.talismanofforesight.levelup=Seu Talismã fica mais forte!
items.artifacts.talismanofforesight.low_charge=O talismã requer pelo menos 5% de carga para realizar a adivinhação.
