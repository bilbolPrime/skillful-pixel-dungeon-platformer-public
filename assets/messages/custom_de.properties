custom.generated.oh_i_see_you_have_cef64cb7a7=Oh, ich sehe, Sie haben es geschafft! Ich hoffe, es hat Ihnen nicht allzu viele Sorgen bereitet. Wie versprochen, können Sie sich einen meiner hochwertigen Zauberstäbe aussuchen.
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=Oh, welch eine angenehme Überraschung, an so einem Ort einen netten Menschen zu treffen! Ich bin hier, um eine seltene Zutat zu besorgen – einen Rotbeerensamen. Als Magier kann ich mich zwar gut gegen die Monster hier verteidigen, aber ich verirre mich ständig, was mir sehr peinlich ist. Könnten Sie mir vielleicht helfen? Ich würde Ihre Dienste gerne mit einem meiner besten Zauberstäbe bezahlen.
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=Oh, welch eine angenehme Überraschung, an einem solchen Ort einen netten Menschen zu treffen! Ich bin hier, um eine seltene Zutat zu besorgen – Leichenstaub. Man kann ihn aus Skelettresten gewinnen, und davon gibt es im Verlies reichlich. Als Magier kann ich mich zwar gut gegen die Monster hier verteidigen, aber ich verirre mich ständig, was mir sehr peinlich ist. Könnten Sie mir vielleicht helfen? Ich würde Ihre Dienste gerne mit einem meiner besten Zauberstäbe bezahlen.
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=Oh, welch eine angenehme Überraschung, an so einem Ort einen netten Menschen zu treffen! Ich bin hier, um eine seltene Zutat zu besorgen: einen Phantomfisch. Man kann ihn mit bloßen Händen fangen, aber im Wasser ist er kaum zu erkennen. Als Magier kann ich mich zwar gut gegen die Monster hier verteidigen, aber ich verirre mich ständig, was mir sehr peinlich ist. Könnten Sie mir vielleicht helfen? Ich würde Ihre Dienste gerne mit einem meiner besten Zauberstäbe bezahlen.
custom.generated.oh_yes_you_are_my_14b646c984=Oh ja! Du bist mein Held! Was deine Belohnung angeht, habe ich gerade kein Bargeld dabei, aber ich habe etwas Besseres für dich. Das ist mein Familienerbstück-Ring.
