items.artifacts.sandalsofnature.absorb_seed=O calçado absorve as sementes, eles parecem mais saudáveis.
items.artifacts.sandalsofnature.ac_feed=ALIMENTAR
items.artifacts.sandalsofnature.ac_root=RAIZ
items.artifacts.sandalsofnature.desc_1=O que inicialmente parecem ser sandálias feitas de barbante são, na verdade, duas plantas! Elas parecem muito fracas e pálidas, talvez precisem de nutrientes?
items.artifacts.sandalsofnature.desc_2=O calçado cresceu e agora se assemelha mais a dois sapatos de alfaiataria. Parte da cor retornou a eles; talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_3=As plantas cresceram novamente e agora se assemelham a um par de botas robustas feitas de casca de árvore. Elas parecem ter recuperado suas forças, mas talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_4=As plantas parecem ter atingido seu tamanho máximo, assemelhando-se a um par de caneleiras blindadas. As caneleiras são de um marrom escuro e lembram uma árvore muito robusta.
items.artifacts.sandalsofnature.desc_ability=O calçado ondula com a cor da última semente que você usou. Ele pode criar raízes brevemente no solo e produzir o efeito daquela planta em qualquer lugar num raio de 3 quadrados. \nSemente: _%s_\nCarga necessária: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=As sandálias amaldiçoadas estão bloqueando qualquer sintonia com a natureza.
items.artifacts.sandalsofnature.desc_hint=Você se sente mais em sintonia com a natureza ao usar este artefato.
items.artifacts.sandalsofnature.desc_seeds=Você alimentou o calçado com sementes %d.
