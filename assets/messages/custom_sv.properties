custom.theme.sewers.intro=Fängelsehålan ligger precis under staden, dess övre nivåer utgör faktiskt stadens avloppssystem. Eftersom de nominellt är en del av staden är dessa nivåer inte så farliga. Ingen kommer att kalla det en säker plats, men åtminstone slipper du att hantera ond magi här.
custom.theme.prison.intro=För många år sedan byggdes ett underjordiskt fängelse här för de farligaste brottslingarna. Vid den tiden verkade det som en mycket smart idé, eftersom det här stället verkligen var mycket svårt att fly från. Men snart började mörkt miasma tränga in underifrån och driva fångar och vakter till vansinne. Till slut övergavs fängelset, även om några fångar lämnades inlåsta här.
custom.theme.caves.intro=Grottorna, som sträcker sig ner under det övergivna fängelset, är glest befolkade. De ligger för djupt för att kunna utnyttjas av staden och de är för fattiga på mineraler för att intressera dvärgarna. Förr i tiden fanns det en handelspost någonstans här på vägen mellan dessa två stater, men den har förfallit sedan dvärgmetropolens nedgång. Nu bor endast allestädes närvarande gnollar och underjordiska djur här.
custom.theme.city.intro=Dvärgmetropolen var en gång den största av dvärgarnas stadsstater. Under sin glansdagar har den mekaniserade dvärgarnas armé framgångsrikt avvärjt invasionen av den gamla guden och hans demonarmé. Men det sägs att de återvändande krigarna har fört med sig frön av korruption, och att segern var början på slutet för det underjordiska kungariket.
custom.theme.halls.intro=Förr i tiden var dessa nivåer utkanten av Metropolis. Efter den kostsamma segern i kriget med de gamla gudarna var dvärgarna för försvagade för att rensa dem från kvarvarande demoner. Gradvis har demoner stärkt sitt grepp om denna plats och nu kallas den Demonhallar. \n\n Väldigt få äventyrare har någonsin stigit ner så här långt...
custom.theme.sewers.sign.1=Överskatta inte din styrka, använd vapen och rustningar du kan hantera.
custom.theme.sewers.sign.2=Vissa faror i avloppet är lätta att missa vid första anblicken. Om ett rum känns fel, sakta ner och titta noga.
custom.theme.sewers.sign.3=Kom ihåg att öka din styrka inte är det enda sättet att få tillgång till bättre utrustning. Du kan också sänka dess styrkekrav med Uppgraderingsrullar.
custom.theme.sewers.sign.4=Du kan spendera ditt guld i butiker i hela fängelsehålan. Det finns till och med en köpman på första våningen nu.
custom.theme.sewers.sign.5=Se upp för Goo!
custom.theme.prison.sign.1=Pixel-Mart - allt du behöver för ett lyckat äventyr!
custom.theme.prison.sign.2=Identifiera dina trolldrycker och skriftrullar så snart som möjligt. Skjut det inte upp till det ögonblick då du faktiskt behöver dem.
custom.theme.prison.sign.3=Att vara hungrig skadar inte, men att svälta gör ont.
custom.theme.prison.sign.4=Överraskningsattacker har större chans att träffa. Du kan fortfarande överraska fiender när du kontrollerar utrymmet runt en dörröppning.
custom.theme.prison.sign.5=Släpp inte ut Tengu!
custom.theme.caves.sign.1=Pixel-Mart. Spendera pengar. Lev längre.
custom.theme.caves.sign.2=När du blir attackerad av flera monster samtidigt, försök att dra dig tillbaka bakom en dörr.
custom.theme.caves.sign.3=Om du brinner, låt dig inte bli instängd. Vertikal rörelse är viktigare i grottorna.
custom.theme.caves.sign.4=Det är ingen mening med att äga mer än en Ankh samtidigt, eftersom du kommer att förlora dem vid återuppståndelsen.
custom.theme.caves.sign.5=FARA! Tunga maskiner kan orsaka skador, förlust av lemmar eller dödsfall!
custom.theme.city.sign.1=Pixel-Mart. Ett säkrare liv i fängelsehålan.
custom.theme.city.sign.2=När du uppgraderar ett förtrollat vapen finns det en chans att förstöra den förtrollningen.
custom.theme.city.sign.3=Vapen och rustningar försämras snabbare än trollstavar och ringar, men det finns fler sätt att fixa dem.
custom.theme.city.sign.4=Det enda sättet att få en Scroll of Wipe Out är att ta emot den som en gåva från fängelsehålans andar.
custom.theme.city.sign.5=Inga vapen tillåtna i Hans Majestäts närvaro!
custom.theme.halls.sign.1=När du försöker läsa skylten brister den ut i grönaktiga lågor.
