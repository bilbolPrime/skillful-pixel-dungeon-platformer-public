custom.theme.sewers.intro=The Dungeon lies right beneath the City, its upper levels actually constitute the City's sewer system. Being nominally a part of the City, these levels are not that dangerous. No one will call it a safe place, but at least you won't need to deal with evil magic here.
custom.theme.prison.intro=Many years ago an underground prison was built here for the most dangerous criminals. At the time it seemed like a very clever idea, because this place indeed was very hard to escape. But soon dark miasma started to permeate from below, driving prisoners and guards insane. In the end the prison was abandoned, though some convicts were left locked up here.
custom.theme.caves.intro=The caves, which stretch down under the abandoned prison, are sparcely populated. They lie too deep to be exploited by the City and they are too poor in minerals to interest the dwarves. In the past there was a trade outpost somewhere here on the route between these two states, but it has perished since the decline of Dwarven Metropolis. Only omnipresent gnolls and subterranean animals dwell here now.
custom.theme.city.intro=Dwarven Metropolis was once the greatest of dwarven city-states. In its heyday the mechanized army of dwarves has successfully repelled the invasion of the old god and his demon army. But it is said, that the returning warriors have brought seeds of corruption with them, and that victory was the beginning of the end for the underground kingdom.
custom.theme.halls.intro=In the past these levels were the outskirts of Metropolis. After the costly victory in the war with the old god dwarves were too weakened to clear them of remaining demons. Gradually demons have tightened their grip on this place and now it's called Demon Halls.\n\nVery few adventurers have ever descended this far...
custom.theme.sewers.sign.1=Don't overestimate your strength, use weapons and armor you can handle.
custom.theme.sewers.sign.2=Some dangers in the sewers are easy to miss at first glance. If a room feels wrong, slow down and look carefully.
custom.theme.sewers.sign.3=Remember that raising your strength is not the only way to access better equipment. You can also lower its strength requirement with Scrolls of Upgrade.
custom.theme.sewers.sign.4=You can spend your gold in shops throughout the dungeon. There is even a merchant on the first floor now.
custom.theme.sewers.sign.5=Beware of Goo!
custom.theme.prison.sign.1=Pixel-Mart - all you need for successful adventure!
custom.theme.prison.sign.2=Identify your potions and scrolls as soon as possible. Don't put it off to the moment when you actually need them.
custom.theme.prison.sign.3=Being hungry doesn't hurt, but starving does hurt.
custom.theme.prison.sign.4=Surprise attack has a better chance to hit. You can still catch enemies off guard when you control the space around a doorway.
custom.theme.prison.sign.5=Don't let The Tengu out!
custom.theme.caves.sign.1=Pixel-Mart. Spend money. Live longer.
custom.theme.caves.sign.2=When you're attacked by several monsters at the same time, try to retreat behind a door.
custom.theme.caves.sign.3=If you're burning, don't let yourself get boxed in. Vertical movement matters more in the caves.
custom.theme.caves.sign.4=There is no sense in possessing more than one Ankh at the same time, because you will lose them upon resurrecting.
custom.theme.caves.sign.5=DANGER! Heavy machinery can cause injury, loss of limbs or death!
custom.theme.city.sign.1=Pixel-Mart. A safer life in dungeon.
custom.theme.city.sign.2=When you upgrade an enchanted weapon, there is a chance to destroy that enchantment.
custom.theme.city.sign.3=Weapons and armors deteriorate faster than wands and rings, but there are more ways to fix them.
custom.theme.city.sign.4=The only way to obtain a Scroll of Wipe Out is to receive it as a gift from the dungeon spirits.
custom.theme.city.sign.5=No weapons allowed in the presence of His Majesty!
custom.theme.halls.sign.1=As you try to read the sign it bursts into greenish flames.
custom.title.about_text=A realtime platform adaption of Skillful Pixel Dungeon by BilbolDev
