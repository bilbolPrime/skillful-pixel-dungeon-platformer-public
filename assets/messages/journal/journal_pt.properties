journal.document.adventurers_guide.alchemy.body=Se você não achar um item consumível útil, pode usá-lo como ingrediente alquímico ou transformá-lo em energia alquímica universal. Poções e pergaminhos energizantes também os identificam! \n\n Os amuletos são um tipo único de equipamento criado e aprimorado por meio da alquimia. Eles são feitos com um catalisador mágico para amuletos e um pouco de energia alquímica. \n\n (O primeiro caldeirão de alquimia está no 3º ou 4º andar da masmorra. Há páginas de livros de receitas de alquimia perto desses caldeirões também.)
journal.document.adventurers_guide.alchemy.title=Alquimia e Bugigangas
journal.document.adventurers_guide.dieing.body=Explorar masmorras é perigoso e a maioria dos aventureiros acaba encontrando seu fim. A sorte ajuda, mas os melhores aventureiros usam todos os truques possíveis para aumentar suas chances. (Não se frustre se estiver morrendo muito, este jogo é difícil! Concentre-se em aprender o jogo e melhorar constantemente, não em vencer imediatamente.)
journal.document.adventurers_guide.dieing.title=Lidando com a derrota
journal.document.adventurers_guide.examining.body=É importante estudar seus inimigos e o ambiente ao redor em vez de atacar às cegas! Acostume-se a examinar tudo o que for novo. (Você pode examinar usando o botão da lupa e selecionando o que deseja examinar. Você também pode examinar melhorias ou penalidades selecionando seus ícones.)
journal.document.adventurers_guide.examining.title=Examinando
journal.document.adventurers_guide.food.body=Racionar a comida de forma eficaz é uma das melhores maneiras de aumentar suas chances de sobrevivência. Você não precisa comer sempre que sentir fome! Quando você não estiver morrendo de fome, sua saúde se regenerará lentamente; portanto, se você comer quando estiver com a saúde cheia, essa regeneração será desperdiçada! Se você controlar o ritmo das suas refeições com base na sua saúde, sua comida durará muito mais tempo.
journal.document.adventurers_guide.food.title=Lidando com a fome
journal.document.adventurers_guide.identifying.body=As cores das poções e os símbolos nos pergaminhos são diferentes em cada masmorra. Equipamentos não identificados podem ser aprimorados ou encantados se você tiver sorte, ou podem estar amaldiçoados! Pergaminhos de identificação, aprimoramento ou remoção de maldição são muito úteis se você quiser reduzir o risco de usar equipamentos não identificados. (Você pode encontrar uma lista de todos os itens que identificou na aba Catálogo do seu diário)
journal.document.adventurers_guide.identifying.title=Identificação de itens
journal.document.adventurers_guide.intro.body=Saudações, aventureiro! Você está lendo o Tomo da Maestria em Masmorras! Este guia é melhor utilizado como referência e magicamente lhe indicará o melhor momento para ler cada página. (Quando o botão do diário piscar, selecione-o para ler o conteúdo do guia! Algumas páginas estão faltando, mas talvez você as encontre na masmorra.)
journal.document.adventurers_guide.intro.title=Introdução
journal.document.adventurers_guide.levelling.body=Subir de nível aumenta seus atributos e concede pontos de talento, o que pode fazer uma grande diferença em combate. É melhor ter pelo menos um nível para cada andar da masmorra. Pode ser tentador se apressar e evitar a exploração ou o combate, mas fazer isso o privará de suprimentos e experiência. (Você pode ver informações sobre seu herói, incluindo experiência, no painel de status no canto da interface do jogo. Selecione o retrato do seu herói para obter ainda mais informações.)
journal.document.adventurers_guide.levelling.title=Adquirindo experiência
journal.document.adventurers_guide.looting.body=Salas atrás de portas trancadas ou que contêm obstáculos geralmente têm itens melhores. Quando um obstáculo bloqueia seu caminho, você geralmente pode encontrar um item útil no mesmo andar. Você sempre poderá encontrar 2 poções de força e 3 pergaminhos de aprimoramento em cada região de masmorra de cinco andares, então eles são um ótimo indicador de quão bem você está explorando. (Você pode ver uma lista de pontos de referência e chaves não utilizadas na aba de notas da janela do diário.)
journal.document.adventurers_guide.looting.title=Saque Eficaz
journal.document.adventurers_guide.magic.body=Ataques mágicos atravessam armaduras e são difíceis de esquivar. Isso significa que o dano de varinhas é muito confiável, mas também torna os inimigos mágicos muito perigosos! No entanto, ataques mágicos sempre têm uma desvantagem. Varinhas têm cargas limitadas e inimigos mágicos geralmente não conseguem usar sua magia em curta distância. Ao enfrentar inimigos que usam magia, é importante aprender como impedi-los de usá-la contra você.
journal.document.adventurers_guide.magic.title=Ataques Mágicos
journal.document.adventurers_guide.positioning.body=A estratégia é tão importante quanto o equipamento. Situações ruins, como ser cercado, geralmente podem ser evitadas com um bom posicionamento. Por exemplo, a maioria das masmorras tem corredores estreitos que forçam os inimigos a lutar um de cada vez. Esses corredores geralmente também têm portas para ataques surpresa! Existem muitas maneiras de usar elementos do ambiente, como grama, água, buracos ou armadilhas, a seu favor.
journal.document.adventurers_guide.positioning.title=Posicionamento
journal.document.adventurers_guide.searching.body=As masmorras estão repletas de portas secretas e armadilhas que parecem invisíveis à primeira vista. Você pode dedicar algum tempo e procurar cuidadosamente se suspeitar que alguma porta ou armadilha esteja escondida por perto. (Você pode examinar todos os quadrados ao seu redor usando o botão da lupa duas vezes. Talvez haja algumas portas escondidas perto de onde você encontrou esta página!)
journal.document.adventurers_guide.searching.title=Pesquisando
journal.document.adventurers_guide.strength.body=Não há tempo para treinar com as armas e armaduras encontradas na masmorra, então você precisará de força bruta para usá-las com eficácia. Poções de força e pergaminhos de aprimoramento são a maneira mais eficaz de atender aos requisitos de força de equipamentos de nível superior. É importante eventualmente começar a usar itens de nível superior, mas não ignore os equipamentos que você pode usar agora.
journal.document.adventurers_guide.strength.title=Força
journal.document.adventurers_guide.surprise_attacks.body=Os ataques surpresa têm acerto garantido, tornando-os especialmente úteis contra inimigos evasivos como cobras e espectros. Você pode surpreender os inimigos logo após eles entrarem em uma porta enquanto o perseguem, ou quando eles o perdem de vista.
journal.document.adventurers_guide.surprise_attacks.title=Ataques surpresa
journal.document.adventurers_guide.title=tomo de domínio de masmorras
journal.document.adventurers_guide.upgrades.body=Quanto mais fundo você for em uma masmorra, mais importante será usar equipamentos de alto nível aprimorados magicamente, mas você também precisará de força para usá-los corretamente. Varinhas, anéis e artefatos não precisam de força, mas têm usos limitados ou não ajudam tão diretamente em combate. Fazer boas escolhas sobre o que aprimorar é muito importante para sobreviver no início da masmorra e para se preparar para o sucesso mais tarde.
journal.document.adventurers_guide.upgrades.title=Atualizações
journal.document.alchemy_guide.bombs.body=Uma bomba de pólvora negra padrão pode ser misturada com um item específico para criar uma bomba aprimorada.
journal.document.alchemy_guide.bombs.title=Bombas aprimoradas
journal.document.alchemy_guide.brews_elixirs.body=Poções e elixires são poções avançadas com uma variedade de efeitos, geralmente de uso único.
journal.document.alchemy_guide.brews_elixirs.title=bebidas e elixires
journal.document.alchemy_guide.energy_food.body=Muitas receitas requerem energia alquímica cristalina, que é produzida pela desconstrução de itens consumíveis em um caldeirão de alquimia. Poções ou pergaminhos energizantes também as identificam. Algumas receitas que requerem energia são mágicas, mas estas se assemelham à culinária tradicional.
journal.document.alchemy_guide.energy_food.title=Energia e Alimentos
journal.document.alchemy_guide.exotic_potions.body=Poções podem ser misturadas com energia para criar poções exóticas. Elas têm efeitos mais poderosos, mas geralmente são úteis de maneiras diferentes.
journal.document.alchemy_guide.exotic_potions.title=poções exóticas
journal.document.alchemy_guide.exotic_scrolls.body=Pergaminhos exóticos podem ser criados com um pouco de energia e um pergaminho. Eles são um pouco mais fortes e mais caros do que poções exóticas.
journal.document.alchemy_guide.exotic_scrolls.title=pergaminhos exóticos
journal.document.alchemy_guide.potions.body=Bem-vindo(a) às Aplicações Práticas da Alquimia! Este livro é um guia de receitas para criar itens em um caldeirão de alquimia. Começaremos com a receita mais icônica: Poções! Use três sementes para preparar uma poção aleatória! Cada semente tem uma poção correspondente; use várias sementes iguais para aumentar a chance de a poção estar relacionada às sementes que você usou.
journal.document.alchemy_guide.potions.title=Introdução e Poções
journal.document.alchemy_guide.spells.body=Os feitiços estão contidos em cristais e proporcionam uma variedade de efeitos, geralmente com múltiplos usos.
journal.document.alchemy_guide.spells.title=feitiços
journal.document.alchemy_guide.stones.body=Misturar um pergaminho em um caldeirão de alquimia irá imbuir sua magia em duas pedras dentro do caldeirão. Isso cria runas e identifica o pergaminho!
journal.document.alchemy_guide.stones.title=Criando Runas
journal.document.alchemy_guide.title=Guia de Alquimia
journal.document.alchemy_guide.weapons.body=Algumas das armas mais leves ou mágicas podem ser usadas em alquimia! Cada conjunto de armas de arremesso produz metal líquido suficiente para reparar completamente outro conjunto do mesmo nível e categoria. Observe que alquimizar um conjunto o destruirá por completo, mesmo que não esteja totalmente presente! Uma varinha produzirá resina arcana suficiente para aprimorar duas varinhas do mesmo nível, mas não acima de +3.
journal.document.alchemy_guide.weapons.title=Aprimorando Armas
journal.document.caves_explorer.alive.body=23 de Verão, 308\n\nUma das máquinas anãs ganhou vida de alguma forma! Estávamos apenas passando quando ela avançou e quase esmagou dois do nosso grupo com seus enormes punhos de metal. Felizmente, eu estava carregando minha varinha de desintegração. Alguns disparos bem direcionados e a besta foi reduzida a sucata.\n\nO que me preocupa é que não fizemos absolutamente nada para provocar a máquina. Os anões não poderiam ter projetado as máquinas para serem tão agressivas, é como se ela estivesse tentando nos emboscar!\n\nPelo menos consegui ajudar meus companheiros desta vez.\n- Archibald
journal.document.caves_explorer.alive.title=Está vivo!
journal.document.caves_explorer.city.body=21 de Verão, 308\n\nJá estamos na terceira semana e, depois de passarmos grande parte dos últimos dez dias explorando cada vez mais fundo, finalmente chegamos ao fundo das minas. Encontramos várias engenhocas de metal e um grande portão que bloqueia a entrada para a antiga metrópole anã.\n\nO ferreiro nos alertou sobre algumas dessas máquinas. Aparentemente, elas foram feitas para defesa de área e têm a tendência de ativar quando perturbadas. Não temos nada a fazer na cidade e o metal teria pouco valor como sucata, então achamos melhor acatar o aviso e voltar.\n\nDevo admitir que estava curioso, mas investigar lá embaixo certamente não valia o risco.\n- Archibald
journal.document.caves_explorer.city.title=A entrada da cidade
journal.document.caves_explorer.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores neste conjunto.
journal.document.caves_explorer.expedition.body=1º de Verão, 308\n\nHoje começa nossa expedição de quatro semanas às minas anãs abandonadas! Fui incumbido pelo próprio rei de explorar a região. Meus principais objetivos são encontrar quaisquer recursos naturais inexplorados e inspecionar as cavernas para um possível projeto de construção de prisão.\n\nEmbora eu seja capaz de me defender, aceitei uma escolta da guarda da cidade por insistência do rei. Eles são um bando de simplórios, mas contanto que não me atrasem, sua presença é tolerável.\n\nEsperamos limpar os esgotos e chegar às minas até o anoitecer.\n- Archibald Drummond. Arquimago, Instituto de Magia do Sul.
journal.document.caves_explorer.expedition.title=Início da Expedição!
journal.document.caves_explorer.gold.body=4 de Verão, 308\n\nNossos primeiros dias foram realmente muito frutíferos! Depois de estabelecer um acampamento base, partimos para explorar algumas das áreas superiores da mina abandonada. Embora haja muita tralha inútil deixada pelos anões, muitas das paredes da caverna também estão repletas de ouro!\n\nInfelizmente, não somos os primeiros aqui. As cavernas estão infestadas de animais selvagens agressivos e parece que bandos de gnolls também estão interessados no ouro. Admito que fui injusto com minha escolta de guardas; eles têm se mostrado exploradores e guarda-costas muito mais capazes do que eu esperava.\n\nMesmo com esse sucesso, ainda temos muito da mina para explorar.\n- Archibald
journal.document.caves_explorer.gold.title=Tanto ouro!
journal.document.caves_explorer.report.body=28 de Verão, 308\n\nHoje terminaremos de empacotar nossos pertences e nos prepararemos para partir. E bem a tempo, pois vários membros do nosso grupo começaram a ter pesadelos terríveis após o incidente com a máquina agressiva. Provavelmente é apenas cansaço, mas os pesadelos são todos preocupantemente semelhantes.\n\nEm resumo, as áreas superiores da mina são bastante seguras. Se uma utilidade pudesse ser encontrada para o ouro negro, sua mineração poderia ser bastante lucrativa. Os grandes espaços abertos também seriam muito úteis para os planos de construção da cidade. As minas inferiores, no entanto, são mais perigosas e devem ser evitadas.\n\nEscreverei tudo isso no meu relatório final nos próximos dias.\n- Archibald
journal.document.caves_explorer.report.title=Relatório Final
journal.document.caves_explorer.title=Diário do Explorador
journal.document.caves_explorer.troll.body=11 de Verão, 308\n\nApós iniciarmos nossa exploração na seção central das minas, encontramos um rosto amigável! Bem... relativamente amigável. Um troll das cavernas montou uma pequena ferraria ali. Ele é ranzinza e pouco falante, mas consertou nosso equipamento em troca de um pouco de ouro.\n\nInfelizmente, o ferreiro troll também nos informou que todo esse ouro bonito não é tão bom quanto parece. Ele o chama de "ouro escuro" e, aparentemente, se degrada rapidamente sob a luz do sol. Isso certamente explicaria por que nunca houve conflitos pelos recursos aqui.\n\nSuponho que precisamos cavar um pouco mais fundo para ver se há algo mais valioso.\n- Archibald
journal.document.caves_explorer.troll.title=Encontrei um Troll
journal.document.city_warlock.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores neste conjunto.
journal.document.city_warlock.failure.body=Parece que eu também fui tolo. Presumi que o Novo Rei precisava que a corte se submetesse a ele de bom grado, mas agora vejo que ele tem o poder de controlar até mesmo aqueles que resistem a ele. Ele trouxe cegamente toda a oposição mais forte até a sua porta para que pudesse transformá-los pessoalmente em seus escravos. Agora, ondas de sua energia necromântica estão varrendo a cidade, transformando instantaneamente a maioria em seus suplicantes. Os poucos que ainda têm livre arbítrio estão fugindo. Decidi ficar para trás para observar o melhor que puder e procurar uma brecha. Com o poder mágico que possuo, devo conseguir me manter escondido e seguro por algum tempo.
journal.document.city_warlock.failure.title=Falha
journal.document.city_warlock.more_powerful.body=Tem sido difícil controlar o tempo, mas já faz uma semana desde minha última anotação. Nossa civilização realmente entrou em colapso. Os portões estão fechados, todas as funções da nossa sociedade cessaram e carcaças vazias de anões vagam pelos corredores. Em meio a tudo isso, de alguma forma, o Novo Rei está se tornando ainda mais poderoso. A cada dia, a força de sua vontade aumenta, mas também está mudando. Não consigo descrever, mas parece que ele não é mais um anão. Estou começando a aceitar que o melhor que posso fazer é documentar esses eventos. Ficarei aqui o máximo que puder e então me retirarei quando minha vontade começar a enfraquecer.
journal.document.city_warlock.more_powerful.title=Mais poderoso
journal.document.city_warlock.new_power.body=O que está acontecendo aqui? O poder que emana do Novo Rei é de fato diferente do que era antes, mas há algo mais. Esse novo poder parece irradiar dos corredores mais internos da nossa cidade. Ainda mais intrigante é que a atividade na metrópole superior também diminuiu. Não sei o que está acontecendo lá embaixo, mas está atraindo quase toda a atenção do Novo Rei. Retornar aos corredores profundos será perigoso, mas preciso descobrir o que está causando essa mudança. Talvez o Novo Rei tenha uma fraqueza, afinal?
journal.document.city_warlock.new_power.title=Um Novo Poder
journal.document.city_warlock.old_king.body=É o quinto dia do segundo mês do trigésimo terceiro ano da era da magia. Se um habitante do mundo superior estiver lendo isto, é algum momento do inverno de 264. Meu nome é Thymor Zahir e, pelo que sei, sou o último membro sobrevivente da corte anã. Nosso rei está morto, substituído por um dos meus antigos colegas que enlouqueceu com o poder. O resto da corte se submeteu a ele, como os tolos que são, e perdeu seu livre-arbítrio no processo. Só eu previ isso e fugi antes que seu ritual pudesse ser concluído. O círculo interno caiu, mas o poder do Novo Rei ainda não alcançou a todos. Devo organizar uma resistência o mais rápido possível. Recuso-me a deixar nossa gloriosa civilização sucumbir a este megalomaníaco!
journal.document.city_warlock.old_king.title=O Rei está morto
journal.document.city_warlock.resistance.body=A notícia parece ter se espalhado rapidamente. Faz apenas alguns dias e eu já reuni um pequeno exército de lealistas ao Velho Rei. Poucos são habilidosos com magia, mas quase toda a ordem de monges guerreiros está entre nós. Devemos ser mais do que páreo para um anão insano e sua corte de escravos. Enquanto isso, o Novo Rei se escondeu nos aposentos internos de nossa cidade. Sem dúvida, ele já gastou a maior parte de seu poder e espera se recuperar antes de encontrar mais resistência. Lançaremos nosso ataque em algumas horas. Com sorte, conseguiremos formar um conselho provisório e restaurar a estabilidade de nossa maravilhosa cidade até o final da noite.
journal.document.city_warlock.resistance.title=Uma resistência
journal.document.city_warlock.seen_it.body=Vi o que jaz abaixo, mas não consigo descrever. Minhas mãos tremem incontrolavelmente enquanto tento colocar meus pensamentos no papel. Por que isso está acontecendo? Foi o Novo Rei que fez isso? Não faz sentido. Talvez seu uso desenfreado do poder tenha atraído isso? Eu esperava salvar nossa civilização, mas agora vejo que o mundo inteiro está em risco. De alguma forma, o rei é o menor dos males. Não tenho outra escolha, pelo bem maior, me entregarei. Por favor, guie-me, meu rei, use-me como um instrumento para manter Yog-Dzewa sob controle!
journal.document.city_warlock.seen_it.title=Eu já vi isso
journal.document.city_warlock.title=Diário do Bruxo
journal.document.halls_king.amulet.body=EU CONSEGUI! ZXQPH0 ZXQ ZXQPH1 ZXQ Eu não sabia exatamente o que encontraria, mas o que descobri lá fora superou minhas expectativas mais ousadas. Tanto poder, ali, pronto para ser tomado, e é todo meu! ZXQPH2 ZXQ ZXQPH3 ZXQ Com isso, nenhum dos tolos da corte ousará se opor a mim. Estou eufórico só de pensar em todas as maneiras diferentes pelas quais eu poderia humilhá-los. Ora, por que parar por aí? Tenho poder suficiente para destruir cada um deles, se eu quiser! Isso pode ser excessivo, mas não devo demorar muito para decidir ou eles ficarão desconfiados. ZXQPH4 ZXQ ZXQPH5 ZXQ Acho que vou chamar esse grande poder de Amuleto de Yendor! ZXQPH6 ZXQ - R.
journal.document.halls_king.amulet.title=O Amuleto
journal.document.halls_king.attrition.body=Tenho um plano para lidar com essa coisa. Seu poder é infinito, mas sua capacidade de invadir este mundo não é. Ela depende de lacaios e avatares para fazerem sua vontade enquanto tenta acumular poder suficiente para tomar o amuleto. Embora eu não possua o amuleto fisicamente, ainda tenho controle total sobre seu poder. Com toda a cidade anã à minha disposição, também tenho vantagem numérica. Posso simplesmente continuar enviando soldados para impedi-la de tomar o amuleto e vencer esta guerra gradualmente por desgaste! Eu, Rodney, Rei dos Anões, sobreviverei a você, Yog-Dzewa!
journal.document.halls_king.attrition.title=Atrito
journal.document.halls_king.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores neste conjunto.
journal.document.halls_king.new_king.body=EU SOU O REI, AHAHAHAHAAA!\n\nEles simplesmente me deixaram fazer isso! Sem quase nenhum convencimento, concordaram em me deixar 'compartilhar' esse poder com eles em um grande ritual. Em um instante, eles se transformaram de um coro de vozes zombeteiras em minha nova corte de súditos silenciosos!\n\nComo era de se esperar, Thymor fugiu como um covarde ao primeiro sinal de problema. Já consigo sentir a força de resistência que ele está formando. Acho que vou permitir que ele continue, para que possa entregar todos os seus conspiradores diretamente à minha porta!\n\nClaramente, o reino também não me respeita. Suponho que vou resolver isso também.\n- Rei dos Anões
journal.document.halls_king.new_king.title=Um Novo Rei
journal.document.halls_king.rejection.body=IMBECIS!\n\nNos últimos 33 anos, nosso reino prosperou com nossa nova tecnologia mágica. Aprendemos a invocar espíritos elementais e dobrá-los à nossa vontade, mas, de alguma forma, agora novas experiências são 'perigosas demais'.\n\nEu sei o que realmente está acontecendo. A rejeição das minhas teorias não tem nada a ver com o mérito delas e sim com a pessoa que as sugere. Provavelmente estão todos rindo de mim pelas minhas costas.\n\nBem, chega! Não me importo com o que dizem, explorarei os confins do nosso universo sozinho e guardarei tudo o que descobrir para mim!\n- R.
journal.document.halls_king.rejection.title=Rejeição
journal.document.halls_king.ritual.body=Thymor me confrontou publicamente hoje mais cedo e insistiu que eu explicasse minha nova fonte de poder. Eu o ignorei o melhor que pude, mas sinto os olhares julgadores do resto da corte sobre mim mais uma vez. Eu esperava passar um pouco mais de tempo aproveitando a calmaria antes da tempestade, mas não importa mais. Decidi o que quero fazer. Alegarei que obtive meu poder através de um novo ritual e me oferecerei para realizá-lo nos outros bruxos e no Rei. Assim que o ritual terminar, serei rei! Thymor protestará, é claro, mas com tanto poder em jogo, duvido que o ouçam! TODOS SE CURVARÃO PERANTE MIM! - Futuro Rei dos Anões
journal.document.halls_king.ritual.title=O Ritual
journal.document.halls_king.thing.body=Há um problema. Thymor foi derrotado sem esforço, mas parece que minha busca nos planos exteriores não passou despercebida. Alguma... 'coisa'... foi atraída para o meu mundo e está começando a forçar sua passagem pelo fundo dos corredores inferiores. Para complicar ainda mais as coisas, esse é o local exato onde guardei o amuleto! Uma criatura tão rancorosa, por que tenta me negar meu poder quando ainda há muito lá fora para ser tomado? Apesar do meu poder, não acho que posso simplesmente atacar e lutar contra ele. Seu verdadeiro poder é insondável, mas deve haver alguma maneira de limitá-lo. DEFENDEREI MEU PRÊMIO!
journal.document.halls_king.thing.title=A Coisa
journal.document.halls_king.title=Diário de ???
journal.document.intros.caves.body=Essas cavernas pouco povoadas estendem-se sob a prisão abandonada. Ricas em minerais, elas já foram um centro de comércio e indústria movimentados para a sociedade anã abaixo, mas foram abandonadas quando os anões se tornaram obcecados por magia negra. As cavernas agora são habitadas principalmente por vida selvagem subterrânea, gnolls e máquinas abandonadas; provavelmente corrompidas pelo mesmo poder que afetou as regiões acima.
journal.document.intros.caves.title=Cavernas
journal.document.intros.city.body=A Metrópole Anã já foi a maior de todas as cidades-estado anãs. Em seu auge, os anões construíram máquinas maravilhosas de metal e magia que permitiram que sua cidade se expandisse rapidamente. Então, um dia, os portões da cidade foram trancados e ninguém mais ouviu falar dos anões. Os poucos que escaparam da cidade quando ela se fechou contaram histórias de um feiticeiro louco que roubou o trono e da terrível magia que ele aprendeu a controlar.
journal.document.intros.city.title=Metrópole Anã
journal.document.intros.discover_hint=Você pode encontrar esse texto ao acessar uma região específica pela primeira vez.
journal.document.intros.dungeon.body=Muitos heróis da cidade acima já se aventuraram na masmorra antes de você, e a maioria nunca mais foi vista. Dizem que um mal ancestral espreita nas profundezas, guardando o todo-poderoso Amuleto de Yendor. Mesmo agora, uma energia sombria irradia de baixo, abrindo caminho até a cidade. Você conquistará a masmorra e reivindicará o amuleto? É hora de começar sua própria aventura!
journal.document.intros.dungeon.title=Masmorra
journal.document.intros.halls.body=Esses salões profundos da Metrópole Anã foram corrompidos por magia negra. No passado, essas regiões abrigavam a corte de feiticeiros de elite do Rei Anão, mas agora parecem ter sido tomadas por algo ainda mais sinistro... Todos os tipos de criaturas demoníacas horripilantes habitam esses salões, lideradas por algum poder sombrio terrível. Se o Rei dos Anões não foi a fonte da corrupção que se espalha, o que quer que esteja aqui embaixo deve ser. Cuidado, poucos aventureiros já desceram tão fundo...
journal.document.intros.halls.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores neste conjunto.
journal.document.intros.halls.title=Salões Demoníacos
journal.document.intros.prison.body=Há muitos anos, uma prisão foi construída aqui para abrigar criminosos perigosos. Rigorosamente controlada e segura, condenados de toda a região eram trazidos para cá para cumprir pena. Mas logo uma névoa escura começou a se espalhar por baixo, corrompendo as mentes de guardas e prisioneiros. Em resposta ao caos crescente, a cidade isolou toda a prisão. Ninguém sabe o que aconteceu com aqueles que foram deixados para morrer dentro dessas paredes...
journal.document.intros.prison.title=Prisão
journal.document.intros.sewers.body=Os andares superiores da masmorra constituem, na verdade, o sistema de esgoto da cidade. À medida que a energia sombria se insinuou das profundezas, as criaturas do esgoto, geralmente inofensivas, tornaram-se cada vez mais ferozes. A cidade teve que enviar patrulhas de guarda para cá, a fim de tentar manter a segurança daqueles que vivem acima. Este lugar é perigoso, mas pelo menos a magia maligna que atua aqui é fraca.
journal.document.intros.sewers.title=Esgotos
journal.document.intros.title=Apresentação das regiões
journal.document.prison_warden.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores neste conjunto.
journal.document.prison_warden.journal.body=Primeiro dia da primavera de 362\n\nEsta é a primeira entrada no diário de trabalho da diretora da prisão, Kiana Smith. Com tudo o que tem acontecido ultimamente, decidi começar um diário para organizar meus pensamentos.\n\nGerenciar uma prisão a meio quilômetro de profundidade nunca seria fácil, mas ultimamente parece que algum tipo de perturbação organizada está acontecendo. Os detentos têm se comportado mal sem motivo aparente e se recusam a explicar o porquê.\n\nAlguns dos guardas estão começando a dizer que o lugar é assombrado. Não posso deixar que meus próprios funcionários espalhem boatos, mas não posso culpá-los por estarem inquietos.\n- Smith
journal.document.prison_warden.journal.title=Manter um diário
journal.document.prison_warden.letter.body=Thomas, você tem sido um ótimo amigo, então estou lhe fazendo um favor. Quando começar seu turno hoje à noite, tranque e reforce a cela de Tengu, jogue a chave em algum nicho e saia. Não importa se os outros prisioneiros estiverem sem vigilância, logo ninguém poderá sair deste lugar. Aquele maluco precisa ficar preso, se ele escapar, não dá para saber o que ele fará. Não conte a ninguém sobre isso e não se preocupe em me procurar. Uma capitã deve afundar com seu navio. - Kiana
journal.document.prison_warden.letter.title=Carta para Thomas
journal.document.prison_warden.mines.body=54º dia do Inverno, 363\n\nUm grupo de engenheiros da cidade chegou hoje, dizendo que estão aqui para selar a antiga entrada das minas subterrâneas. Suponho que a cidade não queira mais se preocupar com a manutenção da passagem. Não fui informado com antecedência, como de costume.\n\nO engenheiro-chefe deles também me contou um monte de bobagens sobre magia anã vazando das minas. Não acredito em uma palavra sequer.\n\nA situação está muito mais controlada com nossa nova equipe, mas a raiz do problema ainda não foi resolvida. Algo definitivamente está afetando os detentos aqui, e derrubar algumas paredes não vai mudar isso.\n- Smith
journal.document.prison_warden.mines.title=Selando as minas
journal.document.prison_warden.no_support.body=11 de Primavera, 364\n\nO que diabos a cidade está pensando? Depois de solicitar ajuda urgentemente, não ouvi nada, nem mesmo um pedido de desculpas vazio como costumam enviar quando meus pedidos são negados.\n\nEnquanto isso, os detentos continuam piorando e alguns dos guardas até começaram a causar problemas. Será que eles pretendem deixar isso piorar até que tenhamos uma rebelião?!\n\nPelo menos Thomas continua sendo confiável como sempre. Sua ajuda organizacional tem sido inestimável, e sua ideia de ativar aquelas antigas unidades DM-100 foi lamentável, mas necessária. Estou confiante de que posso retomar o controle dessa situação, só preciso de um pouco de apoio!\n-Smith
journal.document.prison_warden.no_support.title=Sem suporte
journal.document.prison_warden.recruits.body=80º dia da Primavera, 362\n\nComo prometido, um monte de novos recrutas chegou hoje. Parece o de sempre, alguns promissores e muitos peões que só querem o salário. Mesmo assim, ter toda essa nova força bruta deve ajudar bastante com nossos detentos indisciplinados recentes.\n\nEm um trabalho como este, é importante saber em quem você pode confiar. Um novo contratado, Thomas, parece especialmente promissor. Preciso de toda a ajuda possível agora, então, se ele se sair bem, verei se consigo promovê-lo rapidamente.\n- Smith
journal.document.prison_warden.recruits.title=Novos recrutas
journal.document.prison_warden.rotberry.body=23 de Outono, 363\n\nRecebi um lindo presente do Felix hoje. É um arbusto vermelho brilhante chamado 'Rotberry'.\n\nJá mencionei para ele como este lugar é deprimente, parece que ele estava ouvindo. Segundo ele, esta planta não gosta de luz nem água, então eu só preciso podar as folhas uma vez por mês, mais ou menos. Podá-la deve ser importante, ele mencionou isso uma dúzia de vezes em sua carta.\n\nClaro, Felix nunca faz nada de graça. Ele diz que as sementes que esta planta produz são ótimas para fazer varinhas, então, naturalmente, eu lhe devo algumas cada vez que a planta produz.\n- Smith
journal.document.prison_warden.rotberry.title=Planta de Rotberry
journal.document.prison_warden.title=Diário do Guarda
journal.document.sewers_guard.crabs.body=11 de Inverno, 376\nQueridos Mamãe e Papai,\n\nComo se os ratos já não fossem ruins o suficiente, lá embaixo tem caranguejos gigantes! Um deles passou correndo por mim e acertou o Lee em cheio antes de conseguirmos matá-lo. O Thomas diz que não é minha culpa, mas eu sei que ele só está tentando ser legal comigo.\n\nFelizmente, na saída, encontramos um aventureiro que tinha um pouco de pomada de capim-sol sobrando. O Lee talvez não tivesse sobrevivido sem aquilo.\n\nEu vi o aventureiro olhando para uma rosa antes de partir; ele disse que era um presente. Por que ele arriscaria a vida aqui embaixo se alguém se importa tanto com ele?\n\nÉ exatamente isso que estou fazendo, não é? Sinto que estou me metendo em algo que não consigo lidar.
journal.document.sewers_guard.crabs.title=Caranguejos gigantes!
journal.document.sewers_guard.dangerous.body=88º dia do Outono, 375\nQueridos Mamãe e Papai,\n\nAgora eu entendo por que o pagamento é tão bom, os esgotos estão infestados de monstros! Os 'vermes' e 'foras da lei' são ratos gigantes sedentos de sangue e bandos de gnolls furiosos.\n\nFelizmente, o resto da minha equipe sabe o que está fazendo. Nosso capitão, Thomas, é um especialista nisso. Estou tentando aprender rápido para não ser um peso para vocês.\n\nEste trabalho é muito mais perigoso do que eu imaginava. Ainda bem que não posso enviar isso agora, não quero que vocês se preocupem.\n\nVou me cuidar,\n- Sonya
journal.document.sewers_guard.dangerous.title=Uma posição perigosa...
journal.document.sewers_guard.discover_hint=Você pode encontrar este texto em uma região específica, mas somente depois de encontrar todos os textos anteriores neste conjunto.
journal.document.sewers_guard.guild.body=23 de Inverno, 376\nQueridos Mamãe e Papai,\n\nDesta vez não encontramos novos monstros. Em vez disso, nos deparamos com um pequeno grupo da guilda dos ladrões durante uma patrulha.\n\nTudo o que ouvi sobre a guilda é ruim, mas o resto da minha equipe pareceu quase amigável com eles. Thomas trocou informações e suprimentos com um deles antes de seguirmos caminhos separados.\n\nNão entendo, não era para estarmos nos livrando de foras da lei? Thomas até disse para não mencionar isso a ninguém no comando. As informações e os suprimentos deles foram muito úteis, e não aguentaríamos mais lutas.\n\nAcho que estamos todos juntos nessa aqui embaixo.
journal.document.sewers_guard.guild.title=A Guilda dos Ladrões
journal.document.sewers_guard.lost.body=40º dia do Inverno, 376\n\nThomas e eu estamos perdidos. Nos separamos do resto da equipe enquanto lutávamos contra alguns gnolls. Nenhum de nós está ferido, mas os esgotos inferiores são como um labirinto.\n\nThomas diz que conhece uma rota de saída, mas ela começa na antiga entrada da prisão, no fundo dos esgotos. Eu realmente não gosto de ir mais fundo, mas não temos rações e descer é muito mais rápido do que ficar vagando por aí procurando nossa rota de patrulha.\n\nVai ficar tudo bem. Thomas sabe o que está fazendo.
journal.document.sewers_guard.lost.title=Estamos perdidos
journal.document.sewers_guard.new_position.body=85º dia do Outono, 375\nQueridos Mamãe e Papai,\n\nEu disse a vocês que todo o trabalho duro na guarda da cidade valeria a pena. Acabei de ser promovido!\n\nFui convidado para me juntar a uma equipe especializada que trabalha nos esgotos. Aparentemente, há problemas com pragas e foras da lei lá embaixo, e é nosso trabalho eliminá-los. É um trabalho sujo, mas os esgotos são quentes no inverno e pagamos três vezes mais do que o serviço de guarda normal!\n\nÉ tudo meio secreto, então não posso enviar esta carta. É estranho não escrever para vocês, então vou continuar escrevendo mesmo assim. Talvez eu possa mostrá-los a você um dia.\n\nMelhor,\n- Sonya
journal.document.sewers_guard.new_position.title=Meu novo cargo!
journal.document.sewers_guard.not_worth.body=Thomas e eu nos deparamos com uma espécie de monstro gosmento gigantesco na entrada da prisão. Antes que pudéssemos reagir, ele nos atingiu com magia. Thomas absorveu a maior parte do dano. Ele se foi. Nenhum dinheiro do mundo vale isso. Vou sair pela rota que Thomas me indicou. Depois, usarei o que ganhei como guarda para tirar meus pais e a mim desta cidade amaldiçoada. Uma parte de mim quer acreditar que o Rei tenha um plano para tudo isso, mas duvido. Estou deixando estas cartas como um aviso para os outros. É mais do que apenas ratos e caranguejos gigantes, algo está muito errado aqui embaixo.
journal.document.sewers_guard.not_worth.title=Não vale a pena.
journal.document.sewers_guard.title=Cartas da Guarda
