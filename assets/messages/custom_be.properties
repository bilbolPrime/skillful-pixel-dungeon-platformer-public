custom.theme.sewers.intro=Падзямелле знаходзіцца прама пад горадам, яго верхнія ўзроўні насамрэч утвараюць гарадскую каналізацыйную сістэму. Паколькі гэтыя ўзроўні намінальна з'яўляюцца часткай горада, яны не такія ўжо і небяспечныя. Ніхто не назаве яго бяспечным месцам, але, прынамсі, вам тут не прыйдзецца мець справу са злой магіяй.
custom.theme.prison.intro=Шмат гадоў таму тут была пабудавана падземная турма для найбольш небяспечных злачынцаў. У той час гэта здавалася вельмі разумнай ідэяй, бо з гэтага месца сапраўды было вельмі цяжка ўцячы. Але неўзабаве знізу пачалі пранікаць цёмныя міязмы, якія зводзілі зняволеных і ахоўнікаў з розуму. У рэшце рэшт турму закінулі, хоць некаторых асуджаных пакінулі тут пад замком.
custom.theme.caves.intro=Пячоры, якія цягнуцца ўніз пад закінутай турмой, маланаселеныя. Яны ляжаць занадта глыбока, каб іх мог выкарыстоўваць горад, і занадта бедныя на карысныя выкапні, каб цікавіць гномаў. У мінулым тут, на шляху паміж гэтымі двума дзяржавамі, быў гандлёвы фарпост, але ён знік з часоў заняпаду гномскай метраполіі. Цяпер тут жывуць толькі ўсюдыісныя гнолы і падземныя жывёлы.
custom.theme.city.intro=Гномская метраполія калісьці была найвялікшым з гномскіх гарадоў-дзяржав. У перыяд свайго росквіту механізаваная армія гномаў паспяхова адбіла ўварванне старога бога і яго войска дэманаў. Але кажуць, што тыя, хто вярнуўся, прынеслі з сабой насенне разбэшчвання, і гэтая перамога стала пачаткам канца падземнага каралеўства.
custom.theme.halls.intro=У мінулым гэтыя ўзроўні былі ўскраінамі Метраполіса. Пасля дарагой перамогі ў вайне са старажытнымі багамі гномы былі занадта аслабленыя, каб ачысціць іх ад рэшткаў дэманаў. Паступова дэманы ўзмацнілі сваю ўладу над гэтым месцам, і цяпер яно называецца Дэманскімі Заламі.\n\nВельмі мала шукальнікаў прыгод калі-небудзь спускаліся так глыбока...
custom.theme.sewers.sign.1=Не пераацэньвайце свае сілы, выкарыстоўвайце зброю і даспехі, з якімі можаце справіцца.
custom.theme.sewers.sign.2=Некаторыя небяспекі ў каналізацыі лёгка не заўважыць на першы погляд. Калі пакой здаецца нечым незвычайным, зменшце хуткасць і ўважліва агледзьцеся.
custom.theme.sewers.sign.3=Памятайце, што павышэнне вашай сілы — не адзіны спосаб атрымаць доступ да лепшага рыштунку. Вы таксама можаце знізіць патрабаванні да яго сілы з дапамогай Скруткаў паляпшэння.
custom.theme.sewers.sign.4=Вы можаце траціць сваё золата ў крамах па ўсім падзямеллі. Цяпер на першым паверсе нават ёсць гандляр.
custom.theme.sewers.sign.5=Сцеражыцеся Гу!
custom.theme.prison.sign.1=Pixel-Mart - усё, што трэба для паспяховага прыгоды!
custom.theme.prison.sign.2=Як мага хутчэй вызначце свае зелля і скруткі. Не адкладайце гэта да таго моманту, калі яны вам сапраўды спатрэбяцца.
custom.theme.prison.sign.3=Быць голадам не баліць, але галадаць баліць.
custom.theme.prison.sign.4=Нечаканая атака мае больш шанцаў на траплення. Вы ўсё яшчэ можаце заспець ворагаў знянацку, калі кантралюеце прастору вакол дзвярнога праёму.
custom.theme.prison.sign.5=Не выпускай Тэнгу!
custom.theme.caves.sign.1=Pixel-Mart. Трацьце грошы. Жывіце даўжэй.
custom.theme.caves.sign.2=Калі на вас адначасова нападаюць некалькі монстраў, паспрабуйце адступіць за дзверы.
custom.theme.caves.sign.3=Калі вы гарэце, не дазваляйце сабе апынуцца ў абмежаванай прасторы. У пячорах вертыкальны рух мае большае значэнне.
custom.theme.caves.sign.4=Няма сэнсу валодаць больш чым адным Анкх адначасова, бо вы страціце іх пасля ўваскрашэння.
custom.theme.caves.sign.5=НЕБЕЗПЕКА! Цяжкая тэхніка можа прывесці да траўмаў, страты канечнасцяў або смерці!
custom.theme.city.sign.1=Pixel-Mart. Больш бяспечнае жыццё ў падзямеллі.
custom.theme.city.sign.2=Калі вы паляпшаеце зачараваную зброю, ёсць шанец знішчыць гэтыя чары.
custom.theme.city.sign.3=Зброя і даспехі псуюцца хутчэй, чым палачкі і пярсцёнкі, але ёсць больш спосабаў іх паправіць.
custom.theme.city.sign.4=Адзіны спосаб атрымаць Скрутак Знішчэння — гэта атрымаць яго ў падарунак ад духаў падзямелля.
custom.theme.city.sign.5=Зброя забароненая ў прысутнасці Яго Вялікасці!
custom.theme.halls.sign.1=Як толькі спрабуеш прачытаць надпіс, ён успыхвае зялёным полымем.
