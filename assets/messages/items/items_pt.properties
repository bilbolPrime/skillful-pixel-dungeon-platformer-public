items.artifacts.driedrose$wndghosthero.cant_cursed=O fantasma só pode usar equipamentos que você tenha certeza de que não estão amaldiçoados.
items.artifacts.driedrose$wndghosthero.cant_strength=O fantasma não é forte o suficiente para usar isso.
