scenes.heroselectscene.challenges_nowin=Os desafios são modificadores opcionais que tornam o jogo mais difícil. Alguns desafios tornam a masmorra mais perigosa, outros reduzem o poder das suas habilidades ou itens. Precisas de vencer pelo menos uma partida antes de poderes ativar os desafios.
scenes.heroselectscene.custom_seed=Sementes personalizadas
scenes.heroselectscene.custom_seed_clear=Claro
scenes.heroselectscene.custom_seed_desc=O jogo utiliza um código de semente para a geração de masmorras; a mesma semente e versão do jogo geram sempre a mesma masmorra! _Os jogos com sementes personalizadas não podem ganhar crachás nem contribuir para o número de jogos jogados e aparecem na parte inferior da página de classificação. _
scenes.heroselectscene.custom_seed_duplicate=Já tens um jogo normal em andamento com essa seed. Precisas de terminar esse jogo antes de usar a seed personalizada.
scenes.heroselectscene.custom_seed_nowin=O jogo utiliza um código de semente para a geração de masmorras; a mesma semente e versão do jogo geram sempre a mesma masmorra! \n\n_Precisa de vencer pelo menos uma partida antes de poder inserir sementes personalizadas._
