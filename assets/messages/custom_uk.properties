custom.generated.oh_i_see_you_have_cef64cb7a7=О, бачу, тобі вдалося! Сподіваюся, це тебе не надто турбує. Як я обіцяв, ти можеш обрати одну з моїх високоякісних паличок.
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=О, який приємний сюрприз зустріти порядну людину в такому місці! Я прийшов сюди за рідкісним інгредієнтом - насінням гнильниці. Як маг, я цілком можу захиститися від місцевих монстрів, але я миттєво гублюся, це дуже ніяково. Можливо, ви могли б мені допомогти? Я був би радий заплатити за ваші послуги однією з моїх найкращих паличок.
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=О, який приємний сюрприз зустріти порядну людину в такому місці! Я прийшов сюди за рідкісним інгредієнтом - трупним пилом. Його можна зібрати зі скелетних останків, і їх у підземеллі чимало. Як маг, я цілком можу захиститися від місцевих монстрів, але я миттєво гублюся, це дуже ніяково. Можливо, ви могли б мені допомогти? Я був би радий заплатити за ваші послуги однією з моїх найкращих паличок.
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=О, який приємний сюрприз зустріти порядну людину в такому місці! Я прийшов сюди за рідкісним інгредієнтом: рибою-фантомом. Її можна зловити голими руками, але її дуже важко помітити у воді. Як користувач магії, я цілком можу захиститися від місцевих монстрів, але я миттєво гублюся, це дуже ніяково. Можливо, ви могли б мені допомогти? Я був би радий заплатити за ваші послуги однією з моїх найкращих паличок.
custom.generated.oh_yes_you_are_my_14b646c984=О так! Ти мій герой! Щодо твоєї винагороди, у мене зараз немає з собою готівки, але в мене є дещо краще для тебе. Це моя сімейна реліквія.
