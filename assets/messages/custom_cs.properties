versionnewsinfo.message=Vítejte v Skillful PixelDungeon!\n \nAs of %1$s (Build %2$d): \n - Přidán režim v okně (změněno v nastavení).\n - Stisknutím klávesy Escape ve hře se otevře menu.\n - Opraven problém způsobený kombinací kláves Alt-Tab.\n\n Bavte se :D
