custom.theme.sewers.intro=ダンジョンは街の真下に位置し、上層階は実際には街の下水道システムの一部となっている。名目上は街の一部であるため、これらの階層はそれほど危険ではない。誰もここを安全な場所とは言わないだろうが、少なくとも邪悪な魔法と戦う必要はない。
custom.theme.prison.intro=何年も前、この場所に最も危険な犯罪者を収容するための地下刑務所が建設されました。当時は、ここは脱獄が非常に困難だったため、非常に巧妙なアイデアのように思われました。しかし、間もなく地下から暗い瘴気が立ち込め始め、囚人や看守を狂気に陥れました。最終的に刑務所は放棄されましたが、一部の囚人はここに閉じ込められたままとなりました。
custom.theme.caves.intro=廃墟となった監獄の地下深くに広がる洞窟は、ほとんど人が住んでいない。都市が開発するには深すぎるし、ドワーフ族の興味を引くほど鉱物資源も豊富ではない。かつてはこの二つの国家を結ぶ交易路のどこかに交易拠点があったが、ドワーフの首都が衰退して以来、その拠点も消滅してしまった。今では、どこにでもいるノール族と地底生物だけがこの地に住んでいる。
custom.theme.city.intro=ドワーフの都市国家ドワーフは、かつてはドワーフの都市国家の中で最も偉大な都市だった。最盛期には、ドワーフの機械化軍が古の神とその魔軍の侵略を撃退することに成功した。しかし、帰還した戦士たちが腐敗の種を持ち帰り、その勝利が地下王国の終焉の始まりとなったと言われている。
custom.theme.halls.intro=かつてこの階層はメトロポリスの郊外だった。古の神々との戦争で多大な犠牲を払って勝利を収めた後、ドワーフたちは残存する悪魔を一掃する力を失い、弱体化してしまった。次第に悪魔はこの地を支配下に置き、今では「魔界の広間」と呼ばれている。ここまで降りてきた冒険者はごくわずかだ…。
custom.theme.sewers.sign.1=自分の力を過信せず、自分が扱える武器と防具を使用せよ。
custom.theme.sewers.sign.2=下水道には、一見しただけでは見落としやすい危険が潜んでいる。何か違和感を感じたら、立ち止まって注意深く観察しよう。
custom.theme.sewers.sign.3=筋力を上げるだけがより良い装備を入手する方法ではないことを覚えておいてください。強化の巻物を使えば、必要な筋力値を下げることもできます。
custom.theme.sewers.sign.4=ダンジョン内の様々なお店でゴールドを使うことができます。1階にも商人がいますよ。
custom.theme.sewers.sign.5=粘液に注意！
custom.theme.prison.sign.1=Pixel-Mart - 冒険を成功させるために必要なものがすべて揃っています！
custom.theme.prison.sign.2=ポーションや巻物はできるだけ早く確認しておきましょう。実際に必要になる直前まで後回しにしてはいけません。
custom.theme.prison.sign.3=空腹であること自体は痛くないが、飢餓状態は痛む。
custom.theme.prison.sign.4=奇襲攻撃は命中率が高い。出入口周辺の空間を制圧すれば、敵の不意を突くことができる。
custom.theme.prison.sign.5=天狗を解き放つな！
custom.theme.caves.sign.1=ピクセルマート。お金を使えば、長生きできる。
custom.theme.caves.sign.2=複数のモンスターに同時に襲われた場合は、ドアの後ろに退避するようにしてください。
custom.theme.caves.sign.3=燃えるような感覚に襲われたら、身動きが取れなくなるような状況に陥らないように。洞窟内では、垂直方向の動きがより重要になる。
custom.theme.caves.sign.4=同時に複数のアンクを所有しても意味がない。なぜなら、復活した際にそれらはすべて失われるからだ。
custom.theme.caves.sign.5=危険！重機は怪我、四肢切断、または死亡事故を引き起こす可能性があります！
custom.theme.city.sign.1=ピクセルマート。ダンジョンでのより安全な生活。
custom.theme.city.sign.2=魔法のかかった武器をアップグレードすると、その魔法が破壊される可能性があります。
custom.theme.city.sign.3=武器や防具は杖や指輪よりも早く劣化するが、修理する方法はより多く存在する。
custom.theme.city.sign.4=「殲滅の巻物」を入手できる唯一の方法は、ダンジョンの精霊から贈り物として受け取ることである。
custom.theme.city.sign.5=陛下の御前では武器の持ち込みは一切禁止です！
custom.theme.halls.sign.1=看板を読もうとした途端、緑色の炎が噴き出した。
