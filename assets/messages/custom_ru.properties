custom.generated.oh_i_see_you_have_cef64cb7a7=О, я вижу, у вас всё получилось! Надеюсь, это не доставило вам слишком много хлопот. Как и обещал, вы можете выбрать одну из моих высококачественных волшебных палочек.
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=О, какой приятный сюрприз — встретить порядочного человека в таком месте! Я пришёл сюда за редким ингредиентом — семечком гнилой ягоды. Будучи магом, я вполне способен защитить себя от местных монстров, но я быстро теряюсь, это очень неловко. Может быть, вы могли бы мне помочь? Я с удовольствием заплачу за ваши услуги одной из своих лучших волшебных палочек.
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=О, какой приятный сюрприз встретить порядочного человека в таком месте! Я пришел сюда за редким ингредиентом — пылью из трупов. Ее можно собрать из останков скелетов, а их в подземелье предостаточно. Будучи магом, я вполне способен защитить себя от местных монстров, но я быстро теряюсь, это очень неловко. Может быть, вы могли бы мне помочь? Я с удовольствием заплачу за ваши услуги одной из своих лучших волшебных палочек.
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=О, какой приятный сюрприз — встретить порядочного человека в таком месте! Я пришёл сюда за редким ингредиентом: рыбой-призраком. Её можно поймать голыми руками, но в воде её очень трудно заметить. Будучи магом, я вполне способен защититься от местных монстров, но я быстро теряюсь, это очень неловко. Может быть, вы могли бы мне помочь? Я с удовольствием заплачу за ваши услуги одной из своих лучших волшебных палочек.
