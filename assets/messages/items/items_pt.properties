items.weapon.melee.whip.ability_desc=A Duelista pode _chicoteá-los_ em todos os inimigos ao seu redor. Essa habilidade causa _%1$d-%2$d de dano_, atinge todos os inimigos dentro do alcance de ataque e tem acerto garantido.
