custom.generated.warriors_are_physically_tough_and_02774ddc7a=Воїни фізично витривалі та можуть завдавати багато шкоди. Однак вони страждають, коли справа доходить до зброї дальнього бою та магії. Вивчення таких навичок все ще можливо, але вимагає більше зусиль.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Розбійники покладаються на спритність, скритність та точність. Вони перевершують мобільність, засідки, отруєння та ухильний бій, але втрачають частину сирої витривалості воїна на передовій.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Чарівники майстерно володіють мистецтвом магії. Вони страждають, коли справа доходить до фізичної сили та спритності. Навчитися таким навичкам все ще можливо, але вимагає більше зусиль.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Мисливці чудово володіють дальнім бою та мобільністю. Вони контролюють бої за допомогою луків, універсальних пострілів та стабільних знарядь виживання, але менш комфортно почуваються в тривалих сутичках ближнього бою.
