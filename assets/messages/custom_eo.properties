custom.generated.oh_i_see_you_have_cef64cb7a7=Ho, mi vidas, ke vi sukcesis! Mi esperas, ke ĝi ne tro ĝenis vin. Kiel mi promesis, vi povas elekti unu el miaj altkvalitaj sorĉbastonoj.
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=Ho, kia agrabla surprizo renkonti decan homon en tia loko! Mi venis ĉi tien por malofta ingredienco - semo de Rotbero. Estante magiisto, mi tute kapablas defendi min kontraŭ lokaj monstroj, sed mi perdiĝas tuj, estas tre embarase. Ĉu vi eble povus helpi min? Mi volonte pagos por via servo per unu el miaj plej bonaj sorĉbastonoj.
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=Ho, kia agrabla surprizo renkonti decan homon en tia loko! Mi venis ĉi tien por malofta ingredienco - kadavropolvo. Ĝi povas esti kolektita el skeletaj restaĵoj kaj estas sufiĉa nombro da ili en la kelkarcero. Estante magiisto, mi tute kapablas defendi min kontraŭ lokaj monstroj, sed mi perdiĝas tuj, estas tre embarase. Eble vi povus helpi min? Mi volonte pagos por via servo per unu el miaj plej bonaj sorĉbastonoj.
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=Ho, kia agrabla surprizo renkonti decan homon en tia loko! Mi venis ĉi tien por malofta ingredienco: fantoma fiŝo. Oni povas kapti ĝin per nudaj manoj, sed estas tre malfacile rimarki ĝin en la akvo. Estante magiisto, mi tute kapablas defendi min kontraŭ lokaj monstroj, sed mi perdiĝas tuj, estas tre embarase. Ĉu vi eble povus helpi min? Mi volonte pagos por via servo per unu el miaj plej bonaj sorĉbastonoj.
