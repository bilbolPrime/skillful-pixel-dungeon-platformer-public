items.item.rankings_desc=Morto por: %s
items.journal.alchemypage.desc=Uma página rasgada de um guia de alquimia. A maior parte do texto é muito pequena para ser lida à distância, mas é possível distinguir o título da página:
items.journal.alchemypage.name=página rasgada de um livro de alquimia
items.journal.documentpage.desc=Uma página solitária, provavelmente arrancada de algum livro. Você precisará pegá-la para lê-la.
items.journal.documentpage.name=página rasgada
items.journal.guidebook.desc=Um guia para aventureiros, deixado aqui por alguém que decidiu que aventuras não eram para si! Este livro em particular é mágico e pode inspirar os aventureiros a lerem uma página no momento certo. Apesar dessa funcionalidade, o livro é mais popular por causa das grandes palavras "Não entre em pânico!" escritas em letras grandes e amigáveis na capa.
items.journal.guidebook.hint_desktop=Seu guia tem dicas para você! Selecione o botão piscante do diário (%s) no canto superior direito para lê-lo.
items.journal.guidebook.hint_mobile=Seu guia tem dicas para você! Toque no botão piscante do diário no canto superior direito para lê-lo.
items.journal.guidebook.hint_status=Guia
items.journal.guidebook.name=tomo de domínio de masmorras
items.journal.guidepage.desc=Uma página rasgada de um guia de aventuras. A maior parte do texto é muito pequena para ler à distância, mas é possível distinguir o título da página:
items.journal.guidepage.name=página rasgada do guia
items.journal.regionlorepage$caves.desc=O que parece ser uma anotação no diário de bordo de um explorador, está surpreendentemente bem preservado apesar de sua idade. Pegue-o para ler.
items.journal.regionlorepage$caves.name=entrada de registro antiga
items.journal.regionlorepage$city.desc=Uma pequena placa de metal enferrujada com uma mensagem magicamente gravada nela. As letras ainda são legíveis apesar da idade da placa, mas você terá que pegá-la para lê-la.
items.journal.regionlorepage$city.name=tablete enferrujado
items.journal.regionlorepage$halls.desc=Um pequeno tablet preto com letras verdes brilhantes gravadas nele. À distância, as letras brilhantes se confundem em uma névoa; você terá que pegá-lo para ler.
items.journal.regionlorepage$halls.name=tablet brilhante
items.journal.regionlorepage$prison.desc=Uma anotação de diário, ou algum outro tipo de registro, escrita em um pedaço de papel antigo. Parece ter se conservado melhor do que as cartas que você encontrou nos esgotos, mas você ainda precisará pegá-la para lê-la.
items.journal.regionlorepage$prison.name=anotação de diário desgastada
items.journal.regionlorepage$sewers.desc=O que parece ser uma carta, escrita em um pedaço de papel sujo. Você precisará pegá-la para conseguir decifrar o que está escrito.
items.journal.regionlorepage$sewers.name=carta gasta
items.keys.crystalkey.desc=As superfícies cortadas desta chave cristalina brilham na escuridão. Talvez ela abra algo feito de cristal?
items.keys.crystalkey.name=Chave de cristal
items.keys.goldenkey.desc=Os entalhes nesta chave dourada são minúsculos e intrincados. Talvez ela abra um baú trancado?
items.keys.goldenkey.name=chave dourada
items.keys.ironkey.desc=Os entalhes desta antiga chave de ferro estão bastante gastos; seu cordão de couro está deteriorado pelo tempo. Que porta ela poderia abrir?
items.keys.ironkey.name=chave de ferro
items.keys.wornkey.desc=Esta chave está gasta e descolorida, mas parece robusta. Provavelmente consegue abrir alguma porta importante por perto.
items.keys.wornkey.name=chave gasta
items.kindofmisc.unequip_message=Primeiro, você precisa desequipar um desses itens. Selecione um item para trocar.
items.kindofmisc.unequip_title=Desequipe um item
items.kindofweapon.empty=vazio
items.kindofweapon.equip_cursed=Seu aperto em torno da arma se intensifica involuntariamente.
items.kindofweapon.swift_equip=Você equipa sua arma rapidamente.
items.kindofweapon.which_equip_msg=Em qual espaço de arma você gostaria de equipar este item?\n\nA Campeã ataca diretamente com sua arma primária, mas pode usar a habilidade de qualquer uma das armas. Ambas as armas compartilham a mesma quantidade de cargas.\n\nA Campeã também pode trocar instantaneamente entre sua arma primária e secundária.
items.kindofweapon.which_equip_primary=Primário (%s)
items.kindofweapon.which_equip_secondary=Secundário (%s)
items.kingscrown.ac_wear=VESTIR
items.kingscrown.desc=A coroa do último rei anão, ela brilha com uma tremenda energia mágica. Ao ser usada, a magia da coroa fluirá para a armadura que você estiver vestindo, transformando-a em uma armadura épica única com habilidades especiais. A nova armadura manterá todas as propriedades da armadura original.
items.kingscrown.discover_hint=Você pode obter este item como recompensa ao derrotar certos inimigos.
items.kingscrown.naked=Infelizmente, a coroa não pode transformar sua roupa íntima.
items.kingscrown.name=Coroa do Rei Anão
items.kingscrown.ratgraded=As patas do Rei Rato brilham intensamente enquanto sua armadura se transforma!
items.kingscrown.upgraded=A coroa brilha intensamente e depois se desintegra conforme sua armadura se transforma!
items.liquidmetal.ac_apply=APLICAR
items.liquidmetal.already_fixed=Essa arma arremessada já está em perfeitas condições!
items.liquidmetal.apply=Você usa o metal líquido %d para reparar sua arma de arremesso.
items.liquidmetal.desc=Este líquido mágico pode preencher rachaduras e rasgos em uma arma de arremesso, restaurando-a à sua condição perfeita! Se um conjunto de armas estiver faltando uma arma, mas totalmente reparado, o metal líquido pode até ser usado para substituir a arma faltante do conjunto! Uma arma de nível 1 requer 10 unidades de metal líquido para ser totalmente reparada, enquanto uma arma de nível 5 requer 30. Cada melhoria também aumenta a quantidade de metal necessária em 35%. O metal líquido não pode ser usado para reparar as pontas de dardos com ponta.
items.liquidmetal.discover_hint=Você pode criar este item através da alquimia.
items.liquidmetal.name=metal líquido
items.liquidmetal.prompt=Selecione uma arma de arremesso.
items.lostbackpack.desc=Este é o seu inventário perdido. Recolha-o para recuperar todos os itens que você perdeu!
items.lostbackpack.name=mochila perdida
items.merchantsbeacon.ac_use=USAR
items.merchantsbeacon.desc=Esta estranha peça de tecnologia anã permite que você se comunique a grandes distâncias. Após ser ativado, este farol permitirá que você venda itens para o Pixel Mart de qualquer lugar da masmorra. No entanto, a magia dentro do farol durará apenas uma sessão, então use-a com sabedoria.
items.merchantsbeacon.name=farol do comerciante
items.potions.brews.aquabrew.desc=Ao ser quebrada, esta poção libera um jato de água pressurizada no local. A força é suficiente apenas para causar dano a inimigos em chamas, mas também espalha água pelo terreno próximo, desativa armadilhas, apaga incêndios e empurra personagens perto do ponto de impacto.
items.potions.brews.aquabrew.name=água
items.potions.brews.blizzardbrew.desc=Ao ser quebrada, essa poção liberará uma tempestade giratória que se espalhará rapidamente como um gás.
items.potions.brews.blizzardbrew.name=cerveja de nevasca
items.potions.brews.brew.discover_hint=Você pode criar este item através da alquimia.
items.potions.brews.causticbrew.desc=Essa mistura espalhará uma gosma corrosiva numa vasta área ao redor do local onde se quebrar. Qualquer coisa atingida pela gosma derreterá lentamente se não puder ser removida com água.
items.potions.brews.causticbrew.name=bebida cáustica
items.potions.brews.infernalbrew.desc=Ao ser quebrada, esta poção liberará um incêndio devastador que se espalhará rapidamente como gás.
items.potions.brews.infernalbrew.name=poção infernal
items.potions.brews.shockingbrew.desc=Ao ser quebrada, esta poção desencadeará uma tempestade elétrica em uma vasta área ao redor do local onde se quebrar.
items.potions.brews.shockingbrew.name=mistura chocante
items.potions.brews.unstablebrew.desc=Esta poção mágica brilha com as cores mutáveis do arco-íris. Ao ser bebida ou arremessada, ela desencadeará o efeito de uma poção aleatória. O efeito da poção será sempre benéfico se for bebida e sempre prejudicial se for arremessada.
items.potions.brews.unstablebrew.name=cerveja instável
items.potions.elixirs.elixir.discover_hint=Você pode criar este item através da alquimia.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Você adquiriu temporariamente propriedades restauradoras semelhantes às de Goo. Enquanto estiver na água, você recuperará uma pequena quantidade de saúde por turno. O efeito é pausado quando sua saúde estiver completa ou você sair da água. Cura restante: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=cura aquática
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contém os restos de Goo aprimorados com uma poção de cura. Embora não proporcione cura imediata, restaurará gradualmente uma quantidade maior de saúde enquanto você estiver na água.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenescimento aquático
items.potions.elixirs.elixirofarcanearmor.desc=Este elixir concederá ao bebedor uma resistência duradoura a danos mágicos.
items.potions.elixirs.elixirofarcanearmor.name=elixir de armadura arcana
items.potions.elixirs.elixirofdragonsblood.desc=Ao ser consumido, este elixir enviará um poder ígneo pelas veias de quem o beber. Esse efeito tornará o bebedor imune ao fogo e permitirá que ele incendeie inimigos com ataques físicos.
items.potions.elixirs.elixirofdragonsblood.name=elixir de sangue de dragão
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Você está sob o efeito de um elixir de queda suave, permitindo que você caia em abismos sem sofrer dano!\n\nTurnos restantes: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=queda de penas
items.potions.elixirs.elixiroffeatherfall.desc=Este elixir oferece um efeito de levitação mais fraco, porém mais controlado, permitindo que quem o bebe caia de grandes alturas sem se machucar por um curto período de tempo.
items.potions.elixirs.elixiroffeatherfall.light=Você se sente leve como uma pluma!
items.potions.elixirs.elixiroffeatherfall.name=elixir da queda suave
items.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina cura com a doçura do mel. Quando ingerido, ele terá o mesmo efeito de uma poção de cura e saciará uma pequena quantidade de fome, mas também pode ser arremessado para curar um aliado. Criaturas com afinidade por mel podem ser apaziguadas se este item for usado nelas.
items.potions.elixirs.elixirofhoneyedhealing.name=elixir de cura adocicado
items.potions.elixirs.elixiroficytouch.desc=Ao ser consumido, este elixir permitirá que o bebedor absorva o calor dos inimigos que atacar. Esse efeito tornará o bebedor imune ao frio e permitirá que ele congele os inimigos com ataques físicos.
items.potions.elixirs.elixiroficytouch.name=elixir de toque gélido
items.potions.elixirs.elixirofmight$htboost.desc=Seu corpo se sente anormalmente forte e saudável. Sua saúde máxima é aumentada por um período prolongado. À medida que você sobe de nível, o aumento diminuirá gradualmente. Valor atual do aumento: PH0. Níveis restantes: PH1.
items.potions.elixirs.elixirofmight$htboost.name=aumento máximo de saúde
items.potions.elixirs.elixirofmight.desc=Este poderoso líquido percorrerá seus músculos, aumentando permanentemente sua força em um ponto e aumentando temporariamente sua saúde máxima em %d pontos. O aumento de saúde é proporcional à sua saúde máxima, mas diminuirá gradualmente conforme você sobe de nível.
items.potions.elixirs.elixirofmight.msg=Uma força inédita percorre seu corpo, agora você possui a força %d!
items.potions.elixirs.elixirofmight.name=elixir do poder
items.potions.elixirs.elixiroftoxicessence.desc=Ao ser consumido, este elixir imbuirá o bebedor com energia tóxica. O bebedor espalhará continuamente gás tóxico enquanto se move e ficará imune a gás tóxico e veneno por um período ligeiramente maior do que a duração do efeito.
items.potions.elixirs.elixiroftoxicessence.name=elixir de essência tóxica
items.potions.exotic.exoticpotion.amber=poção de âmbar exótica
items.potions.exotic.exoticpotion.azure=poção azul exótica
items.potions.exotic.exoticpotion.bistre=poção de bistre exótica
items.potions.exotic.exoticpotion.charcoal=poção de carvão exótica
items.potions.exotic.exoticpotion.crimson=poção carmesim exótica
