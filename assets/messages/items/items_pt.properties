items.weapon.melee.flail.ability_desc=O Duelista pode girar um mangual para acumular poder por um curto período. A cada turno em que o mangual é girado, ele causará +%d de dano em seu próximo ataque normal, até um máximo de 3 vezes. Um mangual giratório também garante acerto. Apenas iniciar a rotação do mangual consome uma carga.
