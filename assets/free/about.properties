en.title=A realtime platform adaption of Skillful Pixel Dungeon by BilbolDev
en.body=Thank you for playing the free version of Pixel Dungeon Platformer. You can play the entire game without any limitations. Please consider purchasing through Steam to support the dev. Supporter bonuses in the Steam version include access to Steam achievements, Steam Cloud saves, a supporter badge, and the option for Rat King to accompany you on your adventure as a harmless entertaining companion.
be.title=Адаптацыя гульні Skillful Pixel Dungeon ад BilbolDev для платформы ў рэжыме рэальнага часу.
be.body=Дзякуй, што гуляеце ў бясплатную версію Pixel Dungeon Platformer. Вы можаце гуляць усю гульню без якіх-небудзь абмежаванняў. Калі ласка, падумайце аб куплі праз Steam, каб падтрымаць распрацоўшчыка. У знак падзякі вы атрымаеце: Доступ да дасягненняў Steam Захаванні ў Steam Cloud Значок заўзятара Rat King можа суправаджаць вас у вашых прыгодах. Ён не дае ніякіх пераваг, але можа быць даволі цікавым.
cs.title=Adaptace hry Skillful Pixel Dungeon od BilbolDev pro platformu v reálném čase
cs.body=Děkujeme, že hrajete bezplatnou verzi Pixel Dungeon Platformer. Můžete hrát celou hru bez jakýchkoli omezení. Zvažte prosím nákup přes Steam a podpořte tak vývojáře. Jako projev vděčnosti obdržíte: Přístup k achievementům Steam Ukládání pozic do služby Steam Cloud Odznak fanoušků Rat King vás může doprovodit na vašem dobrodružství. Nenabízí sice žádnou výhodu, ale může být docela zábavný.
de.title=Eine Echtzeit-Plattformadaption von Skillful Pixel Dungeon von BilbolDev
de.body=Vielen Dank, dass Sie die kostenlose Version von Pixel Dungeon Platformer gespielt haben. Sie können das gesamte Spiel ohne Einschränkungen spielen. Um den Entwickler zu unterstützen, würden wir uns freuen, wenn Sie die Vollversion über Steam erwerben. Als Dankeschön erhalten Sie: Zugriff auf die Steam-Erfolge Spielstände in der Steam Cloud Unterstützerabzeichen Rat King kann dich auf deinem Abenteuer begleiten. Er bietet zwar keine Vorteile, kann aber durchaus unterhaltsam sein.
el.title=Μια προσαρμογή πλατφόρμας σε πραγματικό χρόνο του Skillful Pixel Dungeon από τον BilbolDev
el.body=Σας ευχαριστούμε που παίξατε τη δωρεάν έκδοση του Pixel Dungeon Platformer. Μπορείτε να παίξετε ολόκληρο το παιχνίδι χωρίς περιορισμούς. Παρακαλούμε σκεφτείτε να αγοράσετε μέσω του Steam για να υποστηρίξετε την ανάπτυξη. Ως ένδειξη ευγνωμοσύνης, θα σας δοθούν: Πρόσβαση στα επιτεύγματα του Steam Αποθήκευση στο Steam Cloud Σήμα υποστηρικτών Ο Rat King μπορεί να σας συνοδεύσει στην περιπέτειά σας. Δεν προσφέρει κανένα πλεονέκτημα, αλλά μπορεί να είναι αρκετά διασκεδαστικός.
eo.title=Realtempa platforma adapto de Skillful Pixel Dungeon fare de BilbolDev
eo.body=Dankon pro ludado de la senpaga versio de Pixel Dungeon Platformer. Vi povas ludi la tutan ludon sen iuj limigoj. Bonvolu konsideri aĉeti ĝin per Steam por subteni la programiston. Kiel signo de dankemo, vi ricevos: Aliro al Steam atingoj Konservado en Steam Cloud Subtenanto-insigno Rat King povas akompani vin en via aventuro. Li ne ofertas ian ajn avantaĝon sed povas esti sufiĉe amuza.
es.title=Una adaptación en tiempo real de Skillful Pixel Dungeon por BilbolDev
es.body=Gracias por jugar la versión gratuita de Pixel Dungeon Platformer. Puedes jugar el juego completo sin limitaciones. Considera comprar la versión completa a través de Steam para apoyar al desarrollador. Como muestra de agradecimiento, recibirás: Acceso a los logros de Steam Partidas guardadas en Steam Cloud Insignia de aficionado Rat King puede acompañarte en tu aventura. No ofrece ninguna ventaja, pero puede ser bastante entretenido.
fr.title=Une adaptation en temps réel du jeu Skillful Pixel Dungeon de BilbolDev.
fr.body=Merci d'avoir joué à la version gratuite de Pixel Dungeon Platformer. Vous pouvez jouer à l'intégralité du jeu sans aucune limitation. Pensez à l'acheter via Steam pour soutenir le développeur. En guise de remerciement, vous recevrez : Accès aux succès de Steam Sauvegardes Steam Cloud Badge de supporter Rat King peut vous accompagner dans votre aventure. Il n'offre aucun avantage, mais peut s'avérer très divertissant.
hu.title=A Skillful Pixel Dungeon valós idejű platform adaptációja BilbolDev-tól
hu.body=Köszönjük, hogy a Pixel Dungeon Platformer ingyenes verzióját játszottad. A teljes játékot korlátozások nélkül játszhatod. Kérjük, fontold meg a Steam-n keresztüli vásárlást a fejlesztő támogatása érdekében. Hálánk jeléül a következőket kapod: Hozzáférés a Steam teljesítményekhez Mentések a Steam Cloudban Szurkolói jelvény Rat King elkísérhet a kalandjaidon. Nem kínál semmilyen előnyt, de meglehetősen szórakoztató tud lenni.
in.title=Adaptasi platform waktu nyata dari Skillful Pixel Dungeon karya BilbolDev
in.body=Terima kasih telah memainkan versi gratis Pixel Dungeon Platformer. Anda dapat memainkan seluruh permainan tanpa batasan apa pun. Mohon pertimbangkan untuk membeli melalui Steam untuk mendukung pengembang. Sebagai tanda terima kasih, Anda akan mendapatkan: Akses ke pencapaian Steam Penyimpanan game di Steam Cloud Lencana pendukung Rat King dapat menemani Anda dalam petualangan Anda. Dia tidak menawarkan keuntungan apa pun, tetapi bisa sangat menghibur.
it.title=Adattamento in tempo reale per piattaforma di Skillful Pixel Dungeon di BilbolDev
it.body=Grazie per aver giocato alla versione gratuita di Pixel Dungeon Platformer. Puoi giocare all'intero gioco senza alcuna limitazione. Ti invitiamo a considerare l'acquisto tramite Steam per supportare lo sviluppatore. Come segno di gratitudine, riceverai: Accesso agli obiettivi Steam Salvataggi su Steam Cloud Distintivo dei tifosi Rat King può accompagnarti nella tua avventura. Non offre alcun vantaggio, ma può essere piuttosto divertente.
ja.title=BilbolDevによるSkillful Pixel Dungeonのリアルタイムプラットフォーム版
ja.body=Pixel Dungeon Platformerの無料版をプレイしていただきありがとうございます。制限なくゲーム全体をプレイできます。開発者を支援するため、Steamからご購入をご検討ください。感謝の印として、以下の特典が贈られます。 Steamの実績へのアクセス Steamクラウドセーブ サポーターバッジ Rat Kingはあなたの冒険に同行できます。彼は何のメリットも提供しませんが、とても面白い存在です。
ko.title=BilbolDev의 Skillful Pixel Dungeon을 실시간 플랫폼으로 각색한 작품입니다.
ko.body=Pixel Dungeon Platformer 무료 버전을 플레이해주셔서 감사합니다. 모든 콘텐츠를 제한 없이 즐기실 수 있습니다. 개발자를 응원해주시려면 Steam를 통해 구매해주시면 감사하겠습니다. 감사의 표시로 다음과 같은 보상을 드립니다. Steam 업적에 접근 가능 Steam 클라우드 저장 서포터즈 배지 Rat King는 여러분의 모험에 동행할 수 있습니다. 특별한 이점을 제공하지는 않지만 꽤 재미있는 동반자가 될 수 있습니다.
nl.title=Een realtime platformadaptatie van Skillful Pixel Dungeon door BilbolDev
nl.body=Bedankt voor het spelen van de gratis versie van Pixel Dungeon Platformer. Je kunt het hele spel zonder beperkingen spelen. Overweeg om de volledige versie via Steam aan te schaffen om de ontwikkelaar te steunen. Als blijk van waardering ontvang je het volgende: Toegang tot Steam-prestaties Opgeslagen spellen in Steam Cloud Supportersbadge Rat King kan je vergezellen op je avontuur. Hij biedt geen enkel voordeel, maar kan wel erg vermakelijk zijn.
pl.title=Adaptacja gry Skillful Pixel Dungeon w czasie rzeczywistym autorstwa BilbolDev
pl.body=Dziękujemy za grę w darmową wersję Pixel Dungeon Platformer. Możesz grać w całą grę bez żadnych ograniczeń. Rozważ zakup za pośrednictwem Steam, aby wesprzeć twórców. W ramach wdzięczności otrzymasz: Dostęp do osiągnięć Steam Zapisy w Steam Cloud Odznaka kibica Rat King może towarzyszyć Ci w Twojej przygodzie. Nie oferuje żadnych korzyści, ale potrafi być całkiem zabawny.
pt.title=Uma adaptação para plataforma em tempo real de Skillful Pixel Dungeon por BilbolDev
pt.body=Obrigado por jogar a versão gratuita de Pixel Dungeon Platformer. Você pode jogar o jogo completo sem limitações. Considere comprar a versão completa através de Steam para apoiar o desenvolvedor. Como forma de agradecimento, você receberá: Acesso às conquistas Steam Salvamentos no Steam Cloud Distintivo de torcedor Rat King pode te acompanhar em sua aventura. Ele não oferece nenhuma vantagem, mas pode ser bem divertido.
pt-pt.title=Uma adaptação para plataforma em tempo real de Skillful Pixel Dungeon por BilbolDev
pt-pt.body=Obrigado por jogar a versão gratuita de Pixel Dungeon Platformer. Pode jogar o jogo completo sem limitações. Considere comprar a versão completa através de Steam para apoiar o programador. Como forma de agradecimento, receberá: Acesso às conquistas Steam Jogos guardados na Steam Cloud Distintivo de adepto Rat King pode acompanhá-lo na sua aventura. Não oferece qualquer vantagem, mas pode ser bastante divertido.
ru.title=Адаптация игры Skillful Pixel Dungeon от BilbolDev для платформы реального времени.
ru.body=Спасибо за то, что вы играете в бесплатную версию Pixel Dungeon Platformer. Вы можете играть в игру без каких-либо ограничений. Пожалуйста, рассмотрите возможность покупки через Steam, чтобы поддержать разработчика. В знак благодарности вы получите: Доступ к достижениям Steam Сохранения в Steam Cloud Значок болельщика Rat King может сопровождать вас в вашем приключении. Он не дает никаких преимуществ, но может быть довольно забавным.
sv.title=En realtidsplattformsanpassning av Skillful Pixel Dungeon av BilbolDev
sv.body=Tack för att du spelar gratisversionen av Pixel Dungeon Platformer. Du kan spela hela spelet utan några begränsningar. Överväg att köpa via Steam för att stödja utvecklaren. Som ett tecken på tacksamhet får du: Tillgång till Steam-prestationer Sparfiler i Steam Cloud Supportermärke Rat King kan följa med dig på ditt äventyr. Han erbjuder inga fördelar men kan vara ganska underhållande.
tr.title=BilbolDev tarafından geliştirilen Skillful Pixel Dungeon'ın gerçek zamanlı platform uyarlaması.
tr.body=Pixel Dungeon Platformer'nun ücretsiz sürümünü oynadığınız için teşekkür ederiz. Oyunu herhangi bir sınırlama olmadan tamamen oynayabilirsiniz. Geliştiriciyi desteklemek için lütfen Steam üzerinden satın almayı düşünün. Teşekkürümüzün bir göstergesi olarak size şunlar verilecektir: Steam başarımlarına erişim Steam Cloud kayıtları Taraftar rozeti Rat King maceranızda size eşlik edebilir. Herhangi bir avantaj sağlamaz ancak oldukça eğlenceli olabilir.
uk.title=Адаптація гри Skillful Pixel Dungeon від BilbolDev для платформи в реальному часі
uk.body=Дякуємо, що граєте в безкоштовну версію Pixel Dungeon Platformer. Ви можете грати всю гру без будь-яких обмежень. Будь ласка, подумайте про придбання через Steam, щоб підтримати розробника. На знак подяки ви отримаєте: Доступ до досягнень Steam Збереження в Steam Cloud Значок вболівальника Rat King може супроводжувати вас у вашій пригоді. Він не пропонує жодних переваг, але може бути досить цікавим.
vi.title=Một phiên bản chuyển thể thời gian thực của Skillful Pixel Dungeon do BilbolDev phát triển.
vi.body=Cảm ơn bạn đã chơi phiên bản miễn phí của Pixel Dungeon Platformer. Bạn có thể chơi toàn bộ trò chơi mà không bị giới hạn nào. Vui lòng cân nhắc mua thông qua Steam để ủng hộ nhà phát triển. Như một lời cảm ơn, bạn sẽ nhận được: Truy cập vào các thành tích Steam Lưu trò chơi trên Steam Cloud Huy hiệu người ủng hộ Rat King có thể đồng hành cùng bạn trong cuộc phiêu lưu. Anh chàng này không mang lại lợi thế nào nhưng lại khá thú vị.
zh.title=由 BilbolDev 开发的《Skillful Pixel Dungeon》的实时平台改编版
zh.body=感谢您体验免费版 Pixel Dungeon Platformer。您可以畅玩所有游戏内容，没有任何限制。为了支持开发者，请考虑通过 Steam 购买完整版。作为感谢，您将获得以下赠品： 获取 Steam 成就 Steam 云存档 支持者徽章 Rat King 可以陪伴你踏上冒险之旅。他虽然不能提供任何优势，但会给你带来不少乐趣。
zh-hant.title=由 BilbolDev 開發的《Skillful Pixel Dungeon》的即時平台改編版
zh-hant.body=感謝您體驗免費版 Pixel Dungeon Platformer。您可以暢玩所有遊戲內容，沒有任何限制。為了支持開發者，請考慮透過 Steam 購買完整版。作為感謝，您將獲得以下贈品： 取得 Steam 成就 Steam 雲端存檔 支持者徽章 Rat King 可以陪伴你踏上冒險之旅。他雖然不能提供任何優勢，但會帶給你不少樂趣。
