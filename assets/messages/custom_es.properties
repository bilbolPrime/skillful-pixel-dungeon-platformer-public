custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Los pícaros se basan en la agilidad, el sigilo y la precisión. Destacan por su movilidad, las emboscadas, el veneno y el combate evasivo, pero sacrifican parte de la resistencia bruta de un guerrero de primera línea.
