custom.theme.sewers.intro=Le Donjon se situe juste sous la Ville, ses niveaux supérieurs constituant en réalité le système d'égouts de celle-ci. Faisant nominalement partie de la Ville, ces niveaux ne sont pas si dangereux. Personne ne les qualifierait de lieu sûr, mais au moins vous n'y aurez pas à affronter de magie noire.
custom.theme.prison.intro=Il y a de nombreuses années, une prison souterraine fut construite ici pour les criminels les plus dangereux. À l'époque, l'idée paraissait ingénieuse, car il était en effet très difficile de s'évader de cet endroit. Mais bientôt, une sombre atmosphère commença à s'infiltrer depuis les profondeurs, rendant fous prisonniers et gardiens. Finalement, la prison fut abandonnée, bien que quelques condamnés y soient restés enfermés.
custom.theme.caves.intro=Les grottes, qui s'étendent sous la prison abandonnée, sont peu peuplées. Trop profondes pour être exploitées par la Cité, elles sont également trop pauvres en minéraux pour intéresser les nains. Jadis, un comptoir commercial se dressait ici, sur la route reliant ces deux royaumes, mais il a disparu depuis le déclin de la Métropole Naine. Seuls les gnolls omniprésents et les animaux souterrains y vivent désormais.
custom.theme.city.intro=La Métropole Naine fut jadis la plus grande des cités-États naines. À son apogée, l'armée mécanisée des nains repoussa victorieusement l'invasion du vieux dieu et de son armée démoniaque. Mais la légende raconte que les guerriers de retour ramenèrent avec eux les germes de la corruption, et que cette victoire marqua le début de la fin pour le royaume souterrain.
custom.theme.halls.intro=Autrefois, ces niveaux étaient les abords de Métropole. Après leur lourde victoire contre l'ancien dieu, les nains, trop affaiblis, ne purent se débarrasser des démons qui y rôdaient encore. Peu à peu, ces derniers ont renforcé leur emprise sur ce lieu, désormais appelé les Salles des Démons. Très peu d'aventuriers se sont aventurés aussi loin…
custom.theme.sewers.sign.1=Ne surestimez pas votre force, utilisez des armes et une armure que vous pouvez manier.
custom.theme.sewers.sign.2=Certains dangers dans les égouts sont faciles à manquer au premier abord. Si une pièce vous paraît suspecte, ralentissez et regardez attentivement.
custom.theme.sewers.sign.3=N'oubliez pas qu'augmenter votre force n'est pas le seul moyen d'accéder à un meilleur équipement. Vous pouvez également réduire la force requise grâce aux Parchemins d'amélioration.
custom.theme.sewers.sign.4=Vous pouvez dépenser votre or dans les boutiques du donjon. Il y a même un marchand au premier étage maintenant.
custom.theme.sewers.sign.5=Attention à la substance gluante !
custom.theme.prison.sign.1=Pixel-Mart - tout ce dont vous avez besoin pour une aventure réussie !
custom.theme.prison.sign.2=Identifiez vos potions et parchemins dès que possible. N'attendez pas le moment où vous en aurez réellement besoin.
custom.theme.prison.sign.3=Avoir faim ne fait pas mal, mais mourir de faim, si.
custom.theme.prison.sign.4=Une attaque surprise a plus de chances de toucher. Vous pouvez toujours surprendre vos ennemis en contrôlant l'espace autour d'une porte.
custom.theme.prison.sign.5=Ne laissez pas sortir le Tengu !
custom.theme.caves.sign.1=Pixel-Mart. Dépensez de l'argent. Vivez plus longtemps.
custom.theme.caves.sign.2=Lorsque vous êtes attaqué par plusieurs monstres simultanément, essayez de vous réfugier derrière une porte.
custom.theme.caves.sign.3=Si vous êtes en feu, ne vous laissez pas encercler. Les mouvements verticaux sont plus importants dans les grottes.
custom.theme.caves.sign.4=Il est inutile de posséder plus d'une Ankh à la fois, car vous les perdrez lors de votre résurrection.
custom.theme.caves.sign.5=DANGER ! Les machines lourdes peuvent causer des blessures, des amputations ou la mort !
custom.theme.city.sign.1=Pixel-Mart. Une vie plus sûre dans le donjon.
custom.theme.city.sign.2=Lorsque vous améliorez une arme enchantée, il existe une chance de détruire cet enchantement.
custom.theme.city.sign.3=Les armes et les armures se détériorent plus vite que les baguettes et les anneaux, mais il existe plus de moyens de les réparer.
custom.theme.city.sign.4=Le seul moyen d'obtenir un Parchemin d'Anéantissement est de le recevoir en cadeau des esprits du donjon.
custom.theme.city.sign.5=Aucune arme n'est autorisée en présence de Sa Majesté !
custom.theme.halls.sign.1=Alors que vous tentez de lire le panneau, il s'embrase de flammes verdâtres.
