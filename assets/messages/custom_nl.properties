custom.generated.oh_i_see_you_have_cef64cb7a7=Oh, ik zie dat het je gelukt is! Ik hoop dat het je niet al te veel moeite heeft gekost. Zoals beloofd, kun je een van mijn hoogwaardige toverstokken uitkiezen.
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=Oh, wat een aangename verrassing om zo'n aardig persoon te ontmoeten! Ik ben hier voor een zeldzaam ingrediënt: een Rotberry-zaadje. Als magiër kan ik mezelf prima verdedigen tegen de plaatselijke monsters, maar ik verdwaal steeds, wat erg gênant is. Zou u me misschien kunnen helpen? Ik betaal u graag met een van mijn beste toverstokken.
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=Oh, wat een aangename verrassing om zo'n aardig persoon te ontmoeten! Ik ben hier voor een zeldzaam ingrediënt: lijkenstof. Dat kan worden gewonnen uit skeletresten en daar is een ruime hoeveelheid van te vinden in de kerker. Als magiër kan ik me prima verdedigen tegen de plaatselijke monsters, maar ik verdwaal steeds, wat erg gênant is. Zou u me misschien kunnen helpen? Ik betaal u graag met een van mijn beste toverstokken.
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=Oh, wat een aangename verrassing om zo'n aardig persoon te ontmoeten! Ik ben hier voor een zeldzaam ingrediënt: een spookvis. Je kunt hem met je blote handen vangen, maar hij is erg moeilijk te zien in het water. Als magiër kan ik me prima verdedigen tegen de plaatselijke monsters, maar ik verdwaal steeds, wat erg gênant is. Zou u me misschien kunnen helpen? Ik betaal u graag met een van mijn beste toverstokken.
