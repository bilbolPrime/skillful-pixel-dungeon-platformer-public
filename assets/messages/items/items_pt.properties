items.artifacts.driedrose$wndghosthero.desc=O fantasma é fraco por si só, mas sua forma é sólida o suficiente para ser equipado com armas e armaduras. Ele poderá usar esses itens assim como você. O fantasma pode equipar itens que exigem até _%d de força._
