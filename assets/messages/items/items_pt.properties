items.food.frozencarpaccio.desc=É um pedaço de carne crua congelada. A única maneira de comê-la é cortando-a em fatias finas. E, surpreendentemente, fica muito boa assim.
items.food.frozencarpaccio.discover_hint=Você pode criar isso usando outro alimento.
