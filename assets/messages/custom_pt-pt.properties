custom.theme.sewers.intro=A Masmorra fica bem abaixo da Cidade, e os seus níveis superiores constituem, na realidade, o sistema de esgotos da Cidade. Por ser nominalmente parte da Cidade, estes níveis não são assim tão perigosos. Ninguém diria que é um lugar seguro, mas pelo menos não terá de lidar com magia maléfica aqui.
custom.theme.prison.intro=Há muitos anos, foi aqui construída uma prisão subterrânea para os criminosos mais perigosos. Na altura, pareceu-me uma ideia muito inteligente, pois de facto era muito difícil escapar deste local. Mas depressa uma névoa escura começou a emanar do subsolo, enlouquecendo prisioneiros e guardas. No final, a prisão foi abandonada, embora alguns condenados tenham permanecido trancados lá dentro.
custom.theme.caves.intro=As grutas, que se estendem sob a prisão abandonada, são pouco povoadas. Tornam-se demasiado profundas para serem exploradas pela Cidade e são demasiado pobres em minerais para interessar os anões. No passado, existia um entreposto comercial algures aqui na rota entre estes dois reinos, mas desapareceu com o declínio da Metrópole Anã. Apenas gnolls omnipresentes e animais subterrâneos habitam este lugar agora.
custom.theme.city.intro=A Metrópole Anã foi em tempos a maior das cidades-estado anãs. No seu auge, o exército mecanizado de anões repeliu com sucesso a invasão do deus antigo e do seu exército de demónios. Mas dizem que os guerreiros que regressaram trouxeram consigo sementes de corrupção, e que a vitória foi o princípio do fim para o reino subterrâneo.
custom.theme.halls.intro=No passado, estes níveis eram os arredores da Metrópolis. Após a custosa vitória na guerra contra o deus antigo, os anões ficaram demasiado enfraquecidos para os expulsar dos restantes demónios. Gradualmente, os demónios fortaleceram o seu domínio sobre este lugar, que é agora chamado de Salões Demoníacos. Pouquíssimos aventureiros se aventuraram tão longe...
custom.theme.sewers.sign.1=Não sobrevalorize a sua força, use armas e armaduras que consiga manejar.
custom.theme.sewers.sign.2=Alguns perigos nos esgotos são fáceis de passar despercebidos à primeira vista. Se uma sala parecer suspeita, abrande o ritmo e observe com atenção.
custom.theme.sewers.sign.3=Lembre-se que aumentar a sua força não é a única forma de aceder a equipamentos melhores. Também pode diminuir o requisito de força com Pergaminhos de Melhoria.
custom.theme.sewers.sign.4=Pode gastar o seu ouro nas lojas espalhadas pela masmorra. Há até um mercador no primeiro andar agora.
custom.theme.sewers.sign.5=Cuidado com a gosma!
custom.theme.prison.sign.1=Pixel-Mart - tudo o que precisa para uma aventura de sucesso!
custom.theme.prison.sign.2=Identifique as suas poções e pergaminhos o mais rapidamente possível. Não deixe para a última hora, quando realmente precisar deles.
custom.theme.prison.sign.3=Ter fome não dói, mas morrer de fome dói.
custom.theme.prison.sign.4=Um ataque surpresa tem maior probabilidade de acertar. Pode ainda apanhar os inimigos desprevenidos ao controlar o espaço em redor de uma porta.
custom.theme.prison.sign.5=Não deixem escapar o Tengu!
custom.theme.caves.sign.1=Pixel-Mart. Gaste dinheiro. Viva mais.
custom.theme.caves.sign.2=Quando for atacado por vários monstros ao mesmo tempo, tente refugiar-se atrás de uma porta.
custom.theme.caves.sign.3=Se estiver com queimaduras solares, não se deixe encurralar. O movimento vertical é mais importante nas grutas.
custom.theme.caves.sign.4=Não faz sentido possuir mais do que um Ankh ao mesmo tempo, pois irá perdê-los ao ressuscitar.
custom.theme.caves.sign.5=PERIGO! As máquinas pesadas podem causar ferimentos, perda de membros ou morte!
custom.theme.city.sign.1=Pixel-Mart. Uma vida mais segura na masmorra.
custom.theme.city.sign.2=Ao melhorar uma arma encantada, existe a hipótese de destruir o encantamento.
custom.theme.city.sign.3=As armas e as armaduras deterioram-se mais rapidamente do que as varinhas e os anéis, mas existem mais formas de as reparar.
custom.theme.city.sign.4=A única forma de obter um Pergaminho de Extermínio é recebê-lo como um presente dos espíritos da masmorra.
custom.theme.city.sign.5=É proibido andar armado na presença de Sua Majestade!
custom.theme.halls.sign.1=Ao tentar ler a placa, esta explode em chamas esverdeadas.
custom.title.about_text=Uma adaptação em tempo real para plataforma do Skillful Pixel Dungeon, da BilbolDev.
