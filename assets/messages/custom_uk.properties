custom.generated.hey_human_wanna_be_useful_14bcc0da93=Гей, людино! Хочеш бути корисним, га? Візьми цю кирку та вбий нею кажана, мені потрібна його кров на голові. Що ти маєш на увазі, як я заплачу? Ти жадібний... Гаразд, гаразд, у мене немає грошей, щоб заплатити, але я можу трохи покувати для тебе. Вважай, що тобі пощастило, я єдиний коваль навколо.
