custom.generated.warriors_are_physically_tough_and_02774ddc7a=Воины физически выносливы и способны выдерживать большой урон. Однако они испытывают трудности с использованием дальнобойного оружия и магии. Освоить такие навыки всё ещё возможно, но требует больших усилий.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Разбойники полагаются на ловкость, скрытность и точность. Они превосходно мобильны, умеют устраивать засады, используют яды и уклоняются от ударов, но при этом им не хватает той выносливости, которая присуща воинам на передовой.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Волшебники в совершенстве владеют искусством магии. Однако им не хватает физической силы и ловкости. Овладеть этими навыками всё ещё возможно, но это требует больших усилий.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Охотницы превосходно владеют дистанционным боем и отличаются высокой мобильностью. Они контролируют ход боя с помощью луков, вспомогательных выстрелов и надежных средств выживания, но менее комфортно чувствуют себя в затяжных ближних схватках.
