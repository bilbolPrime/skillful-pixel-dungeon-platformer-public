custom.theme.sewers.intro=Подземелье находится прямо под городом, его верхние уровни фактически представляют собой городскую канализационную систему. Будучи номинально частью города, эти уровни не так уж опасны. Никто не назовёт это место безопасным, но, по крайней мере, здесь вам не придётся иметь дело со злой магией.
custom.theme.prison.intro=Много лет назад здесь была построена подземная тюрьма для самых опасных преступников. В то время это казалось очень удачной идеей, ведь из этого места действительно было очень трудно сбежать. Но вскоре из-под земли начала проникать мрачная атмосфера, сводя с ума заключенных и охранников. В конце концов тюрьма была заброшена, хотя некоторые заключенные остались здесь запертыми.
custom.theme.caves.intro=Пещеры, простирающиеся под заброшенной тюрьмой, малонаселены. Они расположены слишком глубоко, чтобы их мог использовать Город, и слишком бедны полезными ископаемыми, чтобы заинтересовать гномов. В прошлом где-то здесь, на пути между этими двумя государствами, находился торговый форпост, но он исчез после упадка Гномьего Метрополиса. Теперь здесь обитают лишь вездесущие гноллы и подземные животные.
custom.theme.city.intro=Гномья Метрополис когда-то была величайшим из гномьих городов-государств. В период своего расцвета механизированная армия гномов успешно отразила вторжение древнего бога и его армии демонов. Но говорят, что вернувшиеся воины принесли с собой семена разложения, и эта победа стала началом конца для подземного королевства.
custom.theme.halls.intro=Раньше эти уровни были окраинами Метрополиса. После дорогостоящей победы в войне со старым богом гномы были слишком ослаблены, чтобы очистить их от оставшихся демонов. Постепенно демоны усилили свою власть над этим местом, и теперь оно называется Залами Демонов. Очень немногие искатели приключений когда-либо спускались так далеко...
custom.theme.sewers.sign.1=Не переоценивайте свои силы, используйте оружие и доспехи, с которыми вы сможете справиться.
custom.theme.sewers.sign.2=Некоторые опасности в канализации легко пропустить с первого взгляда. Если вам что-то не нравится в помещении, замедлите шаг и внимательно осмотритесь.
custom.theme.sewers.sign.3=Помните, что повышение силы — не единственный способ получить доступ к лучшему снаряжению. Вы также можете снизить требования к силе с помощью Свиток улучшения.
custom.theme.sewers.sign.4=Вы можете потратить свое золото в магазинах, расположенных по всему подземелью. Теперь даже на первом этаже есть торговец.
custom.theme.sewers.sign.5=Осторожно, слизь!
custom.theme.prison.sign.1=Pixel-Mart — всё, что нужно для успешных приключений!
custom.theme.prison.sign.2=Как можно скорее определите свои зелья и свитки. Не откладывайте это на потом, когда они действительно понадобятся.
custom.theme.prison.sign.3=Чувство голода само по себе не причиняет боли, а вот голодание – причиняет боль.
custom.theme.prison.sign.4=Внезапная атака имеет больше шансов на попадание. Вы все еще можете застать врагов врасплох, контролируя пространство вокруг дверного проема.
custom.theme.prison.sign.5=Не выпускайте Тэнгу!
custom.theme.caves.sign.1=Pixel-Mart. Тратьте деньги. Живите дольше.
custom.theme.caves.sign.2=Если на вас одновременно напали несколько монстров, постарайтесь отступить за дверь.
custom.theme.caves.sign.3=Если вы горите, не позволяйте себе оказаться в замкнутом пространстве. В пещерах вертикальное движение имеет большее значение.
custom.theme.caves.sign.4=Нет смысла иметь более одного анкха одновременно, потому что вы потеряете их при воскрешении.
custom.theme.caves.sign.5=ОПАСНО! Тяжелая техника может стать причиной травм, ампутации конечностей или смерти!
custom.theme.city.sign.1=Pixel-Mart. Более безопасная жизнь в подземелье.
custom.theme.city.sign.2=При улучшении зачарованного оружия существует вероятность разрушить это зачарование.
custom.theme.city.sign.3=Оружие и доспехи изнашиваются быстрее, чем волшебные палочки и кольца, но способов их ремонта больше.
custom.theme.city.sign.4=Единственный способ получить Свиток Уничтожения — это получить его в дар от духов подземелья.
custom.theme.city.sign.5=В присутствии Его Величества запрещено носить оружие!
custom.theme.halls.sign.1=Когда вы пытаетесь прочитать надпись, она вспыхивает зеленоватым пламенем.
