items.food.pasty$fishleftover.desc=Um pouco de peixe que sobrou da sua refeição anterior. Você pode comê-lo quando quiser para matar um pouco a fome.
items.food.pasty$fishleftover.eat_msg=Aquela comida estava razoável.
items.food.pasty$fishleftover.name=restos de peixe
items.food.pasty.amulet_desc=Você finalmente encontrou, o amuleto mágico de... espere um minuto, isso é apenas um chocolate embrulhado em papel alumínio feito para se parecer com o amuleto! Não lhe dará poder ilimitado, mas pelo menos o saciará e lhe dará uma pequena carga de artefato. \n\nPrimeiro de Abril!
items.food.pasty.amulet_name=amuleto de Yendor?
items.food.pasty.cane_desc=Uma enorme bengala doce e açucarada. É grande o suficiente para te satisfazer, e o açúcar pode até dar uma pequena carga extra às suas varinhas. Boas Festas!
items.food.pasty.cane_name=bengala doce
items.food.pasty.desc=Um autêntico pastel da Cornualha com recheio tradicional de carne e batata. Delicioso!
items.food.pasty.egg_desc=Um ovo de chocolate enorme, embrulhado em papel alumínio amarelo colorido. Tem chocolate suficiente para te deixar satisfeito, e o açúcar pode dar um toque extra aos seus objetos de decoração. Feliz Páscoa!
items.food.pasty.egg_name=ovos de pascoa
items.food.pasty.fish_desc=Um peixe inteiro cozido no vapor, magicamente preservado sobre uma cama de verduras. É tradição guardar um pouco de peixe para mais tarde nesta época do ano, então você aproveita as sobras em vez de comer tudo de uma vez. Feliz Ano Novo Lunar!
items.food.pasty.fish_name=peixe cozido no vapor
items.food.pasty.name=pastoso
items.food.pasty.pie_desc=Uma fatia enorme de torta de abóbora. Seu sabor doce e picante vai te satisfazer e te dar um pouquinho de conforto. Feliz Halloween!
items.food.pasty.pie_name=torta de abóbora
items.food.pasty.rainbow_desc=Esta poção colorida é um tipo de alimento líquido. Além de saciar sua fome, ela contém um pouco de magia que acalma inimigos comuns próximos, fazendo com que hesitem temporariamente em lutar contra você. Feliz Orgulho!
items.food.pasty.rainbow_name=poção do arco-íris
items.food.pasty.shattered_name=bolo verde
items.food.pasty.sparkling_desc=Esta poção espumante é um tipo de alimento líquido. Ela sacia a fome e simula o sabor do vinho espumante, mas não contém álcool. A sensação de calor na barriga proporciona um pouco de proteção. Feliz Ano Novo!
items.food.pasty.sparkling_name=poção cintilante
items.food.pasty.vanilla_desc=Esta grande fatia de bolo de baunilha tem confeitos coloridos e cobertura azul. O bolo foi feito para celebrar anos de experiência e, ao ser devorado, você terá acesso a um pouco dessa experiência. O Pixel Dungeon original foi lançado em 4 de dezembro de 2012. Feliz aniversário, Pixel Dungeon!
items.food.pasty.vanilla_name=bolo azul
items.food.phantommeat.desc=Um grande bife translúcido e brilhante, cortado de uma piranha fantasma. Esta carne mágica não precisa ser cozida e concede diversos benefícios defensivos, além de saciar completamente a fome. Ao ser consumida, concede invisibilidade, pele de casca de árvore, cura parcial e elimina muitos efeitos nocivos.
items.food.phantommeat.discover_hint=Você pode obter este item como recompensa ao derrotar certos inimigos.
items.food.phantommeat.name=carne fantasma
items.food.smallration.desc=Parece exatamente uma ração alimentar padrão, só que menor.
items.food.smallration.discover_hint=Você pode comprar este item em uma loja.
items.food.smallration.eat_msg=Aquela comida estava razoável.
items.food.smallration.name=pequena ração alimentar
items.food.stewedmeat.desc=O cozimento lento da carne a livrou de quaisquer doenças ou parasitas. Ela deve ser segura para consumo.
items.food.stewedmeat.discover_hint=Você pode criar este item através da alquimia.
items.food.stewedmeat.eat_msg=Aquela comida estava razoável.
items.food.stewedmeat.name=carne cozida
items.food.supplyration.desc=Esta ração foi deixada na masmorra por e para membros da guilda dos ladrões. Ela foi especialmente criada para ser consumida em movimento e auxiliar em artimanhas em geral. Embora não sacie tanto quanto uma ração normal, pode ser consumida rapidamente, proporciona uma pequena cura direta e restaura uma carga da capa das sombras do Ladino.
items.food.supplyration.discover_hint=Você pode encontrar este item usando um talento específico do herói.
items.food.supplyration.name=ração de fornecimento
items.gold.desc=Uma pilha de moedas de ouro. Colete moedas de ouro para gastá-las mais tarde em uma loja.
items.gold.name=ouro
items.heap.artifact=um artefato
items.heap.chest=Peito
items.heap.chest_desc=Você só saberá o que tem dentro depois de abrir!
items.heap.crystal_chest=Baú de cristal
items.heap.crystal_chest_desc=Você pode ver _%s_ lá dentro, mas para abrir o baú você precisa de uma chave de cristal.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Baú trancado
items.heap.locked_chest_desc=Você só saberá o que tem dentro depois de abrir! Mas para abrir, você precisa de uma chave dourada.
items.heap.remains=Restos mortais do herói
items.heap.remains_desc=Isto é tudo o que restou de um dos seus antecessores. Talvez valha a pena verificar se há algum objeto de valor.
items.heap.ring=um anel
items.heap.skeleton=Restos esqueléticos
items.heap.skeleton_desc=Isto é tudo o que restou de algum aventureiro azarado. Talvez valha a pena verificar se há algum objeto de valor.
items.heap.tomb=Túmulo
items.heap.tomb_desc=Essa tumba antiga pode conter algo útil, mas seu dono certamente se oporá a ser verificada.
items.heap.wand=uma varinha
items.honeypot$shatteredpot.desc=O pote foi estilhaçado, apenas o mel pegajoso que reveste suas paredes o mantém unido, e ele está se desfazendo lentamente. Apesar de estar quebrado, a abelha ainda parece querer proteger o pote.
items.honeypot$shatteredpot.name=pote de mel quebrado
items.honeypot.ac_shatter=ESTILHAÇO
items.honeypot.desc=Este grande pote de mel está apenas forrado com mel; na verdade, ele abriga uma abelha gigante! Abelhas enormes como essas geralmente ficam em suas colmeias; talvez o pote seja algum tipo de gaiola especializada para abelhas? A abelha parece bem satisfeita dentro do pote com seu mel e zumbindo cautelosamente quando você a observa.
items.honeypot.name=pote de mel
items.item.ac_drop=DERRUBAR
items.item.ac_throw=LANÇAR
items.item.curse=xingamento
items.item.custom_note=Este item possui uma nota personalizada: "_%s_"
items.item.custom_note_type=Este tipo de item possui uma nota personalizada: "_%s_"
items.item.discover_hint=Você pode encontrar este item aleatoriamente na masmorra.
