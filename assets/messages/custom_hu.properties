custom.theme.sewers.intro=A Kazamata közvetlenül a Város alatt fekszik, felső szintjei valójában a Város csatornarendszerét alkotják. Mivel névleg a Város részét képezik, ezek a szintek nem annyira veszélyesek. Senki sem nevezné biztonságos helynek, de legalább nem kell gonosz mágiával foglalkoznod itt.
custom.theme.prison.intro=Sok évvel ezelőtt egy földalatti börtönt építettek itt a legveszélyesebb bűnözők számára. Akkoriban nagyon okos ötletnek tűnt, mivel erről a helyről valóban nagyon nehéz volt kiszabadulni. De hamarosan sötét miazma kezdett betölteni a helyet alulról, megőrjítve a foglyokat és az őröket. Végül a börtönt elhagyták, bár néhány elítéltet itt hagytak bezárva.
custom.theme.caves.intro=Az elhagyatott börtön alatt elnyúló barlangok ritkán lakottak. Túl mélyen fekszenek ahhoz, hogy a Város kiaknázza őket, és túl szegények ásványkincsekben ahhoz, hogy a törpöket érdekeljék. A múltban valahol itt, a két állam közötti útvonalon volt egy kereskedelmi állomás, de a Törp Metropolisz hanyatlása óta elpusztult. Ma már csak mindenütt jelenlévő gnollok és földalatti állatok élnek itt.
custom.theme.city.intro=A törp metropolisz egykor a legnagyobb törpe városállam volt. Fénykorában a törpök gépesített serege sikeresen visszaverte az öreg isten és démonserege invázióját. De azt mondják, hogy a visszatérő harcosok a romlás magvait hozták magukkal, és ez a győzelem a földalatti királyság végének kezdetét jelentette.
custom.theme.halls.intro=A múltban ezek a szintek Metropolisz külvárosai voltak. Az öreg istenekkel vívott költséges háborúban aratott győzelem után a törpök túl legyengültek ahhoz, hogy megtisztítsák őket a megmaradt démonoktól. A démonok fokozatosan egyre szorosabbra fogták ezt a helyet, és most Démoncsarnokoknak hívják. \n\nNagyon kevés kalandor ereszkedett le idáig...
custom.theme.sewers.sign.1=Ne becsüld túl az erődet, használj olyan fegyvereket és páncélokat, amiket el tudsz viselni.
custom.theme.sewers.sign.2=A csatornákban található veszélyek némelyike első pillantásra könnyen észrevétlen. Ha egy helyiségben nincs rendben a környezet, lassíts le, és nézz körül alaposan.
custom.theme.sewers.sign.3=Ne feledd, hogy az erőd növelése nem az egyetlen módja a jobb felszereléshez való hozzáférésnek. A Fejlesztési Tekercsekkel is csökkentheted az erőkövetelményt.
custom.theme.sewers.sign.4=Az aranyadat elköltheted a kazamata üzleteiben. Most már egy kereskedő is van az első emeleten.
custom.theme.sewers.sign.5=Óvakodj a Goo-tól!
custom.theme.prison.sign.1=Pixel-Mart - minden, amire szükséged van a sikeres kalandhoz!
custom.theme.prison.sign.2=Azonosítsd a varázsitalaidat és tekercseidet a lehető leghamarabb. Ne halogasd addig a pillanatig, amikor tényleg szükséged lesz rájuk.
custom.theme.prison.sign.3=Az éhség nem fáj, de az éhezés igen.
custom.theme.prison.sign.4=A meglepetésszerű támadásnak nagyobb esélye van a találatra. Továbbra is váratlanul érheted az ellenséget, ha uralod az ajtó körüli teret.
custom.theme.prison.sign.5=Ne engedd ki a Tengut!
custom.theme.caves.sign.1=Pixel-Mart. Költs pénzt. Élj tovább.
custom.theme.caves.sign.2=Amikor egyszerre több szörnyeteg támad meg, próbálj meg egy ajtó mögé menekülni.
custom.theme.caves.sign.3=Ha égsz, ne hagyd, hogy bezárkózzon. A barlangokban a függőleges mozgás fontosabb.
custom.theme.caves.sign.4=Nincs értelme egyszerre egynél több Ankh-ot birtokolni, mert feltámadáskor elveszíted őket.
custom.theme.caves.sign.5=VESZÉLY! A nehézgépek sérülést, végtagvesztést vagy halált okozhatnak!
custom.theme.city.sign.1=Pixel-Mart. Biztonságosabb élet a kazamatában.
custom.theme.city.sign.2=Amikor fejlesztesz egy elvarázsolt fegyvert, van esély a varázslat elpusztítására.
custom.theme.city.sign.3=A fegyverek és páncélok gyorsabban kopnak el, mint a pálcák és a gyűrűk, de több módja is van a javításuknak.
custom.theme.city.sign.4=A Törölés Tekercsét csak úgy lehet megszerezni, ha ajándékba kapjuk a kazamata szellemeitől.
custom.theme.city.sign.5=Őfelsége jelenlétében tilos fegyvert viselni!
custom.theme.halls.sign.1=Ahogy megpróbálod elolvasni a táblát, zöldes lángokba borul.
