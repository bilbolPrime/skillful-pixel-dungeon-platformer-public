tasks.register('generateSteamIcon') {
    inputs.file(steamIconPng)
    outputs.file(steamIconIco)

    doLast {
        def image = javax.imageio.ImageIO.read(steamIconPng)
        if (image == null) {
            throw new GradleException("Unable to read launcher icon: ${steamIconPng}")
        }

        int iconWidth = image.width
        int iconHeight = image.height
        byte[] pngBytes

        if (image.width > 256 || image.height > 256) {
            def scaledImage = new java.awt.image.BufferedImage(256, 256, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = scaledImage.createGraphics()
            try {
                graphics.setComposite(java.awt.AlphaComposite.Src)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(image, 0, 0, 256, 256, null)
            } finally {
                graphics.dispose()
            }

            def output = new java.io.ByteArrayOutputStream()
            javax.imageio.ImageIO.write(scaledImage, 'png', output)
            pngBytes = output.toByteArray()
            iconWidth = 256
            iconHeight = 256
        } else {
            pngBytes = steamIconPng.bytes
        }

        File outputFile = steamIconIco.get().asFile
        outputFile.parentFile.mkdirs()

        outputFile.withOutputStream { stream ->
            writeWordLE(stream, 0)
            writeWordLE(stream, 1)
            writeWordLE(stream, 1)

            stream.write(iconWidth >= 256 ? 0 : iconWidth)
            stream.write(iconHeight >= 256 ? 0 : iconHeight)
            stream.write(0)
            stream.write(0)
            writeWordLE(stream, 1)
            writeWordLE(stream, 32)
            writeDwordLE(stream, pngBytes.length)
            writeDwordLE(stream, 22)
            stream.write(pngBytes)
        }
    }
}

tasks.register('generateSteamMacIcon') {
    inputs.file(steamIconPng)
    outputs.file(steamIconIcns)

    onlyIf {
        hostOperatingSystem.isMacOsX()
    }

    doLast {
        File iconSetDir = new File(steamIconIcns.get().asFile.parentFile, 'skillful-pixel-dungeon-platformer.iconset')
        delete(iconSetDir)
        iconSetDir.mkdirs()

        List<List<Object>> iconSizes = [
                [16, 'icon_16x16.png'],
                [32, 'icon_16x16@2x.png'],
                [32, 'icon_32x32.png'],
                [64, 'icon_32x32@2x.png'],
                [128, 'icon_128x128.png'],
                [256, 'icon_128x128@2x.png'],
                [256, 'icon_256x256.png'],
                [512, 'icon_256x256@2x.png'],
                [512, 'icon_512x512.png'],
                [1024, 'icon_512x512@2x.png']
        ]

        iconSizes.each { List<Object> iconSpec ->
            int size = iconSpec[0] as int
            String name = iconSpec[1] as String
            exec {
                commandLine('sips', '-z', String.valueOf(size), String.valueOf(size), steamIconPng.absolutePath, '--out', new File(iconSetDir, name).absolutePath)
            }
        }

        exec {
            commandLine('iconutil', '-c', 'icns', iconSetDir.absolutePath, '-o', steamIconIcns.get().asFile.absolutePath)
        }
    }
}

def configureSteamPackagingTask = { TaskProvider<Exec> taskProvider, Provider<Directory> inputDir, Provider<Directory> outputDir,
        List<String> extraArguments ->
    taskProvider.configure {
        if (hostOperatingSystem.isWindows()) {
            dependsOn(tasks.named('generateSteamIcon'))
            inputs.file(steamIconIco)
        } else if (hostOperatingSystem.isMacOsX()) {
            dependsOn(tasks.named('generateSteamMacIcon'))
            inputs.file(steamIconIcns)
        } else {
            inputs.file(steamIconPng)
        }

        inputs.dir(inputDir)
        outputs.dir(outputDir)

        doFirst {
            ensureSupportedSteamPackagingHost()

            File jpackageExecutable = steamJpackageExecutable()
            if (jpackageExecutable == null) {
                throw new GradleException('Could not find jpackage. Set JPACKAGE or JAVA_HOME to a JDK with jpackage installed.')
            }

            File outputDirFile = outputDir.get().asFile
            delete(outputDirFile)
            outputDirFile.mkdirs()

            List<String> arguments = [
                    jpackageExecutable.absolutePath,
                    '--type', 'app-image',
                    '--input', inputDir.get().asFile.absolutePath,
                    '--dest', outputDirFile.absolutePath,
                    '--name', rootProject.ext.appName,
                    '--app-version', steamAppVersion,
                    '--main-jar', "${steamJarBaseName}.jar",
                    '--main-class', application.mainClass.get(),
                    '--icon', resolveSteamIconFile().absolutePath
            ]

            if (hostOperatingSystem.isMacOsX()) {
                arguments.addAll([
                        '--mac-package-identifier', steamMacBundleIdentifier,
                        '--mac-package-name', steamMacMenuName
                ])
            }

            arguments.addAll(extraArguments)

            commandLine(arguments)
        }
    }
}

