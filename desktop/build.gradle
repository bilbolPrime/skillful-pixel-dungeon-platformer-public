import org.gradle.internal.os.OperatingSystem

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

configurations {
    proguard
}

dependencies {
    proguard "com.guardsquare:proguard-base:7.6.1"
}

def desktopJarBaseName = 'skillful-pixel-dungeon-platformer'
def desktopIconPng = rootProject.file('assets/icon.png')
def desktopIconIco = layout.buildDirectory.file('desktop/icon/skillful-pixel-dungeon-platformer.ico')
def desktopIconIcns = layout.buildDirectory.file('desktop/icon/skillful-pixel-dungeon-platformer.icns')
def desktopAppJarDir = layout.buildDirectory.dir('desktop/app-jar')
def desktopRuntimeLibsDir = layout.buildDirectory.dir('desktop/runtime-libs')
def desktopInputDir = layout.buildDirectory.dir('desktop/input')
def hostOperatingSystem = OperatingSystem.current()
def desktopMacBundleIdentifier = 'com.bilboldev.skillfulpixeldungeonplatformer'
def desktopMacMenuName = 'PD Platformer'
def desktopAppVersion = String.valueOf(rootProject.version)
def desktopObfuscatedJar = layout.buildDirectory.file("desktop/obfuscation/${desktopJarBaseName}.jar")
def desktopObfuscationConfig = layout.buildDirectory.file('desktop/obfuscation/proguard-config.pro')
def desktopObfuscationMapping = layout.buildDirectory.file('desktop/obfuscation/mapping.txt')
def desktopJarTask = tasks.named('jar', Jar)
def coreJarTask = project(':core').tasks.named('jar', Jar)

def normalizedHostArchitecture = {
    String architecture = (System.getProperty('os.arch') ?: '').toLowerCase()
    if (architecture in ['x86_64', 'amd64']) {
        return 'x64'
    }
    if (architecture in ['aarch64', 'arm64']) {
        return 'arm64'
    }
    return architecture
}
def desktopHostPlatformId = {
    if (hostOperatingSystem.isWindows()) {
        return 'windows-' + normalizedHostArchitecture()
    }
    if (hostOperatingSystem.isLinux()) {
        return 'linux-' + normalizedHostArchitecture()
    }
    if (hostOperatingSystem.isMacOsX()) {
        return 'macos-' + normalizedHostArchitecture()
    }
    return 'unsupported-' + normalizedHostArchitecture()
}

def desktopPackageDir = layout.buildDirectory.dir("desktop/package/${desktopHostPlatformId()}")

def executableName = { String baseName ->
    System.getProperty('os.name').toLowerCase().contains('windows') ? "${baseName}.exe" : baseName
}

def toPortablePath = { File file ->
    file.absolutePath.replace('\\', '/')
}

def quoteForProguard = { File file ->
    "\"${toPortablePath(file)}\""
}

def libraryEntryForProguard = { File file ->
    String path = quoteForProguard(file)
    file.name.toLowerCase().endsWith('.jmod') ? path + '(!**.jar;!module-info.class)' : path
}

def writeWordLE = { OutputStream stream, int value ->
    stream.write(value & 0xFF)
    stream.write((value >> 8) & 0xFF)
}

def writeDwordLE = { OutputStream stream, int value ->
    stream.write(value & 0xFF)
    stream.write((value >> 8) & 0xFF)
    stream.write((value >> 16) & 0xFF)
    stream.write((value >> 24) & 0xFF)
}

def desktopRuntimeLibraries = {
    String desktopJarName = desktopJarTask.get().archiveFileName.get()
    configurations.runtimeClasspath.resolve().findAll { File file ->
        return file.name.endsWith('.jar') && file.name != desktopJarName && !file.name.startsWith('core-')
    }.sort { File left, File right -> left.name <=> right.name }
}

def desktopJavaHomes = {
    LinkedHashSet<File> homes = new LinkedHashSet<>()
    [System.getenv('SKILLFUL_DESKTOP_DEBUG_JAVA_HOME'), System.getenv('JAVA_HOME'), System.getProperty('java.home')]
            .findAll { String value -> value != null && !value.trim().isEmpty() }
            .each { String javaHome ->
                File homeDir = new File(javaHome)
                homes.add(homeDir)
                if (homeDir.parentFile != null) {
                    homes.add(homeDir.parentFile)
                }
            }

    homes
}

def isAndroidStudioJbr = { File homeDir ->
    if (homeDir == null) {
        return false
    }

    String normalized = toPortablePath(homeDir).toLowerCase()
    return normalized.contains('/android studio/jbr')
}

def desktopJavaHome = {
    desktopJavaHomes().find { File homeDir ->
        return new File(homeDir, 'bin/' + executableName('java')).isFile() && (new File(homeDir, 'jmods').isDirectory() || new File(homeDir, 'lib/rt.jar').isFile())
    }
}

def desktopRuntimeJavaHome = {
    File preferredHome = desktopJavaHomes().find { File homeDir ->
        return !isAndroidStudioJbr(homeDir)
                && new File(homeDir, 'bin/' + executableName('java')).isFile()
                && (new File(homeDir, 'jmods').isDirectory() || new File(homeDir, 'lib/rt.jar').isFile())
    }

    return preferredHome != null ? preferredHome : desktopJavaHome()
}

def desktopJavaRuntimeLibraries = {
    File preferredJavaHome = desktopJavaHome()
    List<File> homesToScan = preferredJavaHome != null ? [preferredJavaHome] : new ArrayList<File>(desktopJavaHomes())
    LinkedHashSet<File> candidates = new LinkedHashSet<>()

    homesToScan.each { File homeDir ->
        candidates.add(new File(homeDir, 'jmods'))
        candidates.add(new File(homeDir, 'lib/rt.jar'))
    }

    ArrayList<File> libraries = new ArrayList<>()
    candidates.each { File candidate ->
        if (candidate.isDirectory()) {
            libraries.addAll(fileTree(candidate).matching { include '*.jmod' }.files.sort { File left, File right -> left.name <=> right.name })
        } else if (candidate.isFile()) {
            libraries.add(candidate)
        }
    }

    libraries
}

def desktopJpackageExecutable = {
    LinkedHashSet<File> candidates = new LinkedHashSet<>()
    def envOverride = System.getenv('JPACKAGE')
    if (envOverride != null && !envOverride.trim().isEmpty()) {
        candidates.add(new File(envOverride.trim()))
    }

    desktopJavaHomes().each { File homeDir ->
        candidates.add(new File(homeDir, 'bin/' + executableName('jpackage')))
    }

    candidates.find { File candidate -> candidate.isFile() }
}

def ensureSupportedDesktopPackagingHost = {
    String architecture = normalizedHostArchitecture()

    if (hostOperatingSystem.isWindows() && architecture == 'x64') {
        return
    }

    if (hostOperatingSystem.isLinux() && architecture == 'x64') {
        return
    }

    if (hostOperatingSystem.isMacOsX() && architecture == 'arm64') {
        return
    }

    throw new GradleException("Native packaging is not configured for this host. Current host is ${hostOperatingSystem.getName()} ${architecture}; supported targets are Windows x64, Linux x64, and macOS arm64.")
}

def resolveDesktopIconFile = {
    if (hostOperatingSystem.isWindows()) {
        return desktopIconIco.get().asFile
    }
    if (hostOperatingSystem.isMacOsX()) {
        return desktopIconIcns.get().asFile
    }
    return desktopIconPng
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main {
    java.srcDirs = ['src']
    resources {
        srcDirs = [rootProject.file('assets')]
        exclude 'saves/**', 'rankings/**', 'hs_err_pid*.log'
    }
}

application {
    mainClass = 'com.bilboldev.skillfulpixeldungeonplatformer.desktop.DesktopLauncher'
}

tasks.register('desktopAppJar', Jar) {
    dependsOn desktopJarTask
    dependsOn coreJarTask

    archiveBaseName.set(desktopJarBaseName)
    archiveVersion.set('')
    destinationDirectory.set(desktopAppJarDir)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes('Main-Class': application.mainClass.get())
    }

    from({
        zipTree(desktopJarTask.get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from({
        zipTree(coreJarTask.get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'
}

tasks.register('syncDesktopRuntimeLibs', Sync) {
    into(desktopRuntimeLibsDir)
    from({
        desktopRuntimeLibraries()
    })
}

tasks.register('writeDesktopObfuscationConfig') {
    dependsOn(tasks.named('desktopAppJar'))
    dependsOn(tasks.named('syncDesktopRuntimeLibs'))

    inputs.file(tasks.named('desktopAppJar').flatMap { it.archiveFile })
    inputs.files(configurations.runtimeClasspath)
    inputs.file(file('proguard-desktop.pro'))
    outputs.file(desktopObfuscationConfig)
    outputs.file(desktopObfuscationMapping)

    doLast {
        List<File> libraryFiles = new ArrayList<>(desktopRuntimeLibraries())
        libraryFiles.addAll(desktopJavaRuntimeLibraries())
        if (libraryFiles.isEmpty()) {
            throw new GradleException('Desktop obfuscation requires a full JDK with jmods or lib/rt.jar. Set JAVA_HOME or SKILLFUL_DESKTOP_DEBUG_JAVA_HOME to a full JDK installation.')
        }

        File configFile = desktopObfuscationConfig.get().asFile
        configFile.parentFile.mkdirs()
        desktopObfuscatedJar.get().asFile.parentFile.mkdirs()
        desktopObfuscationMapping.get().asFile.parentFile.mkdirs()

        List<String> lines = []
        lines << "-injars ${quoteForProguard(tasks.named('desktopAppJar').get().archiveFile.get().asFile)}"
        lines << "-outjars ${quoteForProguard(desktopObfuscatedJar.get().asFile)}"
        lines << "-printmapping ${quoteForProguard(desktopObfuscationMapping.get().asFile)}"

        libraryFiles.each { File dependency ->
            lines << "-libraryjars ${libraryEntryForProguard(dependency)}"
        }

        configFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register('obfuscateDesktopAppJar', JavaExec) {
    dependsOn(tasks.named('writeDesktopObfuscationConfig'))

    group = 'distribution'
    description = 'Obfuscates the desktop application jar.'
    classpath = configurations.proguard
    mainClass = 'proguard.ProGuard'
    workingDir = project.projectDir

    args("@${project.relativePath(desktopObfuscationConfig.get().asFile)}")
    args("@${project.relativePath(file('proguard-desktop.pro'))}")
}

tasks.register('syncDesktopInput', Sync) {
    dependsOn 'obfuscateDesktopAppJar', 'syncDesktopRuntimeLibs'
    into desktopInputDir
    from desktopObfuscatedJar
    from desktopRuntimeLibsDir
}

tasks.register('generateDesktopIcon') {
    inputs.file(desktopIconPng)
    outputs.file(desktopIconIco)

    doLast {
        def image = javax.imageio.ImageIO.read(desktopIconPng)
        if (image == null) {
            throw new GradleException("Unable to read launcher icon: ${desktopIconPng}")
        }

        int iconWidth = image.width
        int iconHeight = image.height
        byte[] pngBytes

        if (image.width > 256 || image.height > 256) {
            def scaledImage = new java.awt.image.BufferedImage(256, 256, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def graphics = scaledImage.createGraphics()
            try {
                graphics.setComposite(java.awt.AlphaComposite.Src)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
                graphics.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(image, 0, 0, 256, 256, null)
            } finally {
                graphics.dispose()
            }

            def output = new java.io.ByteArrayOutputStream()
            javax.imageio.ImageIO.write(scaledImage, 'png', output)
            pngBytes = output.toByteArray()
            iconWidth = 256
            iconHeight = 256
        } else {
            pngBytes = desktopIconPng.bytes
        }

        File outputFile = desktopIconIco.get().asFile
        outputFile.parentFile.mkdirs()

        outputFile.withOutputStream { stream ->
            writeWordLE(stream, 0)
            writeWordLE(stream, 1)
            writeWordLE(stream, 1)

            stream.write(iconWidth >= 256 ? 0 : iconWidth)
            stream.write(iconHeight >= 256 ? 0 : iconHeight)
            stream.write(0)
            stream.write(0)
            writeWordLE(stream, 1)
            writeWordLE(stream, 32)
            writeDwordLE(stream, pngBytes.length)
            writeDwordLE(stream, 22)
            stream.write(pngBytes)
        }
    }
}

tasks.register('generateDesktopMacIcon') {
    inputs.file(desktopIconPng)
    outputs.file(desktopIconIcns)

    onlyIf {
        hostOperatingSystem.isMacOsX()
    }

    doLast {
        File iconSetDir = new File(desktopIconIcns.get().asFile.parentFile, 'skillful-pixel-dungeon-platformer.iconset')
        delete(iconSetDir)
        iconSetDir.mkdirs()

        List<List<Object>> iconSizes = [
                [16, 'icon_16x16.png'],
                [32, 'icon_16x16@2x.png'],
                [32, 'icon_32x32.png'],
                [64, 'icon_32x32@2x.png'],
                [128, 'icon_128x128.png'],
                [256, 'icon_128x128@2x.png'],
                [256, 'icon_256x256.png'],
                [512, 'icon_256x256@2x.png'],
                [512, 'icon_512x512.png'],
                [1024, 'icon_512x512@2x.png']
        ]

        iconSizes.each { List<Object> iconSpec ->
            int size = iconSpec[0] as int
            String name = iconSpec[1] as String
            exec {
                commandLine('sips', '-z', String.valueOf(size), String.valueOf(size), desktopIconPng.absolutePath, '--out', new File(iconSetDir, name).absolutePath)
            }
        }

        exec {
            commandLine('iconutil', '-c', 'icns', iconSetDir.absolutePath, '-o', desktopIconIcns.get().asFile.absolutePath)
        }
    }
}

def configureDesktopPackagingTask = { TaskProvider<Exec> taskProvider, Provider<Directory> inputDir, Provider<Directory> outputDir,
        List<String> extraArguments ->
    taskProvider.configure {
        if (hostOperatingSystem.isWindows()) {
            dependsOn(tasks.named('generateDesktopIcon'))
            inputs.file(desktopIconIco)
        } else if (hostOperatingSystem.isMacOsX()) {
            dependsOn(tasks.named('generateDesktopMacIcon'))
            inputs.file(desktopIconIcns)
        } else {
            inputs.file(desktopIconPng)
        }

        inputs.dir(inputDir)
        outputs.dir(outputDir)

        doFirst {
            ensureSupportedDesktopPackagingHost()

            File jpackageExecutable = desktopJpackageExecutable()
            if (jpackageExecutable == null) {
                throw new GradleException('Could not find jpackage. Set JPACKAGE or JAVA_HOME to a JDK with jpackage installed.')
            }

            File outputDirFile = outputDir.get().asFile
            delete(outputDirFile)
            outputDirFile.mkdirs()

            List<String> arguments = [
                    jpackageExecutable.absolutePath,
                    '--type', 'app-image',
                    '--input', inputDir.get().asFile.absolutePath,
                    '--dest', outputDirFile.absolutePath,
                    '--name', rootProject.ext.appName,
                    '--app-version', desktopAppVersion,
                    '--main-jar', "${desktopJarBaseName}.jar",
                    '--main-class', application.mainClass.get(),
                    '--icon', resolveDesktopIconFile().absolutePath
            ]

            if (hostOperatingSystem.isMacOsX()) {
                arguments.addAll([
                        '--mac-package-identifier', desktopMacBundleIdentifier,
                        '--mac-package-name', desktopMacMenuName
                ])
            }

            arguments.addAll(extraArguments)

            commandLine(arguments)
        }
    }
}

def packageDesktopTask = tasks.register('packageDesktop', Exec) {
    dependsOn 'syncDesktopInput'
}
configureDesktopPackagingTask(packageDesktopTask, desktopInputDir, desktopPackageDir, [])

tasks.named('run', JavaExec).configure {
    workingDir = rootProject.file('assets')
    File preferredJavaHome = desktopRuntimeJavaHome()
    if (preferredJavaHome != null) {
        executable = new File(preferredJavaHome, 'bin/' + executableName('java')).absolutePath
        environment 'JAVA_HOME', preferredJavaHome.absolutePath
    }
    debugOptions {
        port = 51234
    }
}
