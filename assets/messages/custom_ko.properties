custom.theme.sewers.intro=지하 감옥은 도시 바로 아래에 있으며, 위층은 사실상 도시의 하수도 시스템입니다. 명목상 도시의 일부이기 때문에 그다지 위험하지는 않습니다. 안전한 곳이라고는 할 수 없지만, 적어도 사악한 마법과 마주할 일은 없을 겁니다.
custom.theme.prison.intro=수년 전, 이곳에는 가장 위험한 범죄자들을 가두는 지하 감옥이 지어졌습니다. 당시에는 탈출이 매우 어려웠기 때문에 아주 기발한 아이디어처럼 보였습니다. 하지만 곧 지하에서 검은 기운이 스며들기 시작했고, 죄수들과 간수들은 미쳐버렸습니다. 결국 감옥은 버려졌지만, 일부 죄수들은 이곳에 갇힌 채 남겨졌습니다.
custom.theme.caves.intro=버려진 감옥 아래로 뻗어 있는 동굴들은 인구 밀도가 매우 낮다. 도시에서 개발하기에는 너무 깊고, 드워프들이 관심을 가질 만큼 광물이 풍부하지도 않다. 과거에는 이 두 국가를 잇는 교역로 어딘가에 무역 기지가 있었지만, 드워프 대도시가 쇠퇴하면서 사라졌다. 지금은 어디에나 존재하는 놀과 지하 동물들만이 이곳에 살고 있다.
custom.theme.city.intro=드워프 대도시는 한때 드워프 도시 국가 중 가장 위대한 제국이었습니다. 전성기 시절, 드워프의 기계화 군대는 고대 신과 그의 악마 군대의 침략을 성공적으로 격퇴했습니다. 그러나 돌아온 전사들이 타락의 씨앗을 가져왔고, 그 승리는 지하 왕국의 종말의 시작이었다고 전해집니다.
custom.theme.halls.intro=과거 이곳은 메트로폴리스의 외곽 지역이었습니다. 고대 신과의 전쟁에서 값비싼 승리를 거둔 후, 드워프들은 남은 악마들을 완전히 소탕할 만큼 강해지지 못했습니다. 점차 악마들이 이곳을 장악해 왔고, 이제 이곳은 '악마의 전당'이라 불립니다. 극소수의 모험가만이 이곳까지 내려왔습니다...
custom.theme.sewers.sign.1=자신의 힘을 과대평가하지 말고, 다룰 수 있는 무기와 갑옷을 사용하세요.
custom.theme.sewers.sign.2=하수도에는 처음에는 쉽게 간과할 수 있는 위험 요소들이 있습니다. 만약 어떤 방이 뭔가 이상하다고 느껴진다면, 속도를 늦추고 꼼꼼히 살펴보세요.
custom.theme.sewers.sign.3=힘 스탯을 올리는 것만이 더 좋은 장비를 얻는 유일한 방법은 아니라는 점을 기억하세요. 업그레이드 스크롤을 사용하면 장비의 힘 요구치를 낮출 수도 있습니다.
custom.theme.sewers.sign.4=던전 곳곳에 있는 상점에서 금화를 사용할 수 있습니다. 이제 1층에도 상인이 생겼어요.
custom.theme.sewers.sign.5=끈적끈적한 액체를 조심하세요!
