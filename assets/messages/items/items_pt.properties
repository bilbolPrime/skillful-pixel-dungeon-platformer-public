items.potions.exotic.exoticpotion.jade=poção de jade exótica
items.potions.exotic.exoticpotion.magenta=poção exótica magenta
items.potions.exotic.exoticpotion.no=Não, mudei de ideia.
items.potions.exotic.exoticpotion.silver=poção de prata exótica
items.potions.exotic.exoticpotion.turquoise=poção turquesa exótica
items.potions.exotic.exoticpotion.unknown_desc=Este frasco redondo contém um líquido granulado e colorido. Parece ser algo estranho a esta terra; quem sabe o que poderá acontecer se for bebido ou atirado?
items.potions.exotic.exoticpotion.warning=Você realmente deseja cancelar o uso desta poção? Ela será consumida de qualquer maneira.
items.potions.exotic.exoticpotion.yes=Sim, tenho certeza.
items.potions.exotic.potionofcleansing$cleanse.desc=Este personagem é temporariamente imune a todos os efeitos negativos de status!\n\nTurnos restantes: %s.
items.potions.exotic.potionofcleansing$cleanse.name=purificado
items.potions.exotic.potionofcleansing.desc=Este poderoso reagente tornará o usuário imune a todos os efeitos negativos por alguns turnos após ser ingerido. Também pode ser arremessado em um alvo para purificá-lo.
items.potions.exotic.potionofcleansing.name=poção de limpeza
items.potions.exotic.potionofcorrosivegas.desc=Ao abrir ou quebrar este recipiente de vidro pressurizado, seu conteúdo explodirá em uma nuvem mortal de gás corrosivo cor de ferrugem. O gás se espalha mais rapidamente do que gases tóxicos e é mais letal, mas também não dura tanto tempo.
items.potions.exotic.potionofcorrosivegas.name=poção de gás corrosivo
items.potions.exotic.potionofdivineinspiration.bonus=+2 Pontos de Talento!
items.potions.exotic.potionofdivineinspiration.desc=O poder da energia sagrada reduzido à forma líquida, esta poção imbuirá o bebedor com poder divino, concedendo-lhe dois pontos de talento bônus em um nível de sua escolha. Esta poção só pode ser usada uma vez para cada nível de talento.
items.potions.exotic.potionofdivineinspiration.name=poção de inspiração divina
items.potions.exotic.potionofdivineinspiration.no_more_points=Você não pode ganhar mais pontos de talento bônus.
items.potions.exotic.potionofdivineinspiration.select_tier=Selecione um nível de talento para ganhar dois pontos de bônus. Você precisa ter desbloqueado o nível para poder gastar os pontos.
items.potions.exotic.potionofdragonsbreath.desc=Este frasco contém um composto incomum que entra em combustão logo após se misturar com a saliva. Cuspir o líquido rapidamente permitirá ao usuário expelir chamas pela boca!
items.potions.exotic.potionofdragonsbreath.name=poção do hálito do dragão
items.potions.exotic.potionofdragonsbreath.prompt=Escolha um local para queimar
items.potions.exotic.potionofearthenarmor.desc=Em vez de paralisar, esse líquido tem um efeito endurecedor na pele, transformando-a em uma armadura natural temporária.
items.potions.exotic.potionofearthenarmor.name=poção de armadura de terra
items.potions.exotic.potionofmagicalsight.desc=Após beber isso, seus sentidos serão brevemente aguçados a níveis incríveis, permitindo que você veja através de paredes em um raio de 12 quadrados!
items.potions.exotic.potionofmagicalsight.name=poção da visão mágica
items.potions.exotic.potionofmastery.armor_easier=Sua armadura ficará mais fácil de vestir!
items.potions.exotic.potionofmastery.desc=Em vez de conceder força bruta, esta poção irá sintonizar os músculos do usuário com um item específico. Isso tornará o item mais fácil de usar, como se o usuário tivesse praticado com ele e desenvolvido memória muscular. A arma ou armadura escolhida exigirá 2 pontos a menos de força para ser usada. Esta poção só pode ser usada uma vez em cada item.
items.potions.exotic.potionofmastery.name=poção da maestria
items.potions.exotic.potionofmastery.prompt=Domine um item
items.potions.exotic.potionofmastery.weapon_easier=Sua arma ficará mais fácil de manejar!
items.potions.exotic.potionofshielding.desc=Em vez de curar, esta poção projetará um escudo resistente ao redor do corpo do usuário, bloqueando uma quantidade considerável de dano.
items.potions.exotic.potionofshielding.name=poção de proteção
items.potions.exotic.potionofshroudingfog.desc=Quando exposto ao ar, o líquido neste frasco produzirá uma densa névoa esfumaçada que se espalhará rapidamente e bloqueará a visão de seus inimigos.
items.potions.exotic.potionofshroudingfog.name=poção de névoa envolvente
items.potions.exotic.potionofsnapfreeze.desc=A substância química contida nesta poção reagirá rapidamente com o ar, congelando e imobilizando instantaneamente tudo o que estiver dentro de sua área de efeito.
items.potions.exotic.potionofsnapfreeze.name=poção de congelamento instantâneo
items.potions.exotic.potionofstamina.desc=Ingerir esse líquido estranhamente doce lhe proporcionará um aumento de energia duradouro, permitindo que você corra em ritmo acelerado por um período prolongado.
items.potions.exotic.potionofstamina.name=poção de resistência
items.potions.exotic.potionofstormclouds.desc=Ao lançar esta poção, será criada uma nuvem de vapor concentrado que se espalhará rapidamente, condensando-se e espalhando-se pelo ambiente. A maior parte do terreno será transformada em água, inimigos de fogo sofrerão dano, o fogo será extinto e as armadilhas serão sobrecarregadas e destruídas.
items.potions.exotic.potionofstormclouds.name=poção de nuvens de tempestade
items.potions.potion$placeholder.name=poção
items.potions.potion$seedtopotion.name=Poção Aleatória
items.potions.potion.ac_drink=BEBIDA
items.potions.potion.amber=poção âmbar
items.potions.potion.azure=poção azul
items.potions.potion.beneficial=Poção benéfica
