items.weapon.melee.flail$spinabilitytracker.desc=A Duelista está girando seu mangual, acumulando dano para seu próximo ataque normal. Cada giro consome um turno, mas aumenta o dano, até um máximo de três giros. O mangual também tem a garantia de acertar enquanto gira. Giros atuais: %1$d%%.\n Turnos restantes: %2$s.
