items.artifacts.hornofplenty.desc=Este chifre não pode ser soprado, mas parece se encher de comida à medida que você se aventura e ganha experiência. Você pode consumir cada carga individualmente como um lanche ou comer até ficar satisfeito.
items.artifacts.hornofplenty.desc_cursed=O chifre amaldiçoado se prendeu ao seu lado, parecendo mais interessado em receber comida do que em produzi-la.
items.artifacts.hornofplenty.desc_hint=Talvez haja uma maneira de aumentar o poder do chifre fornecendo-lhe energia alimentar.
