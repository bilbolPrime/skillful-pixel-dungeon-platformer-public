custom.theme.sewers.intro=Lochy znajdują się tuż pod Miastem, a ich górne poziomy stanowią w rzeczywistości miejski system kanalizacyjny. Będąc nominalnie częścią Miasta, te poziomy nie są aż tak niebezpieczne. Nikt nie nazwie ich bezpiecznym miejscem, ale przynajmniej nie będziesz musiał mierzyć się tu ze złą magią.
custom.theme.prison.intro=Wiele lat temu zbudowano tu podziemne więzienie dla najgroźniejszych przestępców. Wówczas wydawało się to bardzo sprytnym pomysłem, ponieważ z tego miejsca rzeczywiście trudno było uciec. Wkrótce jednak mroczne opary zaczęły przenikać z dołu, doprowadzając więźniów i strażników do szaleństwa. Ostatecznie więzienie opuszczono, choć niektórzy skazani pozostali tu zamknięci.
custom.theme.caves.intro=Jaskinie, które ciągną się pod opuszczonym więzieniem, są słabo zaludnione. Leżą zbyt głęboko, by eksploatować je mogło Miasto, i są zbyt ubogie w minerały, by zainteresować krasnoludy. W przeszłości, gdzieś na szlaku między tymi dwoma stanami, znajdowała się placówka handlowa, ale zniknęła wraz z upadkiem Krasnoludzkiej Metropolii. Teraz zamieszkują je jedynie wszechobecne gnole i podziemne zwierzęta.
custom.theme.city.intro=Krasnoludzka Metropolia była niegdyś najpotężniejszym krasnoludzkim miastem-państwem. W czasach swojej świetności zmechanizowana armia krasnoludów skutecznie odparła inwazję starego boga i jego armii demonów. Mówi się jednak, że powracający wojownicy przynieśli ze sobą ziarna zepsucia, a zwycięstwo to było początkiem końca podziemnego królestwa.
custom.theme.halls.intro=W przeszłości te poziomy stanowiły obrzeża Metropolis. Po kosztownym zwycięstwie w wojnie ze Starym Bogiem krasnoludy były zbyt osłabione, by oczyścić je z pozostałych demonów. Stopniowo demony zacieśniały swoją władzę nad tym miejscem i teraz nazywa się ono Sale Demonów.\n\nNiewielu poszukiwaczy przygód kiedykolwiek zstąpiło tak daleko...
custom.theme.sewers.sign.1=Nie przeceniaj swojej siły, używaj broni i zbroi, z którymi możesz sobie poradzić.
custom.theme.sewers.sign.2=Niektóre niebezpieczeństwa w kanałach łatwo przeoczyć na pierwszy rzut oka. Jeśli pomieszczenie wydaje się nieodpowiednie, zwolnij i rozejrzyj się uważnie.
custom.theme.sewers.sign.3=Pamiętaj, że zwiększenie siły to nie jedyny sposób na uzyskanie lepszego ekwipunku. Możesz również obniżyć wymaganą siłę za pomocą Zwojów Ulepszeń.
custom.theme.sewers.sign.4=Możesz wydawać złoto w sklepach w całym lochu. Teraz jest nawet kupiec na pierwszym piętrze.
custom.theme.sewers.sign.5=Uważaj na Goo!
custom.theme.prison.sign.1=Pixel-Mart - wszystko, czego potrzebujesz do udanej przygody!
custom.theme.prison.sign.2=Zidentyfikuj swoje mikstury i zwoje jak najszybciej. Nie odkładaj tego na moment, gdy naprawdę ich potrzebujesz.
custom.theme.prison.sign.3=Bycie głodnym nie boli, ale głodowanie już tak.
custom.theme.prison.sign.4=Atak z zaskoczenia ma większą szansę na trafienie. Nadal możesz zaskoczyć wrogów, kontrolując przestrzeń wokół drzwi.
custom.theme.prison.sign.5=Nie wypuszczaj Tengu!
custom.theme.caves.sign.1=Pixel-Mart. Wydawaj pieniądze. Żyj dłużej.
custom.theme.caves.sign.2=Jeśli zaatakuje cię kilka potworów jednocześnie, spróbuj wycofać się za drzwi.
custom.theme.caves.sign.3=Jeśli czujesz pieczenie, nie daj się zamknąć. W jaskiniach ważniejsze jest poruszanie się w pionie.
custom.theme.caves.sign.4=Nie ma sensu posiadać więcej niż jednego Ankh jednocześnie, ponieważ utracisz je po wskrzeszeniu.
custom.theme.caves.sign.5=NIEBEZPIECZEŃSTWO! Ciężki sprzęt może spowodować obrażenia, utratę kończyn lub śmierć!
custom.theme.city.sign.1=Pixel-Mart. Bezpieczniejsze życie w lochach.
custom.theme.city.sign.2=Kiedy ulepszasz zaczarowaną broń, istnieje szansa na zniszczenie tego zaklęcia.
custom.theme.city.sign.3=Broń i zbroje niszczeją szybciej niż różdżki i pierścienie, ale jest więcej sposobów, aby je naprawić.
custom.theme.city.sign.4=Jedynym sposobem na zdobycie Zwoju Unicestwienia jest otrzymanie go w prezencie od duchów lochów.
custom.theme.city.sign.5=W obecności Jego Wysokości broń jest niedozwolona!
custom.theme.halls.sign.1=Gdy próbujesz odczytać znak, wybucha on zielonkawym płomieniem.
