scenes.heroselectscene.daily=デイリーラン
scenes.heroselectscene.daily_desc=毎日、誰にとっても同じ新しいゲームが用意される！この「デイリーラン」は、プレイする人全員に同じダンジョンを生成します（同じゲームバージョンをプレイしている限り）。\n\nデイリーランは好きなだけ時間をかけてクリアできますが、一度にアクティブにできるのは1つだけです。デイリーランはバッジの対象外です。\n\n現在選択されているヒーローとチャレンジで、今日のデイリーを開始しますか？
scenes.heroselectscene.daily_existing=すでにデイリー走行を開始しています。別のデイリーを開始する前に、そのランを終了する必要があります。
scenes.heroselectscene.daily_no=いいえ
scenes.heroselectscene.daily_nowin=毎日、誰にとっても同じ新しいゲームが用意される！この「デイリーラン」は、プレイする人全員に同じダンジョンを生成します（同じゲームバージョンをプレイしている限り）。\n\nデイリーランをプレイできるようになるには、少なくとも1勝する必要があります。
scenes.heroselectscene.daily_repeat=あなたはすでに今日のデイリーをプレーした。再プレーは可能ですが、ランキング外の練習としてのみプレーしてください。\n\nリプレイ完了後、記録が削除されるまでのしばらくの間、デイリーランキングのウィンドウからその記録を見ることができます。\n\n現在選択されているヒーローとチャレンジで、今日のデイリーをリプレイしますか？
scenes.heroselectscene.daily_unavailable_long=未来にある毎日を開始したようです！最近タイムゾーンを変更した場合や、システムクロックを変更した場合に起こる可能性があります。次の日刊は%d日後になります。
