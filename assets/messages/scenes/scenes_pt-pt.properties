scenes.heroselectscene.daily=Corrida diária
scenes.heroselectscene.daily_desc=Todos os dias, é disponibilizado um novo jogo, sendo o mesmo para todos! Esta "corrida diária" gera a mesma masmorra para todos os que a jogam (desde que estejam a jogar a mesma versão do jogo). Pode demorar o tempo que quiser para completar uma corrida diária, mas só pode ter uma ativa de cada vez. As corridas diárias não são elegíveis para emblemas e têm a sua própria página de classificação. Gostaria de começar a corrida diária de hoje com o herói e os desafios que selecionou?
scenes.heroselectscene.daily_existing=Já tem uma corrida diária em andamento. Precisa de encerrar essa corrida antes de iniciar outra.
scenes.heroselectscene.daily_no=Não
scenes.heroselectscene.daily_nowin=Todos os dias, é disponibilizado um novo jogo, sendo o mesmo para todos! Esta "partida diária" gera a mesma masmorra para todos os jogadores (desde que estejam a jogar a mesma versão do jogo). Precisa de vencer pelo menos uma partida para poder participar nas partidas diárias.
scenes.heroselectscene.daily_repeat=Já jogou a missão diária de hoje. Pode jogá-la novamente, se quiser, mas apenas como uma partida de treino sem classificação. Após concluir a repetição, poderá visualizá-la na janela de classificação diária durante um curto período antes de o registo ser eliminado. Deseja jogar novamente a missão diária de hoje com o herói e os desafios que selecionou?
scenes.heroselectscene.daily_unavailable_long=Parece que iniciou uma atualização diária que está no futuro! Isto pode acontecer se tiver mudado de fuso horário recentemente ou se tiver alterado o relógio do sistema. _A sua próxima atualização diária estará disponível daqui a %d dias._
