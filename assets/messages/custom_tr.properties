custom.theme.sewers.intro=Zindan, şehrin hemen altında yer alıyor; üst katları aslında şehrin kanalizasyon sistemini oluşturuyor. Şehrin bir parçası sayıldığından, bu katlar o kadar tehlikeli değil. Kimse burayı güvenli bir yer olarak adlandırmayacak, ama en azından burada kötü büyülerle uğraşmanıza gerek kalmayacak.
custom.theme.prison.intro=Yıllar önce, en tehlikeli suçlular için buraya yeraltı bir hapishane inşa edildi. O zamanlar çok zekice bir fikir gibi görünüyordu, çünkü buradan kaçmak gerçekten çok zordu. Ancak kısa süre sonra aşağıdan karanlık bir sis sızmaya başladı ve mahkumları ve gardiyanları deliliğe sürükledi. Sonunda hapishane terk edildi, ancak bazı mahkumlar burada kilitli kaldı.
custom.theme.caves.intro=Terk edilmiş hapishanenin altına doğru uzanan mağaralar, seyrek nüfusludur. Şehrin işleyebileceğinden çok daha derindedirler ve cücelerin ilgisini çekecek kadar mineral bakımından fakirdirler. Geçmişte bu iki devlet arasındaki güzergah üzerinde bir ticaret karakolu vardı, ancak Cüce Metropolü'nün çöküşünden beri yok oldu. Şimdi burada sadece her yerde bulunan gnollar ve yer altı hayvanları yaşamaktadır.
custom.theme.city.intro=Cüce Metropolü bir zamanlar cüce şehir devletlerinin en büyüğüydü. En parlak döneminde, cücelerin mekanize ordusu, eski tanrının ve iblis ordusunun istilasını başarıyla püskürtmüştü. Ancak, geri dönen savaşçıların beraberlerinde yozlaşma tohumları getirdiği ve bu zaferin yeraltı krallığı için sonun başlangıcı olduğu söylenir.
custom.theme.halls.intro=Geçmişte bu bölgeler Metropolis'in dış mahalleleriydi. Eski tanrıyla yapılan savaşta kazanılan pahalı zaferden sonra cüceler, kalan iblislerden temizleyemeyecek kadar zayıflamışlardı. İblisler yavaş yavaş bu yer üzerindeki hakimiyetlerini sıkılaştırdılar ve şimdi buraya İblis Salonları deniyor. Çok az maceracı bu kadar derine inmiştir...
custom.theme.sewers.sign.1=Gücünüzü abartmayın, başa çıkabileceğiniz silah ve zırhları kullanın.
custom.theme.sewers.sign.2=Kanalizasyonlardaki bazı tehlikeler ilk bakışta kolayca gözden kaçabilir. Bir odanın şüpheli olduğunu hissederseniz, yavaşlayın ve dikkatlice bakın.
custom.theme.sewers.sign.3=Unutmayın, daha iyi ekipmanlara erişmenin tek yolu gücünüzü artırmak değildir. Yükseltme Parşömenleri ile ekipmanın güç gereksinimini de düşürebilirsiniz.
custom.theme.sewers.sign.4=Zindandaki dükkanlarda altınlarınızı harcayabilirsiniz. Hatta artık birinci katta bile bir tüccar var.
custom.theme.sewers.sign.5=Yapışkan maddeye dikkat edin!
custom.theme.prison.sign.1=Pixel-Mart - başarılı bir macera için ihtiyacınız olan her şey!
custom.theme.prison.sign.2=İksirlerinizi ve parşömenlerinizi mümkün olan en kısa sürede belirleyin. Onlara gerçekten ihtiyacınız olduğu ana kadar ertelemeyin.
custom.theme.prison.sign.3=Aç olmak acı vermez, ama açlıktan ölmek acı verir.
custom.theme.prison.sign.4=Sürpriz saldırının isabet etme şansı daha yüksektir. Bir kapının etrafındaki alanı kontrol ettiğinizde düşmanları yine de hazırlıksız yakalayabilirsiniz.
custom.theme.prison.sign.5=Tengu'nun dışarı çıkmasına izin vermeyin!
custom.theme.caves.sign.1=Pixel-Mart. Para harcayın. Daha uzun yaşayın.
custom.theme.caves.sign.2=Aynı anda birden fazla canavarın saldırısına uğradığınızda, bir kapının arkasına çekilmeye çalışın.
custom.theme.caves.sign.3=Eğer çok ısınıyorsanız, kendinizi sıkışmış bir alana hapsetmeyin. Mağaralarda dikey hareket daha önemlidir.
custom.theme.caves.sign.4=Aynı anda birden fazla Ankh'a sahip olmanın bir anlamı yok, çünkü dirildiğinizde onları kaybedeceksiniz.
custom.theme.caves.sign.5=TEHLİKE! Ağır makineler yaralanmaya, uzuv kaybına veya ölüme neden olabilir!
custom.theme.city.sign.1=Pixel-Mart. Zindanlarda daha güvenli bir yaşam.
custom.theme.city.sign.2=Büyülü bir silahı yükselttiğinizde, o silahın büyüsünü yok etme olasılığı vardır.
custom.theme.city.sign.3=Silahlar ve zırhlar asa ve yüzüklerden daha hızlı yıpranır, ancak onları tamir etmenin daha fazla yolu vardır.
custom.theme.city.sign.4=Yok Etme Parşömeni'ni elde etmenin tek yolu, onu zindan ruhlarından hediye olarak almaktır.
custom.theme.city.sign.5=Majestelerinin huzurunda silah taşımak yasaktır!
custom.theme.halls.sign.1=Tabelayı okumaya çalışırken yeşilimsi alevler yükseliyor.
