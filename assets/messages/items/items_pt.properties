items.artifacts.etherealchains.desc=Essas correntes grandes, porém leves, brilham com energia espiritual. Elas podem ser usadas para puxar você em direção ao terreno ou para atrair inimigos. A natureza etérea das correntes permite até mesmo que elas atravessem paredes!
items.artifacts.etherealchains.desc_cursed=As correntes amaldiçoadas estão presas ao seu corpo, balançando constantemente, tentando te fazer tropeçar ou te imobilizar.
items.artifacts.etherealchains.desc_equipped=As correntes repousam ao seu redor, drenando lentamente a energia espiritual daqueles que você derrota. Cada carga é um elo na corrente, que se estenderá exatamente um quadrado.
items.artifacts.etherealchains.does_nothing=Isso não vai adiantar nada.
