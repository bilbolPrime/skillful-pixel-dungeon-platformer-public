items.artifacts.timekeepershourglass$sandbag.desc=Este pequeno saco de areia fina deve funcionar perfeitamente com a sua ampulheta. Parece estranho que o lojista tenha este item específico justamente quando você precisa dele...
items.artifacts.timekeepershourglass$sandbag.levelup=Você adiciona a areia à sua ampulheta.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Sua ampulheta está cheia de areia mágica!
items.artifacts.timekeepershourglass$sandbag.name=saco de areia mágica
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Você não tem uma ampulheta para colocar essa areia.
items.artifacts.timekeepershourglass$timefreeze.desc=O tempo fica congelado ao seu redor, permitindo que você execute ações instantaneamente. O efeito durará até ser cancelado ou sua ampulheta ficar sem carga. Atacar ou usar magia também interromperá esse efeito. \n\nTurnos até o uso da carga: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Congelamento do tempo
items.artifacts.timekeepershourglass.ac_activate=ATIVAR
items.artifacts.timekeepershourglass.cursed=Você não pode usar uma ampulheta amaldiçoada.
items.artifacts.timekeepershourglass.deactivate=Você desativa o congelamento do tempo.
items.artifacts.timekeepershourglass.desc=Esta grande ampulheta ornamentada parece bastante modesta, mas você sente um grande poder em sua moldura finamente esculpida. Ao girar a ampulheta e observar a areia escorrer, você pode sentir sua magia te atraindo; certamente, usar essa magia lhe daria algum controle sobre o tempo.
items.artifacts.timekeepershourglass.desc_cursed=A ampulheta amaldiçoada está presa ao seu lado, você pode senti-la tentando manipular o fluxo do seu tempo.
items.artifacts.timekeepershourglass.desc_hint=A ampulheta parece ter perdido um pouco de areia, se ao menos você pudesse encontrar um pouco...
items.artifacts.timekeepershourglass.freeze=Congele o tempo ao meu redor
items.artifacts.timekeepershourglass.name=ampulheta do cronometrista
items.artifacts.timekeepershourglass.no_charge=Sua ampulheta ainda não recarregou o suficiente para ser usada.
items.artifacts.timekeepershourglass.onfreeze=De repente, tudo ao seu redor congela.
items.artifacts.timekeepershourglass.onstasis=O mundo parece mudar ao seu redor num instante.
items.artifacts.timekeepershourglass.prompt=Como você gostaria de usar a magia da ampulheta? Enquanto estiver em estase, o tempo correrá normalmente enquanto você estiver congelado e completamente invulnerável, consumindo até 2 cargas por vez. Quando o tempo estiver congelado, você poderá se mover como se suas ações não levassem tempo. Isso pode ser desativado a qualquer momento usando a ampulheta ou atacando.
items.artifacts.timekeepershourglass.stasis=Coloquei-me em estado de estase
items.artifacts.unstablespellbook.ac_add=ADICIONAR
items.artifacts.unstablespellbook.ac_read=LER
items.artifacts.unstablespellbook.blinded=Não é possível ler o livro estando cego.
items.artifacts.unstablespellbook.cursed=Você não pode ler um livro de feitiços amaldiçoado.
items.artifacts.unstablespellbook.desc=Este tomo está em surpreendentemente bom estado de conservação, considerando sua idade. Ele crepita e estala ao folhear as páginas, pulsando com uma energia instável. Se você ler este livro, não há como prever que feitiço poderá lançar.
items.artifacts.unstablespellbook.desc_cursed=O livro amaldiçoado se ligou a você, impedindo sua capacidade de usar a maioria dos pergaminhos.
items.artifacts.unstablespellbook.desc_empowered=Os pergaminhos que você adicionou ao livro estão irradiando poder. Você poderá escolher a versão exótica dos efeitos desses pergaminhos, mas isso terá um custo adicional.
items.artifacts.unstablespellbook.desc_index=O livro está incompleto. Seu índice aponta atualmente para as seguintes páginas em branco:
items.artifacts.unstablespellbook.infuse_scroll=Você infunde a energia do pergaminho no livro.
items.artifacts.unstablespellbook.name=livro de feitiços instável
items.artifacts.unstablespellbook.no_charge=Seu livro de feitiços está sem energia no momento.
items.artifacts.unstablespellbook.prompt=Selecione um pergaminho
items.artifacts.unstablespellbook.read_empowered=O pergaminho que você adicionou ao grimório está repleto de energia. Você pode canalizar tanto a versão normal quanto a exótica do efeito deste pergaminho. Escolher a variante exótica custará 2 cargas em vez de 1.
items.artifacts.unstablespellbook.unable_scroll=Você não pode adicionar este pergaminho ao livro.
items.artifacts.unstablespellbook.unknown_scroll=Você ainda não tem certeza de que tipo de pergaminho é este.
items.bags.bag.discover_hint=Você pode comprar este item em uma loja.
items.bags.bag.name=mochila
items.bags.magicalholster.desc=Este coldre fino é feito de couro de animal exótico e possui uma poderosa magia que lhe permite armazenar uma enorme quantidade de armas de longo alcance. Você pode simplesmente enfiar a mão na bolsa e sempre encontrará o item que procura. Devido à magia do coldre, as varinhas carregarão um pouco mais rápido e as armas de arremesso durarão um pouco mais dentro dele.
items.bags.magicalholster.name=coldre mágico
items.bags.potionbandolier.desc=Esta bandoleira grossa envolve o peito como uma faixa e possui várias tiras isolantes para acomodar frascos de poções, seu cantil ou frascos de metal líquido. Enquanto estiverem dentro da bandoleira, suas poções ficarão protegidas do frio.
items.bags.potionbandolier.name=bandoleira de poções
items.bags.scrollholder.desc=Este recipiente tubular parece ideal para guardar ferramentas e mapas de astrônomos, mas seus pergaminhos também caberão perfeitamente. Há até alguns compartimentos laterais que acomodariam cristais mágicos, estiletes arcanos e resina arcana. O recipiente não parece ser muito inflamável, então seus pergaminhos estarão protegidos do fogo dentro dele.
items.bags.scrollholder.name=suporte de pergaminho
items.bags.velvetpouch.desc=Esta pequena bolsa de veludo pode guardar diversos itens pequenos, como sementes, runas e alguns ingredientes de alquimia.
items.bags.velvetpouch.discover_hint=Um dos heróis começa com este item.
items.bags.velvetpouch.name=bolsa de veludo
items.bombs.arcanebomb.desc=Esta bomba foi imbuída com propriedades arcanas. Ela explodirá em uma poderosa rajada semelhante ao ataque potencializado de Goo, causando _%1$d-%2$d de dano mágico_ a tudo em um raio de 2 quadrados.
items.bombs.arcanebomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.arcanebomb.name=bomba arcana
items.bombs.bomb$doublebomb.desc=Um pacote com duas bombas de pólvora negra bem pesadas; parece que você ganha uma de graça!
items.bombs.bomb$doublebomb.name=duas bombas
items.bombs.bomb.ac_lightthrow=LUZ E PROJEÇÃO
items.bombs.bomb.desc=Uma bomba de pólvora negra bastante pesada. A explosão desta bomba causa dano de _%1$d a _%2$d_ a tudo que estiver adjacente a ela e destruirá parte do terreno ou de alguns itens próximos.
items.bombs.bomb.desc_burning=O pavio da bomba está queimando, mantenha distância ou apague-a!
items.bombs.bomb.desc_fuse=Parece que o pavio vai precisar de algumas rodadas para queimar completamente depois de aceso.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=A explosão te mata...
items.bombs.bomb.rankings_desc=Morto por uma explosão
items.bombs.bomb.snuff_fuse=Você apaga rapidamente o pavio da bomba.
items.bombs.firebomb.desc=Esta bomba foi modificada para explodir em uma área maior, causando _%1$d-%2$d de dano_ e espalhando chamas contínuas em um raio de 2 quadrados.
items.bombs.firebomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.firebomb.name=bomba incendiária
items.bombs.flashbangbomb.desc=Esta bomba personalizada explodirá em uma explosão de luz, som e eletricidade ao detonar. Tudo que estiver a até 2 quadrados de distância sofrerá dano de _%1$d a %2$d_ pela explosão, mais 25%% de dano da eletricidade e ficará atordoado por 10 turnos.
items.bombs.flashbangbomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.flashbangbomb.name=granada de efeito moral
items.bombs.frostbomb.desc=Esta bomba foi modificada para explodir em uma área maior, causando _%1$d-%2$d de dano_ e espalhando uma rajada contínua de ar congelante em um raio de 2 quadrados.
items.bombs.frostbomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.frostbomb.name=bomba de gelo
items.bombs.holybomb.desc=Esta bomba foi modificada para emitir luz sagrada em uma área maior ao explodir. Qualquer coisa dentro de 2 quadrados sofrerá _%1$d-%2$d de dano_ da explosão, e inimigos mortos-vivos ou demoníacos sofrerão 50%% de dano adicional da luz sagrada.
items.bombs.holybomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.holybomb.name=bomba sagrada
items.bombs.noisemaker.desc=Esta bomba personalizada emitirá sons repetidamente quando seu pavio se apagar. Quando algo tocar a bomba, ela explodirá e causará dano de _%1$d-%2$d_ a tudo em um raio de 2 quadrados!
items.bombs.noisemaker.desc_burning=O dispositivo sonoro está funcionando, ele explodirá quando algo se aproximar!
items.bombs.noisemaker.discover_hint=Você pode criar este item através da alquimia.
items.bombs.noisemaker.name=gerador de ruído
items.bombs.regrowthbomb.desc=Esta bomba personalizada espalhará um líquido vital por toda parte em um raio de 3 quadrados, em vez de explodir. A área atingida pela explosão fará brotar grama e plantas rapidamente. Você e quaisquer aliados atingidos pela explosão serão curados como se tivessem bebido uma poção de cura.
items.bombs.regrowthbomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.regrowthbomb.name=bomba de regeneração
items.bombs.shrapnelbomb.desc=Esta bomba foi modificada com pedaços de metal da DM-300, que se fragmentarão e voarão para todos os lados ao explodir, causando dano de _%1$d a %2$d_ em uma área enorme ao redor da bomba. É melhor se esconder atrás de algo ao usá-la...
items.bombs.shrapnelbomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.shrapnelbomb.name=bomba de estilhaços
items.bombs.smokebomb.desc=Esta bomba foi modificada para expelir uma densa nuvem de gás ao mesmo tempo em que explode. Ela causará dano de _%1$d a %2$d_ e espalhará uma névoa densa em um raio de 2 quadrados.
items.bombs.smokebomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.smokebomb.name=bomba de fumaça
items.bombs.woollybomb.desc=Esta bomba personalizada criará um amplo campo de ovelhas mágicas após explodir. A explosão causará dano de _%1$d a %2$d_ a tudo em um raio de 2 quadrados. As ovelhas bloquearão o movimento e persistirão por um longo tempo! No entanto, as ovelhas não durarão tanto na presença de inimigos poderosos e poderão ser dissipadas manualmente mais cedo interagindo com eles.
items.bombs.woollybomb.discover_hint=Você pode criar este item através da alquimia.
items.bombs.woollybomb.name=bomba lanosa
items.brokenseal$warriorshield.desc_active=O selo quebrado do Guerreiro está ajudando-o a perseverar, concedendo-lhe um escudo além de sua saúde. Há um tempo de recarga após o escudo ser ativado inicialmente, antes que ele possa ser usado novamente. Este escudo não se dissipa com o tempo, mas terminará se não houver inimigos por perto durante alguns turnos. Quando terminar, qualquer escudo não utilizado reduzirá o tempo de recarga, até um máximo de 50. Escudo restante: Tempo de recarga atual:
items.brokenseal$warriorshield.desc_cooldown=O Guerreiro recentemente obteve proteção devido ao seu selo quebrado e deve esperar até poder se beneficiar novamente de seu efeito de proteção.\n\nTurnos restantes: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=O tempo de recarga do escudo do Guerreiro está atualmente negativo, o que significa que, quando seu escudo é ativado, o tempo de recarga será menor que os 150 turnos usuais. O tempo de recarga do escudo pode ser reduzido para até -150 turnos, o que significa que ele estará disponível imediatamente após ser ativado.
items.brokenseal$warriorshield.name=Escudo do Guerreiro
items.brokenseal.ac_affix=AFIXO
items.brokenseal.affix=Você fixa o selo na sua armadura!
items.brokenseal.choose_desc=Tanto esta armadura quanto o selo quebrado possuem um glifo. Escolha qual glifo deve ser mantido. ZXQPH2 ZXQ ZXQPH3 ZXQ Glifo da Armadura: ZXQPH0 ZXQ ZXQPH4 ZXQ Glifo do Selo Quebrado: ZXQPH1 ZXQ ZXQPH5 ZXQ ZXQPH6 ZXQ Observe que, se você escolher o glifo que está atualmente na armadura, o selo não poderá transferi-lo posteriormente.
items.brokenseal.choose_title=Escolha um glifo
items.brokenseal.cursed_armor=O selo não se aplica a armaduras amaldiçoadas.
items.brokenseal.desc=Um selo de cera, afixado à armadura como símbolo de bravura. Possui uma runa de proteção desbotada gravada no centro e está rachado ao meio. Como lembrança de sua terra natal, o selo ajuda o guerreiro a perseverar. Enquanto estiver usando o selo, o guerreiro ganhará instantaneamente proteção quando estiver prestes a sofrer dano que reduza sua saúde à metade ou menos. O selo pode ser afixado à armadura e transferido entre armaduras. Ele pode carregar uma única melhoria consigo, desde que essa melhoria tenha sido aplicada à armadura enquanto o selo estava anexado a ela.
items.brokenseal.discover_hint=Um dos heróis começa com este item.
items.brokenseal.inscribed=O selo contém a inscrição _%s._
items.brokenseal.name=lacre rompido
items.brokenseal.prompt=Selecione uma armadura
items.brokenseal.unknown_armor=Primeiro você precisa identificar se essa armadura é amaldiçoada ou não.
items.dewdrop.already_full=Você já goza de plena saúde.
items.dewdrop.desc=Uma gota de orvalho cristalina. Devido à magia deste lugar, a água pura possui pequenas propriedades restauradoras.
items.dewdrop.name=gota de orvalho
items.energycrystal.desc=Uma coleção de pequenos cristais mágicos, repletos de energia alquímica. Esses cristais são o ingrediente mais comum em receitas de alquimia e podem ser produzidos em um caldeirão de alquimia ao desmontar itens consumíveis.
items.energycrystal.name=cristal de energia
