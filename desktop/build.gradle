def steamMacMenuName = 'SkillfulPD'
def freeDesktopBuildProperty = 'spd.desktopFreeBuild'
def normalizedHostArchitecture = {
    String architecture = (System.getProperty('os.arch') ?: '').toLowerCase()
    if (architecture in ['x86_64', 'amd64']) {
        return 'x64'
    }
    if (architecture in ['aarch64', 'arm64']) {
        return 'arm64'
    }
    return architecture
}
def steamHostPlatformId = {
    if (hostOperatingSystem.isWindows()) {
        return 'windows-' + normalizedHostArchitecture()
    }
    if (hostOperatingSystem.isLinux()) {
        return 'linux-' + normalizedHostArchitecture()
    }
    if (hostOperatingSystem.isMacOsX()) {
        return 'macos-' + normalizedHostArchitecture()
    }
    return 'unsupported-' + normalizedHostArchitecture()
}
def steamPackagePlatformId = steamHostPlatformId()
def steamLocalPackageDir = layout.buildDirectory.dir("steam/local/package/${steamPackagePlatformId}")
def steamFreePackageDir = layout.buildDirectory.dir("steam/free/package/${steamPackagePlatformId}/Free")
def steamPublishPackageDir = layout.buildDirectory.dir("steam/publish/package/${steamPackagePlatformId}")
def steamAppVersion = String.valueOf(rootProject.version ?: '1.0')
def legacySteamPackageInputDir = layout.buildDirectory.dir('steam-package-input')
def steamObfuscatedJar = layout.buildDirectory.file("steam/publish/obfuscation/${steamJarBaseName}.jar")
def steamObfuscationConfig = layout.buildDirectory.file('steam/publish/obfuscation/proguard-config.pro')
def steamObfuscationMapping = layout.buildDirectory.file('steam/publish/obfuscation/mapping.txt')
def desktopJarTask = tasks.named('jar', Jar)
def coreJarTask = project(':core').tasks.named('jar', Jar)
def steamAppImageName = hostOperatingSystem.isMacOsX() ? "${rootProject.ext.appName}.app" : rootProject.ext.appName

def executableName = { String baseName ->
    System.getProperty('os.name').toLowerCase().contains('windows') ? "${baseName}.exe" : baseName
}

def toPortablePath = { File file ->
    file.absolutePath.replace('\\', '/')
}

def quoteForProguard = { File file ->
    "\"${toPortablePath(file)}\""
}

def libraryEntryForProguard = { File file ->
    String path = quoteForProguard(file)
    file.name.toLowerCase().endsWith('.jmod') ? path + '(!**.jar;!module-info.class)' : path
}

def writeSteamAppIdFile = { File file ->
    file.parentFile.mkdirs()
    file.text = steamAppId + System.lineSeparator()
}

def writeSteamAppIdFiles = { File installRoot ->
    LinkedHashSet<File> targets = new LinkedHashSet<>()
    targets.add(new File(installRoot, 'steam_appid.txt'))

    if (hostOperatingSystem.isWindows()) {
        targets.add(new File(installRoot, 'app/steam_appid.txt'))
    } else if (hostOperatingSystem.isLinux()) {
        targets.add(new File(installRoot, 'bin/steam_appid.txt'))
        targets.add(new File(installRoot, 'lib/app/steam_appid.txt'))
    } else if (hostOperatingSystem.isMacOsX()) {
        targets.add(new File(installRoot, 'Contents/MacOS/steam_appid.txt'))
        targets.add(new File(installRoot, 'Contents/app/steam_appid.txt'))
    }

    targets.each { File target ->
        writeSteamAppIdFile(target)
    }
}

def writeWordLE = { OutputStream stream, int value ->
    stream.write(value & 0xFF)
    stream.write((value >> 8) & 0xFF)
}

def writeDwordLE = { OutputStream stream, int value ->
    stream.write(value & 0xFF)
    stream.write((value >> 8) & 0xFF)
    stream.write((value >> 16) & 0xFF)
    stream.write((value >> 24) & 0xFF)
}

def steamRuntimeLibraries = {
    String desktopJarName = desktopJarTask.get().archiveFileName.get()
    configurations.runtimeClasspath.resolve().findAll { File file ->
        return file.name.endsWith('.jar') && file.name != desktopJarName && !file.name.startsWith('core-')
    }.sort { File left, File right -> left.name <=> right.name }
}

def addSteamJavaHomesFrom = { LinkedHashSet<File> homes, File root ->
    if (root == null || !root.isDirectory()) {
        return
    }

    root.listFiles()?.findAll { File candidate -> candidate.isDirectory() }?.sort { File left, File right -> right.name <=> left.name }?.each { File candidate ->
        homes.add(candidate)
    }
}

def steamJavaHomes = {
    LinkedHashSet<File> homes = new LinkedHashSet<>()
    [System.getenv('SKILLFUL_DESKTOP_DEBUG_JAVA_HOME'), System.getenv('JAVA_HOME'), System.getProperty('java.home')]
            .findAll { String value -> value != null && !value.trim().isEmpty() }
            .each { String javaHome ->
                File homeDir = new File(javaHome)
                homes.add(homeDir)
                if (homeDir.parentFile != null) {
                    homes.add(homeDir.parentFile)
                }
            }

    homes
}

def isAndroidStudioJbr = { File homeDir ->
    if (homeDir == null) {
        return false
    }

    String normalized = toPortablePath(homeDir).toLowerCase()
    return normalized.contains('/android studio/jbr')
}

def steamJavaHome = {
    steamJavaHomes().find { File homeDir ->
        return new File(homeDir, 'bin/' + executableName('java')).isFile() && (new File(homeDir, 'jmods').isDirectory() || new File(homeDir, 'lib/rt.jar').isFile())
    }
}

def desktopRuntimeJavaHome = {
    File preferredHome = steamJavaHomes().find { File homeDir ->
    File javaExecutable = new File(homeDir, 'bin/' + executableName('java'))
    File jmodsDir = new File(homeDir, 'jmods')
    File rtJar = new File(homeDir, 'lib/rt.jar')
    !isAndroidStudioJbr(homeDir) && javaExecutable.isFile() && (jmodsDir.isDirectory() || rtJar.isFile())
    }

    return preferredHome != null ? preferredHome : steamJavaHome()
}

def steamJavaRuntimeLibraries = {
    File preferredJavaHome = steamJavaHome()
    List<File> homesToScan = preferredJavaHome != null ? [preferredJavaHome] : new ArrayList<File>(steamJavaHomes())
    LinkedHashSet<File> candidates = new LinkedHashSet<>()

    homesToScan.each { File homeDir ->
        candidates.add(new File(homeDir, 'jmods'))
        candidates.add(new File(homeDir, 'lib/rt.jar'))
    }

    ArrayList<File> libraries = new ArrayList<>()
    candidates.each { File candidate ->
        if (candidate.isDirectory()) {
            libraries.addAll(fileTree(candidate).matching { include '*.jmod' }.files.sort { File left, File right -> left.name <=> right.name })
        } else if (candidate.isFile()) {
            libraries.add(candidate)
        }
    }

    libraries
}

def steamJpackageExecutable = {
    LinkedHashSet<File> candidates = new LinkedHashSet<>()
    def envOverride = System.getenv('JPACKAGE')
    if (envOverride != null && !envOverride.trim().isEmpty()) {
        candidates.add(new File(envOverride.trim()))
    }

    steamJavaHomes().each { File homeDir ->
        candidates.add(new File(homeDir, 'bin/' + executableName('jpackage')))
    }

    candidates.find { File candidate -> candidate.isFile() }
}

def ensureSupportedSteamPackagingHost = {
    String architecture = normalizedHostArchitecture()

    if (hostOperatingSystem.isWindows() && architecture == 'x64') {
        return
    }

    if (hostOperatingSystem.isLinux() && architecture == 'x64') {
        return
    }

    if (hostOperatingSystem.isMacOsX() && architecture == 'arm64') {
        return
    }

    throw new GradleException("Steam packaging on this host is not configured for repo-supported depots. Current host is ${hostOperatingSystem.getName()} ${architecture}; supported targets are Windows x64, Linux x64, and macOS arm64.")
}

def resolveSteamIconFile = {
    if (hostOperatingSystem.isWindows()) {
        return steamIconIco.get().asFile
    }
    if (hostOperatingSystem.isMacOsX()) {
        return steamIconIcns.get().asFile
    }
    return steamIconPng
}

