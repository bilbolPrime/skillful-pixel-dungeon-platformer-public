scenes.heroselectscene.challenges_nowin=チャレンジとは、ゲームをより難しくするオプションの修正要素である。ダンジョンをより危険にするものもあれば、能力やアイテムの威力を下げるものもある。\n\nチャレンジを有効にするには、少なくとも1勝する必要があります。
scenes.heroselectscene.custom_seed=カスタムシード
scenes.heroselectscene.custom_seed_clear=クリア
scenes.heroselectscene.custom_seed_desc=このゲームはダンジョン生成にシードコードを使用し、同じシードとゲームバージョンは常に同じダンジョンを生成します！カスタムシードゲームは、バッジを獲得したり、プレイしたゲームに貢献したりすることができず、ランキングページの一番下に表示されます。
scenes.heroselectscene.custom_seed_duplicate=すでにそのシードで通常の対局が進行中です。カスタムシードを使用する前に、その対局を終了する必要があります。
scenes.heroselectscene.custom_seed_nowin=このゲームではダンジョン生成にシードコードを使用し、同じシードとゲームバージョンで常に同じダンジョンが生成される！\n\nカスタムシードを入力できるようになるには、少なくとも1勝する必要があります。
