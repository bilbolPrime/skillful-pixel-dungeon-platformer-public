custom.generated.oh_i_see_you_have_cef64cb7a7=ああ、成功したんですね！あまりご迷惑をおかけしていなければ幸いです。お約束通り、私の高品質な杖の中からお好きなものをお選びいただけます。
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=ああ、こんな場所でまともな人に会えるなんて、嬉しい驚きです！私は珍しい材料、腐ベリーの種を探しに来たんです。魔法使いなので、地元のモンスターには十分対抗できるのですが、すぐに道に迷ってしまって、とても困っています。もしかしたら、助けていただけませんか？お礼に、私の自慢の杖を差し上げます。
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=ああ、こんな場所でまともな人に会えるなんて、嬉しい驚きです！私は珍しい材料、死体粉を探しにここに来ました。それは骸骨から採取できるもので、ダンジョンには大量にあります。魔法使いなので、地元のモンスターには十分対抗できますが、すぐに迷子になってしまい、とても困っています。もしかしたら、助けていただけませんか？お礼に、私の最高の杖を差し上げます。
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=ああ、こんなところでまともな人に会えるなんて、なんと嬉しい驚きだろう！私は幻の魚という珍しい食材を求めてここに来た。素手でも釣れるが、水中ではなかなか気づかない。魔法の使い手だから、地元のモンスターから身を守ることはできるんだけど、あっという間に迷子になってしまって、とても恥ずかしいんだ。助けてくれませんか？私の最高の杖の1本で、喜んでお代をお支払いしますよ。
