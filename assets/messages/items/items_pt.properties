items.artifacts.lloydsbeacon.tele_fail=A magia de teletransporte falha.
items.artifacts.masterthievesarmband.ac_steal=ROUBAR
items.artifacts.masterthievesarmband.cursed=Você não pode usar uma braçadeira amaldiçoada.
items.artifacts.masterthievesarmband.desc=Esta braçadeira de veludo roxo carrega a marca de um mestre ladrão. Ela não lhe pertence, mas provavelmente também não pertencia ao seu último dono.
items.artifacts.masterthievesarmband.desc_cursed=A braçadeira amaldiçoada está presa ao seu pulso e, de alguma forma, sua bolsa de ouro parece estar ficando cada vez mais leve...
items.artifacts.masterthievesarmband.desc_worn=Você sente o poder se acumular na braçadeira em seu pulso à medida que ganha experiência. Você pode usar esse poder para roubar lojas ou assaltar inimigos! Assaltar inimigos acontece instantaneamente, os desorienta brevemente e lhe dá a chance de pegar qualquer saque que eles tenham! Esse poder é mais eficaz contra inimigos desatentos. Assaltar o mesmo inimigo várias vezes não aumenta suas chances de obter saque.
items.artifacts.masterthievesarmband.failed_steal=Você não conseguiu roubar nada.
