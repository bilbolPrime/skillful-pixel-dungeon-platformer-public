items.weapon.melee.gauntlet.ability_desc=O Duelista pode realizar um _golpe combinado_ com uma manopla de pedra. Este ataque tem acerto garantido e causa _+%d de dano_ para cada vez que o Duelista acertar um ataque corpo a corpo ou com arma de arremesso normal. Se o Duelista não acertar por 5 turnos, o combo é reiniciado.
