custom.generated.warriors_are_physically_tough_and_02774ddc7a=I guerrieri sono fisicamente resistenti e possono incassare molti danni. Tuttavia, sono svantaggiati quando si tratta di armi a distanza e magia. Imparare queste abilità è comunque possibile, ma richiede maggiore impegno.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=I ladri si affidano ad agilità, furtività e precisione. Eccellono nella mobilità, negli agguati, nel veleno e nel combattimento evasivo, ma a scapito della robustezza tipica dei guerrieri in prima linea.
custom.generated.wizards_master_the_arts_of_3efc4cde47=I maghi padroneggiano le arti magiche. Hanno delle lacune in termini di forza fisica e agilità. Acquisire tali abilità è comunque possibile, ma richiede maggiore impegno.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Le cacciatrici eccellono nel combattimento a distanza e nella mobilità. Controllano gli scontri con archi, colpi di precisione e strumenti di sopravvivenza affidabili, ma si trovano meno a loro agio in risse ravvicinate prolungate.
