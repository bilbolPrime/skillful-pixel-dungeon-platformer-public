items.scrolls.exotic.exoticscroll.naudiz=pergaminho exótico de NAUDIZ
items.scrolls.exotic.exoticscroll.odal=pergaminho exótico de ODAL
items.scrolls.exotic.exoticscroll.raido=pergaminho exótico de RAIDO
items.scrolls.exotic.exoticscroll.sowilo=pergaminho exótico de SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=pergaminho exótico de TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Uma runa mágica brilhante e indecifrável está escrita neste pergaminho negro. Parece ser de outro mundo; quem sabe o que acontecerá quando for lida em voz alta?
items.scrolls.exotic.exoticscroll.yngvi=pergaminho exótico de YNGVI
items.scrolls.exotic.scrollofantimagic.desc=O encantamento neste pergaminho irá envolvê-lo com uma aura mágica que bloqueia temporariamente todos os efeitos mágicos, sejam eles prejudiciais ou benéficos. Isso inclui a maioria dos efeitos de itens mágicos, como varinhas, pergaminhos, anéis, artefatos, encantamentos e maldições. No entanto, as habilidades da armadura heroica são fortes o suficiente para funcionar independentemente disso.
items.scrolls.exotic.scrollofantimagic.name=pergaminho de antimagia
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Uma arena mágica surgiu ao seu redor, indicada por uma densa névoa vermelha. Enquanto estiver na névoa, sua fome não aumentará e você receberá 33%% menos dano de todas as fontes. Se você tiver outras fontes de redução de dano (como armadura), elas serão aplicadas após a redução de 33%%. Turnos restantes: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafio
items.scrolls.exotic.scrollofchallenge.desc=Ao ser lido em voz alta, este pergaminho liberará um grande rugido que atrairá inimigos para o usuário, criando simultaneamente uma pequena arena ao seu redor. Enquanto o leitor permanecer nesta arena, receberá 33% menos dano de todas as fontes (isso é aplicado antes de outras formas de redução de dano) e não perderá a saciedade. O tamanho da arena será proporcional ao tamanho da área em que o leitor estiver. Será particularmente pequena em algumas áreas de chefes.
items.scrolls.exotic.scrollofchallenge.name=pergaminho de desafio
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Seu pergaminho de adivinhação identificou os seguintes itens:
items.scrolls.exotic.scrollofdivination.desc=Este pergaminho identificará aleatoriamente quatro tipos de itens que você desconhece. Os tipos identificados podem ser a cor de uma poção, a runa de um pergaminho ou a gema de um anel. Os itens identificados não serão necessariamente itens que você esteja carregando.
items.scrolls.exotic.scrollofdivination.name=pergaminho de adivinhação
items.scrolls.exotic.scrollofdivination.nothing_left=Não há mais nada para identificar!
items.scrolls.exotic.scrollofdread.desc=Ao ser lido, este pergaminho emitirá um clarão de luz vermelha que instilará um terror incrível em todos os inimigos em seu campo de visão. Tão grande é o efeito que eles tentarão fugir rapidamente de toda a masmorra, para nunca mais serem vistos! Assim como o terror, este efeito pode expirar com o tempo ou se o inimigo for atacado. Inimigos com forte vontade, como chefes, serão afetados pelo terror comum.
items.scrolls.exotic.scrollofdread.name=pergaminho do terror
items.scrolls.exotic.scrollofenchantment.armor=Selecione um glifo para aplicar à sua armadura.
items.scrolls.exotic.scrollofenchantment.cancel=cancelar
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelar ainda consumirá seu pergaminho de encantamento, tem certeza?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Não, mudei de ideia.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sim, tenho certeza.
items.scrolls.exotic.scrollofenchantment.desc=Este pergaminho imbuirá uma arma ou armadura com poderosa energia mágica. O leitor terá até certo ponto de controle sobre qual magia será imbuída.
items.scrolls.exotic.scrollofenchantment.inv_title=Encantar um item
items.scrolls.exotic.scrollofenchantment.name=pergaminho de encantamento
items.scrolls.exotic.scrollofenchantment.weapon=Selecione um encantamento para aplicar à sua arma.
items.scrolls.exotic.scrollofforesight.desc=Após a leitura deste pergaminho, os detalhes do terreno próximo serão constantemente transmitidos à mente do leitor com clareza cristalina. Esse efeito dura um período considerável e revelará todas as portas ou armadilhas ocultas, tornando a busca desnecessária.
items.scrolls.exotic.scrollofforesight.name=pergaminho da previsão
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelar ainda consumirá seu pergaminho de metamorfose, tem certeza?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Escolha um talento para se transformar.
items.scrolls.exotic.scrollofmetamorphosis.desc=Este pergaminho contém uma poderosa magia de transmutação, que se aplicará ao conjurador em vez de a um item. A magia deste pergaminho permitirá que você selecione um talento e o substitua por um de cinco talentos do mesmo nível de diferentes classes de herói! Este efeito só pode ser aplicado a talentos de classe, não a talentos obtidos por subclasses ou habilidades de armadura. Talentos que você não pode usar não serão oferecidos como opções.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento de metamorfose
items.scrolls.exotic.scrollofmetamorphosis.name=pergaminho da metamorfose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Escolha um novo talento para substituir o talento que se transformou.
items.scrolls.exotic.scrollofmysticalenergy.desc=O poder mágico bruto contido neste pergaminho, quando liberado, carregará os artefatos equipados pelo usuário ao longo do tempo.
items.scrolls.exotic.scrollofmysticalenergy.name=pergaminho de energia mística
items.scrolls.exotic.scrollofpassage.desc=O feitiço neste pergaminho transporta instantaneamente o leitor para a região mais próxima, no primeiro andar acima. Muito útil para chegar rapidamente a uma loja.
items.scrolls.exotic.scrollofpassage.name=pergaminho de passagem
items.scrolls.exotic.scrollofprismaticimage.desc=O encantamento neste pergaminho criará um gêmeo ilusório e colorido do leitor. Esta imagem prismática age como um clone mais fraco do leitor, com defesa semelhante, mas com menos pontos de vida e dano. A imagem prismática se revelará quando houver inimigos presentes e tentará defender o leitor. Se uma imagem prismática já existir, usar este pergaminho a curará completamente.
items.scrolls.exotic.scrollofprismaticimage.name=pergaminho de imagem prismática
items.scrolls.exotic.scrollofpsionicblast.desc=Este pergaminho contém uma energia destrutiva incrível que pode ser canalizada para destruir as mentes de todas as criaturas visíveis. Há, no entanto, um efeito colateral significativo, e o leitor também sofrerá danos, ficará cego e enfraquecido. Quanto mais alvos o pergaminho atingir, menor será o dano sofrido pelo leitor.
items.scrolls.exotic.scrollofpsionicblast.name=pergaminho de explosão psíquica
items.scrolls.exotic.scrollofpsionicblast.ondeath=A Explosão Psiônica despedaça sua mente...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Essa criatura foi enfeitiçada pela magia de um pergaminho com o canto de uma sereia. Um personagem enfeitiçado se torna permanentemente seu aliado e lutará contra qualquer inimigo que encontrar.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=fascinado
items.scrolls.exotic.scrollofsirenssong.cancel=Você deve escolher um alvo.
items.scrolls.exotic.scrollofsirenssong.desc=A leitura deste pergaminho emite uma melodia sedutora que enfeitiçará o inimigo alvo, transformando-o permanentemente em um aliado! Outros inimigos que a ouvirem ficarão temporariamente encantados. Inimigos particularmente fortes podem resistir ao efeito de encantamento e serão enfeitiçados em vez disso.
items.scrolls.exotic.scrollofsirenssong.name=pergaminho da canção da sereia
items.scrolls.exotic.scrollofsirenssong.no_target=O pergaminho ativa-se sem um alvo.
items.scrolls.exotic.scrollofsirenssong.prompt=Escolha um alvo
items.scrolls.inventoryscroll.no=Não, mudei de ideia.
items.scrolls.inventoryscroll.warning=Tem mesmo vontade de cancelar este uso de rolagem? A rolagem não foi identificada anteriormente, então será consumida de qualquer forma.
items.scrolls.inventoryscroll.yes=Sim, tenho certeza.
items.scrolls.scroll$placeholder.name=rolagem
items.scrolls.scroll.ac_read=LER
items.scrolls.scroll.berkanan=pergaminho de BERKANAN
items.scrolls.scroll.blinded=Não é possível ler um pergaminho estando cego.
items.scrolls.scroll.cursed=Seu livro de feitiços amaldiçoado impede você de invocar a magia deste pergaminho! Um pergaminho de remover maldição talvez seja forte o suficiente para ainda funcionar...
items.scrolls.scroll.gyfu=pergaminho de GYFU
items.scrolls.scroll.isaz=pergaminho de ISAZ
items.scrolls.scroll.kaunan=pergaminho de KAUNAN
items.scrolls.scroll.laguz=pergaminho de LAGUZ
items.scrolls.scroll.mannaz=pergaminho de MANNAZ
items.scrolls.scroll.naudiz=pergaminho de NAUDIZ
items.scrolls.scroll.no_magic=Você não pode ler um pergaminho enquanto for imune à magia.
items.scrolls.scroll.odal=pergaminho de ODAL
items.scrolls.scroll.raido=pergaminho de RAIDO
items.scrolls.scroll.sowilo=pergaminho de SOWILO
items.scrolls.scroll.tiwaz=pergaminho de TIWAZ
items.scrolls.scroll.unknown_desc=Uma runa mágica indecifrável está escrita neste pergaminho. Quem sabe o que acontecerá quando for lida em voz alta?
items.scrolls.scroll.yngvi=pergaminho de YNGVI
items.scrolls.scrollofidentify.desc=Este pergaminho revela permanentemente todos os segredos de um único item.
items.scrolls.scrollofidentify.inv_title=Identifique um item
items.scrolls.scrollofidentify.it_is=Seu item foi identificado: %s.
items.scrolls.scrollofidentify.name=pergaminho de identificação
items.scrolls.scrolloflullaby.desc=A leitura deste pergaminho emite uma melodia suave que embalará todos os que o ouvirem num sono mágico profundo. Para o leitor e seus aliados, o sono é restaurador.
items.scrolls.scrolloflullaby.name=pergaminho de canção de ninar
items.scrolls.scrolloflullaby.sooth=O pergaminho emite uma melodia suave. Você sente muito sono.
items.scrolls.scrollofmagicmapping.desc=Ao ler este pergaminho, uma imagem de clareza cristalina ficará gravada em sua memória, revelando o layout preciso da fase e todos os segredos ocultos. A localização de itens e criaturas permanecerá desconhecida.
items.scrolls.scrollofmagicmapping.layout=Agora você conhece o layout do nível.
items.scrolls.scrollofmagicmapping.name=pergaminho de mapeamento mágico
items.scrolls.scrollofmirrorimage.copies=O pergaminho forma imagens espelhadas de você.
items.scrolls.scrollofmirrorimage.desc=O encantamento neste pergaminho criará dois gêmeos ilusórios do leitor. Essas imagens espelhadas agem como clones mais fracos do leitor e perseguirão seus inimigos. Elas não possuem durabilidade, porém, e desaparecerão ao sofrerem dano.
items.scrolls.scrollofmirrorimage.name=pergaminho de imagem espelhada
items.scrolls.scrollofmirrorimage.no_copies=O pergaminho tenta criar imagens espelhadas suas, mas elas não têm para onde ir.
items.scrolls.scrollofrage.desc=Ao ser lido em voz alta, este pergaminho liberará um grande rugido que atrairá todos os inimigos para o leitor e enfurecerá os que estiverem por perto.
items.scrolls.scrollofrage.name=pergaminho de fúria
items.scrolls.scrollofrage.roar=O pergaminho emite um rugido ensurdecedor que ecoa por toda a masmorra!
items.scrolls.scrollofrecharging.desc=O poder mágico bruto contido neste pergaminho carregará todas as varinhas do usuário ao longo do tempo, quando forem liberadas.
items.scrolls.scrollofrecharging.name=rolagem de recarga
items.scrolls.scrollofrecharging.surge=Uma onda de energia percorre seu corpo, revigorando suas varinhas!
items.scrolls.scrollofremovecurse.cleansed=Seu objeto irradia uma luz purificadora, e a energia malévola se dispersa!
items.scrolls.scrollofremovecurse.desc=O encantamento neste pergaminho removerá instantaneamente qualquer maldição de uma única arma, anel, varinha, armadura ou artefato.
items.scrolls.scrollofremovecurse.inv_title=Limpe um item
items.scrolls.scrollofremovecurse.name=pergaminho de remover maldição
items.scrolls.scrollofremovecurse.not_cleansed=Seu objeto emite uma luz purificadora, mas nada acontece.
items.scrolls.scrollofremovecurse.spirit=Seu pergaminho liberta o espírito atormentado!
items.scrolls.scrollofretribution.blast=Uma poderosa energia mágica irrompe do pergaminho!
items.scrolls.scrollofretribution.desc=Este pergaminho contém energia destrutiva que canaliza o sofrimento do leitor para fora, transformando-o em uma explosão de poder. Quanto mais fraco o leitor estiver, mais dano causará. Com pouca vida, este pergaminho pode matar a maioria dos inimigos instantaneamente. O uso do pergaminho, no entanto, cobra um preço do usuário, cegando-o e enfraquecendo-o.
items.scrolls.scrollofretribution.name=pergaminho da retribuição
items.scrolls.scrollofteleportation.cant_reach=Você não pode se teletransportar para lá.
items.scrolls.scrollofteleportation.desc=O feitiço neste pergaminho transporta instantaneamente o leitor para um local diferente no mesmo nível da masmorra. O pergaminho prioriza áreas que o leitor ainda não explorou, embora não seja capaz de teletransportar através de portas trancadas ou barricadas. Ele pode, no entanto, revelar portas secretas que levam a novas áreas.
items.scrolls.scrollofteleportation.name=pergaminho de teletransporte
items.scrolls.scrollofteleportation.no_tele=A magia de teletransporte falha.
items.scrolls.scrollofteleportation.prompt=Escolha um local para se teletransportar.
items.scrolls.scrollofteleportation.tele=Num piscar de olhos, você foi teletransportado para outro local da fase.
items.scrolls.scrollofterror.desc=Ao ser lido, este pergaminho emitirá um clarão de luz vermelha que aterrorizará todos os inimigos em seu campo de visão, fazendo-os fugir. Atacar um inimigo em fuga reduzirá a duração do efeito.
items.scrolls.scrollofterror.many=O pergaminho emite um brilho intenso de luz vermelha e os monstros fogem!
items.scrolls.scrollofterror.name=pergaminho do terror
items.scrolls.scrollofterror.none=O pergaminho emite um brilho intenso de luz vermelha.
items.scrolls.scrollofterror.one=O pergaminho emite um brilho intenso de luz vermelha e o %s foge!
items.scrolls.scrolloftransmutation.desc=Este pergaminho contém uma poderosa magia de transmutação. Quando usado em um item elegível, ele o transformará em um item diferente do mesmo tipo. A magia preservará até mesmo melhorias, encantamentos e glifos. Pergaminhos e poções serão transmutados em seus equivalentes exóticos e vice-versa.
items.scrolls.scrolloftransmutation.inv_title=Transmutar um item
items.scrolls.scrolloftransmutation.morph=Seu objeto se transforma em algo diferente!
items.scrolls.scrolloftransmutation.name=pergaminho de transmutação
items.scrolls.scrolloftransmutation.nothing=Nada de interessante acontece.
items.scrolls.scrollofupgrade.desc=Este pergaminho aprimorará um único item ou conjunto de armas de arremesso. Varinhas terão seu poder e número de cargas aumentados, armas e armaduras causarão e bloquearão mais dano, conjuntos de armas de arremesso serão totalmente reparados e mais duráveis, e os efeitos dos anéis serão intensificados. Ele pode até enfraquecer ou, às vezes, dissipar completamente maldições, embora não seja tão potente quanto um pergaminho de remoção de maldição. Infelizmente, a magia de aprimoramento também pode apagar encantamentos ou glifos em equipamentos de nível superior.
items.scrolls.scrollofupgrade.inv_title=Melhore um item
items.scrolls.scrollofupgrade.name=pergaminho de atualização
items.scrolls.scrollofupgrade.remove_curse=O pergaminho de aprimoramento remove a maldição do seu item!
items.scrolls.scrollofupgrade.weaken_curse=O pergaminho de aprimoramento enfraquece a maldição do seu item.
items.spells.alchemize$wndalchemizeitem.energize=Transforme em energia %d
items.spells.alchemize$wndalchemizeitem.energize_1=Transforme 1 em energia %d
items.spells.alchemize$wndalchemizeitem.energize_all=Transforme tudo em energia %d
items.spells.alchemize$wndalchemizeitem.sell=Transforme em %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Transforme 1 em %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Converter tudo para %dg
items.spells.alchemize.desc=Este feitiço contém poderes transmutativos semelhantes aos encontrados em um caldeirão de alquimia. Cada conjuração permite ao usuário transformar um item (ou conjunto de itens) em ouro ou energia alquímica. Transformar poções ou pergaminhos em energia até mesmo os identificará! Alguns usos de Alquimia são vendidos em lojas, mas muitos mais podem ser criados usando alquimia, combinando uma semente, uma runa e um pouco de energia alquímica.
items.spells.alchemize.name=alquimizar
items.spells.alchemize.prompt=Alquimizar um item
items.spells.beaconofreturning.creatures=A aura psíquica das criaturas vizinhas não permite que você se teletransporte neste momento.
items.spells.beaconofreturning.desc=Este feitiço complexo concede ao usuário a habilidade de retornar a um local predefinido, independentemente da distância. O feitiço só será consumido ao retornar, podendo ser conjurado quantas vezes desejar, mas só se lembrará do último local para o qual foi conjurado.
items.spells.beaconofreturning.desc_set=Este farol foi posicionado em algum lugar no andar %d.
items.spells.beaconofreturning.name=farol do retorno
items.spells.beaconofreturning.preventing=A forte aura mágica deste lugar impede que você use o feitiço!
items.spells.beaconofreturning.set=O sinalizador foi posicionado na sua localização atual.
items.spells.beaconofreturning.wnd_body=A configuração substituirá a localização para a qual o farol foi definido anteriormente. \n\nRetornar fará com que você volte para a última localização definida e consumirá um uso do feitiço.
items.spells.beaconofreturning.wnd_return=RETORNAR
items.spells.beaconofreturning.wnd_set=DEFINIR
items.spells.curseinfusion.desc=Esta magia infunde um equipamento com a mesma poderosa magia maligna presente em DM-300. O item em que for usada será imediatamente amaldiçoado, e qualquer encantamento ou glifo que ele possua será anulado. No caso de armas, armaduras e varinhas, o item receberá melhorias além de ser amaldiçoado. As melhorias da infusão de maldição não se acumulam e são perdidas se o item for desamaldiçoado. Infusões de maldição múltiplas também podem ser usadas para alterar a maldição de uma arma ou armadura.
items.spells.curseinfusion.inv_title=Amaldiçoar um item
items.spells.curseinfusion.name=infusão de maldição
items.spells.magicalinfusion.desc=Este feitiço possui o mesmo poder mágico que um pergaminho de aprimoramento, mas de forma mais estável. Além de aprimorar um item normalmente, ele nunca apagará um encantamento, glifo ou maldição.
items.spells.magicalinfusion.infuse=Seu item está imbuído de energia arcana!
items.spells.magicalinfusion.inv_title=Infundir um item
items.spells.magicalinfusion.name=infusão mágica
items.spells.magicalporter.desc=Este feitiço transportará magicamente qualquer item em que for lançado. Ao contrário do farol de um mercador, porém, os itens serão transportados para a entrada do próximo andar do chefe.
items.spells.magicalporter.inv_title=Transportar um item
items.spells.magicalporter.name=porteiro mágico
items.spells.magicalporter.nowhere=Não há nenhum lugar para onde você possa enviar um item.
items.spells.phaseshift.desc=Este feitiço caótico teletransportará qualquer personagem alvo para um local aleatório no andar atual e o atordoará por um período considerável. Inimigos poderosos serão capazes de resistir ao efeito de atordoamento. Este feitiço pode ser direcionado a um alvo ou ao próprio usuário.
items.spells.phaseshift.name=deslocamento de fase
items.spells.phaseshift.no_target=Não há nada para se teletransportar ali.
items.spells.reclaimtrap.desc=Esta magia contém resquícios da energia mecânica de DM-300. Quando conjurada sobre uma armadilha ativa, o poder da armadilha se ligará a você, permitindo que você use a magia novamente para expelir esse poder e ativar o efeito da armadilha em qualquer local que desejar. No entanto, algumas armadilhas podem não funcionar em todos os lugares, e apenas uma armadilha pode ser armazenada por vez.
items.spells.reclaimtrap.desc_trap=O feitiço está pronto para ativar um _%s._
items.spells.reclaimtrap.name=armadilha de recuperação
items.spells.reclaimtrap.no_trap=Não há nenhuma armadilha ali.
items.spells.recycle.desc=Este feitiço contém uma forma inferior de magia de transmutação. Embora não funcione em equipamentos, ele transformará um pergaminho, poção, semente, runa ou dardo com ponta em um item aleatório do mesmo tipo.
items.spells.recycle.inv_title=Recicle um item
items.spells.recycle.name=reciclar
items.spells.recycle.recycled=Seu item foi reciclado em: %s.
items.spells.spell.ac_cast=ELENCO
items.spells.spell.discover_hint=Você pode criar este item através da alquimia.
items.spells.spell.no_magic=Você não pode lançar feitiços enquanto for imune à magia.
items.spells.summonelemental.ac_imbue=IMPURRAR
items.spells.summonelemental.desc=Este feitiço canaliza a energia das brasas elementais usadas para criá-lo e permite que você invoque um elemental aliado para lutar ao seu lado! Apenas um elemental pode ser invocado por vez, mas o feitiço pode ser conjurado novamente para trazer o elemental de volta sem custo algum.
items.spells.summonelemental.desc_chaos=O feitiço está atualmente irradiando energia caótica e invocará um elemental do caos. Você pode imbuir um item diferente, mas o feitiço perderá sua imbução atual.
items.spells.summonelemental.desc_fire=O feitiço está quente ao toque e invocará um elemental de fogo. Você pode imbuir um item diferente, mas o feitiço perderá sua imbução atual.
items.spells.summonelemental.desc_frost=O feitiço está frio ao toque e invocará um elemental de gelo. Você pode imbuir um item diferente, mas o feitiço perderá seu efeito atual.
items.spells.summonelemental.desc_newborn=O feitiço está atualmente sem imbuimento e invocará um elemental recém-nascido sem ataque à distância. Você pode imbuir uma poção de chama líquida, poção de gelo, pergaminho de recarga ou pergaminho de transmutação para fortalecer o feitiço, fazendo com que as invocações futuras sejam elementais com poder total!
items.spells.summonelemental.desc_shock=O feitiço está atualmente irradiando energia estática e invocará um _elemental de choque_. Você pode imbuir um item diferente, mas o feitiço perderá sua imbução atual.
items.spells.summonelemental.imbue_prompt=Imbuir um item
items.spells.summonelemental.name=invocar elemental
items.spells.targetedspell.inv_title=Infundir um item
items.spells.targetedspell.prompt=Escolha um alvo
items.spells.telekineticgrab.cant_grab=Você não pode pegar isso.
items.spells.telekineticgrab.desc=Este feitiço permite ao conjurador pegar remotamente todos os itens em um local, ou todas as armas arremessadas que estiverem presas em um inimigo! Não pode ser usado para pegar itens que pertencem a outra pessoa, ou para pegar recipientes como baús.
items.spells.telekineticgrab.name=agarrar telecinético
items.spells.telekineticgrab.no_target=Não há nada para agarrar ali.
items.spells.unstablespell.desc=Este pequeno cristal quadrado preto possui símbolos rúnicos variáveis em cada uma de suas superfícies. \n\n. Quando ativado, ele desencadeará o efeito de um pergaminho aleatório. O efeito do pergaminho será sempre focado em combate se houver inimigos em seu campo de visão e sempre não será focado em combate caso contrário.
items.spells.unstablespell.name=feitiço instável
items.spells.wildenergy.desc=Este feitiço contém parte da energia amaldiçoada que alimentava o DM-300. Ao ser conjurado, ele recarregará suas varinhas e artefatos equipados, além de ativar um efeito aleatório de varinha amaldiçoada. Você poderá escolher a direção para onde essa magia amaldiçoada será direcionada.
items.spells.wildenergy.name=energia selvagem
items.stones.inventorystone.ac_use=USAR
items.stones.runestone$placeholder.name=pedra rúnica
items.stones.runestone.discover_hint=Você pode encontrar este item aleatoriamente na masmorra ou criá-lo através da alquimia.
items.stones.stoneofaggression$aggression.desc=Magia manipulativa está fazendo com que todos os inimigos próximos prefiram atacar este personagem.\n\nTurnos restantes: %s.
items.stones.stoneofaggression$aggression.name=direcionado
items.stones.stoneofaggression.desc=Quando esta pedra é arremessada contra um aliado ou inimigo, todos os inimigos próximos priorizarão atacar esse personagem por um curto período. Chefes, no entanto, podem resistir ao efeito, reduzindo significativamente a duração e sofrendo menos dano dos ataques de seus lacaios.
items.stones.stoneofaggression.name=pedra da agressão
items.stones.stoneofaugmentation$wndaugment.cancel=Deixa para lá
items.stones.stoneofaugmentation$wndaugment.choice=O que você gostaria de melhorar?
items.stones.stoneofaugmentation$wndaugment.damage=Dano
items.stones.stoneofaugmentation$wndaugment.defense=Defesa
items.stones.stoneofaugmentation$wndaugment.evasion=Evasão
items.stones.stoneofaugmentation$wndaugment.none=Remover Aumento
items.stones.stoneofaugmentation$wndaugment.speed=Velocidade
items.stones.stoneofaugmentation.desc=Esta runa possui uma magia poderosa que pode aprimorar equipamentos, melhorando uma propriedade em detrimento de outra. Usá-la em uma arma permitirá aumentar a velocidade ou o dano. Armas arremessáveis também ganharão ou perderão durabilidade proporcionalmente à sua velocidade. Usá-la em uma armadura permitirá aumentar a defesa ou a evasão.
items.stones.stoneofaugmentation.discover_hint=Você pode comprar este item em uma loja ou criá-lo através da alquimia.
items.stones.stoneofaugmentation.inv_title=Aumentar um item
items.stones.stoneofaugmentation.name=pedra de aumento
items.stones.stoneofblast.desc=Esta runa explodirá instantaneamente no local onde for lançada. Assim como uma bomba, a explosão causará dano a tudo que estiver por perto.
items.stones.stoneofblast.name=pedra de explosão
items.stones.stoneofblink.desc=Esta runa teletransportará o usuário para o local para onde for lançada.
items.stones.stoneofblink.name=pedra do piscar
items.stones.stoneofclairvoyance.desc=Esta pedra revelará instantaneamente todos os azulejos em uma área muito ampla ao redor de onde for lançada. Seu efeito se estenderá até mesmo através das paredes.
items.stones.stoneofclairvoyance.name=pedra da clarividência
items.stones.stoneofdeepsleep.desc=Quando esta pedra for atirada contra um inimigo, ela o fará cair num sono mágico profundo. Inimigos adormecidos magicamente dormirão para sempre até serem perturbados.
items.stones.stoneofdeepsleep.name=pedra do sono profundo
items.stones.stoneofdetectmagic.desc=Esta runa é capaz de detectar a magia que afeta um item. Usá-la em um item não identificado revelará se ele está afetado por uma maldição maligna e se está sob o efeito de magia positiva, como encantamentos ou melhorias.
items.stones.stoneofdetectmagic.detected_bad=Você detectou magia malévola afetando este item!
items.stones.stoneofdetectmagic.detected_both=Você detecta efeitos mágicos tanto positivos quanto negativos neste item!
items.stones.stoneofdetectmagic.detected_good=Você detecta uma influência mágica positiva sobre este objeto!
items.stones.stoneofdetectmagic.detected_none=Você não detectou nenhum efeito mágico sobre este item.
items.stones.stoneofdetectmagic.inv_title=Detectar um item
items.stones.stoneofdetectmagic.name=pedra de detecção mágica
items.stones.stoneofdisarming.desc=Esta runa contém magia capaz de desativar armadilhas maliciosas escondidas por toda a masmorra. Ela desarmará até 9 armadilhas na área onde for lançada.
items.stones.stoneofdisarming.name=pedra de desarmamento
items.stones.stoneofenchantment.armor=Sua armadura brilha na escuridão!
items.stones.stoneofenchantment.desc=Esta runa possui magia de encantamento. Ao contrário de um pergaminho de aprimoramento, ela não aumentará o poder direto de um item, mas imbuirá uma arma ou armadura com um encantamento, concedendo-lhe um novo poder.
items.stones.stoneofenchantment.inv_title=Encantar um item
items.stones.stoneofenchantment.name=pedra de encantamento
items.stones.stoneofenchantment.weapon=Sua arma brilha no escuro!
items.stones.stoneoffear.desc=Quando esta pedra for atirada em um personagem, ele ficará tomado de terror e fugirá. Atacar um personagem em fuga reduzirá a duração do efeito.
items.stones.stoneoffear.name=pedra do medo
items.stones.stoneofflock.desc=Esta pedra rúnica invoca ovelhas mágicas por um curto período de tempo ao redor do local onde for lançada.
items.stones.stoneofflock.name=pedra do rebanho
items.stones.stoneofintuition$wndguess.break=Sua pedra da intuição se desfaz em pó...
items.stones.stoneofintuition$wndguess.correct=Correto. O tipo do item foi identificado!
items.stones.stoneofintuition$wndguess.incorrect=Seu palpite estava incorreto.
items.stones.stoneofintuition$wndguess.text=Tente adivinhar o tipo do item não identificado. Se você acertar, o tipo será identificado!
items.stones.stoneofintuition.break_info=Você pode usar as pedras da intuição duas vezes antes que uma se quebre; seu próximo uso não consumirá uma pedra.
items.stones.stoneofintuition.break_warn=Você já usou uma pedra da intuição anteriormente, então _seu próximo uso consumirá uma pedra_.
items.stones.stoneofintuition.desc=Esta runa contém uma versão mais fraca da magia encontrada nos pergaminhos de identificação. Em vez de identificar diretamente um item, ela atuará sobre sua intuição, permitindo que você tente identificar o tipo de uma poção, pergaminho ou anel por meio de palpites.
items.stones.stoneofintuition.inv_title=Selecione um item
items.stones.stoneofintuition.name=pedra da intuição
items.stones.stoneofshock.desc=Esta runa libera uma explosão de energia elétrica que atordoa brevemente todos os alvos próximos e concede ao lançador uma carga de varinha para cada alvo atingido.
items.stones.stoneofshock.name=pedra de choque
items.stylus.ac_inscribe=INSCREVER
items.stylus.cursed=A magia da caneta não funcionará em armaduras amaldiçoadas.
items.stylus.desc=Este estilete arcano é feito de uma pedra escura e muito dura. Usando-o, você pode inscrever um glifo mágico em sua armadura, mas não tem poder para escolher qual glifo será; o estilete decidirá por você.
items.stylus.identify=Primeiro você precisa identificar se essa armadura está amaldiçoada.
items.stylus.inscribed=Você gravou sua armadura com a caneta.
items.stylus.name=caneta arcana
items.stylus.prompt=Selecione uma armadura
items.tengusmask.ac_wear=VESTIR
items.tengusmask.desc=Esta máscara caiu do rosto de Tengu quando ele morreu, e você pode sentir um grande poder mágico emanando dela. Seria a máscara a fonte de força de Tengu? Ao usá-la, o tremendo poder da máscara será transferido para você, permitindo que você escolha uma subclasse para o seu herói. Qual subclasse você escolherá?
items.tengusmask.discover_hint=Você pode obter este item como recompensa ao derrotar certos inimigos.
items.tengusmask.name=Máscara de Tengu
items.tengusmask.used=A máscara se desintegra à medida que seu poder flui para dentro de você!
items.torch.ac_light=LUZ
items.torch.desc=Item essencial para aventureiros, quando uma masmorra fica escura, uma tocha pode ajudar a iluminar o caminho.
items.torch.name=tocha
items.trinkets.chaoticcenser.desc=Após algum tempo no caldeirão de alquimia, este incensário parece produzir fumaça por conta própria! Esses gases se acumulam e são expelidos do incensário em direção aos inimigos em intervalos quase aleatórios. Ele parece capaz de produzir todos os tipos de gases, mas você terá um breve aviso antes que o incensário seja ativado.
items.trinkets.chaoticcenser.name=incensário caótico
items.trinkets.chaoticcenser.spew=Seu incensário está prestes a expelir: %s.
items.trinkets.chaoticcenser.stats_desc=No nível atual, este item gera um gás nocivo perto de um inimigo aproximadamente a cada _%d_ turnos. Os gases só aparecem quando há inimigos presentes. Em níveis mais altos, esses gases têm maior probabilidade de serem exóticos e poderosos.
items.trinkets.chaoticcenser.typical_stats_desc=Normalmente, este amuleto gera um gás nocivo perto de um inimigo a cada _%d_ turnos aproximadamente. Os gases só aparecem quando há inimigos presentes. Em níveis mais altos, esses gases têm maior probabilidade de serem exóticos e poderosos.
items.trinkets.crackedspyglass.desc=Este telescópio de mão seria uma demonstração de grande e preciso trabalho artesanal, não fosse a rachadura em sua lente frontal. A luneta parece estar ajudando você a revelar novos itens na masmorra, mas devido à sua falha, os itens revelados são bem difíceis de enxergar!
items.trinkets.crackedspyglass.name=luneta rachada
items.trinkets.crackedspyglass.stats_desc=No nível atual, este objeto tem uma chance de _%1$s%%_ de criar um item oculto extra em cada andar que não seja de chefe.
items.trinkets.crackedspyglass.stats_desc_upgraded=No nível atual, este objeto tem _100%% de chance_ de criar um item oculto extra em cada andar que não seja de chefe, e _%1$s%% de chance_ de criar um segundo item oculto extra.
items.trinkets.crackedspyglass.typical_stats_desc=Normalmente, este objeto tem uma chance de _%1$s%%_ de criar um item oculto extra em cada andar que não seja de chefe.
items.trinkets.dimensionalsundial.desc=Este pequeno relógio de sol portátil consegue, de alguma forma, projetar uma sombra nas profundezas da masmorra, mesmo que não esteja na vertical. Mais estranho ainda, a posição da sombra parece não ter nenhuma relação com o sol neste mundo. Quando não projeta sombra, o relógio de sol parece atrair perigo.
items.trinkets.dimensionalsundial.name=relógio de sol dimensional
items.trinkets.dimensionalsundial.stats_desc=Em seu nível atual, este item reduzirá a taxa de surgimento de inimigos em _%1$d%%_ durante o dia (das 8h às 20h) e aumentará a taxa de surgimento de inimigos em _%2$d%%_ durante a noite (das 20h às 8h).
items.trinkets.dimensionalsundial.typical_stats_desc=Normalmente, este amuleto reduzirá a taxa de surgimento de inimigos em _%1$d%%_ durante o dia (das 8h às 20h) e aumentará a taxa de surgimento de inimigos em _%2$d%%_ à noite (das 20h às 8h).
items.trinkets.dimensionalsundial.warning=Seu relógio de sol não está projetando sombra, e você se sente inquieto.
items.trinkets.exoticcrystals.desc=Esses pequenos cristais rosa têm a mesma forma que os cristais de energia alquímica. Embora não possam ser usados diretamente para gerar energia, parecem influenciar de alguma forma as poções e os pergaminhos que você encontra.
items.trinkets.exoticcrystals.name=cristais exóticos
items.trinkets.exoticcrystals.stats_desc=No nível atual, este item substituirá _%s%%_ de poções ou pergaminhos obtidos como recompensa por seus equivalentes exóticos. Isso não afeta poções de força, pergaminhos de aprimoramento ou itens gerados para ajudar a resolver salas de perigo.
items.trinkets.exoticcrystals.typical_stats_desc=Normalmente, este item substituirá _%s%%_ de poções ou pergaminhos obtidos como recompensa por seus equivalentes exóticos. Isso não afeta poções de força, pergaminhos de aprimoramento ou itens gerados para ajudar a resolver salas de perigo.
items.trinkets.eyeofnewt.desc=Este olho de tritão dourado e preto é um ingrediente comum, agora transformado em um objeto decorativo. O olho parece reduzir sua visão em troca de permitir que você veja as coisas de outras maneiras.
items.trinkets.eyeofnewt.name=olho de tritão
items.trinkets.eyeofnewt.stats_desc=No seu nível atual, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental sobre inimigos dentro de _%2$d_ quadrados.
items.trinkets.eyeofnewt.typical_stats_desc=Normalmente, este acessório reduzirá seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental sobre inimigos dentro de _%2$d_ quadrados.
items.trinkets.ferrettuft.desc=Um tufo de pelo branco e sedoso de furão, preso por uma fita verde-limão amarrada em forma de laço. Os furões são conhecidos por sua agilidade, travessuras e falta de integridade. Parte desse poder parece emanar do enfeite, aumentando a capacidade de evasão de qualquer coisa por perto.
items.trinkets.ferrettuft.name=tufo de furão
items.trinkets.ferrettuft.stats_desc=No seu nível atual, este item aumentará a evasão de todos os personagens em _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Normalmente, este item aumentará a evasão de todos os personagens em _%1$s%%_.
items.trinkets.mimictooth.desc=Este dente grande e afiado deve ter sido arrancado de um imitador muito infeliz. Parece estar influenciando os imitadores da masmorra, tornando-os mais frequentes e perigosos.
items.trinkets.mimictooth.name=imitar dente
items.trinkets.mimictooth.stats_desc=No nível atual, este amuleto tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumentará a quantidade de itens que eles deixam cair. Cada andar da masmorra também terá uma chance _%2$s%%_ de conter um mímico de ébano furtivo extra.
items.trinkets.mimictooth.typical_stats_desc=Normalmente, este amuleto tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detectar, mas também aumentará a quantidade de itens que eles deixam cair. Cada andar da masmorra também terá uma chance _%2$s%%_ de conter um mímico de ébano furtivo extra.
items.trinkets.mossyclump.desc=Este aglomerado de musgo úmido parece reter a umidade, não importa o quanto você o aperte. Parece estar magicamente ligado à própria masmorra, fazendo com que grama e água apareçam com mais frequência.
items.trinkets.mossyclump.name=tufo de musgo
items.trinkets.mossyclump.stats_desc=No nível atual, este item fará com que _%d%%_ dos pisos sem tema se preencham com água ou grama.\n\nEste item custa uma quantidade maior de energia para ser aprimorado.
items.trinkets.mossyclump.typical_stats_desc=Normalmente, este item fará com que _%d%%_ pisos sem tema fiquem cheios de água ou grama.\n\nEste item custa uma quantidade maior de energia para ser aprimorado.
items.trinkets.parchmentscrap.desc=Este pequeno pedaço de pergaminho parece ter vindo de um rolo. Ele reteve parte de sua magia e parece estar influenciando as armas e armaduras encontradas na masmorra.
items.trinkets.parchmentscrap.name=pedaço de pergaminho
items.trinkets.parchmentscrap.stats_desc=No nível atual, este amuleto tornará encantamentos e glifos _%dx_ comuns, e maldições em armas e armaduras _%sx_ comuns. Maldições em varinhas, anéis ou artefatos não são afetadas. Este amuleto custa uma quantidade maior de energia para ser aprimorado.
items.trinkets.parchmentscrap.typical_stats_desc=Normalmente, este amuleto tornará encantamentos e glifos _%dx_ comuns, e maldições em armas e armaduras _%sx_ comuns. Maldições em varinhas, anéis ou artefatos não são afetadas. \n\n Este amuleto custa uma quantidade maior de energia para ser aprimorado.
items.trinkets.petrifiedseed.desc=Esta semente foi fossilizada, seja por lentos processos geológicos ou por magia. A semente parece estar influenciando magicamente a flora da masmorra, ocasionalmente substituindo sementes de plantas por runas.
items.trinkets.petrifiedseed.name=semente petrificada
items.trinkets.petrifiedseed.stats_desc=No seu nível atual, este trinket fará com que a grama pisoteada deixe cair runas em vez de sementes _%1$s%%_ da maioria das vezes, e também fará com que a grama alta deixe cair itens _%2$s%%_ com mais frequência.
items.trinkets.petrifiedseed.typical_stats_desc=Normalmente, este amuleto fará com que a grama pisoteada deixe cair runas em vez de sementes _%1$s%%_ da maioria das vezes, e também fará com que a grama alta deixe cair itens _%2$s%%_ com mais frequência.
items.trinkets.ratskull.desc=Este objeto macabro não é muito maior que o crânio de um rato comum, que, por algum motivo, é uma raridade nesta masmorra. A influência mágica do crânio parece atrair os habitantes mais raros da masmorra, fazendo com que apareçam com muito mais frequência.
items.trinkets.ratskull.name=crânio de rato
items.trinkets.ratskull.stats_desc=No nível atual, este amuleto fará com que inimigos exóticos raros _%dx_ tenham a mesma probabilidade de aparecer. No entanto, o crânio é apenas metade tão eficaz em atrair mímicos de cristal e estátuas blindadas.
items.trinkets.ratskull.typical_stats_desc=Normalmente, este amuleto fará com que inimigos exóticos raros _%dx_ tenham a mesma probabilidade de aparecer. No entanto, o crânio é apenas metade tão eficaz para atrair mímicos de cristal e estátuas blindadas.
items.trinkets.saltcube.desc=Este grande cristal de sal foi cortado em um formato cúbico quase perfeito e, de alguma forma, conseguiu drenar metade da água do caldeirão de alquimia em vez de se dissolver. Parece estar magicamente desidratando e preservando os alimentos que você ingere, prolongando a sensação de saciedade, mas também diminuindo a recuperação da sua saúde quando você não está em estado de inanição.
items.trinkets.saltcube.name=cubo de sal
items.trinkets.saltcube.stats_desc=No nível atual, este item aumentará o tempo antes que você sinta fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de saúde em _%2$s%%_, a menos que o chão esteja trancado.
items.trinkets.saltcube.typical_stats_desc=Normalmente, este item aumentará o tempo antes de você sentir fome em _%1$s%%_, mas também reduzirá sua taxa de regeneração de saúde em _%2$s%%_, a menos que o chão esteja trancado.
items.trinkets.shardofoblivion$thrownusetracker.desc=Você usou recentemente uma arma de arremesso não identificada, que conta como um item de equipamento não identificado usado para o fragmento do esquecimento por um curto período. \n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Arma de arremesso não identificada utilizada
items.trinkets.shardofoblivion$wandusetracker.desc=Você usou recentemente uma varinha não identificada, que conta como um item de equipamento não identificado usado para o fragmento do esquecimento por um curto período. \n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Varinha não identificada utilizada
items.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.trinkets.shardofoblivion.desc=Após ser fervido no caldeirão de alquimia, este pequeno fragmento de metal amaldiçoado se transformou em... nada? A luz parece se curvar ao seu redor, e ele paira no ar quando você não o está segurando. O fragmento parece estar absorvendo poder magicamente da sua ignorância, então é melhor não pensar muito nisso.
items.trinkets.shardofoblivion.identify=Você identifica o item!
items.trinkets.shardofoblivion.identify_not_yet=Esse item ainda não está pronto para ser identificado.
items.trinkets.shardofoblivion.identify_prompt=Identifique um item
items.trinkets.shardofoblivion.identify_ready=Um item está pronto para ser identificado: %s. Use seu Fragmento do Esquecimento para identificá-lo.
items.trinkets.shardofoblivion.identify_ready_worn=Seus itens desgastados agora estão prontos para serem identificados. Use seu Fragmento do Esquecimento nos itens para identificá-los.
items.trinkets.shardofoblivion.name=fragmento do esquecimento
items.trinkets.shardofoblivion.stats_desc=No nível atual, este trinket aumentará a taxa de drop de itens dos inimigos em 20%% para cada peça de equipamento não identificado que você tenha equipado ou usado recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente itens que estejam prontos para serem identificados.
items.trinkets.shardofoblivion.typical_stats_desc=Normalmente, este trinket aumentará a taxa de drop de itens dos inimigos em 20%% para cada peça de equipamento não identificado que você tenha equipado ou usado recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que você identifique equipamentos, mas pode ser usado para identificar manualmente itens que estejam prontos para serem identificados.
items.trinkets.thirteenleafclover.desc=De alguma forma, o cozimento no caldeirão de alquimia fez com que este trevo criasse um monte de folhas extras! Não está muito claro se este objeto traz sorte ou azar; talvez ele torne sua sorte ainda mais caótica?
items.trinkets.thirteenleafclover.name=trevo de treze folhas
items.trinkets.thirteenleafclover.stats_desc=No seu nível atual, este trinket fará com que você cause dano máximo _%1$d%%_ do tempo, e dano mínimo _%2$d%%_ do tempo.
items.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, este trinket fará com que você cause dano máximo _%1$d%%_ do tempo, e dano mínimo _%2$d%%_ do tempo.
items.trinkets.trapmechanism.desc=O mecanismo central de uma das armadilhas de queda da masmorra, cuidadosamente esculpido no chão para que possa ser carregado. Parece estar magicamente ligado à própria masmorra, tornando o terreno perigoso mais comum, mas também aumentando sua afinidade com ele.
items.trinkets.trapmechanism.name=mecanismo de armadilha
items.trinkets.trapmechanism.stats_desc=No nível atual, este item fará com que _%1$d%%_ dos andares sem tema se tornem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra se tornarão visíveis.
items.trinkets.trapmechanism.typical_stats_desc=Normalmente, este amuleto fará com que _%1$d%%_ dos andares sem tema se tornem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra se tornarão visíveis.
items.trinkets.trinket$placeholder.name=bugiganga
items.trinkets.trinket.discover_hint=Este item tem uma chance de ser uma opção sempre que você criar um objeto decorativo através da alquimia.
items.trinkets.trinketcatalyst$randomtrinket.desc=Um item próximo está preso dentro de uma bolsa que você não consegue abrir. O processo de alquimia dissolverá a bolsa, mas você não saberá qual bugiganga obterá até que o faça!
items.trinkets.trinketcatalyst$randomtrinket.name=bugiganga aleatória
items.trinkets.trinketcatalyst.desc=Esta esfera de pó dourado mágico brilha na escuridão da masmorra. Este catalisador pode ser usado em um caldeirão de alquimia com um pouco de energia alquímica para produzir um item de bugiganga único. Os itens de bugiganga proporcionam diversos efeitos diferentes que alteram ligeiramente a masmorra ou seus habitantes. Os itens de bugiganga podem ser aprimorados com mais energia para tornar seu efeito mais poderoso ou descartados para que o efeito seja anulado completamente.
items.trinkets.trinketcatalyst.name=catalisador mágico
items.trinkets.trinketcatalyst.window_text=A água começa a brilhar ao adicionar o catalisador. Existem alguns objetos próximos que você pode imbuir de energia para transformá-los em um objeto mágico.
items.trinkets.trinketcatalyst.window_title=criar uma bugiganga
items.trinkets.vialofblood.desc=Este frasco fino contém o sangue de algum habitante da masmorra; ele se move lentamente conforme você gira o frasco. Parece potencializar magicamente os efeitos de cura, mas também retardá-los.
items.trinkets.vialofblood.name=frasco de sangue
items.trinkets.vialofblood.stats_desc=No nível atual, este item aumentará a saúde geral que você ganha ao beber poções de cura, cantis ou fontes de saúde em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (isso aumenta com o nível do herói).
items.trinkets.vialofblood.typical_stats_desc=Normalmente, este amuleto aumentará a saúde geral que você ganha ao beber poções de cura, cantis ou fontes de saúde em _%1$s%%_. No entanto, esses efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (isso aumenta com o nível do herói).
items.trinkets.wondrousresin.desc=Essa resina azul brilhante parece conter a essência destilada da magia de uma varinha amaldiçoada. A magia do caldeirão de alquimia parece tê-la estabilizado um pouco, e agora ela está afetando suas varinhas.
items.trinkets.wondrousresin.name=resina maravilhosa
items.trinkets.wondrousresin.stats_desc=No nível atual, este amuleto fará com que os efeitos de varinhas amaldiçoadas se tornem neutros ou positivos _%1$s%%_ da vez, e fará com que varinhas não amaldiçoadas disparem um raio amaldiçoado neutro ou positivo adicional _%2$s%%_ da vez.\n\nEste amuleto custa uma quantidade maior de energia para ser aprimorado.
items.trinkets.wondrousresin.typical_stats_desc=Normalmente, este amuleto forçará os efeitos de varinhas amaldiçoadas a se tornarem neutros ou positivos _%1$s%%_ da vez, e fará com que varinhas não amaldiçoadas disparem um raio amaldiçoado neutro ou positivo adicional _%2$s%%_ da vez.\n\nEste amuleto custa uma quantidade maior de energia para ser aprimorado.
items.wands.cursedwand.disguise=Sua aparência muda diante dos seus olhos!
items.wands.cursedwand.fire=Você sente cheiro de queimado...
items.wands.cursedwand.grass=A grama brota ao seu redor!
items.wands.cursedwand.gravity=De repente, a gravidade começa a puxar em direções aleatórias!
items.wands.cursedwand.gravity_end=O caos gravitacional chega ao fim.
items.wands.cursedwand.gravity_positive=De repente, a gravidade começa a puxar em direções aleatórias, mas isso não parece te afetar.
items.wands.cursedwand.mass_invuln=Uma luz brilhante irrompe da sua varinha!
items.wands.cursedwand.nothing=Nada acontece.
items.wands.cursedwand.ondeath=Você foi morto pelo seu próprio %s.
items.wands.cursedwand.petrify=De repente, você congela no lugar!
items.wands.cursedwand.sinkhole=O chão começa a ceder ao seu redor!
items.wands.cursedwand.sinkhole_positive=O chão começa a ceder, mas parece suficientemente firme sob você.
items.wands.cursedwand.supernova=Uma bola de energia flamejante começa a crescer. É melhor você correr!
items.wands.cursedwand.supernova_positive=Uma bola de energia flamejante começa a crescer, mas de alguma forma parece segura.
items.wands.cursedwand.transmogrify_other=Seu item se transforma em algo diferente!
items.wands.cursedwand.transmogrify_wand=Sua varinha se transforma em um item diferente!
items.wands.damagewand.upgrade_stat_name_1=Dano Mágico
items.wands.wand$placeholder.name=varinha
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Este %s está amaldiçoado!
items.wands.wand.cursed=Esta varinha é amaldiçoada, tornando sua magia caótica e aleatória.
items.wands.wand.fizzles=Sua varinha falha; provavelmente não tem carga suficiente.
items.wands.wand.identify=Você já está familiarizado o suficiente com sua varinha para identificá-la.
items.wands.wand.no_magic=Sua varinha falha; você não pode usar varinhas enquanto estiver imune à magia.
items.wands.wand.not_cursed=Esta varinha está livre de magia malévola.
items.wands.wand.prompt=Escolha um local para eletrocutar
items.wands.wand.resin_many=Esta varinha ganhou _%d níveis_ de resina arcana.
items.wands.wand.resin_one=Esta varinha ganhou _1 nível_ com resina arcana.
items.wands.wand.self_target=Você não pode se escolher como alvo!
items.wands.wandofblastwave.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo paralisado com um cajado de onda explosiva, ele consome a paralisia para causar uma explosão de dano mágico adicional. Isso possui um curto tempo de recarga por inimigo.
items.wands.wandofblastwave.desc=Esta varinha é feita de uma espécie de pedra marmorizada, com detalhes em ouro e uma gema preta redonda na ponta. Ela é bem pesada na mão.
items.wands.wandofblastwave.eleblast_desc=Uma explosão elemental com um cajado de onda de choque causa 67% de dano e arremessa todos os inimigos para fora da área de impacto.
items.wands.wandofblastwave.knockback_ondeath=A colisão te matou...
items.wands.wandofblastwave.name=varinha de onda de choque
items.wands.wandofblastwave.ondeath=Você se matou com sua própria Varinha de Onda de Choque...
items.wands.wandofblastwave.staff_name=equipe de onda de choque
items.wands.wandofblastwave.stats_desc=Esta varinha dispara um raio que detona violentamente no local alvo. A força dessa explosão causa dano de _%1$d a %2$d_ e é forte o suficiente para arremessar a maioria dos inimigos para longe.
items.wands.wandofblastwave.typical_stats_desc=Esta varinha dispara um raio que detona violentamente no local alvo. A força dessa explosão normalmente causa dano de _%1$d a %2$d_ e é forte o suficiente para arremessar a maioria dos inimigos para longe.
items.wands.wandofblastwave.upgrade_stat_name_2=Repulsão
items.wands.wandofcorrosion.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de corrosão, o inimigo tem uma chance de ficar coberto de gosma.
items.wands.wandofcorrosion.desc=Esta varinha tem um corpo acinzentado que se abre para revelar uma gema laranja brilhante.
items.wands.wandofcorrosion.eleblast_desc=Uma explosão elemental com um cajado de corrosão inflige corrosão aos inimigos por 4 turnos, começando com 6 de dano.
items.wands.wandofcorrosion.name=varinha de corrosão
items.wands.wandofcorrosion.staff_name=equipe de corrosão
items.wands.wandofcorrosion.stats_desc=Esta varinha dispara um raio que explode em uma nuvem de gás altamente corrosivo no local alvo. Qualquer coisa atingida por essa nuvem sofrerá dano crescente ao longo do tempo, começando com _%d de dano._
items.wands.wandofcorrosion.upgrade_stat_name_1=Danos por corrosão
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume de gás
items.wands.wandofcorruption.already_corrupted=Essa personagem não pode ser influenciada mais.
items.wands.wandofcorruption.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado da corrupção, o inimigo tem uma chance de ficar enlouquecido.
items.wands.wandofcorruption.desc=Esta varinha irradia uma energia escura e caótica, caso isso já não estivesse óbvio pela pequena caveira decorativa esculpida em sua ponta.
items.wands.wandofcorruption.eleblast_desc=Uma explosão elemental com um cajado da corrupção inflige aos inimigos 5 turnos de descontrole.
items.wands.wandofcorruption.name=varinha da corrupção
items.wands.wandofcorruption.staff_name=funcionários da corrupção
items.wands.wandofcorruption.stats_desc=Esta varinha liberará uma explosão de energia corruptora que enfraquecerá os inimigos e, eventualmente, os dobrará à sua vontade. Os inimigos podem resistir à corrupção, mas inimigos enfraquecidos são muito mais fáceis de corromper do que inimigos saudáveis.
items.wands.wandofcorruption.upgrade_stat_name_1=Poder Corruptor
items.wands.wandofcorruption.upgrade_stat_name_2=Duração do efeito negativo
items.wands.wandofdisintegration.bmage_desc=Quando empunhado pelo _Mago de Batalha_, um cajado de desintegração tem seu alcance de ataque aumentado, como se possuísse um encantamento de projeção.
items.wands.wandofdisintegration.desc=Esta varinha é feita de um bloco sólido e liso de obsidiana, com uma profunda luz púrpura percorrendo sua lateral, terminando na ponta. Ela brilha com energia destrutiva, pronta para disparar.
items.wands.wandofdisintegration.eleblast_desc=Uma explosão elemental com um cajado de desintegração causa 100% de dano e atravessa paredes.
items.wands.wandofdisintegration.name=varinha de desintegração
items.wands.wandofdisintegration.staff_name=equipe de desintegração
items.wands.wandofdisintegration.stats_desc=Esta varinha dispara um raio que atravessa qualquer obstáculo e terá um alcance maior conforme for aprimorada. O raio causa dano de _%1$d a %2$d_ e também causará dano bônus para cada inimigo e parede que atravessar.
items.wands.wandofdisintegration.upgrade_stat_name_2=Alcance máximo
items.wands.wandoffireblast.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de explosão de fogo, há uma chance de produzir uma explosão que causa dano aos inimigos e consome todo o fogo próximo! Essa chance aumenta quanto mais fogo estiver adjacente ao inimigo.
items.wands.wandoffireblast.desc=Esta varinha é feita de madeira laqueada de vermelho com folhas de ouro aplicadas generosamente para lhe conferir um aspecto bastante régio. Ela crepita e chia na ponta, ansiosa para liberar sua poderosa magia.
items.wands.wandoffireblast.eleblast_desc=Uma explosão elemental com um cajado de fogo causa 100% de dano, arromba portas e incendeia inimigos e o terreno.
items.wands.wandoffireblast.name=varinha de rajada de fogo
items.wands.wandoffireblast.staff_name=equipe de explosão de fogo
items.wands.wandoffireblast.stats_desc=Esta varinha dispara um cone de fogo quando usada. Seu próximo ataque consumirá _%1$d cargas_ e causará _%2$d-%3$d de dano_. Quanto mais cargas a varinha usar, maior e mais forte será o efeito.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Dano de Carga
items.wands.wandoffireblast.upgrade_stat_name_2=2 Dano de Carga
items.wands.wandoffireblast.upgrade_stat_name_3=3 Dano de Carga
items.wands.wandoffrost.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo congelado com um cajado de gelo, ele tem uma chance de congelá-lo instantaneamente. Essa chance aumenta quanto mais congelado ele estiver.
items.wands.wandoffrost.desc=Esta varinha parece ser feita de algum tipo de gelo mágico. Ela brilha cada vez mais em direção à sua ponta arredondada. É muito fria ao toque, mas, de alguma forma, a mão permanece aquecida.
items.wands.wandoffrost.eleblast_desc=Uma explosão elemental com um cajado de gelo causa 100% de dano, congela os inimigos e apaga incêndios.
items.wands.wandoffrost.name=varinha de gelo
items.wands.wandoffrost.staff_name=cajado de geada
items.wands.wandoffrost.stats_desc=Esta varinha dispara rajadas de energia gélida contra seus inimigos, causando dano de _%1$d-%2$d_ e congelando-os. O efeito parece ser mais forte na água. Inimigos já congelados ou resfriados sofrem menos dano desta varinha.
items.wands.wandoffrost.upgrade_stat_name_2=Duração do resfriamento
items.wands.wandoflightning$lightningcharge.desc=O Mago de Batalha está atualmente carregado de energia, o que lhe concede imunidade ao seu cajado de relâmpagos e aumenta o alcance dos raios que podem ser emitidos por ele.\n\nTurnos restantes: %s.
items.wands.wandoflightning$lightningcharge.name=Carregado eletricamente
items.wands.wandoflightning.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de relâmpagos, ele tem uma chance de se carregar eletricamente por 10 turnos. Enquanto estiver carregado, o Mago de Batalha é imune a dano de relâmpago e poderá lançar raios ainda mais longe.
items.wands.wandoflightning.desc=Esta varinha é feita de metal maciço, o que a torna surpreendentemente pesada. Duas pontas curvam-se juntas na extremidade, e arcos elétricos se formam entre elas.
items.wands.wandoflightning.eleblast_desc=Uma explosão elemental com um cajado de relâmpago causa 100% de dano, atordoa os inimigos por 5 turnos e eletrifica a água.
items.wands.wandoflightning.name=varinha de relâmpago
items.wands.wandoflightning.ondeath=Você se matou com sua própria Varinha de Relâmpagos...
items.wands.wandoflightning.staff_name=cajado do relâmpago
items.wands.wandoflightning.stats_desc=Esta varinha emite raios poderosos que atravessam qualquer alvo, causando dano de _%1$d-%2$d_. Essa eletricidade se propaga para personagens próximos e se espalha mais facilmente na água. Os raios desta varinha podem causar dano a você, mas não a seus aliados.
items.wands.wandoflivingearth$earthguardian.desc=As rochas da sua varinha de terra viva se transformaram em um guardião rochoso protetor! Este protetor rochoso atacará os inimigos próximos, forçando-os a atacar o guardião em vez de você. Quando todas as ameaças próximas forem eliminadas, o guardião se reformará ao seu redor e retornará quando você usar sua varinha novamente.
items.wands.wandoflivingearth$earthguardian.discover_hint=Você pode encontrar esse personagem com uma varinha específica.
items.wands.wandoflivingearth$earthguardian.name=guardião da terra
items.wands.wandoflivingearth$earthguardian.wand_info=O poder defensivo do guardião está ligado ao nível da sua varinha. Atualmente, ele bloqueia dano de _%1$d a %2$d._
items.wands.wandoflivingearth$rockarmor.desc=Rochas mágicas cercam seu corpo; quando você for atacado, elas tentarão bloquear o ataque e reduzirão o dano recebido em 50%%. Cada dano bloqueado, no entanto, remove um pouco da rocha.\n\nArmadura restante: %1$d.\n\nSe rochas suficientes se acumularem ao seu redor, o próximo ataque de sua varinha de terra viva fará com que as rochas se unam em um guardião que lutará ao seu lado.\n\nArmadura necessária para o Guardião: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Este guardião da terra também está se beneficiando do Poder de Muitos. Turnos restantes: %d.
items.wands.wandoflivingearth$rockarmor.name=armadura de rocha
items.wands.wandoflivingearth.bmage_desc=Quando o _Mago de Batalha_ ataca um inimigo com um cajado de terra viva, parte do dano causado é refletido como armadura de pedra.
items.wands.wandoflivingearth.desc=Esta varinha é feita de uma rocha curiosa, com faixas de energia amarela brilhante. As rochas parecem se mover ligeiramente quando você segura a varinha, como se pudessem sentir sua mão.
items.wands.wandoflivingearth.eleblast_desc=Uma explosão elemental com um cajado de terra viva causa 50% de dano e cura um guardião da terra ativo para cada inimigo atingido.
items.wands.wandoflivingearth.name=varinha da terra viva
items.wands.wandoflivingearth.staff_name=equipe da terra viva
items.wands.wandoflivingearth.stats_desc=Esta varinha dispara projéteis de rocha mágica contra os inimigos, causando dano de _%1$d a %2$d_. As rochas se reformarão ao redor do usuário, concedendo-lhe armadura proporcional ao dano causado. Se armadura suficiente for acumulada, ela se transformará em um guardião de rocha quando a varinha for usada novamente.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardião HP Máximo
items.wands.wandoflivingearth.upgrade_stat_name_3=Bloqueio do Guardião
items.wands.wandofmagicmissile$magiccharge.desc=Sua varinha de míssil mágico recarregou suas varinhas, aumentando o nível efetivo do próximo raio que elas lançarem. Suas varinhas foram aprimoradas para: +ZXQPH0. Turnos de carga mágica restantes: ZXQPH1.
items.wands.wandofmagicmissile$magiccharge.name=carga mágica
items.wands.wandofmagicmissile.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de mísseis mágicos, todas as suas varinhas ganharão carga, além do cajado.
items.wands.wandofmagicmissile.desc=Esta varinha bastante simples lança mísseis de pura energia mágica. Embora a varinha em si não possua efeitos especiais, ela tem mais cargas disponíveis e pode fortalecer brevemente outras varinhas quando aprimorada.
items.wands.wandofmagicmissile.discover_hint=Um dos heróis começa com este item.
items.wands.wandofmagicmissile.eleblast_desc=Uma explosão elemental com um cajado de mísseis mágicos causa 50% de dano e concede ao mago 15 turnos de recarga.
items.wands.wandofmagicmissile.name=varinha de míssil mágico
items.wands.wandofmagicmissile.staff_name=cajado de mísseis mágicos
items.wands.wandofmagicmissile.stats_desc=Cada raio disparado por esta varinha causa dano de _%1$d-%2$d_ e, se estiver aprimorada, fortalecerá brevemente outras varinhas.
items.wands.wandofprismaticlight.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de luz prismática, ele ficará incapacitado por um período que varia de acordo com o nível do cajado.
items.wands.wandofprismaticlight.desc=Esta varinha é feita de um único pedaço sólido de cristal translúcido, como um longo bloco de vidro liso. Pequenos fragmentos de luz colorida dançam ao redor da ponta da varinha, ansiosos para explodir.
items.wands.wandofprismaticlight.eleblast_desc=Uma explosão elemental com um cajado de luz prismática causa 67% de dano, revela todo o terreno na área da explosão e cega os inimigos por 5 turnos.
items.wands.wandofprismaticlight.name=varinha de luz prismática
items.wands.wandofprismaticlight.staff_name=bastão de luz prismática
items.wands.wandofprismaticlight.stats_desc=Esta varinha dispara raios de luz que cortam a escuridão da masmorra, revelando áreas ocultas e armadilhas. O feixe pode cegar inimigos e causa dano de _%1$d a %2$d_. Inimigos demoníacos e mortos-vivos queimarão na luz intensa da varinha, sofrendo dano bônus.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Acaso cego
items.wands.wandofprismaticlight.upgrade_stat_name_3=Duração da luz
items.wands.wandofregrowth$dewcatcher.desc=As plantas do gênero <i>Cata-orvalho</i> são maravilhosas por se encherem de orvalho mágico. Elas tentam se camuflar como grama para evitar chamar a atenção, mas seus aglomerados de orvalho as denunciam.
items.wands.wandofregrowth$dewcatcher.discover_hint=Você pode encontrar essa planta com uma varinha específica.
items.wands.wandofregrowth$dewcatcher.name=Coletor de orvalho
items.wands.wandofregrowth$lotus.desc=O lótus dourado é uma planta mística que só pode ser conjurada por uma poderosa varinha de regeneração. Sua aura potencializa todas as plantas e seus efeitos, mas consome sua energia rapidamente e morre em pouco tempo.
items.wands.wandofregrowth$lotus.discover_hint=Você pode encontrar essa planta com uma varinha específica, após aprimorá-la diversas vezes.
items.wands.wandofregrowth$lotus.name=Lótus Dourado
items.wands.wandofregrowth$lotus.wand_info=Este lótus foi produzido por uma varinha de regeneração. Todas as plantas sob seu efeito serão ativadas instantaneamente se plantadas em um personagem. As plantas também terão uma chance de soltar suas sementes, e dardos com ponta usarão menos durabilidade.
items.wands.wandofregrowth$seedpod.desc=As vagens de sementes são plantas mágicas que produzem sementes de outros tipos de plantas, em vez de sementes próprias. De alguma forma, elas conseguem se espalhar apesar de não terem sementes próprias.
items.wands.wandofregrowth$seedpod.discover_hint=Você pode encontrar essa planta com uma varinha específica.
items.wands.wandofregrowth$seedpod.name=Vagem de sementes
items.wands.wandofregrowth.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de regeneração, e ambos estiverem em pé sobre grama, ele receberá cura herbal proporcional ao dano causado.
items.wands.wandofregrowth.degradation=Após mais _%d cargas_, esta varinha começará a falhar na produção de plantas e grama fresca. Esse limite aumenta ao subir de nível ou aprimorar a varinha.
items.wands.wandofregrowth.desc=Esta varinha é feita de uma fina haste de madeira habilmente esculpida. De alguma forma, ela ainda está viva e vibrante, de um verde brilhante como o cerne de uma árvore jovem. "Quando a vida cessa, uma nova vida sempre começa a crescer... O ciclo eterno permanece!"
items.wands.wandofregrowth.eleblast_desc=Uma explosão elemental com um cajado de regeneração cria raízes nos inimigos e faz crescer grama aleatoriamente na área da explosão.
items.wands.wandofregrowth.name=varinha de regeneração
items.wands.wandofregrowth.staff_name=equipe de regeneração
items.wands.wandofregrowth.stats_desc=Ao ser usada, esta varinha lançará energia mágica de regeneração em um cone, fazendo com que grama, raízes e plantas raras brotem. Seu próximo disparo consumirá _%1$d cargas_. Quanto mais cargas a varinha usar, maior e mais forte será o efeito.
items.wands.wandofregrowth.upgrade_stat_name_1=Grama por carga
items.wands.wandofregrowth.upgrade_stat_name_2=Limite total de grama
items.wands.wandoftransfusion.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo enfeitiçado com um cajado de transfusão, ele ganhará um escudo e seu próximo ataque com o cajado não custará nenhum ponto de vida.
items.wands.wandoftransfusion.charged=Seus funcionários estão carregados com a energia vital de seus inimigos!
items.wands.wandoftransfusion.desc=Com um formato bastante simples, esta varinha destaca-se pela sua tonalidade magenta e pela gema preta na ponta.
items.wands.wandoftransfusion.eleblast_desc=Uma explosão elemental com um cajado de transfusão encanta inimigos, cura aliados e causa 100% de dano a inimigos mortos-vivos.
items.wands.wandoftransfusion.name=varinha de transfusão
items.wands.wandoftransfusion.ondeath=Você se matou com sua própria Varinha de Transfusão...
items.wands.wandoftransfusion.staff_name=equipe de transfusão
items.wands.wandoftransfusion.stats_desc=Quando usada em aliados ou inimigos enfeitiçados, esta varinha drenará _%1$d da saúde do usuário_ para curar ou proteger o aliado em _%2$d de saúde_. Quando usada em inimigos, a varinha os enfeitiça brevemente enquanto aplica _%3$d de proteção_ ao usuário. Mortos-vivos hostis sofrerão _%4$d-%5$d de dano_ em vez de serem enfeitiçados.
items.wands.wandoftransfusion.upgrade_stat_name_1=Cura Aliada
items.wands.wandoftransfusion.upgrade_stat_name_2=Autoproteção
items.wands.wandoftransfusion.upgrade_stat_name_3=Dano de Mortos-Vivos
items.wands.wandofwarding$ward.desc_1=Esta sentinela básica irá eletrocutar automaticamente qualquer inimigo que entrar em seu campo de visão, causando _%1$d-%2$d de dano._\n\nEletrocutar esta sentinela com sua varinha de proteção a aprimorará.\n\nEsta sentinela só eletrocutará uma vez antes de se dissipar.\n\nSua varinha de proteção está usando _%3$d de energia_ para manter esta sentinela.
items.wands.wandofwarding$ward.desc_2=Esta proteção aprimorada possui um padrão mais complexo e pode atacar várias vezes. Cada disparo desta proteção causará dano de _%1$d a %2$d_._\n\nAtacar esta proteção com sua varinha de proteção a aprimorará.\n\nEsta proteção disparará três vezes antes de se dissipar.\n\nSua varinha de proteção está usando _%3$d de energia_ para manter esta proteção.
items.wands.wandofwarding$ward.desc_3=Esta proteção totalmente aprimorada é capaz de atacar mais vezes do que suas antecessoras. Cada raio desta proteção causará _%1$d-%2$d de dano._\n\nUsar esta proteção com sua varinha de proteção a aprimorará.\n\nEsta proteção disparará cinco raios antes de se dissipar.\n\nSua varinha de proteção está usando _%3$d de energia_ para manter esta proteção.
items.wands.wandofwarding$ward.desc_4=Esta sentinela menor tem o mesmo poder de fogo que uma sentinela maior, mas possui vida em vez de um número fixo de cargas. Ela se assemelha à gema na ponta da sua varinha de proteção. Cada disparo desta sentinela causará dano de _%1$d a %2$d._\n\nDisparar esta sentinela com sua varinha de proteção a aprimorará e a curará.\n\nEsta sentinela gastará um pouco de vida cada vez que disparar contra um inimigo, mas pode ser curada usando sua varinha de proteção nela.\n\nSua varinha de proteção está usando _%3$d de energia_ para manter esta sentinela ativa.
items.wands.wandofwarding$ward.desc_5=Esta sentinela aprimorada é maior e mais resistente do que uma sentinela inferior. Cada disparo desta sentinela causará dano de _%1$d a %2$d._\n\nDisparar esta sentinela com sua varinha de proteção a aprimorará e a curará.\n\nEsta sentinela gastará um pouco de vida cada vez que disparar contra um inimigo, mas pode ser curada usando sua varinha de proteção nela.\n\nSua varinha de proteção está usando _%3$d de energia_ para manter esta sentinela ativa.
items.wands.wandofwarding$ward.desc_6=Esta sentinela totalmente aprimorada é significativamente mais resistente que suas antecessoras. Cada disparo desta sentinela causará dano de _%1$d a %2$d_. Usar sua varinha de proteção nesta sentinela a curará. Ela gastará um pouco de vida cada vez que atingir um inimigo, mas pode ser curada usando sua varinha de proteção nela. Sua varinha de proteção está usando _%3$d de energia_ para manter esta sentinela ativa.
items.wands.wandofwarding$ward.desc_generic_sentry=Esta sentinela tem o mesmo poder de fogo que uma proteção, mas possui vida em vez de um número fixo de cargas. Ela se assemelha à gema na ponta da sua varinha de proteção. Ao atingir esta sentinela com sua varinha de proteção, ela será aprimorada e curada. Esta sentinela gastará um pouco de vida cada vez que atingir um inimigo, mas pode ser curada ao usar sua varinha de proteção nela.
items.wands.wandofwarding$ward.desc_generic_ward=Esta sentinela irá eletrocutar automaticamente qualquer inimigo que entrar em seu campo de visão. Usar sua varinha de proteção nesta sentinela a aprimorará. As sentinelas têm um número limitado de eletrocutações antes de se dissiparem.
items.wands.wandofwarding$ward.discover_hint=Você pode encontrar esse personagem com uma varinha específica.
items.wands.wandofwarding$ward.dismiss_body=Você pode dissipar esta proteção se não quiser mais que sua varinha a mantenha. Fazer isso destrói a proteção imediatamente.
items.wands.wandofwarding$ward.dismiss_cancel=não
items.wands.wandofwarding$ward.dismiss_confirm=sim
items.wands.wandofwarding$ward.dismiss_title=Dispensar esta ala?
