items.weapon.missiles.darts.cleansingdart.desc=Essas flechas são revestidas com um composto à base de magia real que tornará os aliados temporariamente imunes a todos os efeitos negativos ou removerá os efeitos positivos dos inimigos. Os inimigos podem até se esquecer brevemente de que estão atacando ou fugindo de você. A flecha em si ainda é prejudicial aos inimigos, mas não afetará os aliados.
