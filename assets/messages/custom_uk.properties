custom.generated.a_rarer_brute_variant_that_fb9a3ede61=Рідкісний грубий варіант, який повністю спирається на захист, наступаючи, як стіна щитів, і вимагаючи набагато більше шкоди для чистого знищення.
custom.generated.a_rarer_elder_monk_whose_9280d315d0=Рідкісний старший чернець, чиї удари сильніші, ніж у стандартного печерного учня, і який може різко розпочати рукопашний бій.
