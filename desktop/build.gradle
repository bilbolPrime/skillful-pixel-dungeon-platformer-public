tasks.register('steamAppJar', Jar) {
    dependsOn desktopJarTask
    dependsOn coreJarTask

    archiveBaseName.set(steamJarBaseName)
    archiveVersion.set('')
    destinationDirectory.set(steamAppJarDir)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes('Main-Class': application.mainClass.get())
    }

    from({
        zipTree(desktopJarTask.get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from({
        zipTree(coreJarTask.get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'
}

tasks.register('syncSteamRuntimeLibs', Sync) {
    into(steamRuntimeLibsDir)
    from({
        steamRuntimeLibraries()
    })
}

tasks.register('writeSteamObfuscationConfig') {
    dependsOn(tasks.named('steamAppJar'))
    dependsOn(tasks.named('syncSteamRuntimeLibs'))

    inputs.file(tasks.named('steamAppJar').flatMap { it.archiveFile })
    inputs.files(configurations.runtimeClasspath)
    inputs.file(file('proguard-steam.pro'))
    outputs.file(steamObfuscationConfig)
    outputs.file(steamObfuscationMapping)

    doLast {
        List<File> libraryFiles = new ArrayList<>(steamRuntimeLibraries())
        libraryFiles.addAll(steamJavaRuntimeLibraries())
        if (libraryFiles.isEmpty()) {
            throw new GradleException('Steam obfuscation requires a full JDK with jmods or lib/rt.jar. Set JAVA_HOME or SKILLFUL_DESKTOP_DEBUG_JAVA_HOME to a full JDK installation.')
        }

        File configFile = steamObfuscationConfig.get().asFile
        configFile.parentFile.mkdirs()
        steamObfuscatedJar.get().asFile.parentFile.mkdirs()
        steamObfuscationMapping.get().asFile.parentFile.mkdirs()

        List<String> lines = []
        lines << "-injars ${quoteForProguard(tasks.named('steamAppJar').get().archiveFile.get().asFile)}"
        lines << "-outjars ${quoteForProguard(steamObfuscatedJar.get().asFile)}"
        lines << "-printmapping ${quoteForProguard(steamObfuscationMapping.get().asFile)}"

        libraryFiles.each { File dependency ->
            lines << "-libraryjars ${libraryEntryForProguard(dependency)}"
        }

        configFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}

tasks.register('obfuscateSteamAppJar', JavaExec) {
    dependsOn(tasks.named('writeSteamObfuscationConfig'))

    group = 'distribution'
    description = 'Obfuscates the desktop Steam application jar.'
    classpath = configurations.proguard
    mainClass = 'proguard.ProGuard'
    workingDir = project.projectDir

    args("@${project.relativePath(steamObfuscationConfig.get().asFile)}")
    args("@${project.relativePath(file('proguard-steam.pro'))}")
}

