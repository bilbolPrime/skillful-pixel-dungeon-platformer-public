plants.blandfruitbush$seed.name=semente de fruta insípida
plants.blandfruitbush.desc=Prima distante da podridão-da-fruta, a fruta em forma de pera do arbusto de fruta-bland tem gosto de poeira endurecida. A fruta é grosseira e insubstancial, mas não é venenosa. Talvez pudesse ser cozida.
plants.blandfruitbush.discover_hint=Você pode encontrar essa planta aleatoriamente na masmorra.
plants.blandfruitbush.name=fruta insípida
plants.blindweed$seed.name=semente de erva-cega
plants.blindweed.desc=Ao ser tocada, a planta-cega perece num clarão intenso. O clarão é forte o suficiente para desorientar por vários segundos.
plants.blindweed.name=erva-cega
plants.blindweed.warden_desc=_O Guardião_ canalizará a energia de uma erva-cega em um manto temporário de invisibilidade, em vez de ficar desorientado.
plants.earthroot$armor.desc=Uma espécie de armadura natural e imóvel feita de casca de árvore e corda. Esta armadura de ervas bloqueará o dano de qualquer golpe físico até que sua durabilidade acabe e ela se desfaça. Como a armadura é imóvel, qualquer movimento fará com que ela se quebre e se perca. Armadura restante:
plants.earthroot$armor.name=armadura de ervas
plants.earthroot$seed.name=semente de raiz da terra
plants.earthroot.desc=Quando uma criatura toca uma raiz terrestre, suas raízes criam uma espécie de armadura natural imóvel ao seu redor.
plants.earthroot.name=raiz da terra
plants.earthroot.warden_desc=As raízes de uma planta da família Heteropapiaceae se moverão com a Guardiã, fornecendo a ela uma armadura móvel de casca de árvore.
plants.fadeleaf$seed.name=semente de folha desbotada
plants.fadeleaf.desc=Ao tocar em uma folha desbotada, qualquer criatura será teleportada para um local aleatório no nível atual.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.warden_desc=O efeito de teletransporte da folha desbotada é mais potente para a Guardiã, teletransportando-a de volta para o final do nível anterior da masmorra.
plants.firebloom$seed.name=semente de flor de fogo
plants.firebloom.desc=Quando algo toca uma flor de fogo, explode em chamas.
plants.firebloom.name=flor de fogo
plants.firebloom.warden_desc=Quando ela pisa em uma flor de fogo, _a Guardiã_ será brevemente imbuída de chamas em vez de ser ferida.
plants.icecap$seed.name=semente da calota polar
plants.icecap.desc=Ao ser tocada, uma calota polar libera uma nuvem de pólen congelante. O efeito de congelamento é muito mais forte se o ambiente estiver úmido.
plants.icecap.name=calota polar
plants.icecap.warden_desc=Quando ela pisa em uma calota de gelo, _a Guardiã_ será brevemente imbuída de gelo em vez de ser ferida.
plants.mageroyal$seed.name=semente de mageroyal
plants.mageroyal.desc=As flores espinhosas do mageroyal contêm uma substância química conhecida por suas propriedades neutralizantes. Tudo o que entra em contato com essa planta é purificado de muitos efeitos negativos.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Você se sente revigorado.
plants.mageroyal.warden_desc=Além do efeito neutralizador, o Guardião ficará temporariamente imune a todos os efeitos de área ao pisar em mageroyal.
plants.plant$seed$placeholder.name=semente
plants.plant$seed.ac_plant=PLANTAR
plants.plant$seed.info=Lance esta semente no local onde você deseja que uma planta cresça.
plants.plant$seed.seed_of=semente de %s
plants.plant.discover_hint=Você pode encontrar essa planta aleatoriamente na masmorra ou cultivá-la a partir da semente associada.
plants.plant.warden_desc=Esta planta não possui nenhum efeito especial quando usada pelo Guarda.
plants.rotberry$seed.discover_hint=Você pode encontrar este item durante uma missão específica.
plants.rotberry$seed.name=semente de podridão
plants.rotberry.desc=Os frutos de um arbusto jovem de podridão têm um gosto doce e mortal. Ao longo de alguns anos, esse arbusto de podridão se transformará em outro foco de podridão. Quando pisoteado, um arbusto jovem de podridão libera uma pequena nuvem de gás tóxico.
plants.rotberry.discover_hint=Você pode cultivar essa planta a partir da semente associada durante uma missão específica.
plants.rotberry.name=rotberry
plants.rotberry.warden_desc=Normalmente, um arbusto de podridão produz apenas um pouco de gás quando pisoteado, mas a Guardiã é capaz de aproveitar a energia dele para aumentar temporariamente sua força!
plants.sorrowmoss$seed.name=semente de musgo da tristeza
plants.sorrowmoss.desc=A <i>Schizachyrium scoparium</i> é uma flor (não um musgo) com pétalas afiadas como navalhas, revestidas por um veneno mortal.
plants.sorrowmoss.name=musgo da tristeza
plants.sorrowmoss.warden_desc=Quando ela pisa em um musgo da tristeza, _o Guardião_ será brevemente imbuído de toxina em vez de ser ferido.
plants.starflower$seed.name=semente de flor-estrela
plants.starflower.desc=Diz-se que a flor-estrela, uma planta rara, concede poder sagrado a quem a toca.
plants.starflower.name=flor-estrela
plants.starflower.warden_desc=Além de ser abençoada, a Guardiã receberá uma quantidade significativa de recarga para sua varinha ao pisar em uma flor-estrela.
plants.stormvine$seed.name=semente de videira da tempestade
plants.stormvine.desc=A gravidade afeta a planta trepadeira de forma peculiar, permitindo que seus finos tentáculos azuis "flutuem" no ar. Qualquer coisa presa na trepadeira é afetada e fica desorientada.
plants.stormvine.name=tempestade
plants.stormvine.warden_desc=A Guardiã é capaz de controlar o efeito gravitacional da trepadeira da tempestade e levitará brevemente ao pisar em uma.
plants.sungrass$health.desc=A erva-de-sol possui excelentes propriedades curativas, embora seja muito mais lenta do que uma poção de cura. \n\nAfastar-se da planta interromperá o efeito de cura. \n\nCura restante: %d.
plants.sungrass$health.name=cura com ervas
plants.sungrass$seed.name=semente de capim-sol
plants.sungrass.desc=A erva-de-sol é conhecida pelas propriedades curativas lentas, porém eficazes, de sua seiva.
plants.sungrass.name=capim-sol
plants.sungrass.warden_desc=A Guardiã pode receber cura da grama-do-sol pisoteada mesmo que se afaste dela.
plants.swiftthistle$seed.name=semente de cardo-rápido
plants.swiftthistle$timebubble.desc=Uma pequena bolha de tempo acelerado, permitindo que ações sejam realizadas instantaneamente. Atacar ou usar magia quebrará esse efeito. \n\nTurnos restantes: %s.
plants.swiftthistle$timebubble.name=bolha temporal
plants.swiftthistle.desc=Ao ser pisoteado, o cardo-veloz acelera brevemente o fluxo do tempo ao seu redor, permitindo que quem o pisoteia realize diversas ações instantaneamente.
plants.swiftthistle.name=cardo-de-cauda-longa
plants.swiftthistle.warden_desc=Além de ganhar ações instantâneas, o Guardião também receberá um breve aumento de velocidade ao pisar em cardo-veloz.
