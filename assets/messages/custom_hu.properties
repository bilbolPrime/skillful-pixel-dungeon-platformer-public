custom.generated.wizards_master_the_arts_of_3efc4cde47=A varázslók mesterei a mágia művészetének. Fizikai erő és mozgékonyság terén gyengélkedik. Az ilyen készségek elsajátítása továbbra is lehetséges, de több erőfeszítést igényel.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=A vadásznők kiválóan teljesítenek a távolsági harcban és a mozgékonyságban. Íjakkal, lövésekkel és biztos túlélőeszközökkel irányítják a harcokat, de kevésbé érzik jól magukat a hosszan tartó közelharcokban.
