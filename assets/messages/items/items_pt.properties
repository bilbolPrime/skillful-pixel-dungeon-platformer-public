items.artifacts.etherealchains.rooted=Suas correntes não podem te puxar enquanto você estiver enraizado.
items.artifacts.holytome.ac_cast=ELENCO
items.artifacts.holytome.cursed=Você não pode usar um tomo amaldiçoado.
items.artifacts.holytome.desc=Um tomo sagrado que serve como foco para a magia divina do Clérigo. Usar o tomo permite ao Clérigo conjurar uma variedade de feitiços mágicos. O tomo se tornará progressivamente mais poderoso conforme o Clérigo o utiliza, concedendo-lhe mais cargas máximas e aumentando ligeiramente a velocidade de recarga.
