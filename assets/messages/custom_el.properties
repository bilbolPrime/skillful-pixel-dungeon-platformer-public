custom.theme.sewers.intro=Το Μπουντρούμι βρίσκεται ακριβώς κάτω από την Πόλη, τα ανώτερα επίπεδά του αποτελούν στην πραγματικότητα το αποχετευτικό σύστημα της Πόλης. Όντας τυπικά μέρος της Πόλης, αυτά τα επίπεδα δεν είναι τόσο επικίνδυνα. Κανείς δεν θα το χαρακτηρίσει ασφαλές μέρος, αλλά τουλάχιστον δεν θα χρειαστεί να αντιμετωπίσετε την κακή μαγεία εδώ.
custom.theme.prison.intro=Πριν από πολλά χρόνια χτίστηκε εδώ μια υπόγεια φυλακή για τους πιο επικίνδυνους εγκληματίες. Εκείνη την εποχή φαινόταν σαν μια πολύ έξυπνη ιδέα, επειδή από αυτό το μέρος ήταν πράγματι πολύ δύσκολο να δραπετεύσει κανείς. Αλλά σύντομα ένα σκοτεινό μίασμα άρχισε να διαπερνά από κάτω, τρελαίνοντας κρατούμενους και φρουρούς. Στο τέλος η φυλακή εγκαταλείφθηκε, αν και ορισμένοι κατάδικοι έμειναν κλειδωμένοι εδώ.
custom.theme.caves.intro=Οι σπηλιές, οι οποίες εκτείνονται κάτω από την εγκαταλελειμμένη φυλακή, είναι αραιοκατοικημένες. Βρίσκονται πολύ βαθιά για να εκμεταλλευτεί η Πόλη και είναι πολύ φτωχές σε ορυκτά για να ενδιαφέρουν τους νάνους. Στο παρελθόν υπήρχε ένα εμπορικό φυλάκιο κάπου εδώ, στη διαδρομή μεταξύ αυτών των δύο πολιτειών, αλλά έχει χαθεί από την παρακμή της Μητρόπολης των Νάνων. Μόνο πανταχού παρόντες gnolls και υπόγεια ζώα κατοικούν τώρα εδώ.
custom.theme.city.intro=Η Μητρόπολη των Νάνων ήταν κάποτε η σπουδαιότερη από τις πόλεις-κράτη των νάνων. Στην ακμή της, ο μηχανοκίνητος στρατός των νάνων απέκρουσε με επιτυχία την εισβολή του παλιού θεού και του δαιμονικού στρατού του. Λέγεται όμως ότι οι πολεμιστές που επέστρεψαν έφεραν μαζί τους σπόρους διαφθοράς και ότι η νίκη ήταν η αρχή του τέλους για το υπόγειο βασίλειο.
custom.theme.halls.intro=Στο παρελθόν, αυτά τα επίπεδα ήταν τα περίχωρα της Μητρόπολης. Μετά την δαπανηρή νίκη στον πόλεμο με τον παλιό θεό, οι νάνοι ήταν πολύ αποδυναμωμένοι για να τους καθαρίσουν από τους εναπομείναντες δαίμονες. Σταδιακά, οι δαίμονες έχουν σφίξει τον κλοιό τους σε αυτό το μέρος και τώρα ονομάζεται Αίθουσες των Δαιμόνων. \n\nΕλάχιστοι τυχοδιώκτες έχουν κατέβει ποτέ τόσο μακριά...
custom.theme.sewers.sign.1=Μην υπερεκτιμάς τη δύναμή σου, χρησιμοποίησε όπλα και πανοπλίες που μπορείς να χειριστείς.
custom.theme.sewers.sign.2=Μερικοί κίνδυνοι στους υπονόμους είναι εύκολο να τους διαφύγει κανείς με την πρώτη ματιά. Αν ένα δωμάτιο σας φαίνεται άβολο, επιβραδύνετε και κοιτάξτε προσεκτικά.
custom.theme.sewers.sign.3=Να θυμάστε ότι η αύξηση της δύναμής σας δεν είναι ο μόνος τρόπος για να αποκτήσετε πρόσβαση σε καλύτερο εξοπλισμό. Μπορείτε επίσης να μειώσετε την απαίτηση ισχύος του με τους Πάπυρους Αναβάθμισης.
custom.theme.sewers.sign.4=Μπορείτε να ξοδέψετε τον χρυσό σας σε καταστήματα σε όλο το μπουντρούμι. Υπάρχει ακόμη και ένας έμπορος στον πρώτο όροφο τώρα.
custom.theme.sewers.sign.5=Προσοχή στο Γκού!
custom.theme.prison.sign.1=Pixel-Mart - όλα όσα χρειάζεστε για μια επιτυχημένη περιπέτεια!
