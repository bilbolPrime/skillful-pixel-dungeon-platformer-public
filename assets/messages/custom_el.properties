custom.generated.warriors_are_physically_tough_and_02774ddc7a=Οι πολεμιστές είναι σωματικά σκληροί και μπορούν να προκαλέσουν μεγάλη ζημιά. Ωστόσο, υποφέρουν όταν πρόκειται για όπλα και μαγεία από απόσταση. Η εκμάθηση τέτοιων δεξιοτήτων είναι ακόμα δυνατή, αλλά απαιτεί περισσότερη προσπάθεια.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Οι απατεώνες βασίζονται στην ευκινησία, την μυστικότητα και την ακρίβεια. Διαπρέπουν στην κινητικότητα, τις ενέδρες, τα δηλητήρια και τη μάχη αποφυγής, αλλά χάνουν μέρος της ακατέργαστης σκληρότητας ενός πολεμιστή πρώτης γραμμής.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Οι μάγοι κατακτούν τις τέχνες της μαγείας. Υποφέρουν όταν πρόκειται για σωματική δύναμη και ευκινησία. Η εκμάθηση τέτοιων δεξιοτήτων είναι ακόμα δυνατή, αλλά απαιτεί περισσότερη προσπάθεια.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Οι κυνηγές διαπρέπουν στις μάχες από απόσταση και στην κινητικότητα. Ελέγχουν τις μάχες με τόξα, βοηθητικά πυρά και σταθερά εργαλεία επιβίωσης, αλλά είναι λιγότερο άνετες σε παρατεταμένες μάχες κοντινής εμβέλειας.
