items.amulet.ac_end=TERMINE O JOGO
items.amulet.ascent_desc=Você começa a sentir o grande e terrível poder de Yog-Dzewa emanando do amuleto. Subir de volta pela masmorra como um mortal pode ser mais difícil do que você imaginava! Se você continuar subindo com o amuleto, a masmorra se tornará mais perigosa, os teletransportes entre os andares serão desativados e você só poderá vencer o jogo derrotando os inimigos à medida que sobe pela masmorra! Você pode deixar o amuleto aqui por enquanto, se quiser subir sem iniciar este desafio, ou ativar o amuleto antes de subir para terminar o jogo normalmente.
items.amulet.ascent_no=Pare por agora.
items.amulet.ascent_title=Ascensão
items.amulet.ascent_yes=Continuar!
items.amulet.desc=O Amuleto de Yendor é o artefato mais poderoso conhecido pelos humanos e anões. Seus cristais cintilantes contêm um poder incrível e maravilhoso.
items.amulet.desc_ascent=A origem do amuleto é desconhecida, mas é evidente que ele foi fortemente influenciado pelo poder de Yog-Dzewa. A masmorra parece estar se curvando à vontade de Yog conforme você avança, tornando os inimigos muito mais numerosos e poderosos! Você também não consegue mais ativar ou descartar o amuleto, quase como se estivesse amaldiçoado.
items.amulet.desc_origins=A origem do amuleto é desconhecida. A história conta que o Rei dos Anões se gabou de tê-lo descoberto pouco antes de a civilização anã cortar todos os laços com os outros. Como ele o encontrou? Como Yog-Dzewa o tomou dele? Talvez essas sejam perguntas para outra ocasião; o que importa agora é que o amuleto é seu!
items.amulet.discover_hint=Você pode encontrar este item no fundo da masmorra...
items.amulet.name=amuleto de yendor
items.ankh.ac_bless=abençoar
items.ankh.bless=Você abençoa o ankh com água mágica.
items.ankh.desc=Este antigo símbolo da imortalidade concede a capacidade de retornar à vida após a morte. A maioria dos itens será deixada no local onde você morreu, mas poderá ser recuperada se você retornar. Usando um cantil cheio, o ankh pode ser abençoado com força extra.
items.ankh.desc_blessed=Este antigo símbolo da imortalidade concede a capacidade de retornar à vida após a morte. O ankh foi abençoado e agora é muito mais forte. O ankh se sacrificará para salvá-lo em um momento de perigo mortal.
items.ankh.discover_hint=Você pode comprar este item em uma loja.
items.ankh.name=ankh
items.arcaneresin.ac_apply=APLICAR
items.arcaneresin.apply=Você reveste sua varinha com resina, aumentando seu poder!
items.arcaneresin.desc=Este pó fino brilha entre tons de roxo e branco. Ele pode atuar como um amplificador de energias mágicas, aumentando o nível das varinhas quando aplicado a elas! Aprimorar uma varinha custa 1, 2 ou 3 resinas, dependendo do nível inicial da varinha. A resina pode aprimorar varinhas até um máximo de +3. No entanto, os aprimoramentos de resina são anulados por outras fontes de aprimoramento (como pergaminhos de aprimoramento) e não se aplicam ao imbuir uma varinha no cajado do mago.
items.arcaneresin.discover_hint=Você pode criar este item através da alquimia.
items.arcaneresin.level_too_high=Essa varinha é poderosa demais para que a resina a melhore.
items.arcaneresin.name=resina arcana
items.arcaneresin.not_enough=Você não tem resina suficiente para isso!
items.arcaneresin.prompt=Selecione uma varinha
