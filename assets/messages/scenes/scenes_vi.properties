scenes.gamescene.tutorial_ui_desktop=Thông tin về anh hùng (%1$s) ở bên dưới. Kho đồ (%2$s), ô nhanh và các hành động trong game ở bên phải. Chúc may mắn!
scenes.gamescene.tutorial_ui_mobile=Thông tin về anh hùng nằm ở góc trên bên trái. Kho đồ, ô phím tắt và các hành động trong game nằm ở phía dưới. Chúc may mắn!
