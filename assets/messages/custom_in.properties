custom.generated.oh_i_see_you_have_cef64cb7a7=Oh, saya lihat Anda berhasil! Saya harap ini tidak terlalu merepotkan Anda. Seperti yang saya janjikan, Anda dapat memilih salah satu tongkat sihir berkualitas tinggi saya.
custom.generated.oh_what_a_pleasant_surprise_2d5638b531=Oh, sungguh kejutan yang menyenangkan bertemu orang baik di tempat seperti ini! Aku datang ke sini untuk mencari bahan langka - biji Rotberry. Sebagai pengguna sihir, aku cukup mampu membela diri melawan monster lokal, tetapi aku selalu tersesat, ini sangat memalukan. Mungkin kau bisa membantuku? Aku akan dengan senang hati membayar jasamu dengan salah satu tongkat sihir terbaikku.
custom.generated.oh_what_a_pleasant_surprise_c61a76d7ae=Oh, sungguh kejutan yang menyenangkan bertemu orang baik di tempat seperti ini! Aku datang ke sini untuk mencari bahan langka—debu mayat. Bahan ini bisa dikumpulkan dari sisa-sisa kerangka dan jumlahnya sangat banyak di ruang bawah tanah. Sebagai pengguna sihir, aku cukup mampu membela diri melawan monster-monster lokal, tetapi aku selalu tersesat, ini sangat memalukan. Mungkin kau bisa membantuku? Aku akan dengan senang hati membayar jasamu dengan salah satu tongkat sihir terbaikku.
custom.generated.oh_what_a_pleasant_surprise_d0b76a2632=Oh, sungguh kejutan yang menyenangkan bertemu orang baik di tempat seperti ini! Aku datang ke sini untuk mencari bahan langka: ikan hantu. Kau bisa menangkapnya dengan tangan kosong, tapi sangat sulit untuk melihatnya di dalam air. Sebagai pengguna sihir, aku cukup mampu membela diri dari monster-monster lokal, tapi aku selalu tersesat, itu sangat memalukan. Mungkin kau bisa membantuku? Aku akan dengan senang hati membayar jasamu dengan salah satu tongkat sihir terbaikku.
