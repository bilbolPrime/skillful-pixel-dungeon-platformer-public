items.artifacts.lloydsbeacon.creatures=A aura psíquica das criaturas vizinhas impede o uso do farol de Lloyd neste momento.
items.artifacts.lloydsbeacon.desc=O farol de Lloyd é um dispositivo mágico complexo que concede ao usuário o controle de magias de teletransporte. O farol pode ser usado para retornar a um local predefinido, mas também pode expelir rajadas de magia de teletransporte aleatórias após ser carregado ao ser equipado. Essa magia pode ser direcionada a um alvo ou ao próprio usuário.
items.artifacts.lloydsbeacon.desc_set=Este sinalizador foi posicionado em algum lugar no nível %d da Pixel Dungeon.
