items.wands.wandofwarding$ward.name_6=sentinela maior
items.wands.wandofwarding.bad_location=Você não pode colocar uma sentinela ali.
items.wands.wandofwarding.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um cajado de proteção, todas as proteções e sentinelas ativas têm uma chance de serem curadas.
items.wands.wandofwarding.desc=Esta pequena varinha de metal tem uma gema roxa brilhante flutuando acima da ponta.
items.wands.wandofwarding.eleblast_desc=Uma explosão elemental com um cajado de proteção cura todas as proteções e sentinelas na área da explosão.
items.wands.wandofwarding.name=varinha de proteção
items.wands.wandofwarding.no_more_wards=Sua varinha não consegue sustentar mais nenhuma proteção.
items.wands.wandofwarding.staff_name=equipe de enfermagem
items.wands.wandofwarding.stats_desc=Em vez de causar dano direto ao inimigo, esta varinha invoca sentinelas e proteções estacionárias. As sentinelas podem ser invocadas em qualquer lugar, até mesmo através de paredes, se você tiver visão. Esta varinha pode manter sentinelas equivalentes a _%d de energia_ por vez.
items.wands.wandofwarding.upgrade_stat_name_1=Dano de sentinela
items.wands.wandofwarding.upgrade_stat_name_2=Energia Ward
items.waterskin.ac_drink=BEBIDA
items.waterskin.collected=Você coleta a gota de orvalho em seu odre de água.
items.waterskin.desc=Um recipiente para líquidos, feito de couro e corda, selado com uma rolha de cortiça.
items.waterskin.desc_full=O odre cheio parece irradiar energia; talvez possa ser usado para abençoar outro item de sobrevivência?
items.waterskin.desc_heal=O odre está sendo usado para armazenar água curativa. Quanto mais cheio estiver, mais você se sentirá curado(a) ao beber dela. Você só beberá a quantidade necessária.
items.waterskin.desc_water=No momento, o cantil contém apenas água potável. Certamente há algo na masmorra que o cantil poderia armazenar.
items.waterskin.discover_hint=Um dos heróis começa com este item.
items.waterskin.empty=Seu cantil está vazio!
