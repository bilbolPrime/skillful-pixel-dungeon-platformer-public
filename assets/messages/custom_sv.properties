custom.generated.warriors_are_physically_tough_and_02774ddc7a=Krigare är fysiskt tuffa och kan orsaka mycket skada. De lider dock när det gäller vapen och magi på distans. Att lära sig sådana färdigheter är fortfarande möjligt men kräver mer ansträngning.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Skurkar förlitar sig på smidighet, smygförmåga och precision. De utmärker sig i rörlighet, bakhåll, gift och undvikande strider, men kompromissar med en del av den råa segheten hos en frontlinjekrigare.
