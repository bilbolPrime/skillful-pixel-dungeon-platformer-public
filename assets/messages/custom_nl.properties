custom.generated.warriors_are_physically_tough_and_02774ddc7a=Krijgers zijn fysiek sterk en kunnen veel schade incasseren. Ze hebben echter moeite met afstandswapens en magie. Het is nog steeds mogelijk om deze vaardigheden te leren, maar het vergt meer inspanning.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Schurken vertrouwen op behendigheid, sluipvermogen en precisie. Ze blinken uit in mobiliteit, hinderlagen, gif en ontwijkende gevechten, maar leveren daarvoor wel een deel van de brute kracht van een frontliniestrijder in.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Tovenaars beheersen de kunsten van de magie. Ze schieten echter tekort op het gebied van fysieke kracht en lenigheid. Het is nog steeds mogelijk om dergelijke vaardigheden te leren, maar het vergt meer inspanning.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Jagers blinken uit in gevechten op afstand en mobiliteit. Ze beheersen gevechten met bogen, gerichte schoten en betrouwbare overlevingsmiddelen, maar voelen zich minder op hun gemak in langdurige gevechten van dichtbij.
