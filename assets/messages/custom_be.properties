custom.generated.warriors_are_physically_tough_and_02774ddc7a=Воіны фізічна моцныя і могуць наносіць вялікую шкоду. Аднак яны пакутуюць, калі гаворка ідзе пра зброю далёкага бою і магію. Навучыцца такім навыкам усё яшчэ магчыма, але патрабуе большых намаганняў.
custom.generated.rogues_rely_on_agility_stealth_9fa3bff11c=Разбойнікі спадзяюцца на спрыт, скрытнасць і дакладнасць. Яны выдатна валодаюць мабільнасцю, засадамі, атрутай і ўхіляльным бою, але пры гэтым губляюць частку грубай трываласці воіна на перадавой.
custom.generated.wizards_master_the_arts_of_3efc4cde47=Чараўнікі валодаюць мастацтвам магіі. Яны пакутуюць, калі гаворка ідзе пра фізічную сілу і спрыт. Навучанне такім навыкам усё яшчэ магчыма, але патрабуе большых намаганняў.
custom.generated.huntresses_excel_at_ranged_combat_11d04f6ebd=Паляўніцы выдатна валодаюць дыстанцыйным баем і мабільнасцю. Яны кантралююць баі з дапамогай лукаў, універсальных стрэлаў і ўстойлівых прылад для выжывання, але менш камфортна адчуваюць сябе ў працяглых блізкіх бойках.
