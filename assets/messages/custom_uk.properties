custom.theme.sewers.intro=Підземелля розташоване прямо під Містом, його верхні рівні фактично утворюють каналізаційну систему міста. Будучи номінально частиною Міста, ці рівні не такі вже й небезпечні. Ніхто не назве його безпечним місцем, але принаймні вам тут не доведеться мати справу зі злою магією.
custom.theme.prison.intro=Багато років тому тут було збудовано підземну в'язницю для найнебезпечніших злочинців. На той час це здавалося дуже розумною ідеєю, адже з цього місця справді було дуже важко втекти. Але невдовзі знизу почали проникати темні міазми, які зводили в'язнів та охоронців з розуму. Зрештою, в'язницю покинули, хоча деяких засуджених залишили тут замкненими.
custom.theme.caves.intro=Печери, що простягаються під покинутою в'язницею, малонаселені. Вони лежать надто глибоко, щоб їх експлуатувало Місто, і надто бідні на корисні копалини, щоб зацікавити гномів. У минулому десь тут, на шляху між цими двома державами, був торговий форпост, але він загинув після занепаду Гномської Метрополії. Зараз тут живуть лише всюдисущі гноли та підземні тварини.
custom.theme.city.intro=Гномська метрополія колись була найбільшим з гномських міст-держав. У період свого розквіту механізована армія гномів успішно відбила вторгнення старого бога та його армії демонів. Але кажуть, що воїни, що повернулися, принесли з собою зерна псування, і ця перемога стала початком кінця підземного королівства.
custom.theme.halls.intro=У минулому ці рівні були околицями Метрополіса. Після дорогої перемоги у війні зі старим богом гноми були надто ослаблені, щоб очистити їх від залишків демонів. Поступово демони посилили свою хватку над цим місцем, і тепер воно називається Чертогами Демонів.\n\nДуже мало шукачів пригод коли-небудь спускалися так низько...
custom.theme.sewers.sign.1=Не переоцінюйте свої сили, використовуйте зброю та обладунки, з якими можете впоратися.
custom.theme.sewers.sign.2=Деякі небезпеки в каналізації легко пропустити на перший погляд. Якщо кімната здається не такою, зменшіть швидкість і уважно подивіться.
custom.theme.sewers.sign.3=Пам'ятайте, що підвищення вашої сили — це не єдиний спосіб отримати доступ до кращого спорядження. Ви також можете знизити вимоги до його сили за допомогою Сувоїв Покращення.
custom.theme.sewers.sign.4=Ви можете витрачати своє золото в магазинах по всьому підземеллю. Тепер на першому поверсі навіть є торговець.
custom.theme.sewers.sign.5=Остерігайтеся Гу!
custom.theme.prison.sign.1=Pixel-Mart — все, що потрібно для успішної пригоди!
custom.theme.prison.sign.2=Визначте свої зілля та сувої якомога швидше. Не відкладайте це на той момент, коли вони вам справді знадобляться.
custom.theme.prison.sign.3=Голод не болить, але голодування болить.
custom.theme.prison.sign.4=Раптовий напад має більше шансів на влучення. Ви все ще можете заскочити ворогів зненацька, якщо контролюєте простір навколо дверного отвору.
custom.theme.prison.sign.5=Не випускай Тенгу!
custom.theme.caves.sign.1=Pixel-Mart. Витрачайте гроші. Живіть довше.
custom.theme.caves.sign.2=Коли на вас одночасно нападають кілька монстрів, спробуйте відступити за двері.
custom.theme.caves.sign.3=Якщо ви горите, не дозволяйте собі потрапити в лави. Вертикальний рух має більше значення в печерах.
custom.theme.caves.sign.4=Немає сенсу володіти більше ніж одним Анкхом одночасно, бо ви втратите їх після воскресіння.
custom.theme.caves.sign.5=НЕБЕЗПЕКА! Важка техніка може призвести до травм, втрати кінцівок або смерті!
custom.theme.city.sign.1=Pixel-Mart. Безпечніше життя у підземеллі.
custom.theme.city.sign.2=Коли ви покращуєте зачаровану зброю, є шанс знищити ці чари.
custom.theme.city.sign.3=Зброя та обладунки псуються швидше, ніж чарівні палички та кільця, але є більше способів їх полагодити.
custom.theme.city.sign.4=Єдиний спосіб отримати Сувій Знищення – це отримати його в подарунок від духів підземелля.
custom.theme.city.sign.5=Зброя заборонена в присутності Його Величності!
custom.theme.halls.sign.1=Як тільки ви намагаєтеся прочитати знак, він спалахує зеленуватим полум'ям.
